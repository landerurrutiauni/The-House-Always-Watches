","duel.cap.bang":"BANG!","duel.cap.click":"CLICK…","duel.cap.heard_empty":"EMPTY?","duel.cap.heard_loaded":"LOADED?","duel.cap.safe":"SAFE","duel.cap.skip":"—","duel.chambers":"Chambers","duel.contract.honest":"It wasn’t lying: Debt rises by 20.","duel.contract.lied":"The contract bites: {name} loses a mark.","duel.ev.f_shot_click":"{name} shoots. Click.","duel.ev.f_shot_hit":"{name} shoots: you lose a mark.","duel.ev.f_table_backfire":"The Table turns on {name}: it loses a mark.","duel.ev.f_table_safe":"{name} tempts the Table. Nothing.","duel.ev.p_shot_click":"Click. The chamber was empty.","duel.ev.p_shot_hit":"You shoot: {name} loses a mark.","duel.ev.p_table_backfire":"The Table sends the bullet back: you lose a mark.","duel.ev.p_table_safe":"The Table stays silent. You keep your turn.","duel.ev.reload":"The shotgun reloads.","duel.ev.skipped":"{name} forgets its turn.","duel.final":"THE LAST BULLET","duel.h.cham":"ch. {k}","duel.h.f_p":"Rival → You","duel.h.f_table":"Rival → Table","duel.h.p_foe":"You → Rival","duel.h.p_table":"You → Table","duel.h.skip":"{name} loses the turn","duel.h.title":"Shot history","duel.heard_empty":"You think you hear… nothing.","duel.heard_loaded":"You think you hear… a bullet.","duel.if_lose":"If you lose:","duel.if_win":"If you win:","duel.listen":"LISTEN (−{c} Sanity)","duel.lose":"“The house collects.”","duel.marks_foe":"Foe’s marks","duel.marks_you":"Your marks","duel.n.backfire_f":"The Table sends the bullet back at {name}.","duel.n.backfire_p":"The Table sends the bullet back at you.","duel.n.empty":"Click… Chamber {k} was EMPTY.","duel.n.f_aim_p":"{name} aims at you and pulls the trigger…","duel.n.f_aim_table":"{name} tempts the Table…","duel.n.f_loses":"{name} loses a mark. {n} left.","duel.n.loaded":"BANG! Chamber {k} was LOADED.","duel.n.p_aim_foe":"You aim at {name} and pull the trigger…","duel.n.p_aim_table":"You tempt the Table: you rest the barrel on the felt…","duel.n.p_loses":"You lose a mark. You have {n} left.","duel.n.pass_f":"The turn passes to {name}.","duel.n.pass_p":"The turn comes back to you.","duel.n.reload":"The shotgun reloads: six new chambers. {name} announces {n} bullets.","duel.n.safe_f":"The Table stays silent: {name} keeps the turn.","duel.n.safe_p":"The Table stays silent: you keep your turn.","duel.n.skip_hint":"Tap the screen to speed up.","duel.n.skipped":"{name} forgets its turn.","duel.n.turn_of":"{name}’s turn","duel.setup.note":"If you win: +10 extra Money. If you lose: −12 Health on top of the stake. Nobody makes you believe what they announce.","duel.setup.sub":"What do you put on the table?","duel.shoot_foe":"SHOOT THE FOE","duel.shoot_table":"TEMPT THE TABLE","duel.stake.card.lose":"If you lose: a card from your deck","duel.stake.card.name":"A card from your deck","duel.stake.card.win":"If you win: a special card","duel.stake.debt.lose":"If you lose: +{n} Debt","duel.stake.debt.name":"{n} Debt","duel.stake.debt.win":"If you win: −60 Debt","duel.stake.money.lose":"If you lose: −{n} Money","duel.stake.money.name":"{n} Money","duel.stake.money.win":"If you win: +25 Money","duel.stake.sanity.lose":"If you lose: −{n} Sanity","duel.stake.sanity.name":"{n} Sanity","duel.stake.sanity.win":"If you win: +8 Sanity","duel.title":"THE SHOTGUN","duel.tool.memory":"The foe will forget its next turn.","duel.truth":"Witness: there were {n} real bullets.","duel.truth.honest":"It told the truth.","duel.truth.lied":"You were lied to.","duel.turn_foe":"Foe’s turn…","duel.turn_you":"Your turn","duel.win":"“The house pays.”","duel.you":"You","egg.arrepentido.hint":"Buy and sell without leaving the shop.","egg.arrepentido.name":"Buy and Regret","egg.arrepentido.text":"You bought a joker and sold it in the same visit. The Vendor sighs: “They always come back.”","egg.ases.hint":"Every Ace, in a single play.","egg.ases.name":"Four Aces","egg.ases.text":"Four Aces in one hand. Nobody deals like that by accident.","egg.cinco.hint":"A hand has five fingers; a court, five jokers.","egg.cinco.name":"Five Jesters","egg.cinco.text":"A whole court of jokers whispers behind you. You’ll have to pay for the party.","egg.colapso.hint":"Looking too long at what you shouldn’t.","egg.colapso.name":"Zero Sanity","egg.colapso.text":"Your mind shattered completely. The house notes it with a smile and gives you just enough to go on.","egg.jackpot.hint":"Three lucky numbers together in one hand.","egg.jackpot.name":"Triple Seven","egg.jackpot.text":"Three sevens in one hand. Bells ring that don’t exist.","egg.konami.hint":"A key code from another era, typed on the menu.","egg.konami.name":"Ancient Code","egg.konami.text":"An old combination from another era. The Dealer pretends not to have seen it.","egg.limite.hint":"Win with no margin at all: on the last play.","egg.limite.name":"By a Hair","egg.limite.text":"You won on your very last play, with the house already smiling.","egg.mesa3.hint":"In the duel, tempt the Table and have it not answer… three times in a row.","egg.mesa3.name":"The Table Falls Silent","egg.mesa3.text":"You tempted the Table three times running and it stayed silent all three. No one had spoken to it like that.","egg.ojos.hint":"On the menu, the Dealer’s eyes never leave you. Touch them, again and again.","egg.ojos.name":"He Looks Back","egg.ojos.text":"Seven times you stared into the Dealer’s eyes. For once, he blinks.","egg.paciencia.hint":"The house has all night. Maybe you do too.","egg.paciencia.name":"Patience","egg.paciencia.text":"You waited a full minute without touching anything. The house appreciates those who can wait; it almost never repays them.","egg.poliglota.hint":"Five tongues, one debt.","egg.poliglota.name":"The House Speaks Every Language","egg.poliglota.text":"Spanish, English, French, German and Basque: the debt is understood the same in all five.","egg.real.hint":"The noblest hand of the full deck, ten to Ace.","egg.real.name":"Royal Flush","egg.real.text":"Ten, Jack, Queen, King and Ace of one suit. The Dealer stops shuffling for a second… then shuffles again.","egg.unlocked":"Secret found: {name}","ending.crupier.epi":"Someone sits across from you for the first time. You smile without moving your mouth.","ending.crupier.text":"You ask him to take off the smile. Beneath it there is no face: only a mirror showing your age. “I won so long ago I forgot how to leave,” he says. He hands you the deck and sits in your chair. Now you are the one who deals.","ending.crupier.title":"The Dealer","ending.deuda.epi":"The House always wins. But today it took longer.","ending.deuda.text":"You play the last hand and win. The House writes the win in its ledger and hands you back a black chip. “You still owe me a game,” it says. You stand. The door stays shut, but now you can count.","ending.deuda.title":"The Debt","ending.espectador.epi":"Whoever watches is also in the game.","ending.espectador.text":"You look out of the room, where nobody should look. Behind the glass there is a face lit by a screen. It is you, or someone watching you play. You study each other for a second. Then the house lowers the curtain.","ending.espectador.title":"The Spectator","ending.first":"NEW ENDING","ending.memories":"Memories gained","ending.n":"ENDING {n} / {total}","ending.partida.epi":"Without players, the house is just a room with lights.","ending.partida.text":"You call them by name, one by one: the girl, the man in the chair, the drowned man, the archivist, the child. Each rises from their table. Nobody remembered being a player. They drop their cards all at once. The game ends because nobody is left who wants to go on.","ending.partida.title":"The Game","ending.puerta.epi":"The door closes by itself. This time, on the right side.","ending.puerta.text":"The bone key turns without a sound. Behind the door is a corridor and, at its end, another identical door. You cross it anyway. Outside there is real air and a sign: CLOSED FOR RENOVATION. For the first time, nobody is watching you.","ending.puerta.title":"The Door","ending.to_menu":"BACK TO MENU","ending.true_hint":"You have seen five endings. One more door remains.","ending.verdad.epi":"Thank you for playing. You can stop watching now.","ending.verdad.text":"You have seen every ending. You know all the doors are the same and that the one watching is you. You close the ledger and write the last line. The house goes dark. There is no more game: only the one who played it, and the silence on the other side of the screen.","ending.verdad.title":"The Truth","event.archive_ledger.a":"Read the ledger","event.archive_ledger.b":"Close it","event.archive_ledger.ra":"The columns of figures are games. All end at the same door. You understand there aren’t so many doors.","event.archive_ledger.rb":"“Wise choice,” she says. “Though it changes nothing.” She gives you a few coins for your discretion.","event.archive_ledger.text":"A woman in thick glasses files ledgers that drip ink. “Every name is here,” she says. “And every door is the same.”","event.archive_ledger.title":"The Archivist","event.blood_vending.a":"Pay in blood","event.blood_vending.b":"Walk past","event.blood_vending.ra":"The machine hums, satisfied, and spits out a warm card.","event.blood_vending.rb":"The machine powers down with a sigh. For a moment it seemed disappointed.","event.blood_vending.text":"A machine dispenses cards for a pinprick on the finger. A sign reads: “No change given.”","event.blood_vending.title":"The card machine","event.camera_13.a":"Touch the screen","event.camera_13.b":"Unplug it","event.camera_13.ra":"The glass is warm. On the picture, someone turns slowly toward the camera… and looks exactly like you. The screen spits a few coins out of its slot.","event.camera_13.rb":"You pull the cable. The picture goes out and, for an instant, the whole room breathes. You look like someone who has just spared himself a fright.","event.camera_13.text":"In a corner, a screen shows an empty room with an armchair. On the armchair, your coat. Under the glass, a label: “Camera 13 — live.”","event.camera_13.title":"Camera 13","event.chair_bet.a":"Take the bet","event.chair_bet.b":"Decline","event.chair_bet.ra":"He throws the dice without looking. You hear them roll and stop just as you stop listening.","event.chair_bet.rb":"“I understand,” he murmurs. “I would rather not get up, either.”","event.chair_bet.text":"The Man in the Chair does not stand, and perhaps cannot. “I bet the chair,” he says in a worn voice. “Against your patience.”","event.chair_bet.title":"The chair","event.chair_secret.a":"Listen","event.chair_secret.b":"Interrupt him","event.chair_secret.ra":"He speaks for hours, or seconds. In the end you understand whose chair it is and why he guards it.","event.chair_secret.rb":"He falls silent. The whole house seems to hold its breath until you walk away.","event.chair_secret.text":"“This house was founded by a tired player,” says the Man in the Chair. “Who stayed to wait for the others.” The chair creaks.","event.chair_secret.title":"The founder","event.chapel_candles.a":"Light yours","event.chapel_candles.b":"Snuff out the rest","event.chapel_candles.ra":"The flame is cold and steady. Something in the chapel sighs. You keep a stub for later.","event.chapel_candles.rb":"You blow them out one by one. In the dark the chapel seems larger, and more yours. You find offering coins on the floor.","event.chapel_candles.text":"There are candles everywhere and none burns down. Each carries a name written in wax. Yours is unlit.","event.chapel_candles.title":"A thousand candles","event.child_1.a":"“Yes”","event.child_1.b":"“No”","event.child_1.ra":"It nods, satisfied. “Me too.” It hands you a candy that tastes of metal.","event.child_1.rb":"“Liar,” it says without malice. Up close its face resembles a childhood photo of you that you never saw.","event.child_1.text":"A child in a birthday dress tugs your sleeve. “Did you lose again?” it asks. It isn’t a question.","event.child_1.title":"The child","event.child_2.a":"Keep the drawing","event.child_2.b":"Leave it","event.child_2.ra":"You fold the paper. It is heavy. Somewhere in the house a corridor has turned to make room for a new door.","event.child_2.rb":"It shrugs and crosses out the door. A moment later the chalk redraws it by itself.","event.child_2.text":"The child draws a door in red chalk and writes a number above it: 13. “It’s in the corridor. It only opens if you know which.”","event.child_2.title":"The drawing","event.concierge_1.a":"Pay for the room","event.concierge_1.b":"Ask about the way out","event.concierge_1.ra":"The room smells of lavender and old paper. You sleep as you haven’t in years. The next morning the Concierge sees you off with a nod: “Come back whenever you like; no one ever leaves.”","event.concierge_1.rb":"He smiles without showing his teeth and jingles the ring. “I have a key for every door. Except one.” He stares at an empty hook on the wall. “Someone else has that.”","event.concierge_1.text":"A white-haired man with an enormous key ring taps a little bell. “Welcome, Guest. A room for one night: twenty. Here we charge for sleeping, for leaving and for coming in.”","event.concierge_1.title":"The front desk","event.concierge_2.a":"Cut the ribbon","event.concierge_2.b":"Leave it where it is","event.concierge_2.ra":"The key chills in your hand and turns into a card that wasn’t in the deck. The Concierge doesn’t wake, but his smile twists, like someone dreaming of unpaid bills.","event.concierge_2.rb":"You settle his head on his arms. When he wakes he says nothing, but he notes something on your account: one line fewer. “Courtesy of the house,” he murmurs.","event.concierge_2.text":"The Concierge has fallen asleep on the counter. The master key hangs from his neck on a thin ribbon. The reception bell waits, barely touching his hand.","event.concierge_2.title":"The master key","event.confession_booth.a":"Confess","event.confession_booth.b":"Walk away","event.confession_booth.h":"Ask about the ledger","event.confession_booth.ra":"You say too much. You leave lighter... and somewhere in a ledger, something weighs a little more.","event.confession_booth.rb":"As you walk away you hear your own voice confessing on the other side.","event.confession_booth.rh":"“Part of it can be erased,” it whispers. “But you have to want it.” The debt loosens.","event.confession_booth.text":"A confessional between two tables. On the other side someone breathes slowly and waits for you to speak first.","event.confession_booth.title":"The confessional","event.cook_1.a":"Eat","event.cook_1.b":"Refuse it","event.cook_1.ra":"It’s hot and tastes of something you remember without having lived it. You feel better; the bill notices too.","event.cook_1.rb":"He shrugs. “More for the Child,” he says, and sets aside a plate no one comes to collect.","event.cook_1.text":"In the kitchen a man in a stained apron stirs an enormous pot. “Eat,” says the Cook, “everything gets used here.” You don’t know what the soup is made of.","event.cook_1.title":"Soup of the day","event.cook_2.a":"Open a jar","event.cook_2.b":"Leave him a memory of yours","event.cook_2.ra":"It smells of rain and of a kitchen that isn’t this one. For a moment you understand how to improve your hands. The memory evaporates, and the label with it.","event.cook_2.rb":"You pick one of your memories and he puts it in an empty jar. “Fair price,” he says, counting out some coins. You don’t miss a thing. That’s the strange part.","event.cook_2.text":"The pantry has shelves of labeled jars: a birthday, a farewell, an ordinary Monday. “Memories in preserve,” the Cook explains. “My brother takes what’s left over.”","event.cook_2.title":"The jars","event.cook_3.a":"Deliver it unopened","event.cook_3.b":"Open it","event.cook_3.ra":"The Vendor takes it without thanking you and pays you. “My brother cooks well,” he says. “It’s the only thing he doesn’t charge for.” He no longer looks at you with indifference.","event.cook_3.rb":"Inside is a one-line note and a card you don’t remember seeing. The Cook knows before you leave the pantry.","event.cook_3.text":"The Cook hands you a box tied with string. “For my brother,” he says. “The one who sells what I keep. Don’t open it.”","event.cook_3.title":"An errand for the Vendor","event.cracked_clock.a":"Wind it","event.cracked_clock.b":"Leave it","event.cracked_clock.ra":"Something creaks inside. The clock stays in your hand, stopped, and you no longer know what time it is.","event.cracked_clock.rb":"It is safer not to touch time here. You find a few coins under the pendulum.","event.cracked_clock.text":"A wall clock always reads 3:33. If you stare at it, the second hand trembles, as if asking for something.","event.cracked_clock.title":"The stopped clock","event.dealer_offer.a":"Sign","event.dealer_offer.b":"Refuse","event.dealer_offer.ra":"The ink is warm. The paper folds itself inside your coat. You feel light, and watched.","event.dealer_offer.rb":"He takes the contract back without pressing. “The offer expires.” He leaves you a few coins for the trouble. That is worse.","event.dealer_offer.text":"The Dealer slides a contract across the table. “One signature and that debt disappears.” The small print moves.","event.dealer_offer.title":"The offer","event.dealer_question.a":"“Yes, I remember”","event.dealer_question.b":"“I don’t remember”","event.dealer_question.h":"Ask about the deck","event.dealer_question.ra":"He writes something down. “How curious. Nobody remembers.” He looks at you as if you had just lied to a mirror.","event.dealer_question.rb":"“Neither do I,” he admits, and for the first time the deck stops. You ask his name. He is silent. He has none.","event.dealer_question.rh":"“Fifty-two cards,” he says, unsurprised. “Four suits, thirteen each, Ace to King. And one that isn’t there.” He smiles.","event.dealer_question.text":"“Do you remember how you got here?” asks the Dealer, shuffling without looking. “Before the first hand.”","event.dealer_question.title":"A question","event.dealer_tea.a":"Drink","event.dealer_tea.b":"Refuse the cup","event.dealer_tea.ra":"Warm, sweet, far too familiar. Inside the cup, engraved, your name. You feel better anyway.","event.dealer_tea.rb":"He withdraws the cup, unoffended. “Whenever you like.” You both know it isn’t politeness.","event.dealer_tea.text":"The Dealer pours tea into two identical cups. “Rest a little. The house is paying.” The steam draws a number.","event.dealer_tea.title":"The Dealer’s tea","event.debt_collector.a":"Pay part of it","event.debt_collector.b":"Refuse to pay","event.debt_collector.ra":"He counts the bills twice and writes something down. “A pleasure.”","event.debt_collector.rb":"“I shall note it with interest.” He leaves without a sound. The cold stays.","event.debt_collector.text":"A man in a grey suit waits with a receipt. “Your debt, sir. It bears your signature.” You don’t remember signing.","event.debt_collector.title":"The collector","event.dice_pit.a":"Roll the dice","event.dice_pit.b":"Back away","event.dice_pit.ra":"The dice roll and stop. The voice already knew the result.","event.dice_pit.rb":"The voice clicks its tongue. “Another time.” You hear it laughing below.","event.dice_pit.text":"A sand pit with bone dice. A bodiless voice asks: “Heads or tails?” The dice have neither.","event.dice_pit.title":"The dice pit","event.drowned_pier.a":"Reach out a hand","event.drowned_pier.b":"Walk away","event.drowned_pier.ra":"He grips you. Heavy, freezing, he whispers his payment: someone sank him over a debt that was yours. He leaves you a handful of salt.","event.drowned_pier.rb":"The knocking follows behind you, always at the same distance.","event.drowned_pier.text":"A wooden pier with no water. Below, a man soaked to the bone knocks on the floor with his knuckles, very slowly.","event.drowned_pier.title":"The dry pier","event.first_chip.a":"Take the chip","event.first_chip.b":"Let it roll away","event.first_chip.ra":"It weighs more than it looks. Something in a book you cannot see has just been written down.","event.first_chip.rb":"The chip vanishes into the dark. The Dealer nods, as if he had expected it.","event.first_chip.text":"A black chip rolls to your feet. The Dealer smiles without moving his mouth: “It’s yours. It always was.”","event.first_chip.title":"The black chip","event.girl_1.a":"Play heads or tails","event.girl_1.b":"Decline","event.girl_1.ra":"The coin spins far too long. It lands, or it doesn’t; she has already looked away.","event.girl_1.rb":"“How dull,” she says, pocketing the coin. She follows you with her good eye until you are gone.","event.girl_1.text":"A girl with one eye sewn shut with red thread spins a coin. “Heads or tails. You choose. I watch.”","event.girl_1.title":"The Girl with the Stitched Eye","event.girl_2.a":"Believe her","event.girl_2.b":"Doubt her","event.girl_2.ra":"You thank her. You accept her advice and her money; both turn out false, though useful.","event.girl_2.rb":"She smiles crookedly. “Clever.” You learn her tell: she lies when she looks at the floor.","event.girl_2.text":"“I’m warning you: the House doesn’t lie,” says the girl with the stitched eye. She says it staring at the floor. It is the kind of sentence said while lying.","event.girl_2.title":"What the girl says","event.girl_3.a":"Accept the eye","event.girl_3.b":"Refuse it","event.girl_3.ra":"You put it in and see more: the cards, the room, something behind the room. She keeps the thread.","event.girl_3.rb":"“Another time, then.” She closes her hand, and the eye, if it was an eye, is gone.","event.girl_3.text":"The girl offers a glass eye on her open palm. “This one sees more. It costs more, too.” The red thread has come loose a little.","event.girl_3.title":"The red thread","event.kitchen_fire.a":"Throw in an IOU","event.kitchen_fire.b":"Stir the pot","event.kitchen_fire.ra":"You pick one with your signature and toss it in. It burns blue. The debt lightens… and something inside you does too.","event.kitchen_fire.rb":"You stir slowly. For a moment the broth looks like your face. You ladle some out; it does you good, and the house charges for it.","event.kitchen_fire.text":"Old papers burn beneath the big pot: IOUs, receipts, promises. The Cook is away. The fire looks at you hungrily.","event.kitchen_fire.title":"The stove","event.merchant_memory.a":"Buy a jar","event.merchant_memory.b":"Decline","event.merchant_memory.ra":"You uncork it and suddenly you play one hand better. You don’t know why.","event.merchant_memory.rb":"“Whenever you like.” He is slightly offended. He is the only merchant who never turns his back.","event.merchant_memory.text":"The Peddler sells memories in jars. “This one smells like your first casino. That one, like your last hand.”","event.merchant_memory.title":"A memory for sale","event.mirror_hall.a":"Touch the glass","event.mirror_hall.b":"Look away","event.mirror_hall.h":"Say your name to it","event.mirror_hall.ra":"It is warm, like a hand. Your reflection smiles half a second before you do.","event.mirror_hall.rb":"You count the steps to the exit. Nobody follows you. Nobody, except one.","event.mirror_hall.rh":"The reflection nods. For the first time you feel that someone on that side plays in your favor.","event.mirror_hall.text":"Every mirror returns your gesture a second late. The last one does not follow you: it watches you.","event.mirror_hall.title":"The hall of mirrors","event.moon_window.a":"Open it","event.moon_window.b":"Close it","event.moon_window.ra":"The air smells of wax. You know something you didn’t: the Man in the Chair cannot bear this light.","event.moon_window.rb":"You close it slowly. On the other side of the glass something knocks twice, politely.","event.moon_window.text":"A wall-less window shows an enormous moon. In the rest of the casino it is daytime.","event.moon_window.title":"The window","event.nun_1.a":"Confess","event.nun_1.b":"Stay silent","event.nun_1.ra":"You talk for what feels like a whole night. You leave lighter… and with a slightly longer bill. She notes something on the beads of her rosary.","event.nun_1.rb":"She nods slowly. “Silence is also a debt,” she says, and lights a candle without asking you for anything.","event.nun_1.text":"A nun in a black veil makes room for you in the confessional. “Tell me what you owe,” says the Sister. “Everything is said here, even if no one listens.”","event.nun_1.title":"The veil","event.nun_2.a":"Ask about him","event.nun_2.b":"Pray with her","event.nun_2.h":"Ask for the Dealer’s name","event.nun_2.ra":"“He had a debt and I offered him water. He accepted. It’s paid, though he doesn’t believe it.” At last you understand what happened to the Drowned Man.","event.nun_2.rb":"You pray without words. You feel the weight of a hand that isn’t there. You leave with less fear and damp shoes.","event.nun_2.rh":"The Sister crosses herself. “I know it. He confessed it once, long ago, before the first hand.” She presses her lips together: she won’t tell you. But now you know there was a name.","event.nun_2.text":"“I baptized one for too long,” the Sister murmurs, looking at the font. “Now he lives downstairs and never dries.” The candles lean toward the floor.","event.nun_2.title":"The baptism","event.nun_3.a":"Absolve her","event.nun_3.b":"Leave her praying","event.nun_3.ra":"You say words you don’t remember learning. She weeps without a sound and, rising, hands you something you don’t remember losing either.","event.nun_3.rb":"You walk away with her murmur behind you. In the collection box there are a few coins; you can’t tell whether they’re yours or hers.","event.nun_3.text":"This time it is the Sister who kneels. “I confessed first,” she says. “And I gave him absolution before he had anything to be forgiven.”","event.nun_3.title":"The last confession","event.nurse_1.a":"Let her stitch you","event.nurse_1.b":"Decline","event.nurse_1.ra":"It doesn’t hurt. She closes wounds you didn’t know you had and leaves others unopened. “There,” she says. “Now, to bed.” You don’t stay.","event.nurse_1.rb":"She looks at you for a long moment. “As you wish.” She puts the needle on a tray with a dozen more. It’s not the first time someone has said no.","event.nurse_1.text":"A nurse in a green mask pulls back a curtain. “Sit down, dear. You look awful. No one is cured here, but everyone gets a little better.” She holds a threaded needle.","event.nurse_1.title":"The infirmary","event.nurse_2.a":"Ask about the girl","event.nurse_2.b":"Take the thread","event.nurse_2.ra":"“She saw what lies behind the deck. The Dealer asked me politely.” You understand why the Girl lies: it’s the one thing they didn’t sew shut.","event.nurse_2.rb":"The black thread tangles around your fingers and one of your cards ends up marked with a stitch. It looks as if it was always that way.","event.nurse_2.text":"On the tray lie needles, black thread and a glass eye. “It’s the Girl’s,” says the Nurse. “I sewed hers shut so she’d stop seeing. Now she asks me to do it again every night.”","event.nurse_2.title":"The tray","event.nurse_3.a":"Push his chair","event.nurse_3.b":"Change the dose","event.nurse_3.ra":"You go down the corridor slowly. He talks about when the house was one salon and one table. “I stayed to wait for the others,” he repeats. And the others came.","event.nurse_3.rb":"You swap the label. He doesn’t protest; neither does the Nurse. “If he stands, we’ll see who sits,” she finally says. There is something they no longer charge you for.","event.nurse_3.text":"The Man in the Chair waits in the infirmary corridor. A syringe rests in his lap. “My dose,” he murmurs. “So I don’t stand up.” The Nurse watches you from the doorway.","event.nurse_3.title":"The dose","event.old_photograph.a":"Take it down","event.old_photograph.b":"Leave it","event.old_photograph.ra":"Behind it there are names. Many. None repeats... except yours.","event.old_photograph.rb":"You leave it. You still feel watched, but with a certain kindness. Almost.","event.old_photograph.text":"A group photo hangs on the wall: players around this table, from every era. In the back row, your face.","event.old_photograph.title":"The photograph","event.phone_call.a":"Answer","event.phone_call.b":"Hang up unheard","event.phone_call.ra":"A breath and, beneath it, a murmur of distant applause. “Are you still there?” says someone who isn’t in the room. “We are.”","event.phone_call.rb":"The phone falls silent the moment you touch it. As you hang up, a collective sigh is heard.","event.phone_call.text":"A bakelite phone rings in the middle of the table. It’s for you. It’s always for you, from the second time on.","event.phone_call.title":"The telephone","event.pianist_1.a":"Listen to the end","event.pianist_1.b":"Ask for another","event.pianist_1.h":"Ask about his hands","event.pianist_1.ra":"It lasts as long as it lasts. You feel light, almost forgiven. You leave a coin in his tailcoat pocket.","event.pianist_1.rb":"“It’s the only one I know.” He plays it again, just as perfect. When it ends he holds out an empty cuff: inside are some coins you don’t remember leaving.","event.pianist_1.rh":"“I left them as payment,” he says. “The Dealer wanted them for his first deck. Now the Archivist keeps them in a drawer that never opens.” And he goes on playing.","event.pianist_1.text":"A pianist with empty cuffs plays the chapel organ. There are no hands in his sleeves, yet the music sounds. “It’s the only piece I remember,” he says without turning.","event.pianist_1.title":"The organist","event.pianist_2.a":"Dance with her","event.pianist_2.b":"Watch from afar","event.pianist_2.ra":"You spin until the floor forgets you. You feel better, and worse. She whispers: “Thank you for not letting go.”","event.pianist_2.rb":"You look at each other without a word. Her dress sways without wind. The Pianist plays more softly, as if apologizing.","event.pianist_2.text":"The Woman in Red dances alone among the pews to the rhythm of the organ. If the Pianist stopped, what would become of her? She offers you a gloved hand.","event.pianist_2.title":"The dance","event.prompter_1.a":"Follow his whisper","event.prompter_1.b":"Cover your ears","event.prompter_1.h":"Ask about the Dummy","event.prompter_1.ra":"You say “good evening” and cough. The audience that isn’t there applauds. Someone leaves coins in the box; the Prompter pushes them toward you without looking.","event.prompter_1.rb":"The silence does you good. He sighs like someone who’s lost his place and mutters a line to the void. For a moment, no one tells you what to say.","event.prompter_1.rh":"“The Dummy? I prompt him, from here. But the box has no bottom: I don’t even know where my own lines come from.” You look inside: it’s true, there’s only more darkness.","event.prompter_1.text":"Beneath the stage, a booth shaped like a shell. Inside, a man in thin glasses whispers your line before you think it: “Say ‘good evening’, then cough.” It is the Prompter.","event.prompter_1.title":"The prompt box","event.prompter_2.a":"Read the last line","event.prompter_2.b":"Tear out the page","event.prompter_2.ra":"You squint until you can read it: “The Dealer has a part here too.” You understand that everyone in the house plays a role… and that someone casts them.","event.prompter_2.rb":"The page crumbles in your hand like cold ash. The Prompter doesn’t protest: “Someone had to tear it out sooner or later.” You breathe easier.","event.prompter_2.text":"The Prompter shows you the bound script. Your name appears on every page. On the last, the writing shrinks and vanishes: “Here the audience improvises,” he says.","event.prompter_2.title":"Act three","event.puppet_1.a":"Talk to it","event.puppet_1.b":"Cut its strings","event.puppet_1.ra":"It repeats whole sentences: the same ones the Dealer said to those before you. You notice a pause before each, as if someone were prompting from behind.","event.puppet_1.rb":"It falls limp with a knock of wood. In its pocket are some coins and an unsigned note: “Keep going without looking back.”","event.puppet_1.text":"A ventriloquist’s dummy sits on an empty chair. With no one moving it, its jaw drops: “Welcome,” it says in a voice you’ve heard before. “We were expecting you.”","event.puppet_1.title":"The dummy","event.puppet_2.a":"Follow the script","event.puppet_2.b":"Break the script","event.puppet_2.ra":"You say exactly what was written and everything goes well, too well. The bill lightens. Somewhere, the Dealer seems to smile.","event.puppet_2.rb":"You say a line that wasn’t there. The Dummy is left with its mouth open. For an instant, the whole house has to improvise.","event.puppet_2.text":"The Dummy speaks again. This time it doesn’t repeat the Dealer: it reads your own lines, before you say them. “Page thirty,” it announces. “This is where you hesitate.”","event.puppet_2.title":"The script","event.room_13.a":"Enter","event.room_13.b":"Shut the door","event.room_13.ra":"Inside, the Child waits with the cards in its hands. “Did you lose again?”","event.room_13.rb":"You shut it. The door dissolves into the wall as if it had never been there.","event.room_13.text":"At the end of the corridor stands a door that wasn’t there: 13. Behind it, the sound of a child shuffling, very slowly.","event.room_13.title":"Room 13","event.secret_bone_door.a":"Open it","event.secret_bone_door.b":"Search the room","event.secret_bone_door.ra":"The bone key was in your pocket all along. Behind the door: a room with no exit and air that smells like real air.","event.secret_bone_door.rb":"You find a few coins by the door. The door waits.","event.secret_bone_door.text":"A door made of small, polished bones. It has a lock. And it has your key, though you haven’t seen it yet.","event.secret_bone_door.title":"The bone door","event.secret_stage.a":"Sit in your seat","event.secret_stage.b":"Remain standing","event.secret_stage.ra":"From your seat you see a table, a deck and an empty chair. You understand you are not the only one playing here. Nor the only one watching.","event.secret_stage.rb":"You prefer to remain standing. A short rest, and slightly lighter air.","event.secret_stage.text":"A casino stage with empty seats. Each one bears a name plate. One bears yours. Another, the Dealer’s: it is blank.","event.secret_stage.title":"The empty stage","event.secret_watcher.a":"Stare back","event.secret_watcher.b":"Look down","event.secret_watcher.ra":"It looks at you. You look at it. And for a moment you feel that someone else is watching you both, from outside the room.","event.secret_watcher.rb":"You look down. The eye on the ceiling seems relieved, as if it feared being looked at.","event.secret_watcher.text":"A room without doors with an eye painted on the ceiling. Nobody painted it. It blinks when you blink.","event.secret_watcher.title":"The one who watches","event.signed_receipt.a":"Read it all","event.signed_receipt.b":"Tear it up","event.signed_receipt.ra":"It is a list of games. All lost. All yours.","event.signed_receipt.rb":"You tear it to pieces. When you close your fist it is whole again in your pocket, but lighter.","event.signed_receipt.text":"A folded receipt falls from your pocket. It has your handwriting, an amount you don’t understand, and tomorrow’s date.","event.signed_receipt.title":"The signed receipt","event.staff_room.a":"Check the shifts","event.staff_room.b":"Erase your name","event.staff_room.ra":"Each of them covers a shift for a guest who never left. You grasp something uncomfortable: every one of them played before. Every one.","event.staff_room.rb":"You run a finger over your name and it vanishes. It reappears on the other side of the room. At least there are some forgotten coins in a locker.","event.staff_room.text":"A room with lockers and a shift board: Dealer, Archivist, Vendor, Cook, Nurse, Sister, Pianist… There’s a slot with your name on the last shift of the night.","event.staff_room.title":"The staff room","event.theatre_seats.a":"Take a bow","event.theatre_seats.b":"Leave quietly","event.theatre_seats.ra":"You bow. The applause multiplies, grows deafening… and stops dead. On stage lies something for you: a purse of coins tied with ribbon.","event.theatre_seats.rb":"You tiptoe out. The coats don’t move. Only when you close the door do you hear behind you a sigh of disappointment, from a thousand mouths.","event.theatre_seats.text":"The house is full of coats and hats on seats with no one inside them. When you enter, all the coats turn toward you at once. A single, slow clap is heard.","event.theatre_seats.title":"The stalls","event.usher_1.a":"Sit down","event.usher_1.b":"Stay standing","event.usher_1.ra":"You sink into the velvet. You rest as you couldn’t remember being able to. The show begins and no one walks on stage… but they charge admission on the way out.","event.usher_1.rb":"“As you wish.” She switches off the beam and stands beside you, motionless. A coin drops to the floor; you don’t know who left it.","event.usher_1.text":"A woman in a pillbox cap shines a flashlight at your shoes. “This way, please. Row thirteen, seat thirteen. We were expecting you.” The seat is warm.","event.usher_1.title":"Your seat","event.usher_2.a":"Follow the beam","event.usher_2.b":"Switch off the flashlight","event.usher_2.ra":"On number thirteen lie a coat in your size and a hat with your initials. Every other name is crossed out. Yours isn’t. You feel watched, and not only by her.","event.usher_2.rb":"The darkness is total. She laughs softly. “Now that is a show.” Among the seats you feel for forgotten coins and leave in a hurry.","event.usher_2.text":"The Usher sweeps her flashlight along the rows. On every seat, a folded coat, a hat, a cane. “No one leaves,” she whispers. “They leave their things and stay. Look at number thirteen.”","event.usher_2.title":"The beam of light","event.wall_notes.a":"Keep reading","event.wall_notes.b":"Cover your eyes","event.wall_notes.ra":"There’s more: bets, debts, a couple of jokes. Among the scribbles, some forgotten money in a crack.","event.wall_notes.rb":"They say whoever reads it all stays to live here. You’d rather not find out.","event.wall_notes.text":"Someone has written on the wall in chalk, in charcoal, in blood: “The Nurse stitched the eye.” “The Cook keeps the memories.” “The Vendor sells them.” “The Sister knows the name.” “The Pianist paid with his hands.” Below, smaller: “No one remembers who writes this.”","event.wall_notes.title":"Notes on the wall","event.watcher_1.a":"Look at your screen","event.watcher_1.b":"Change channel","event.watcher_1.h":"Ask who watches the Watchman","event.watcher_1.ra":"You see yourself from above, waiting. You watch your lips move in this very sentence. The Watchman jots something down and slides you a few coins: “For the trouble.”","event.watcher_1.rb":"You press a button and the picture jumps to an empty room, then another, then to a room with no number. The Watchman looks at you for the first time: “That shouldn’t come up.”","event.watcher_1.rh":"He doesn’t answer. But his gaze drops for a second to a corner of the wall where no screen covers the plaster. “There’s a gap there,” he admits, very quietly. “I don’t know what’s in it. No one can see.”","event.watcher_1.text":"A wall of green and blue screens: the Salon, the Corridor, the Chapel, the Kitchens… On one, your own back. A man in a cap doesn’t look away: “Sit down. Don’t talk. I’ll note it down.”","event.watcher_1.title":"The monitors","event.watcher_2.a":"Approach the blind spot","event.watcher_2.b":"Cover your face","event.watcher_2.ra":"For a few seconds, no one sees you. It is a silence that almost hurts. You learn where it begins and where it ends, and that from here the house seems less watchful.","event.watcher_2.rb":"You hold your hands over your face. A screen flickers and stops following you. The Watchman pretends to have seen nothing. You feel a little lighter.","event.watcher_2.text":"The Watchman points to a corner of the ceiling. “That camera faces the wall. Always. Someone turned it years ago.” Beneath it, a square of wall with no screen, no dust, no shadow.","event.watcher_2.title":"The blind spot","event.wet_footprints.a":"Follow them","event.wet_footprints.b":"Ignore them","event.wet_footprints.ra":"Behind the door there is an empty table and a handful of damp chips. Nobody claims them.","event.wet_footprints.rb":"You prefer not to know. The floor, however, keeps getting wet behind you.","event.wet_footprints.text":"Wet, bare footprints cross the carpet and disappear under a door. Someone has just passed.","event.wet_footprints.title":"Wet footprints","event.woman_dress.a":"Take the card","event.woman_dress.b":"Refuse it","event.woman_dress.ra":"The card grows warm. Turned over, it shows someone who wept a great deal and regrets nothing.","event.woman_dress.rb":"She pockets the card without insisting. You know she will offer it again.","event.woman_dress.text":"A woman in a dark red dress holds out a card face down. “Four times as much of everything,” she says. “Debts included.”","event.woman_dress.title":"The Woman in Red","finale.stage1":"THE LAST HAND","finale.stage2":"THE LAST BULLET","fx.abandoned":"You left the room half-finished. The house took something.","fx.collapse":"Your mind cracks: you lose Health and regain some Sanity.","fx.interest":"Debt interest: +{n}","fx.revive_candle":"The short candle lights you again.","fx.revive_life":"An extra life drags you back from death.","fxbanner.big":"BIG PLAY!","fxbanner.good":"NICE PLAY!","fxbanner.huge":"DEVASTATING!","fxbanner.target":"TARGET REACHED!","hand.five":"Five of a kind","hand.flush":"Flush","hand.four":"Four of a kind","hand.full":"Full house","hand.high":"High card","hand.pair":"Pair","hand.royal":"Royal flush","hand.sflush":"Straight flush","hand.straight":"Straight","hand.three":"Three of a kind","hand.twopair":"Two pair","help.combos":"Special combos","help.goal":"Reach the point TARGET before you run out of plays. If you don’t, the house collects.","help.hands":"Hands (chips × mult)","help.score":"Each play scores CHIPS × MULT. The hand (pair, three of a kind, straight…) sets the base; every card and combo adds more. Always check the cost before playing. Each card adds chips by its value: Ace 11, face cards (J, Q, K) 10, the rest their number.","help.stakes":"Staking multiplies the play but costs Health, Sanity, Money or Debt. Some rules forbid it.","help.stakes_title":"Stakes","help.suits":"Suits","help.tips":"Discard weak cards, put up to two in the Pocket at once for the perfect play, and watch your Sanity: when it drops, the screen distorts, and at 0 you collapse (+25 Sanity, −20 Health).","help.tips_title":"Tips","help.title":"Quick guide","hint.boss":"Each wing has a Guardian with rules of its own that change the game. Read them before you play: defeating it brings you closer to the end.","hint.event":"Here you choose between two options: REJECT (← or A) or ACCEPT (→ or D). What changes —Health, Sanity, Money or Debt— you will see afterwards. At 0 Health you die, with low Sanity the house distorts, and Debt grows with interest.","hint.map":"Tap a room to see what it is and tap it again to enter.","hint.merchant":"Everything here is bought with Money. And money is lent too: loans add Debt, and Debt grows with interest after every room.","hint.rest":"A breather: choose just one thing. Sleeping restores Health, breathing restores Sanity, paying lowers Debt and studying levels up a hand.","howto.cards":"SEE HANDS AND SUITS","howto.s1.h":"Goal","howto.s1.t":"You descend through the house room by room. On each floor you choose your path on the map: you play card tables, decide in events and, sometimes, stake something in the shotgun duel. Each wing ends with a Guardian; after that come the Dealer, his last hand and The Door.\nDying is not the end: you keep memories and knowledge, and you go down again.","howto.s2.h":"The map","howto.s2.t":"Each room is a node. Tap one to see what it is and tap it again (or press ENTER) to go in. You can only move to rooms connected to yours.\nThere are card tables, events, the Vendor, rests, the shotgun (a duel where you stake something of yours), a secret bone door and the Guardian.","howto.s3.h":"Your resources","howto.s3.t":"• Health: at 0 you die. An extra candle lifts you back up once, with 40% Health.\n• Sanity: it drops with cards, stakes and events. When low, the screen distorts and whispers appear; at 0 you collapse: you regain 25 Sanity but lose 20 Health.\n• Money: buys things at the shop and pays off debt.\n• Debt: it grows with loans and stakes, and 1.4% interest is added after every room. With a lot of debt, the House raises the table targets by 5% for every 100 over 200 (up to 25%).\n• Shield: absorbs the Health cost of cards.","howto.s4.h":"Card tables","howto.s4.t":"Pick 1 to 5 cards from your hand and play: the hand (pair, three of a kind, straight…) gives chips × multiplier, and each card and combo adds more. Reach the target before you run out of plays; if you don’t, you pay with Health, Sanity and Debt.\nYou can discard, keep up to two cards at once in the Pocket (you can play them from there and your hand is refilled) or stake (it multiplies the play, but it costs). Each opponent brings a rule of its own, shown on the table. Always check the cost before playing.","howto.s5.h":"Events","howto.s5.t":"They are two-option decisions: REJECT (← or A) or ACCEPT (→ or D); on a phone, swipe. Sometimes a third, hidden option (H) appears, depending on what you know or carry. What your decision changes is shown afterwards, and some tools let you redo it.","howto.s6.h":"Shotgun duel","howto.s6.t":"You stake something of yours (Money, Sanity, Debt or a card). The shotgun has 6 chambers, some loaded. The opponent announces how many bullets there are… and may lie.\nOn your turn you can shoot the opponent (if the chamber is loaded, it loses a mark; if not, the turn passes), tempt the Table (if it is empty you keep your turn; if not, you lose a mark) or listen (it costs Sanity and is not always right). Whoever leaves the other with no marks wins.","howto.s7.h":"Shop and rest","howto.s7.t":"The Vendor sells items, tools and cards for Money, and he also lends: loans add Debt.\nAt a rest you choose just one thing: sleep (Health), breathe (Sanity), pay debt or study a hand to level it up.","howto.s8.h":"Dying and remembering","howto.s8.t":"When you die you see your CURRENT DEBT (part of it carries over to your next descent) and your MEMORIES KEPT: permanent perks earned by doing certain things. What you discover is saved as knowledge and opens hidden options and doors.\nThere are 6 endings; The Door asks for different things for each one.","howto.s9.h":"Shield","howto.s9.t":"Some cards cost you Health when they score (Blood, Hunger…). The SHIELD is spent first: each point absorbs one point of that Health.\n• Keys and some special cards and items give it.\n• It shows next to your plays and lasts the whole round.\n• It does not stop stakes or opponent effects.","howto.title":"How to play","hud.debt":"Debt","hud.debt.tip":"What you owe the house: it grows with loans, bets and interest. When high, targets rise (up to +25%). In return, some cards and jokers turn it into points. Pay it off at rests.","hud.deck":"Deck","hud.deck.tip":"See all your cards, special ones highlighted. Sort them by suit, rank, special or newest.","hud.health":"Health","hud.health.tip":"Your life. At 0 you die. Blood cards, Health bets and lost rounds spend it; you recover it by sleeping at a rest or with bandages from the shop.","hud.howto":"How to play","hud.inventory":"Inventory","hud.items":"Items","hud.jokers":"Jokers","hud.levels":"Hand levels","hud.lives":"Lives","hud.lives.tip":"Each candle is a life. You start with one; if your Health hits 0 and you have another, it burns out and you return with 40% Health.","hud.money":"Money","hud.money.tip":"Use it to buy in the shop (jokers, items, cards, bandages…) and to pay off Debt at a rest. You earn it by winning rounds and duels.","hud.no_items":"Nothing yet.","hud.sanity":"Sanity","hud.sanity.tip":"Your mind. It drains when you listen in a duel and from bets, cursed cards and events. When low the screen distorts; at 0 you collapse (−20 Health, +25 Sanity). Breathe at a rest to recover it.","hud.settings":"Settings","hud.tools":"Tools","i18n.load_error":"Could not load the {lang} language file. Showing English; it will be retried.","intro.1":"Are you awake?","intro.2":"At last.","intro.3":"We have to finish a game.","intro.4":"What game?","intro.5":"The last one.","intro.6":"Sit down. I’ll show you how we play here.","item.campanilla.desc":"+1 discard per round.","item.campanilla.name":"Little bell","item.ceniza.desc":"+15 chips per play. −1 Sanity after each room.","item.ceniza.name":"Ash","item.cuchilla_oxidada.desc":"Blood gives +1 more mult but costs +1 Health.","item.cuchilla_oxidada.name":"Rusty blade","item.diente_leche.desc":"Teeth grow +1 more per play.","item.diente_leche.name":"Milk tooth","item.espejo_roto.desc":"+2 mult. Start with −2 Sanity. Redo one decision per run (−5 Sanity).","item.espejo_roto.name":"Broken mirror","item.ficha_negra.desc":"Stakes multiply +0.15 more. Undo a decision by paying 50 Debt.","item.ficha_negra.name":"Black chip","item.guante_crupier.desc":"+1 play per round.","item.guante_crupier.name":"Dealer’s glove","item.libro_cuentas.desc":"Debt interest is halved.","item.libro_cuentas.name":"Ledger","item.llave_hueso.desc":"Starting Shield of 4. Opens the hidden door. Enables the Door ending.","item.llave_hueso.name":"Bone key","item.moneda_mordida.desc":"+5 Money per round won. Gilded cards give +2 more.","item.moneda_mordida.name":"Bitten coin","item.ojo_vidrio.desc":"+1 card in hand. Mist does not affect you.","item.ojo_vidrio.name":"Glass eye","item.reloj_parado.desc":"Targets drop 8%. Debt grows 50% faster.","item.reloj_parado.name":"Stopped clock","joker.abaco.desc":"+1 permanent Mult for every round won in this descent.","joker.abaco.name":"The Rusty Abacus","joker.as_manga.desc":"×1.5 for every Ace that scores.","joker.as_manga.name":"The Ace Up the Sleeve","joker.bufon.desc":"+4 Mult.","joker.bufon.name":"The Mute Jester","joker.casa_gana.desc":"×1.4 if you stake on the play.","joker.casa_gana.name":"The House Always Wins","joker.colmillo_dorado.desc":"+10 chips per Tooth card that scores.","joker.colmillo_dorado.name":"The Golden Fang","joker.corona_podrida.desc":"×2 if the play is a Flush, Full house, Four of a kind, Straight flush, Royal flush or Five of a kind.","joker.corona_podrida.name":"The Rotten Crown","joker.escalera_sin_fin.desc":"+40 chips and +4 mult if the play is a Straight, a Straight flush or a Royal flush.","joker.escalera_sin_fin.name":"The Endless Staircase","joker.gemelos.desc":"×1.5 if the play is Two pair or Full house.","joker.gemelos.name":"The Twins","joker.llavero_roto.desc":"+8 chips and +1 Shield per Key that scores.","joker.llavero_roto.name":"The Broken Keyring","joker.monja_ciega.desc":"×1.25 for every face card (J, Q, K) that scores.","joker.monja_ciega.name":"The Blind Nun","joker.ojo_nuca.desc":"+12 chips per Eye card that scores.","joker.ojo_nuca.name":"The Eye on the Neck","joker.peaje.desc":"You earn 2 Money for every card that scores.","joker.peaje.name":"The Ferryman’s Toll","joker.sanguijuela.desc":"+2 Mult per Blood card that scores.","joker.sanguijuela.name":"The Leech","joker.sombrero.desc":"×1.3 on all your plays, but every play costs 2 Sanity.","joker.sombrero.name":"The Dealer’s Hat","joker.sonrisa.desc":"+30 chips if the play contains a pair or better.","joker.sonrisa.name":"The Fixed Grin","joker.trapero.desc":"+1 Mult per 40 Debt (max +10).","joker.trapero.name":"The Ragman","joker.ultima_oportunidad.desc":"+10 Mult on your last play of the round.","joker.ultima_oportunidad.name":"The Last Chance","joker.ultimo_aliento.desc":"×3 if your Health is below 30%.","joker.ultimo_aliento.name":"The Last Breath","joker.vela_viuda.desc":"×1.5 if your Sanity is below 40.","joker.vela_viuda.name":"The Widow’s Candle","know.clue":"Clue about the Dealer","know.k_chair_founder.name":"The founder","know.k_chair_founder.text":"The Man in the Chair founded the house and never got up.","know.k_child_self.name":"The child is you","know.k_child_self.text":"The child in the birthday dress was you. Its “blind eyes” rule no longer blinds you.","know.k_concierge_keys.name":"The Concierge’s ring","know.k_concierge_keys.text":"The Concierge has a key for every door in the house but one: the way out. Someone else keeps that.","know.k_cook_jars.name":"The jars","know.k_cook_jars.text":"The Cook preserves memories in jars and the Vendor sells them. You know where his hunger comes from: he no longer demands extra of you.","know.k_dealer_deck.name":"The Dealer’s deck","know.k_dealer_deck.text":"The Dealer always deals from the bottom. His deck has no king.","know.k_dealer_ledger.name":"The Dealer’s ledger","know.k_dealer_ledger.text":"In his ledger every line is a game. The last one is missing.","know.k_dealer_no_name.name":"The Dealer has no name","know.k_dealer_no_name.text":"Nobody remembers the Dealer’s name. Neither does he.","know.k_door_same.name":"All the doors are the same","know.k_door_same.text":"Every door leads to the same room. You need to know this to see the truth.","know.k_drowned_paid.name":"The Drowned Man has paid","know.k_drowned_paid.text":"The Drowned Man paid his debt in water. His “drowning” rule no longer sinks you.","know.k_girl_lies.name":"What the girl lies about","know.k_girl_lies.text":"The girl with the stitched eye lies when she tells the truth. Her “no repeats” rule no longer binds you.","know.k_moon.name":"The window’s moon","know.k_moon.text":"The window’s moon is a spotlight. Without its cold, the Man in the Chair loses his rule.","know.k_nun_name.name":"The Dealer’s name","know.k_nun_name.text":"The Sister knows what the Dealer was called and won’t say. But you know he once had a name. Her punishment for repeating plays no longer reaches you.","know.k_nurse_eye.name":"The stitched eye","know.k_nurse_eye.text":"The Nurse stitched the Girl’s eye because it saw too much. You know what her lies hide, and Eyes work for you again against the Nurse.","know.k_pianist_hands.name":"The Pianist’s hands","know.k_pianist_hands.text":"The Pianist paid with his hands for the house’s first deck. The Archivist keeps them in a drawer that never opens.","know.k_players.name":"The players","know.k_players.text":"Everyone here played before. Everyone.","know.k_prompter_box.name":"The Prompter’s box","know.k_prompter_box.text":"The box has no bottom: the Prompter writes over what you’ve already said. You know where he whispers from, and his Memory no longer punishes you for repeating plays.","know.k_puppet_script.name":"The script","know.k_puppet_script.text":"The Dummy repeats the Dealer’s script. Everything said here is written down; what’s missing is by whom.","know.k_reflection.name":"Your reflection","know.k_reflection.text":"In the mirror, you are not the one who moves first.","know.k_room13.name":"Room 13","know.k_room13.text":"There is a room that appears on no floor plan.","know.k_usher_seat.name":"Seat 13","know.k_usher_seat.text":"Every seat in the house was paid for by someone who never left. Number 13 is yours, and it is warm.","know.k_watcher.name":"Someone is watching","know.k_watcher.text":"Someone is watching the game from outside the house.","know.k_watcher_blind.name":"The blind spot","know.k_watcher_blind.text":"There is one room no camera shows, and the Watchman didn’t know. You know where to look, and his Watch no longer ties your hands.","legal.back":"BACK TO THE GAME","legal.lang":"Language","legal.load_error":"The text could not be loaded in {lang}. Showing it in English.","legal.privacy.s1.h":"1. What the game stores","legal.privacy.s1.t":"The game stores your save and your settings (language, volume, accessibility) in your browser’s local storage. This data stays on your device: the game does not send it to any server.\nYou can erase it with RESET PROGRESS in the menu or from your browser settings. If you erase it, you lose your save.","legal.privacy.s2.h":"2. No third-party services","legal.privacy.s2.t":"The game includes no advertising or analytics, uses no cookies and loads no resources from other sites. It does not collect personal data.","legal.privacy.s3.h":"3. Hosting","legal.privacy.s3.t":"Like any website, the hosting where the game is published (currently GitHub Pages) may log technical data about visits, such as the IP address, under its own terms. The game does not receive that data.","legal.privacy.s4.h":"4. Content notice","legal.privacy.s4.t":"THE HOUSE ALWAYS WATCHES is a work of horror fiction: the characters, places and events are imaginary.\nThe money, chips, bets and debts in the game are fictional: they have no real value, they cannot be bought or exchanged for real money, and the game is not a gambling service.\nIt includes flicker and shaking effects, and visual distortion when Sanity drops. You can reduce them in SETTINGS → Reduce effects. If you have photosensitive epilepsy or other discomfort, talk to a professional before playing.","legal.title.privacy":"Privacy and notice","legal.updated":"Last updated: 2026-10-01","log.round_lost":"You lost the round. The house collects.","log.round_won":"Round won.","map.enter":"ENTER","map.info.event":"Something awaits. You don’t know what.","map.info.merchant":"A seller of things that should not be sold.","map.info.rest":"A corner to catch your breath.","map.info.secret":"A bone door nobody else sees.","map.joker_left":"Move {name} left","map.joker_right":"Move {name} right","map.jokers_hint":"Jokers act from left to right. Drag them or use ◀ ▶ to reorder.","map.jokers_label":"Jokers","map.locked":"out of reach","map.opp":"Opponent: {name}","map.pick":"Choose your next hive.hint":"Indice","archive.knowledge":"Connaissances","archive.memories":"Souvenirs","archive.missions":"Missions accomplies","archive.next":"Suivant","archive.page":"Page {n}/{m}","archive.prev":"Précédent","archive.stat.anomalies":"Anomalies","archive.stat.deaths":"Morts","archive.stat.duelsLost":"Duels perdus","archive.stat.duelsWon":"Duels gagnés","archive.stat.roundsLost":"Manches perdues","archive.stat.roundsWon":"Manches gagnées","archive.stat.runs":"Descentes terminées","archive.stats":"Statistiques","archive.tab.chars":"Personnages","archive.tab.eggs":"Secrets","archive.tab.endings":"Fins et souvenirs","archive.tab.know":"Savoir","archive.tab.stats":"Données","archive.title":"Archives","archive.unknown":"???","bio.archivist":"Elle classe tous les noms et toutes les portes. Dans un tiroir qui ne s’ouvre pas, elle garde les mains du Pianiste.","bio.chair":"Il a fondé la maison et s’est assis pour attendre les autres. L’Infirmière lui ajuste sa dose pour qu’il ne se lève pas « pour son bien ».","bio.child":"Il se souvient de toi mieux que toi de lui. Le Cuisinier lui garde toujours une assiette chaude que personne ne l’a jamais vu manger.","bio.concierge":"Il garde toutes les clés de la maison et fait payer l’ouverture des portes. Il connaît la sortie et ne se presse pas de te la dire : lui aussi est resté.","bio.cook":"Il cuisine avec ce que la maison doit et conserve les souvenirs en bocaux. Il partage tablier et dettes avec son frère, le Vendeur.","bio.dealer":"Il n’a pas de nom. Il tient le registre des comptes et distribue un jeu de cinquante-deux cartes… et d’une qui manque.","bio.drowned":"Il a payé sa dette avec de l’eau. La Sœur l’a baptisé trop longtemps et il vit désormais en bas.","bio.girl":"Elle ment presque toujours. L’Infirmière lui a cousu l’œil gauche pour qu’elle cesse de voir ce qu’elle ne devait pas ; chaque nuit, elle lui demande de le recoudre.","bio.merchant":"Il vend des souvenirs en bocal. Il les tient de son frère, le Cuisinier, qui les conserve.","bio.nun":"Elle entend la confession de tous, même celle du Croupier. Elle connaît son nom ; la confession est sacrée et elle ne le dira pas.","bio.nurse":"Elle soigne tous ceux qui restent. Elle a cousu l’œil de la Fille et maintient l’Homme à la Chaise assis ; ni l’un ni l’autre ne l’a remerciée.","bio.pianist":"Il a joué pour le Croupier au commencement et a payé de ses mains. Il joue toujours le seul morceau dont il se souvienne.","bio.prompter":"Il vit dans la niche sous la scène et souffle son texte à tout le monde. Il a écrit le texte que répète le Pantin… du moins le croit-il, car il ne sait plus s’il l’a écrit ou seulement recopié.","bio.puppet":"Il parle avec la voix de celui qui l’a payé. Il répète le texte du Croupier mot pour mot… et parfois un mot avant : c’est le Souffleur qui le lui souffle depuis la niche.","bio.usher":"Elle connaît chaque siège et à qui il appartient. Elle accompagne les invités à leur fauteuil et n’en a jamais vu un repartir ; le 13, elle te le garde.","bio.watcher":"Il regarde tous les écrans à la fois et se souvient de ce qu’il a vu sur chacun. Une seule salle n’est montrée par aucune caméra. L’Infirmière lui apporte son dîner ; il ne lève jamais les yeux.","bio.woman":"Elle danse dans une robe qu’elle ne peut plus ôter. Le Pianiste joue pour elle et elle ne lui demande jamais de s’arrêter.","boss.chair.a":"« Assieds-toi. Ici le sang refroidit et tes cartes ne donnent aucune chaleur. »","boss.chair.l":"« La chaise gagne toujours. C’est la seule chose que j’en sais. »","boss.chair.w":"« Je me lève. J’ai été assis si longtemps que j’ai oublié comment on fait. »","boss.child.a":"« Tu te souviens de moi ? Moi de toi, oui. Ne ferme pas les yeux… ah, ils le sont déjà. »","boss.child.l":"« Encore. Tu perds toujours ici. Tu reviens toujours. »","boss.child.w":"« Tu m’as battu. Je le voulais. Maintenant tu dois grandir. »","boss.cook.a":"« On a faim, dans cette cuisine. Mets plus sur la table et ne te plains pas de la vapeur. »","boss.cook.l":"« Pas de dette, pas de maison. Assieds-toi, ça refroidit. »","boss.cook.w":"« Tu as nettoyé ton assiette. Prends quelque chose avant que mon frère ne le vende. »","boss.dealer.a":"« La dernière main. Sans mises ni tours. Tout à découvert. »","boss.dealer.l":"« Ça a toujours été ma table. Lève-toi ; nous recommencerons. »","boss.dealer.w":"« Bien joué. Un instant, j’ai cru que c’est moi qui ne me relèverais pas. »","boss.drowned.a":"« Respire tant que tu peux. Chaque carte jouée te fera couler un peu. »","boss.drowned.l":"« Bois, bois. Ce n’est que de l’eau. Ce n’est qu’une dette. »","boss.drowned.w":"« J’ai déjà payé. Du moins je le croyais. Monte ; il ne reste rien ici. »","boss.fight":"JOUER LA PARTIE","boss.girl.a":"« On joue à ne pas se répéter. Je remarque tout avec l’œil qui ne voit pas. »","boss.girl.l":"« Encore la même chose, encore la même chose. Tu m’ennuies. »","boss.girl.w":"« Tu m’as battue sans mentir. Comme c’est étrange. Prends ce que tu veux. »","boss.no_rules":"Aucune règle spéciale","boss.nun.a":"« Confesse tes mains avant de les jouer. Ce qui se répète se retient, et ce qui se retient se paie. »","boss.nun.l":"« Prie, mon enfant. La maison n’écoute pas, mais elle note. »","boss.nun.w":"« Je te pardonne ce que tu me dois. Celle du Croupier est un autre compte. Passe. »","boss.nurse.a":"« Respire à fond, ma belle. Tes yeux ne te serviront à rien ici, et l’air se fait rare. »","boss.nurse.l":"« Calme-toi, ce n’est qu’une piqûre. Ils disent tous la même chose et ils retournent tous au lit. »","boss.nurse.w":"« Tu es guéri. Comme c’est étrange ; ici, personne ne l’est. Va-t’en avant que je change d’avis. »","boss.prompter.a":"« Tu es à ta place. Ne regarde pas la niche ; dis ta réplique et le reste viendra tout seul. Et ne te répète pas : le public s’ennuie. »","boss.prompter.l":"« Tu as raté ton entrée. On reprend depuis le début ; je te dirai quand. »","boss.prompter.w":"« La représentation est finie. Tu as improvisé, et ce n’était pas écrit. Alors… qui te l’a soufflé ? »","boss.rules":"Règles de cette partie","boss.title":"GARDIEN","boss.watcher.a":"« Je te vois sur vingt-trois écrans. N’essaie pas de cacher des cartes ni de rejouer un coup : je me souviens de tout. »","boss.watcher.l":"« Enregistré. Ta défaite est déjà aux archives, avec l’heure. Recommence ; je l’enregistrerai aussi. »","boss.watcher.w":"« Un angle mort… Tiens. Je ne savais pas qu’il y en avait un. J’éteins cette caméra ; passe avant que quelqu’un voie que je n’ai pas regardé. »","boss.weakened":"affaiblie","card.base":"{rank} ({suit})","card.carta_doble.desc":"Répète l’effet de la carte comptée juste avant.","card.carta_doble.name":"Carte Double","card.colmillo.desc":"+8 jetons. Gagne +2 à chaque point (max +40).","card.colmillo.name":"Croc","card.corazon.desc":"+2 mult. Rend 2 Santé.","card.corazon.name":"Cœur","card.cursed":"Maudite","card.dado_trucado.desc":"+6 jetons. Joker de couleur.","card.dado_trucado.name":"Dé Pipé","card.el_ahogado.desc":"+40 jetons (+80 si ta Raison est sous 40). −4 Raison.","card.el_ahogado.name":"Le Noyé","card.el_hambre.desc":"+6 mult. Coûte 3 Santé.","card.el_hambre.name":"La Faim","card.hueso_liso.desc":"+20 jetons.","card.hueso_liso.name":"Os Lisse","card.la_deuda.desc":"Jetons = Dette ÷ 6 (max 90). +10 Dette.","card.la_deuda.name":"La Dette","card.la_mujer.desc":"Joker total. ×4 en marquant. +25 Dette et −6 Raison.","card.la_mujer.name":"La Femme en Rouge","card.la_septima.desc":"+7 jetons. Multiplie ×(1 + 0,5 par mort), max ×5.","card.la_septima.name":"La Septième","card.llave_maestra.desc":"+10 jetons et +4 de Bouclier.","card.llave_maestra.name":"Clé Maîtresse","card.moneda_gemela.desc":"+4 jetons. Gagne 4 d’Argent.","card.moneda_gemela.name":"Pièce Jumelle","card.ojo_vigia.desc":"+12 jetons. Révèle 3 cartes du paquet.","card.ojo_vigia.name":"Œil de Garde","card.sangre_pacto.desc":"+3 mult. Coûte 2 Santé.","card.sangre_pacto.name":"Pacte de Sang","card.sombra.desc":"+5 jetons.
