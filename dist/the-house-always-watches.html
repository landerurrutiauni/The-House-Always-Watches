oor.req.crupier":"Requiert : 3 indices sur le Croupier.","door.req.deuda":"Toujours disponible.","door.req.espectador":"Requiert : « Quelqu’un regarde » et « Ton reflet ».","door.req.partida":"Requiert : « Les joueurs » et avoir rencontré 5 personnages.","door.req.puerta":"Requiert : la Clé d’os.","door.req.verdad":"Requiert : 5 fins vues et « Toutes les portes sont la même ».","door.seen":"Fin déjà vue","door.title":"La Porte","duel.announce":"{name} annonce : {n} chambres chargées sur 6.","duel.announce_note":"Il ment peut-être.","duel.anomaly":"« Ce n’était pas la balle que j’attendais. »","duel.chambers":"Chambres","duel.contract.honest":"Ce n’était pas un mensonge : la Dette monte de 20.","duel.contract.lied":"Le contrat mord : {name} perd une marque.","duel.ev.f_shot_click":"{name} tire. Clic.","duel.ev.f_shot_hit":"{name} tire : tu perds une marque.","duel.ev.f_table_backfire":"La Table se retourne contre {name} : il perd une marque.","duel.ev.f_table_safe":"{name} tente la Table. Rien.","duel.ev.p_shot_click":"Clic. La chambre était vide.","duel.ev.p_shot_hit":"Tu tires : {name} perd une marque.","duel.ev.p_table_backfire":"La Table te renvoie la balle : tu perds une marque.","duel.ev.p_table_safe":"La Table se tait. Tu gardes la main.","duel.ev.reload":"Le fusil se recharge.","duel.ev.skipped":"{name} oublie son tour.","duel.final":"LA DERNIÈRE BALLE","duel.heard_empty":"Tu crois entendre… le vide.","duel.heard_loaded":"Tu crois entendre… une balle.","duel.listen":"ÉCOUTER (−{c} Raison)","duel.lose":"« La maison encaisse. »","duel.marks_foe":"Marques de l’adversaire","duel.marks_you":"Tes marques","duel.setup.note":"Si tu gagnes : +10 d’Argent en plus. Si tu perds : −12 de Santé en plus de la mise. Personne ne t’oblige à croire ce qu’on annonce.","duel.setup.sub":"Que mets-tu sur la table ?","duel.shoot_foe":"TIRER SUR L’ADVERSAIRE","duel.shoot_table":"TENTER LA TABLE","duel.stake.card.lose":"Si tu perds : tu perds une carte","duel.stake.card.name":"Une carte de ton paquet","duel.stake.card.win":"Si tu gagnes : une carte spéciale","duel.stake.debt.lose":"Si tu perds : +{n} de Dette","duel.stake.debt.name":"{n} de Dette","duel.stake.debt.win":"Si tu gagnes : −60 de Dette","duel.stake.money.lose":"Si tu perds : −{n} d’Argent","duel.stake.money.name":"{n} d’Argent","duel.stake.money.win":"Si tu gagnes : +25 d’Argent","duel.stake.sanity.lose":"Si tu perds : −{n} de Raison","duel.stake.sanity.name":"{n} de Raison","duel.stake.sanity.win":"Si tu gagnes : +8 de Raison","duel.title":"LE FUSIL","duel.tool.memory":"L’adversaire oubliera son prochain tour.","duel.truth":"Témoin : il y avait {n} vraies balles.","duel.truth.honest":"Il disait vrai.","duel.truth.lied":"On t’a menti.","duel.turn_foe":"Tour de l’adversaire…","duel.turn_you":"À toi","duel.win":"« La maison paie. »","ending.crupier.epi":"Quelqu’un s’assoit pour la première fois en face de toi. Tu souris sans bouger la bouche.","ending.crupier.text":"Tu lui demandes d’ôter son sourire. Dessous, pas de visage : un miroir à ton âge. « J’ai gagné il y a si longtemps que j’ai oublié comment sortir », dit-il. Il te tend le paquet et s’assoit sur ta chaise. C’est toi qui distribues, maintenant.","ending.crupier.title":"Le Croupier","ending.deuda.epi":"La Maison gagne toujours. Mais aujourd’hui, elle a mis plus de temps.","ending.deuda.text":"Tu joues la dernière main et tu gagnes. La Maison inscrit la victoire dans son livre et te rend un jeton noir. « Tu me dois encore une partie », dit-elle. Tu te lèves. La porte reste fermée, mais tu sais compter.","ending.deuda.title":"La Dette","ending.espectador.epi":"Qui regarde fait aussi partie de la partie.","ending.espectador.text":"Tu regardes hors de la salle, là où personne ne devrait regarder. Derrière la vitre, un visage éclairé par un écran. C’est toi, ou quelqu’un qui te regarde jouer. Vous vous observez une seconde. Puis la maison baisse le rideau.","ending.espectador.title":"Le Spectateur","ending.first":"NOUVELLE FIN","ending.memories":"Souvenirs gagnés","ending.n":"FIN {n} / {total}","ending.partida.epi":"Sans joueurs, la maison n’est qu’une salle éclairée.","ending.partida.text":"Tu les appelles par leur nom, un à un : la fille, l’homme à la chaise, le noyé, l’archiviste, l’enfant. Chacun se lève de sa table. Personne ne se souvenait d’avoir été joueur. Ils lâchent leurs cartes en même temps. La partie s’arrête faute de quelqu’un qui veuille continuer.","ending.partida.title":"La Partie","ending.puerta.epi":"La porte se referme toute seule. Cette fois, du bon côté.","ending.puerta.text":"La clé d’os tourne sans bruit. Derrière la porte : un couloir et, au bout, une autre porte identique. Tu la franchis quand même. Dehors, il y a de l’air véritable et une pancarte : FERMÉ POUR TRAVAUX. Pour la première fois, personne ne te regarde.","ending.puerta.title":"La Porte","ending.to_menu":"RETOUR AU MENU","ending.true_hint":"Tu as vu cinq fins. Il reste une porte.","ending.verdad.epi":"Merci d’avoir joué. Tu peux cesser de regarder.","ending.verdad.text":"Tu as vu toutes les fins. Tu sais que toutes les portes sont la même et que celui qui regarde, c’est toi. Tu fermes le livre de comptes et tu écris la dernière ligne. La maison s’éteint. Il n’y a plus de partie : il ne reste que celui qui l’a jouée, et le silence de l’autre côté de l’écran.","ending.verdad.title":"La Vérité","event.archive_ledger.a":"Lire le registre","event.archive_ledger.b":"Le refermer","event.archive_ledger.ra":"Les colonnes de chiffres sont des parties. Toutes finissent à la même porte. Tu comprends qu’il n’y a pas tant de portes.","event.archive_ledger.rb":"« Sage décision », dit-elle. « Même si cela ne change rien. » Elle te donne quelques pièces pour ta discrétion.","event.archive_ledger.text":"Une femme aux lunettes épaisses range des registres qui gouttent d’encre. « Tous les noms sont ici », dit-elle. « Et toutes les portes sont la même. »","event.archive_ledger.title":"L’Archiviste","event.blood_vending.a":"Payer de ton sang","event.blood_vending.b":"Passer ton chemin","event.blood_vending.ra":"Le distributeur ronronne, satisfait, et crache une carte tiède.","event.blood_vending.rb":"Le distributeur s’éteint dans un soupir. Un instant, il a paru déçu.","event.blood_vending.text":"Un distributeur délivre des cartes contre une piqûre au doigt. Une pancarte : « Pas de monnaie rendue ».","event.blood_vending.title":"Le distributeur de cartes","event.chair_bet.a":"Accepter le pari","event.chair_bet.b":"Refuser","event.chair_bet.ra":"Il lance les dés sans regarder. Tu les entends rouler et s’arrêter juste quand tu cesses d’écouter.","event.chair_bet.rb":"« Je comprends », murmure-t-il. « Moi aussi, je préférerais ne pas me lever. »","event.chair_bet.text":"L’Homme à la Chaise ne se lève pas, et peut-être ne le peut-il pas. « Je mise la chaise », dit-il d’une voix usée. « Contre ta patience. »","event.chair_bet.title":"La chaise","event.chair_secret.a":"L’écouter","event.chair_secret.b":"L’interrompre","event.chair_secret.ra":"Il parle des heures, ou des secondes. À la fin, tu comprends à qui est cette chaise et pourquoi il la garde.","event.chair_secret.rb":"Il se tait. La maison entière semble retenir son souffle jusqu’à ce que tu t’éloignes.","event.chair_secret.text":"« Cette maison a été fondée par un joueur fatigué », dit l’Homme à la Chaise. « Qui est resté attendre les autres. » La chaise craque.","event.chair_secret.title":"Le fondateur","event.child_1.a":"« Oui »","event.child_1.b":"« Non »","event.child_1.ra":"Il acquiesce, satisfait. « Moi aussi. » Il te donne un bonbon au goût de métal.","event.child_1.rb":"« Menteur », dit-il sans rancune. De près, son visage ressemble à une photo de toi enfant que tu n’as jamais vue.","event.child_1.text":"Un enfant en robe d’anniversaire te tire par la manche. « Tu as encore perdu ? » demande-t-il. Ce n’est pas une question.","event.child_1.title":"L’enfant","event.child_2.a":"Garder le dessin","event.child_2.b":"Le laisser","event.child_2.ra":"Tu plies le papier. Il est lourd. Quelque part dans la maison, un couloir a pivoté pour placer une nouvelle porte.","event.child_2.rb":"Il hausse les épaules et raye la porte. Un instant plus tard, la craie la redessine toute seule.","event.child_2.text":"L’enfant dessine une porte à la craie rouge et écrit un numéro au-dessus : 13. « Elle est dans le couloir. Elle ne s’ouvre que si tu sais laquelle. »","event.child_2.title":"Le dessin","event.confession_booth.a":"Te confesser","event.confession_booth.b":"Partir","event.confession_booth.h":"Interroger sur le registre","event.confession_booth.ra":"Tu en dis trop. Tu ressors plus léger... et dans un registre, quelque chose pèse un peu plus.","event.confession_booth.rb":"En t’éloignant, tu entends ta propre voix se confesser de l’autre côté.","event.confession_booth.rh":"« Une partie peut être effacée », murmure-t-elle. « Mais il faut le vouloir. » La dette se desserre.","event.confession_booth.text":"Un confessionnal entre deux tables. De l’autre côté, quelqu’un respire lentement et attend que tu parles le premier.","event.confession_booth.title":"Le confessionnal","event.cracked_clock.a":"La remonter","event.cracked_clock.b":"La laisser ainsi","event.cracked_clock.ra":"Quelque chose craque à l’intérieur. L’horloge te reste dans la main, arrêtée, et tu ne sais plus l’heure.","event.cracked_clock.rb":"Mieux vaut ne pas toucher au temps ici. Tu trouves quelques pièces sous le balancier.","event.cracked_clock.text":"Une horloge murale indique toujours 3 h 33. Si tu la fixes, la trotteuse tremble, comme si elle réclamait quelque chose.","event.cracked_clock.title":"L’horloge arrêtée","event.dealer_offer.a":"Signer","event.dealer_offer.b":"Refuser","event.dealer_offer.ra":"L’encre est chaude. Le papier se plie tout seul dans ton manteau. Tu te sens léger, et surveillé.","event.dealer_offer.rb":"Il reprend le contrat sans insister. « L’offre expire. » Il te laisse quelques pièces pour le dérangement. C’est pire ainsi.","event.dealer_offer.text":"Le Croupier fait glisser un contrat sur la table. « Une signature et cette dette disparaît. » Les petites lignes bougent.","event.dealer_offer.title":"L’offre","event.dealer_question.a":"« Oui, je m’en souviens »","event.dealer_question.b":"« Non, je ne m’en souviens pas »","event.dealer_question.h":"Interroger sur le paquet","event.dealer_question.ra":"Il note quelque chose. « Curieux. Personne ne s’en souvient. » Il te regarde comme si tu venais de mentir à un miroir.","event.dealer_question.rb":"« Moi non plus », avoue-t-il, et pour la première fois le paquet s’arrête. Tu lui demandes son nom. Il se tait. Il n’en a pas.","event.dealer_question.rh":"« Quarante cartes », dit-il sans surprise. « Quatre couleurs, dix chacune. Et une qui manque. » Il sourit.","event.dealer_question.text":"« Tu te souviens comment tu es arrivé ? » demande le Croupier en battant sans regarder. « Avant la première main. »","event.dealer_question.title":"Une question","event.dealer_tea.a":"Boire","event.dealer_tea.b":"Refuser la tasse","event.dealer_tea.ra":"Chaud, sucré, bien trop familier. Au fond de la tasse, gravé, ton nom. Tu te sens mieux malgré tout.","event.dealer_tea.rb":"Il retire la tasse sans se vexer. « Quand tu voudras. » Vous savez tous deux que ce n’est pas de la politesse.","event.dealer_tea.text":"Le Croupier sert du thé dans deux tasses identiques. « Repose-toi un peu. La maison offre. » La vapeur dessine un chiffre.","event.dealer_tea.title":"Le thé du Croupier","event.debt_collector.a":"En payer une partie","event.debt_collector.b":"Refuser de payer","event.debt_collector.ra":"Il compte les billets deux fois et note quelque chose. « Un plaisir. »","event.debt_collector.rb":"« Je le noterai avec les intérêts. » Il part sans bruit. Le froid reste.","event.debt_collector.text":"Un homme en costume gris t’attend avec un reçu. « Votre dette, monsieur. Elle porte votre signature. » Tu ne te souviens pas d’avoir signé.","event.debt_collector.title":"Le percepteur","event.dice_pit.a":"Lancer les dés","event.dice_pit.b":"Te retirer","event.dice_pit.ra":"Les dés roulent et s’arrêtent. La voix connaissait déjà le résultat.","event.dice_pit.rb":"La voix claque la langue. « Une autre fois. » Tu l’entends rire plus bas.","event.dice_pit.text":"Une fosse de sable avec des dés en os. Une voix sans corps demande : « Pile ou face ? » Les dés n’ont ni l’un ni l’autre.","event.dice_pit.title":"La fosse aux dés","event.drowned_pier.a":"Lui tendre la main","event.drowned_pier.b":"T’éloigner","event.drowned_pier.ra":"Il t’agrippe. Lourd, glacé, il murmure son paiement : on l’a coulé pour une dette qui était la tienne. Il te laisse une poignée de sel.","event.drowned_pier.rb":"Les coups te suivent dans le dos, toujours à la même distance.","event.drowned_pier.text":"Une jetée en bois sans eau. En dessous, un homme trempé jusqu’aux os frappe le sol du bout des doigts, très lentement.","event.drowned_pier.title":"La jetée à sec","event.first_chip.a":"Prendre le jeton","event.first_chip.b":"Le laisser rouler","event.first_chip.ra":"Il pèse plus qu’il n’en a l’air. Quelque chose vient d’être noté dans un livre que tu ne vois pas.","event.first_chip.rb":"Le jeton se perd dans l’obscurité. Le Croupier hoche la tête, comme s’il s’y attendait.","event.first_chip.text":"Un jeton noir roule jusqu’à tes pieds. Le Croupier sourit sans bouger la bouche : « Il est à toi. Il l’a toujours été. »","event.first_chip.title":"Le jeton noir","event.girl_1.a":"Jouer à pile ou face","event.girl_1.b":"Refuser","event.girl_1.ra":"La pièce tourne trop longtemps. Elle retombe, ou pas ; elle a déjà détourné le regard.","event.girl_1.rb":"« Quel ennui », dit-elle en rangeant la pièce. Elle te suit de son bon œil jusqu’à ce que tu disparaisses.","event.girl_1.text":"Une fille dont un œil est cousu au fil rouge fait tourner une pièce. « Pile ou face. Tu choisis. Moi, je regarde. »","event.girl_1.title":"La Fille à l’Œil Cousu","event.girl_2.a":"La croire","event.girl_2.b":"Douter d’elle","event.girl_2.ra":"Tu la remercies. Tu acceptes son conseil et son argent ; les deux sont faux, mais utiles.","event.girl_2.rb":"Elle sourit de travers. « Malin. » Tu apprends son tic : elle ment quand elle regarde le sol.","event.girl_2.text":"« Je t’avertis : la Maison ne ment pas », dit la fille à l’œil cousu. Elle le dit en fixant le sol. C’est le genre de phrase qu’on dit en mentant.","event.girl_2.title":"Ce que dit la fille","event.girl_3.a":"Accepter l’œil","event.girl_3.b":"Le refuser","event.girl_3.ra":"Tu le mets et tu vois davantage : les cartes, la salle, quelque chose derrière la salle. Elle garde le fil.","event.girl_3.rb":"« Une autre fois, alors. » Elle referme la main, et l’œil, si c’en était un, disparaît.","event.girl_3.text":"La fille tend un œil de verre sur sa paume. « Celui-ci voit davantage. Il coûte aussi davantage. » Le fil rouge s’est un peu défait.","event.girl_3.title":"Le fil rouge","event.merchant_memory.a":"Acheter un bocal","event.merchant_memory.b":"Refuser","event.merchant_memory.ra":"Tu le débouches et tu sais soudain mieux jouer une main précise. Tu ne sais pas pourquoi.","event.merchant_memory.rb":"« Quand tu voudras. » Il est un peu vexé. C’est le seul marchand qui ne tourne jamais le dos.","event.merchant_memory.text":"Le Colporteur vend des souvenirs en bocaux. « Celui-ci sent ton premier casino. Celui-là, ta dernière main. »","event.merchant_memory.title":"Un souvenir à vendre","event.mirror_hall.a":"Toucher la vitre","event.mirror_hall.b":"Détourner les yeux","event.mirror_hall.h":"Lui dire ton nom","event.mirror_hall.ra":"Il est tiède, comme une main. Ton reflet sourit une demi-seconde avant toi.","event.mirror_hall.rb":"Tu comptes les pas jusqu’à la sortie. Personne ne te suit. Personne, sauf un.","event.mirror_hall.rh":"Le reflet acquiesce. Pour la première fois, tu sens que quelqu’un de l’autre côté joue pour toi.","event.mirror_hall.text":"Chaque miroir te renvoie ton geste avec une seconde de retard. Le dernier ne te suit pas : il te regarde.","event.mirror_hall.title":"Le couloir des miroirs","event.moon_window.a":"L’ouvrir","event.moon_window.b":"La fermer","event.moon_window.ra":"L’air sent la cire. Tu sais désormais que l’Homme à la Chaise ne supporte pas cette lumière.","event.moon_window.rb":"Tu la refermes doucement. De l’autre côté de la vitre, quelque chose frappe deux fois, poliment.","event.moon_window.text":"Une fenêtre sans mur montre une lune immense. Dans le reste du casino, il fait jour.","event.moon_window.title":"La fenêtre","event.old_photograph.a":"La décrocher","event.old_photograph.b":"La laisser en place","event.old_photograph.ra":"Derrière, des noms. Beaucoup. Aucun ne se répète... sauf le tien.","event.old_photograph.rb":"Tu la laisses. Tu te sens toujours observé, mais avec une certaine douceur. Presque.","event.old_photograph.text":"Sur le mur, une photo de groupe : des joueurs autour de cette table, de toutes les époques. Au dernier rang, ton visage.","event.old_photograph.title":"La photographie","event.phone_call.a":"Décrocher","event.phone_call.b":"Raccrocher sans écouter","event.phone_call.ra":"Une respiration et, dessous, un bruit d’applaudissements lointains. « Tu es toujours là ? » dit quelqu’un qui n’est pas dans la salle. « Nous, oui. »","event.phone_call.rb":"Le téléphone se tait dès que tu le touches. En raccrochant, on entend un soupir collectif.","event.phone_call.text":"Un téléphone en bakélite sonne au milieu de la table. C’est pour toi. C’est toujours pour toi, à partir de la deuxième fois.","event.phone_call.title":"Le téléphone","event.room_13.a":"Entrer","event.room_13.b":"Fermer la porte","event.room_13.ra":"À l’intérieur, l’Enfant attend, les cartes en main. « Tu as encore perdu ? »","event.room_13.rb":"Tu la fermes. La porte se dissout dans le mur comme si elle n’avait jamais existé.","event.room_13.text":"Au bout du couloir se dresse une porte qui n’y était pas : 13. Derrière, le bruit d’un enfant qui bat les cartes, très lentement.","event.room_13.title":"La chambre 13","event.secret_bone_door.a":"L’ouvrir","event.secret_bone_door.b":"Fouiller la salle","event.secret_bone_door.ra":"La clé d’os était dans ta poche depuis toujours. Derrière : une salle sans issue et un air qui sent le vrai air.","event.secret_bone_door.rb":"Tu trouves quelques pièces près de la porte. La porte attend.","event.secret_bone_door.text":"Une porte faite de petits os polis. Elle a une serrure. Et elle a ta clé, même si tu ne l’as pas encore vue.","event.secret_bone_door.title":"La porte d’os","event.secret_stage.a":"T’asseoir à ta place","event.secret_stage.b":"Rester debout","event.secret_stage.ra":"De ta place, tu vois une table, un paquet et une chaise vide. Tu comprends que tu n’es pas le seul à jouer ici. Ni le seul à regarder.","event.secret_stage.rb":"Tu préfères rester debout. Un court répit, et un air un peu plus léger.","event.secret_stage.text":"Une scène de casino avec des fauteuils vides. Chacun porte une plaque nominative. L’un porte le tien. Un autre, celui du Croupier : elle est vierge.","event.secret_stage.title":"La scène vide","event.secret_watcher.a":"Lui rendre son regard","event.secret_watcher.b":"Baisser les yeux","event.secret_watcher.ra":"Il te regarde. Tu le regardes. Et un instant, tu sens que quelqu’un d’autre vous regarde tous les deux, depuis l’extérieur de la salle.","event.secret_watcher.rb":"Tu baisses les yeux. L’œil du plafond semble soulagé, comme s’il craignait d’être regardé.","event.secret_watcher.text":"Une salle sans portes avec un œil peint au plafond. Personne ne l’a peint. Il cligne quand tu clignes.","event.secret_watcher.title":"Celui qui regarde","event.signed_receipt.a":"Le lire en entier","event.signed_receipt.b":"Le déchirer","event.signed_receipt.ra":"C’est une liste de parties. Toutes perdues. Toutes à toi.","event.signed_receipt.rb":"Tu le déchires en morceaux. Quand tu fermes le poing, il est de nouveau entier dans ta poche, mais plus léger.","event.signed_receipt.text":"Un reçu plié tombe de ta poche. Ton écriture, une somme que tu ne comprends pas, la date de demain.","event.signed_receipt.title":"Le reçu signé","event.wet_footprints.a":"Les suivre","event.wet_footprints.b":"Les ignorer","event.wet_footprints.ra":"Derrière la porte, une table vide et une poignée de jetons humides. Personne ne les réclame.","event.wet_footprints.rb":"Tu préfères ne pas savoir. Le sol, lui, continue de se mouiller derrière toi.","event.wet_footprints.text":"Des traces de pieds nus et mouillés traversent le tapis et disparaissent sous une porte. Quelqu’un vient de passer.","event.wet_footprints.title":"Traces mouillées","event.woman_dress.a":"Prendre la carte","event.woman_dress.b":"La refuser","event.woman_dress.ra":"La carte se réchauffe. Retournée, elle montre quelqu’un qui a beaucoup pleuré et ne regrette rien.","event.woman_dress.rb":"Elle range la carte sans insister. Tu sais qu’elle te la proposera de nouveau.","event.woman_dress.text":"Une femme en robe rouge sombre tend une carte face cachée. « Quatre fois plus de tout », dit-elle. « Dettes comprises. »","event.woman_dress.title":"La Femme en Rouge","finale.stage1":"LA DERNIÈRE MAIN","finale.stage2":"LA DERNIÈRE BALLE","fx.abandoned":"Tu as quitté la salle à moitié. La maison a pris son dû.","fx.collapse":"Ton esprit se brise : tu perds de la Santé et regagnes un peu de Raison.","fx.interest":"Intérêt de la dette : +{n}","fx.revive_candle":"La bougie courte te rallume.","fx.revive_life":"Une vie supplémentaire t’arrache à la mort.","hand.five":"Cinq identiques","hand.flush":"Couleur","hand.four":"Carré","hand.full":"Full","hand.high":"Carte haute","hand.pair":"Paire","hand.sflush":"Quinte flush","hand.straight":"Quinte","hand.three":"Brelan","hand.twopair":"Double paire","help.combos":"Combinaisons spéciales","help.goal":"Atteins l’OBJECTIF de points avant de manquer de coups. Sinon, la maison encaisse.","help.hands":"Mains (jetons × mult)","help.score":"Chaque coup marque JETONS × MULT. La main (paire, brelan, quinte…) donne la base ; chaque carte et combinaison ajoute. Vérifie toujours le coût avant de jouer.","help.stakes":"Miser multiplie le coup mais coûte Santé, Raison, Argent ou Dette. Certaines règles l’interdisent.","help.stakes_title":"Mises","help.suits":"Couleurs","help.tips":"Défausse les mauvaises cartes, garde-en une en Poche pour le coup parfait et surveille ta Raison : quand elle baisse, l’écran se déforme et, à 0, tu t’effondres (+25 de Raison, −20 de Santé).","help.tips_title":"Conseils","help.title":"Guide rapide","hint.boss":"Chaque aile a un Gardien aux règles propres qui changent la partie. Lis-les avant de jouer : le vaincre te rapproche de la fin.","hint.event":"Ici, tu choisis entre deux options : REFUSER (← ou A) ou ACCEPTER (→ ou D). Ce qui change —Santé, Raison, Argent ou Dette— tu le verras ensuite. À 0 de Santé, tu meurs ; avec peu de Raison, la maison se déforme ; et la Dette grandit avec des intérêts.","hint.map":"Touche une salle pour voir ce que c’est, puis touche-la encore pour entrer. Si tu te perds, le bouton ? en haut t’explique le jeu quand tu veux.","hint.merchant":"Ici, tout s’achète avec de l’Argent. Et on prête aussi : les prêts ajoutent de la Dette, et la Dette grandit avec des intérêts après chaque salle.","hint.rest":"Un répit : choisis une seule chose. Dormir rend de la Santé, respirer rend de la Raison, payer réduit la Dette et étudier fait monter une main de niveau.","howto.cards":"VOIR MAINS ET COULEURS","howto.s1.h":"Objectif","howto.s1.t":"Tu descends dans la maison salle après salle. À chaque étage, tu choisis ton chemin sur la carte : tu joues des tables de cartes, tu décides lors d’événements et, parfois, tu mises quelque chose dans le duel au fusil. Chaque aile se termine par un Gardien ; viennent ensuite le Croupier, sa dernière main et La Porte.\nMourir n’est pas la fin : tu gardes souvenirs et connaissances, et tu redescends.","howto.s2.h":"La carte","howto.s2.t":"Chaque salle est un nœud. Touche-en un pour voir ce que c’est, puis touche-le encore (ou appuie sur ENTRER) pour entrer. Tu ne peux aller que vers les salles reliées à la tienne.\nIl y a des tables de cartes, des événements, le Vendeur, des repos, le fusil (un duel où tu mises quelque chose), une porte d’os secrète et le Gardien.","howto.s3.h":"Tes ressources","howto.s3.t":"• Santé : à 0, tu meurs. Une bougie en plus te relève une fois, avec 40 % de Santé.\n• Raison : elle baisse avec les cartes, les mises et les événements. Quand elle est basse, l’écran se déforme et des murmures apparaissent ; à 0, tu t’effondres : tu regagnes 25 de Raison mais perds 20 de Santé.\n• Argent : sert à acheter à la boutique et à payer la dette.\n• Dette : elle augmente avec les prêts et les mises, et 3 % d’intérêts s’ajoutent après chaque salle. Avec beaucoup de dette, la Maison relève l’objectif des tables de 5 % par tranche de 100 au-dessus de 200 (jusqu’à 25 %).\n• Bouclier : absorbe le coût en Santé des cartes.","howto.s4.h":"Tables de cartes","howto.s4.t":"Choisis 1 à 5 cartes de ta main et joue : la main (paire, brelan, quinte…) donne jetons × multiplicateur, et chaque carte et combinaison ajoute davantage. Atteins l’objectif avant de manquer de coups ; sinon, tu paies en Santé, Raison et Dette.\nTu peux défausser, garder une carte en Poche ou miser (cela multiplie le coup, mais coûte). Chaque adversaire apporte une règle propre, visible sur la table. Vérifie toujours le coût avant de jouer.","howto.s5.h":"Événements","howto.s5.t":"Ce sont des décisions à deux options : REFUSER (← ou A) ou ACCEPTER (→ ou D) ; sur téléphone, glisse. Parfois une troisième option cachée (H) apparaît, selon ce que tu sais ou portes. Ce que ta décision change s’affiche ensuite, et certains outils permettent de la refaire.","howto.s6.h":"Duel au fusil","howto.s6.t":"Tu mises quelque chose (Argent, Raison, Dette ou une carte). Le fusil a 6 chambres, certaines chargées. L’adversaire annonce combien il y a de balles… et il peut mentir.\nÀ ton tour, tu peux tirer sur l’adversaire (si la chambre est chargée, il perd une marque ; sinon, le tour passe), tenter la Table (si elle est vide, tu gardes la main ; sinon, tu perds une marque) ou écouter (cela coûte de la Raison et ne tombe pas toujours juste). Celui qui laisse l’autre sans marques gagne.","howto.s7.h":"Boutique et repos","howto.s7.t":"Le Vendeur vend des objets, des outils et des cartes contre de l’Argent, et il prête aussi : les prêts ajoutent de la Dette.\nÀ un repos, tu choisis une seule chose : dormir (Santé), respirer (Raison), payer la dette ou étudier une main pour la faire monter de niveau.","howto.s8.h":"Mourir et se souvenir","howto.s8.t":"Quand tu meurs, tu vois ta DETTE ACTUELLE (une partie est reportée à la descente suivante) et tes SOUVENIRS CONSERVÉS : des avantages permanents gagnés en faisant certaines choses. Ce que tu découvres est gardé comme connaissance et ouvre des options cachées et des portes.\nIl y a 6 fins ; La Porte demande des choses différentes pour chacune.","howto.title":"Comment jouer","hud.debt":"Dette","hud.deck":"Paquet","hud.health":"Santé","hud.howto":"Comment jouer","hud.inventory":"Inventaire","hud.items":"Objets","hud.levels":"Niveaux de main","hud.lives":"Vies","hud.money":"Argent","hud.no_items":"Rien pour l’instant.","hud.sanity":"Raison","hud.settings":"Paramètres","hud.tools":"Outils","intro.1":"Tu es réveillé ?","intro.2":"Enfin.","intro.3":"Nous devons terminer une partie.","intro.4":"Quelle partie ?","intro.5":"La précédente.","intro.6":"Assieds-toi. Je vais te montrer comment on joue ici.","item.campanilla.desc":"+1 défausse par manche.","item.campanilla.name":"Clochette","item.ceniza.desc":"+15 jetons par coup. −2 Raison après chaque salle.","item.ceniza.name":"Cendre","item.cuchilla_oxidada.desc":"Le Sang donne +1 mult de plus mais coûte +1 Santé.","item.cuchilla_oxidada.name":"Lame rouillée","item.diente_leche.desc":"Les Dents faut le savoir pour voir la vérité.","know.k_drowned_paid.name":"Le Noyé a déjà payé","know.k_drowned_paid.text":"Le Noyé a payé sa dette en eau. Sa règle « noyade » ne te fait plus couler.","know.k_girl_lies.name":"Ce dont la fille ment","know.k_girl_lies.text":"La fille à l’œil cousu ment quand elle dit vrai. Sa règle « sans répétition » ne te lie plus.","know.k_moon.name":"La lune de la fenêtre","know.k_moon.text":"La lune de la fenêtre est un projecteur. Sans son froid, l’Homme à la Chaise perd sa règle.","know.k_players.name":"Les joueurs","know.k_players.text":"Tous ceux qui sont ici ont joué avant. Tous.","know.k_reflection.name":"Ton reflet","know.k_reflection.text":"Dans le miroir, ce n’est pas toi qui bouges en premier.","know.k_room13.name":"La Chambre 13","know.k_room13.text":"Il y a une chambre qui ne figure sur aucun plan.","know.k_watcher.name":"Quelqu’un regarde","know.k_watcher.text":"Quelqu’un regarde la partie depuis l’extérieur de la maison.","legal.back":"RETOUR AU JEU","legal.lang":"Langue","legal.privacy.s1.h":"1. Ce que le jeu enregistre","legal.privacy.s1.t":"Le jeu enregistre dans le stockage local de ton navigateur ta partie et tes paramètres (langue, volume, accessibilité). Ces données restent sur ton appareil : le jeu ne les envoie à aucun serveur.\nTu peux les effacer avec RÉINITIALISER LA PROGRESSION dans le menu ou depuis les paramètres de ton navigateur. Si tu les effaces, tu perds ta partie.","legal.privacy.s2.h":"2. Aucun service tiers","legal.privacy.s2.t":"Le jeu ne comporte ni publicité ni outil d’analyse, n’utilise aucun cookie et ne charge aucune ressource d’autres sites. Il ne collecte aucune donnée personnelle.","legal.privacy.s3.h":"3. Hébergement","legal.privacy.s3.t":"Comme tout site web, l’hébergement où le jeu est publié (actuellement GitHub Pages) peut enregistrer des données techniques sur les visites, comme l’adresse IP, selon ses propres conditions. Le jeu ne reçoit pas ces données.","legal.privacy.s4.h":"4. Avertissement de contenu","legal.privacy.s4.t":"THE HOUSE ALWAYS WATCHES est une œuvre de fiction d’horreur : les personnages, lieux et événements sont imaginaires.\nL’argent, les jetons, les paris et les dettes du jeu sont fictifs : ils n’ont aucune valeur réelle, ne s’achètent ni ne s’échangent contre de l’argent réel, et le jeu n’est pas un service de jeux d’argent.\nIl comprend des effets de clignotement et de secousses, et une distorsion visuelle quand la Raison baisse. Tu peux les réduire dans PARAMÈTRES → Réduire les effets. Si tu as une épilepsie photosensible ou d’autres troubles, demande l’avis d’un professionnel avant de jouer.","legal.title.privacy":"Confidentialité et avertissement","legal.updated":"Dernière mise à jour : 2026-10-01","log.round_lost":"Tu as perdu la manche. La maison encaisse.","log.round_won":"Manche gagnée.","map.enter":"ENTRER","map.info.event":"Quelque chose t’attend. Tu ne sais pas quoi.","map.info.merchant":"Un vendeur de choses qui ne devraient pas se vendre.","map.info.rest":"Un coin pour reprendre son souffle.","map.info.secret":"Une porte d’os que personne d’autre ne voit.","map.locked":"hors de portée","map.opp":"Adversaire : {name}","map.pick":"Choisis ta prochaine salle.","map.shotgun":"Duel au fusil. Tu mises quelque chose.","map.title":"Salle {n}/{total}","map.visited":"visitée","mem.m01.name":"Le premier coup","mem.m01.text":"Mourir une fois t’a appris à garder un peu d’argent sur toi. +10 d’Argent au départ.","mem.m02.name":"Mains de rechange","mem.m02.text":"Tu as appris à défausser sans douter. +1 défausse par manche.","mem.m03.name":"Cicatrices","mem.m03.text":"Le corps se souvient. +10 de Santé maximale.","mem.m04.name":"La pièce de la fille","mem.m04.text":"Tu commences avec Paire au niveau 1.","mem.m05.name":"Le sel de la chaise","mem.m05.text":"Tu commences avec un Sel.","mem.m06.name":"De l’air sous l’eau","mem.m06.text":"Récupère 3 de Raison en gagnant une manche.","mem.m07.name":"Jouer comme un enfant","mem.m07.text" PIELEN","boss.girl.a":"„Wir spielen: Nicht wiederholen. Ich merke alles mit dem Auge, das nicht sieht.“","boss.girl.l":"„Schon wieder dasselbe, schon wieder dasselbe. Du langweilst mich.“","boss.girl.w":"„Du hast mich geschlagen und nicht gelogen. Wie seltsam. Nimm, was du willst.“","boss.no_rules":"Keine Sonderregeln","boss.rules":"Regeln dieser Partie","boss.title":"WÄCHTER","boss.weakened":"geschwächt","card.base":"{suit} {rank}","card.carta_doble.desc":"Wiederholt den Effekt der direkt zuvor gewerteten Karte.","card.carta_doble.name":"Doppelkarte","card.colmillo.desc":"+8 Chips. Wächst um +2 pro Wertung (max. +40).","card.colmillo.name":"Fangzahn","card.corazon.desc":"+2 Mult. Heilt 2 Gesundheit.","card.corazon.name":"Herz","card.cursed":"Verflucht","card.dado_trucado.desc":"+6 Chips. Joker für die Farbe.","card.dado_trucado.name":"Gezinkter Würfel","card.el_ahogado.desc":"+40 Chips (+80 bei Verstand unter 40). −4 Verstand.","card.el_ahogado.name":"Der Ertrunkene","card.el_hambre.desc":"+6 Mult. Kostet 3 Gesundheit.","card.el_hambre.name":"Der Hunger","card.hueso_liso.desc":"+20 Chips.","card.hueso_liso.name":"Glatter Knochen","card.la_deuda.desc":"Chips = Schulden ÷ 6 (max. 90). +10 Schulden.","card.la_deuda.name":"Die Schuld","card.la_mujer.desc":"Voller Joker. ×4 beim Werten. +25 Schulden und −6 Verstand.","card.la_mujer.name":"Die Frau in Rot","card.la_septima.desc":"+7 Chips. Multipliziert ×(1 + 0,5 pro Tod), max. ×5.","card.la_septima.name":"Die Siebte","card.llave_maestra.desc":"+10 Chips und +4 Schild.","card.llave_maestra.name":"Hauptschlüssel","card.moneda_gemela.desc":"+4 Chips. Bringt 4 Geld.","card.moneda_gemela.name":"Zwillingsmünze","card.ojo_vigia.desc":"+12 Chips. Deckt 3 Karten des Stapels auf.","card.ojo_vigia.name":"Wachsames Auge","card.sangre_pacto.desc":"+3 Mult. Kostet 2 Gesundheit.","card.sangre_pacto.name":"Blutpakt","card.sombra.desc":"+5 Chips. Joker für den Wert. +1 Schild.","card.sombra.name":"Schatten","char.archivist":"Die Archiva itle":"Debug","dlg.final.1":"Du hast den letzten Tisch erreicht. Alle kommen bis hierher.","dlg.final.2":"Noch eine Hand. Ich gebe. Niemand setzt etwas: Alles liegt offen.","dlg.final.3":"Gewinnst du, reden wir über die Tür. Verlierst du, fängst du von vorn an. Eigentlich dasselbe.","dlg.final.4":"Gut. Es bleibt die letzte Kugel. Noch eins, dann lasse ich dich gehen.","dlg.final.5":"Sechs Kammern. Vier Marken für jeden. Diesmal sieht niemand zu … außer dem Haus.","dlg.final.duel_lost":"„Die letzte Kugel war meine. Noch einmal.“","dlg.final.duel_won":"„Die Partie ist vorbei. Es bleibt nur die Tür.“","dlg.final.lost":"„Du hast die letzte Hand verloren. Das Haus kassiert mit Zinsen.“","dlg.final.won":"„Du hast die Hand gewonnen. Das Haus schweigt.“","door.hint":"Jedes Ende verlangt etwas anderes. Wähle mit Bedacht.","door.open":"Verfügbar","door.req.crupier":"Erfordert: 3 Hinweise auf den Croupier.","door.req.deuda":"Immer verfügbar.","door.req.espectador":"Erfordert: „Jemand sieht zu“ und „Dein Spiegelbild“.","door.req.partida":"Erfordert: „Die Spieler“ und 5 getroffene Figuren.","door.req.puerta":"Erfordert: den Knochenschlüssel.","door.req.verdad":"Erfordert: 5 gesehene Enden und „Alle Türen sind dieselbe“.","door.seen":"Ende bereits gesehen","door.title":"Die Tür","duel.announce":"{name} sagt an: {n} von 6 Kammern geladen.","duel.announce_note":"Es könnte lügen.","duel.anomaly":"„Das war nicht die Kugel, die ich erwartet hatte.“","duel.chambers":"Kammern","duel.contract.honest":"Es log nicht: Die Schulden steigen um 20.","duel.contract.lied":"Der Vertrag beißt: {name} verliert eine Marke.","duel.ev.f_shot_click":"{name} schießt. Klick.","duel.ev.f_shot_hit":"{name} schießt: Du verlierst eine Marke.","duel.ev.f_table_backfire":"Der Tisch wendet sich gegen {name}: Es verliert eine Marke.","duel.ev.f_table_safe":"{name} versucht den Tisch. Nichts.","duel.ev.p_shot_click":"Klick. Die Kammer war leer.","duel.ev.p_shot_hit":"Du schießt: {name} verliert eine Marke.","duel.ev.p_table_backfire":"Der Tisch schickt die Kugel zurück: Du verlierst eine Marke.","duel.ev.p_table_safe":"Der Tisch schweigt. Du bleibst am Zug.","duel.ev.reload":"Die Schrotflinte lädt nach.","duel.ev.skipped":"{name} vergisst seinen Zug.","duel.final":"DIE LETZTE KUGEL","duel.heard_empty":"Du glaubst, … Leere zu hören.","duel.heard_loaded":"Du glaubst, … eine Kugel zu hören.","duel.listen":"LAUSCHEN (−{c} Verstand)","duel.lose":"„Das Haus kassiert.“","duel.marks_foe":"Marken des Gegners","duel.marks_you":"Deine Marken","duel.setup.note":"Bei Sieg: +10 Geld extra. Bei Niederlage: −12 Gesundheit zusätzlich zum Einsatz. Niemand zwingt dich, der Ansage zu glauben.","duel.setup.sub":"Was legst du auf den Tisch?","duel.shoot_foe":"AUF DEN GEGNER SCHIESSEN","duel.shoot_table":"DEN TISCH VERSUCHEN","duel.stake.card.lose":"Bei Niederlage: du verlierst eine Karte","duel.stake.card.name":"Eine Karte aus deinem Stapel","duel.stake.card.win":"Bei Sieg: eine Spezialkarte","duel.stake.debt.lose":"Bei Niederlage: +{n} Schulden","duel.stake.debt.name":"{n} Schulden","duel.stake.debt.win":"Bei Sieg: −60 Schulden","duel.stake.money.lose":"Bei Niederlage: −{n} Geld","duel.stake.money.name":"{n} Geld","duel.stake.money.win":"Bei Sieg: +25 Geld","duel.stake.sanity.lose":"Bei Niederlage: −{n} Verstand","duel.stake.sanity.name":"{n} Verstand","duel.stake.sanity.win":"Bei Sieg: +8 Verstand","duel.title":"DIE SCHROTFLINTE","duel.tool.memory":"Der Gegner vergisst seinen nächsten Zug.","duel.truth":"Zeuge: Es waren {n} echte Kugeln.","duel.truth.honest":"Es sagte die Wahrheit.","duel.truth.lied":"Man hat dich belogen.","duel.turn_foe":"Zug des Gegners …","duel.turn_you":"Du bist dran","duel.win":"„Das Haus zahlt.“","ending.crupier.epi":"Zum ersten Mal setzt sich jemand dir gegenüber. Du lächelst, ohne den Mund zu bewegen.","ending.crupier.text":"Du bittest ihn, das Lächeln abzulegen. Darunter ist kein Gesicht: ein Spiegel in deinem Alter. „Ich habe vor so langer Zeit gewonnen, dass ich vergaß, wie man geht“, sagt er. Er reicht dir das Deck und setzt sich auf deinen Stuhl. Jetzt teilst du aus.","ending.crupier.title":"Der Croupier","ending.deuda.epi":"Das Haus gewinnt immer. Aber heute hat es länger gedauert.","ending.deuda.text":"Du spielst die letzte Hand und gewinnst. Das Haus trägt den Sieg in sein Buch ein und gibt dir einen schwarzen Chip zurück. „Du schuldest mir noch eine Partie“, sagt es. Du stehst auf. Die Tür bleibt zu, aber du kannst jetzt zählen.","ending.deuda.title":"Die Schuld","ending.espectador.epi":"Wer zusieht, spielt auch mit.","ending.espectador.text":"Du blickst aus dem Raum hinaus, wohin niemand blicken sollte. Hinter dem Glas ist ein Gesicht, von einem Bildschirm beleuchtet. Du selbst, oder jemand, der dir beim Spielen zusieht. Ihr betrachtet euch eine Sekunde lang. Dann lässt das Haus den Vorhang fallen.","ending.espectador.title":"Der Zuschauer","ending.first":"NEUES ENDE","ending.memories":"Gewonnene Erinnerungen","ending.n":"ENDE {n} / {total}","ending.partida.epi":"Ohne Spieler ist das Haus nur ein Raum mit Lichtern.","ending.partida.text":"Du rufst sie beim Namen, einen nach dem anderen: das Mädchen, den Mann auf dem Stuhl, den Ertrunkenen, die Archivarin, das Kind. Jeder erhebt sich von seinem Tisch. Niemand erinnerte sich, Spieler gewesen zu sein. Sie lassen die Karten gleichzeitig fallen. Die Partie endet, weil keiner mehr weiterspielen will.","ending.partida.title":"Die Partie","ending.puerta.epi":"Die Tür schließt sich von selbst. Diesmal auf der richtigen Seite.","ending.puerta.text":"Der Knochenschlüssel dreht sich lautlos. Hinter der Tür liegt ein Gang und an dessen Ende eine weitere, gleiche Tür. Du gehst trotzdem hindurch. Draußen ist echte Luft und ein Schild: WEGEN UMBAU GESCHLOSSEN. Zum ersten Mal sieht dir niemand zu.","ending.puerta.title":"Die Tür","ending.to_menu":"ZURÜCK ZUM MENÜ","ending.true_hint":"Du hast fünf Enden gesehen. Eine Tür bleibt noch.","ending.verdad.epi":"Danke fürs Spielen. Du darfst aufhören zuzusehen.","ending.verdad.text":"Du hast alle Enden gesehen. Du weißt, dass alle Türen dieselbe sind und dass der Zuschauer du bist. Du schließt das Rechnungsbuch und schreibst die letzte Zeile. Das Haus erlischt. Es gibt keine Partie mehr: nur den, der sie gespielt hat, und die Stille auf der anderen Seite des Bildschirms.","ending.verdad.title":"Die Wahrheit","event.archive_ledger.a":"Das Buch lesen","event.archive_ledger.b":"Es schließen","event.archive_ledger.ra":"Die Zahlenkolonnen sind Partien. Alle enden an derselben Tür. Du begreifst, dass es gar nicht so viele Türen gibt.","event.archive_ledger.rb":"„Weise Entscheidung“, sagt sie. „Auch wenn es nichts ändert.“ Für deine Diskretion gibt sie dir ein paar Münzen.","event.archive_ledger.text":"Eine Frau mit dicker Brille archiviert Hauptbücher, die Tinte tropfen. „Alle Namen stehen hier“, sagt sie. „Und alle Türen sind dieselbe.“","event.archive_ledger.title":"Die Archivarin","event.blood_vending.a":"Mit Blut zahlen","event.blood_vending.b":"Vorbeigehen","event.blood_vending.ra":"Der Automat summt zufrieden und spuckt eine warme Karte aus.","event.blood_vending.rb":"Der Automat schaltet sich seufzend ab. Einen Moment lang wirkte er enttäuscht.","event.blood_vending.text":"Ein Automat gibt Karten gegen einen Stich in den Finger aus. Ein Schild sagt: „Kein Wechselgeld.“","event.blood_vending.title":"Der Kartenautomat","event.chair_bet.a":"Die Wette annehmen","event.chair_bet.b":"Ablehnen","event.chair_bet.ra":"Er wirft die Würfel, ohne hinzusehen. Du hörst sie rollen und liegen bleiben, genau als du aufhörst zuzuhören.","event.chair_bet.rb":"„Ich verstehe“, murmelt er. „Ich würde auch lieber nicht aufstehen.“","event.chair_bet.text":"Der Mann auf dem Stuhl steht nicht auf, vielleicht kann er es nicht. „Ich setze den Stuhl“, sagt er mit verbrauchter Stimme. „Gegen deine Geduld.“","event.chair_bet.title":"Der Stuhl","event.chair_secret.a":"Zuhören","event.chair_secret.b":"Ihn unterbrechen","event.chair_secret.ra":"Er spricht Stunden oder Sekunden. Am Ende verstehst du, wessen Stuhl das ist und warum er ihn bewacht.","event.chair_secret.rb":"Er verstummt. Das ganze Haus scheint den Atem anzuhalten, bis du gehst.","event.chair_secret.text":"„Dieses Haus gründete ein müder Spieler“, sagt der Mann auf dem Stuhl. „Der blieb, um auf die anderen zu warten.“ Der Stuhl knarrt.","event.chair_secret.title":"Der Gründer","event.child_1.a":"„Ja“","event.child_1.b":"„Nein“","event.child_1.ra":"Es nickt zufrieden. „Ich auch.“ Es gibt dir ein Bonbon, das nach Metall schmeckt.","event.child_1.rb":"„Lügner“, sagt es ohne Groll. Aus der Nähe ähnelt sein Gesicht einem Kinderfoto von dir, das du nie gesehen hast.","event.child_1.text":"Ein Kind im Geburtstagskleid zupft an deinem Ärmel. „Hast du schon wieder verloren?“, fragt es. Es ist keine Frage.","event.child_1.title":"Das Kind","event.child_2.a":"Die Zeichnung behalten","event.child_2.b":"Sie liegen lassen","event.child_2.ra":"Du faltest das Papier. Es ist schwer. Irgendwo im Haus hat sich ein Gang gedreht, um Platz für eine neue Tür zu schaffen.","event.child_2.rb":"Es zuckt mit den Schultern und streicht die Tür durch. Kurz darauf zeichnet die Kreide sie von selbst neu.","event.child_2.text":"Das Kind zeichnet mit roter Kreide eine Tür und schreibt eine Zahl darüber: 13. „Sie ist im Gang. Sie öffnet sich nur, wenn du weißt, welche.“","event.child_2.title":"Die Zeichnung","event.confession_booth.a":"Beichten","event.confession_booth.b":"Weggehen","event.confession_booth.h":"Nach dem Buch fragen","event.confession_booth.ra":"Du sagst zu viel. Du gehst leichter... und irgendwo in einem Buch wiegt etwas ein wenig mehr.","event.confession_booth.rb":"Beim Weggehen hörst du auf der anderen Seite deine eigene Stimme beichten.","event.confession_booth.rh":"„Einen Teil kann man tilgen“, flüstert es. „Aber man muss es wollen.“ Die Schuld lockert sich.","event.confession_booth.text":"Ein Beichtstuhl zwischen zwei Tischen. Auf der anderen Seite atmet jemand langsam und wartet, dass du zuerst sprichst.","event.confession_booth.title":"Der Beichtstuhl","event.cracked_clock.a":"Sie aufziehen","event.cracked_clock.b":"Es dabei belassen","event.cracked_clock.ra":"Im Inneren knirscht etwas. Die Uhr bleibt in deiner Hand, stehen, und du weißt nicht mehr, wie spät es ist.","event.cracked_clock.rb":"Hier ist es sicherer, die Zeit nicht anzufassen. Unter dem Pendel findest du ein paar Münzen.","event.cracked_clock.text":"Eine Wanduhr zeigt immer 3:33. Wenn du sie lange ansiehst, zittert der Sekundenzeiger, als würde er um etwas bitten.","event.cracked_clock.title":"Die stehengebliebene Uhr","event.dealer_offer.a":"Unterschreiben","event.dealer_offer.b":"Ablehnen","event.dealer_offer.ra":"Die Tinte ist warm. Das Papier faltet sich von selbst in deinem Mantel. Du fühlst dich leicht und beobachtet.","event.dealer_offer.rb":"Er nimmt den Vertrag zurück, ohne zu drängen. „Das Angebot verfällt.“ Er lässt dir ein paar Münzen für die Mühe. Das ist schlimmer.","event.dealer_offer.text":"Der Croupier schiebt einen Vertrag über den Tisch. „Eine Unterschrift und die Schuld verschwindet.“ Das Kleingedruckte bewegt sich.","event.dealer_offer.title":"Das Angebot","event.dealer_question.a":"„Ja, ich erinnere mich“","event.dealer_question.b":"„Ich erinnere mich nicht“","event.dealer_question.h":"Nach dem Kartenspiel fragen","event.dealer_question.ra":"Er notiert etwas. „Wie seltsam. Niemand erinnert sich.“ Er sieht dich an, als hättest du gerade einen Spiegel belogen.","event.dealer_question.rb":"„Ich auch nicht“, gibt er zu, und zum ersten Mal hält das Kartenspiel inne. Du fragst nach seinem Namen. Er schweigt. Er hat keinen.","event.dealer_question.rh":"„Vierzig Karten“, sagt er ohne Überraschung. „Vier Farben, je zehn. Und eine, die fehlt.“ Er lächelt.","event.dealer_question.text":"„Erinnerst du dich, wie du hergekommen bist?“, fragt der Croupier und mischt, ohne hinzusehen. „Vor der ersten Hand.“","event.dealer_question.title":"Eine Frage","event.dealer_tea.a":"Trinken","event.dealer_tea.b":"Die Tasse ablehnen","event.dealer_tea.ra":"Warm, süß und viel zu vertraut. In der Tasse eingraviert dein Name. Es geht dir trotzdem besser.","event.dealer_tea.rb":"Er zieht die Tasse zurück, ohne beleidigt zu sein. „Wann immer du willst.“ Ihr beide wisst, dass das keine Höflichkeit ist.","event.dealer_tea.text":"Der Croupier schenkt Tee in zwei identische Tassen ein. „Ruh dich ein wenig aus. Das Haus lädt ein.“ Der Dampf zeichnet eine Zahl.","event.dealer_tea.title":"Der Tee des Croupiers","event.debt_collector.a":"Einen Teil zahlen","event.debt_collector.b":"Die Zahlung verweigern","event.debt_collector.ra":"Er zählt die Scheine zweimal und notiert etwas. „Ein Vergnügen.“","event.debt_collector.rb":"„Ich vermerke es samt Zinsen.“ Er geht lautlos. Die Kälte bleibt.","event.debt_collector.text":"Ein Mann im grauen Anzug erwartet dich mit einer Quittung. „Ihre Schuld, mein Herr. Sie trägt Ihre Unterschrift.“ Du erinnerst dich nicht, unterschrieben zu haben.","event.debt_collector.title":"Der Eintreiber","event.dice_pit.a":"Würfeln","event.dice_pit.b":"Zurückweichen","event.dice_pit.ra":"Die Würfel rollen und bleiben liegen. Die Stimme kannte das Ergebnis schon.","event.dice_pit.rb":"Die Stimme schnalzt. „Ein andermal.“ Du hörst sie unten lachen.","event.dice_pit.text":"Eine Sandgrube mit Knochenwürfeln. Eine körperlose Stimme fragt: „Kopf oder Zahl?“ Die Würfel haben weder das eine noch das andere.","event.dice_pit.title":"Die Würfelgrube","event.drowned_pier.a":"Ihm die Hand reichen","event.drowned_pier.b":"Weggehen","event.drowned_pier.ra":"Er packt dich. Schwer, eiskalt, flüstert er seine Zahlung: Jemand hat ihn wegen einer Schuld versenkt, die deine war. Er lässt dir eine Handvoll Salz.","event.drowned_pier.rb":"Das Klopfen folgt dir im Rücken, immer im gleichen Abstand.","event.drowned_pier.text":"Ein Holzsteg ohne Wasser. Darunter klopft ein bis auf die Knochen durchnässter Mann sehr langsam mit den Knöcheln auf den Boden.","event.drowned_pier.title":"Der trockene Steg","event.first_chip.a":"Den Chip nehmen","event.first_chip.b":"Ihn weiterrollen lassen","event.first_chip.ra":"Er wiegt mehr, als er aussieht. In einem Buch, das du nicht sehen kannst, wurde soeben etwas notiert.","event.first_chip.rb":"Der Chip verschwindet im Dunkeln. Der Croupier nickt, als hätte er es erwartet.","event.first_chip.text":"Ein schwarzer Chip rollt vor deine Füße. Der Croupier lächelt, ohne den Mund zu bewegen: „Er gehört dir. Er hat dir immer gehört.“","event.first_chip.title":"Der schwarze Chip","event.girl_1.a":"Kopf oder Zahl spielen","event.girl_1.b":"Ablehnen","event.girl_1.ra":"Die Münze kreiselt viel zu lange. Sie fällt oder nicht; sie hat schon weggesehen.","event.girl_1.rb":"„Wie langweilig“, sagt sie und steckt die Münze weg. Mit dem guten Auge folgt sie dir, bis du verschwunden bist.","event.girl_1.text":"Ein Mädchen mit einem rot vernähten Auge lässt eine Münze kreiseln. „Kopf oder Zahl. Du wählst. Ich sehe zu.“","event.girl_1.title":"Das Mädchen mit dem vernähten Auge","event.girl_2.a":"Ihr glauben","event.girl_2.b":"Ihr misstrauen","event.girl_2.ra":"Du dankst ihr. Du nimmst ihren Rat und ihr Geld an; beides ist falsch, aber nützlich.","event.girl_2.rb":"Sie lächelt schief. „Schlau.“ Du lernst ihr Zeichen: Sie lügt, wenn sie zu Boden sieht.","event.girl_2.text":"„Ich warne dich: Das Haus lügt nicht“, sagt das Mädchen mit dem vernähten Auge. Sie sagt es und starrt zu Boden. So einen Satz sagt man, wenn man lügt.","event.girl_2.title":"Was das Mädchen sagt","event.girl_3.a":"Das Auge annehmen","event.girl_3.b":"Es ablehnen","event.girl_3.ra":"Du setzt es ein und siehst mehr: die Karten, den Raum, etwas hinter dem Raum. Sie behält den Faden.","event.girl_3.rb":"„Dann eben ein andermal.“ Sie schließt die Hand, und das Auge, falls es eines war, ist fort.","event.girl_3.text":"Das Mädchen hält ein Glasauge auf der flachen Hand hin. „Dieses sieht mehr. Es kostet auch mehr.“ Der rote Faden hat sich ein wenig gelöst.","event.girl_3.title":"Der rote Faden","event.merchant_memory.a":"Ein Glas kaufen","event.merchant_memory.b":"Ablehnen","event.merchant_memory.ra":"Du entkorkst es und spielst plötzlich eine bestimmte Hand besser. Du weißt nicht, warum.","event.merchant_memory.rb":"„Wann immer du willst.“ Er ist ein wenig gekränkt. Er ist der einzige Händler, der nie den Rücken kehrt.","event.merchant_memory.text":"Der Händler verkauft Erinnerungen in Gläsern. „Dieses riecht nach deinem ersten Casino. Jenes nach deiner letzten Hand.“","event.merchant_memory.title":"Eine Erinnerung zu verkaufen","event.mirror_hall.a":"Das Glas berühren","event.mirror_hall.b":"Wegsehen","event.mirror_hall.h":"Ihm deinen Namen sagen","event.mirror_hall.ra":"Es ist warm, wie eine Hand. Dein Spiegelbild lächelt eine halbe Sekunde vor dir.","event.mirror_hall.rb":"Du zählst die Schritte bis zum Ausgang. Niemand folgt dir. Niemand außer einem.","event.mirror_hall.rh":"Das Spiegelbild nickt. Zum ersten Mal spürst du, dass jemand auf der anderen Seite für dich spielt.","event.mirror_hall.text":"Jeder Spiegel gibt deine Geste eine Sekunde zu spät zurück. Der letzte folgt dir nicht: Er beobachtet dich.","event.mirror_hall.title":"Der Spiegelgang","event.moon_window.a":"Es öffnen","event.moon_window.b":"Es schließen","event.moon_window.ra":"Die Luft riecht nach Wachs. Du weißt jetzt etwas Neues: Der Mann auf dem Stuhl erträgt dieses Licht nicht.","event.moon_window.rb":"Du schließt es langsam. Auf der anderen Seite des Glases klopft etwas zweimal, höflich.","event.moon_window.text":"Ein Fenster ohne Wand zeigt einen riesigen Mond. Im Rest des Casinos ist es Tag.","event.moon_window.title":"Das Fenster","event.old_photograph.a":"Es abhängen","event.old_photograph.b":"Es hängen lassen","event.old_photograph.ra":"Dahinter stehen Namen. Viele. Keiner wiederholt sich... außer deinem.","event.old_photograph.rb":"Du lässt es hängen. Du fühlst dich weiter beobachtet, aber mit einer gewissen Freundlichkeit. Fast.","event.old_photograph.text":"An der Wand hängt ein Gruppenfoto: Spieler an diesem Tisch, aus allen Zeiten. In der letzten Reihe dein Gesicht.","event.old_photograph.title":"Das Foto","event.phone_call.a":"Abheben","event.phone_call.b":"Auflegen, ohne zuzuhören","event.phone_call.ra":"Ein Atmen und darunter ein Rauschen fernen Applauses. „Bist du noch da?“, sagt jemand, der nicht im Raum ist. „Wir schon.“","event.phone_call.rb":"Das Telefon verstummt, sobald du es berührst. Beim Auflegen ist ein gemeinsames Seufzen zu hören.","event.phone_call.text":"Ein Bakelit-Telefon klingelt mitten auf dem Tisch. Es ist für dich. Es ist immer für dich, ab dem zweiten Mal.","event.phone_call.title":"Das Telefon","event.room_13.a":"Eintreten","event.room_13.b":"Die Tür schließen","event.room_13.ra":"Drinnen wartet das Kind mit den Karten in den Händen. „Hast du schon wieder verloren?“","event.room_13.rb":"Du schließt sie. Die Tür löst sich in der Wand auf, als wäre sie nie da gewesen.","event.room_13.text":"Am Ende des Ganges steht eine Tür, die vorher nicht da war: 13. Dahinter das Geräusch eines Kindes, das sehr langsam mischt.","event.room_13.title":"Zimmer 13","event.secret_bone_door.a":"Sie öffnen","event.secret_bone_door.b":"Den Raum durchsuchen","event.secret_bone_door.ra":"Der Knochenschlüssel steckte die ganze Zeit in deiner Tasche. Dahinter: ein Raum ohne Ausgang und Luft, die nach echter Luft riecht.","event.secret_bone_door.rb":"Du findest ein paar Münzen neben der Tür. Die Tür wartet.","event.secret_bone_door.text":"Eine Tür aus kleinen, polierten Knochen. Sie hat ein Schloss. Und sie hat deinen Schlüssel, auch wenn du ihn noch nicht gesehen hast.","event.secret_bone_door.title":"Die Knochentür","event.secret_stage.a":"Dich auf deinen Platz setzen","event.secret_stage.b":"Stehen bleiben","event.secret_stage.ra":"Von deinem Platz aus siehst du einen Tisch, ein Kartenspiel und einen leeren Stuhl. Du begreifst, dass du nicht der Einzige bist, der hier spielt. Und nicht der Einzige, der zusieht.","event.secret_stage.rb":"Du bleibst lieber stehen. Eine kurze Rast und etwas leichtere Luft.","event.secret_stage.text":"Eine Casinobühne mit leeren Sesseln. Jeder trägt ein Namensschild. Eines trägt deinen Namen. Ein anderes das des Croupiers: Es ist leer.","event.secret_stage.title":"Die leere Bühne","event.secret_watcher.a":"Zurückstarren","event.secret_watcher.b":"Den Blick senken","event.secret_watcher.ra":"Es sieht dich an. Du siehst es an. Und für einen Moment spürst du, dass noch jemand euch beide beobachtet, von außerhalb des Raums.","event.secret_watcher.rb":"Du senkst den Blick. Das Auge an der Decke wirkt erleichtert, als fürchte es, angesehen zu werden.","event.secret_watcher.text":"Ein Raum ohne Türen mit einem Auge an der Decke. Niemand hat es gemalt. Es blinzelt, wenn du blinzelst.","event.secret_watcher.title":"Der Beobachter","event.signed_receipt.a":"Alles lesen","event.signed_receipt.b":"Zerreißen","event.signed_receipt.ra":"Es ist eine Liste von Partien. Alle verloren. Alle deine.","event.signed_receipt.rb":"Du zerreißt es in Stücke. Wenn du die Faust schließt, steckt es wieder ganz in deiner Tasche, aber leichter.","event.signed_receipt.text":"Eine gefaltete Quittung fällt aus deiner Tasche. Deine Handschrift, ein Betrag, den du nicht verstehst, das Datum von morgen.","event.signed_receipt.title":"Die unterschriebene Quittung","event.wet_footprints.a":"Ihnen folgen","event.wet_footprints.b":"Sie ignorieren","event.wet_footprints.ra":"Hinter der Tür stehen ein leerer Tisch und eine Handvoll feuchter Chips. Niemand beansprucht sie.","event.wet_footprints.rb":"Du willst es lieber nicht wissen. Der Boden hinter dir wird trotzdem weiter nass.","event.wet_footprints.text":"Nasse, nackte Fußspuren führen über den Teppich und verschwinden unter einer Tür. Jemand ist gerade hier gewesen.","event.wet_footprints.title":"Nasse Fußspuren","event.woman_dress.a":"Die Karte nehmen","event.woman_dress.b":"Ablehnen","event.woman_dress.ra":"Die Karte wird warm. Umgedreht zeigt sie jemanden, der sehr geweint hat und nichts bereut.","event.woman_dress.rb":"Sie steckt die Karte weg, ohne zu drängen. Du weißt, dass sie sie wieder anbieten wird.","event.woman_dress.text":"Eine Frau in einem dunkelroten Kleid hält eine verdeckte Karte hin. „Viermal so viel von allem“, sagt sie. „Schulden eingeschlossen.“","event.woman_dress.title":"Die Frau in Rot","finale.stage1":"DIE LETZTE HAND","finale.stage2":"DIE LETZTE KUGEL","fx.abandoned":"Du hast den Raum halb verlassen. Das Haus hat sich etwas genommen.","fx.collapse":"Dein Geist bricht: Du verlierst Gesundheit und gewinnst etwas Verstand zurück.","fx.interest":"Schuldzinsen: +{n}","fx.revive_candle":"Die kurze Kerze entzündet dich neu.","fx.revive_life":"Ein Extraleben reißt dich vom Tod zurück.","hand.five":"Fünfling","hand.flush":"Flush","hand.four":"Vierling","hand.full":"Full House","hand.high":"Hohe Karte","hand.pair":"Paar","hand.sflush":"Straight Flush","hand.straight":"Straße","hand.three":"Drilling","hand.twopair":"Zwei Paare","help.combos":"Sonderkombinationen","help.goal":"Erreiche das Punkteziel, bevor dir die Züge ausgehen. Sonst kassiert das Haus.","help.hands":"Hände (Chips × Mult)","help.score":"Jeder Zug zählt CHIPS × MULT. Die Hand (Paar, Drilling, Straße …) gibt die Basis; jede Karte und Kombination addiert mehr. Prüfe vor dem Spielen immer die Kosten.","help.stakes":"Einsätze vervielfachen den Zug, kosten aber Gesundheit, Verstand, Geld oder Schulden. Manche Regeln verbieten sie.","help.stakes_title":"Einsätze","help.suits":"Farben","help.tips":"Lege schwache Karten ab, behalte eine in der Tasche für den perfekten Zug und achte auf deinen Verstand: Sinkt er, verzerrt sich der Bildschirm, und bei 0 brichst du zusammen (+25 Verstand, −20 Gesundheit).","help.tips_title":"Tipps","help.title":"Kurzanleitung","hint.boss":"Jeder Flügel hat einen Wächter mit eigenen Regeln, die das Spiel verändern. Lies sie, bevor du spielst: Ihn zu besiegen bringt dich dem Ende näher.","hint.event":"Hier entscheidest du zwischen zwei Optionen: ABLEHNEN (← oder A) oder ANNEHMEN (→ oder D). Was sich ändert —Gesundheit, Verstand, Geld oder Schulden— siehst du danach. Bei 0 Gesundheit stirbst du, bei wenig Verstand verzerrt sich das Haus, und die Schulden wachsen mit Zinsen.","hint.map":"Tippe einen Raum an, um zu sehen, was es ist, und tippe ihn noch einmal an, um einzutreten. Wenn du dich verirrst, erklärt dir die Schaltfläche ? oben das Spiel, wann immer du willst.","hint.merchant":"Hier wird alles mit Geld bezahlt. Und es wird auch verliehen: Darlehen erhöhen die Schulden, und die Schulden wachsen nach jedem Raum mit Zinsen.","hint.rest":"Eine Verschnaufpause: Wähle nur eine Sache. Schlafen stellt Gesundheit wieder her, Atmen stellt Verstand wieder her, Zahlen senkt die Schulden und Studieren steigert eine Hand.","howto.cards":"HÄNDE UND FARBEN ANSEHEN","howto.s1.h":"Ziel","howto.s1.t":"Du steigst Raum für Raum durch das Haus hinab. Auf jeder Etage wählst du auf der Karte deinen Weg: Du spielst Kartentische, entscheidest bei Ereignissen und setzt manchmal im Schrotflintenduell etwas ein. Jeder Flügel endet mit einem Wächter; danach folgen der Croupier, seine letzte Hand und Die Tür.\nSterben ist nicht das Ende: Du behältst Erinnerungen und Wissen und steigst erneut hinab.","howto.s2.h":"Die Karte","howto.s2.t":"Jeder Raum ist ein Knoten. Tippe einen an, um zu sehen, was es ist, und tippe ihn noch einmal an (oder drücke EINTRETEN), um hineinzugehen. Du kannst nur in Räume gehen, die mit deinem verbunden sind.\nEs gibt Kartentische, Ereignisse, den Händler, Rasten, die Schrotflinte (ein Duell, bei dem du etwas Eigenes einsetzt), eine geheime Knochentür und den Wächter.","howto.s3.h":"Deine Ressourcen","howto.s3.t":"• Gesundheit: Bei 0 stirbst du. Eine zusätzliche Kerze holt dich einmal mit 40 % Gesundheit zurück.\n• Verstand: Er sinkt durch Karten, Einsätze und Ereignisse. Ist er niedrig, verzerrt sich der Bildschirm und Flüstern erscheint; bei 0 brichst du zusammen: Du gewinnst 25 Verstand zurück, verlierst aber 20 Gesundheit.\n• Geld: Man kauft damit im Laden und zahlt Schulden ab.\n• Schulden: Sie steigen durch Darlehen und Einsätze, und nach jedem Raum kommen 3 % Zinsen dazu. Bei hohen Schulden erhöht das Haus das Ziel der Tische um 5 % pro 100 über 200 (bis zu 25 %).\n• Schild: Er absorbiert die Gesundheitskosten von Karten.","howto.s4.h":"Kartentische","howto.s4.t":"Wähle 1 bis 5 Karten aus deiner Hand und spiele: Die Hand (Paar, Drilling, Straße …) ergibt Chips × Multiplikator, und jede Karte und Kombination addiert mehr. Erreiche das Ziel, bevor dir die Züge ausgehen; sonst zahlst du mit Gesundheit, Verstand und Schulden.\nDu kannst ablegen, eine Karte in der Tasche behalten oder einen Einsatz machen (er vervielfacht den Zug, kostet aber). Jeder Gegner bringt eine eigene Regel mit, die am Tisch angezeigt wird. Prüfe vor dem Spielen immer die Kosten.","howto.s5.h":"Ereignisse","howto.s5.t":"Es sind Entscheidungen mit zwei Optionen: ABLEHNEN (← oder A) oder ANNEHMEN (→ oder D); am Handy wischst du. Manchmal erscheint eine dritte, verborgene Option (H), je nachdem, was du weißt oder bei dir trägst. Was deine Entscheidung ändert, wird danach angezeigt, und manche Werkzeuge erlauben es, sie zu wiederholen.","howto.s6.h":"Schrotflintenduell","howto.s6.t":"Du setzt etwas Eigenes ein (Geld, Verstand, Schulden oder eine Karte). Die Schrotflinte hat 6 Kammern, einige geladen. Der Gegner sagt an, wie viele Kugeln es sind … und er kann lügen.\nAm Zug kannst du auf den Gegner schießen (ist die Kammer geladen, verliert er eine Marke; sonst geht der Zug weiter), den Tisch versuchen (ist er leer, bleibst du am Zug; sonst verlierst du eine Marke) oder lauschen (kostet Verstand und liegt nicht immer richtig). Wer den anderen ohne Marken zurücklässt, gewinnt.","howto.s7.h":"Laden und Rast","howto.s7.t":"Der Händler verkauft Gegenstände, Werkzeuge und Karten gegen Geld und verleiht auch Geld: Darlehen erhöhen die Schulden.\nBei einer Rast wählst du nur eine Sache: schlafen (Gesundheit), atmen (Verstand), Schulden zahlen oder eine Hand studieren, um sie eine Stufe zu steigern.","howto.s8.h":"Sterben und Erinnern","howto.s8.t":"Wenn du stirbst, siehst du deine AKTUELLEN SCHULDEN (ein Teil wird in den nächsten Abstieg übernommen) und deine BEHALTENEN ERINNERUNGEN: dauerhafte Vorteile, die man durch bestimmte Taten verdient. Was du entdeckst, wird als Wissen gespeichert und öffnet verborgene Optionen und Türen.\nEs gibt 6 Enden; Die Tür verlangt für jedes etwas anderes.","howto.title":"So wird gespielt","hud.debt":"Schulden","hud.deck":"Stapel","hud.health":"Gesundheit","hud.howto":"So wird gespielt","hud.inventory":"Inventar","hud.items":"Gegenstände","hud.levels":"Handstufen","hud.lives":"Leben","hud.money":"Geld","hud.no_items":"Noch nichts.","hud.sanity":"Verstand","hud.settings":"Einstellungen","hud.tools":"Werkzeuge","intro.1":"Bist du wach?","intro.2":"Endlich.","intro.3":"Wir müssen eine Partie zu Ende spielen.","intro.4":"Welche Partie?","intro.5":"Die vorige.","intro.6":"Setz dich. Ich zeige dir, wie man hier spielt.","item.campanilla.desc":"+1 Ablage pro Runde.","item.campanilla.name":"Glöckchen","item.ceniza.desc":"+15 Chips pro Zug. −2 Verstand nach jedem Raum.","item.ceniza.name":"Asche","item.cuchilla_oxidada.desc":"Blut gibt +1 Mult mehr, kostet aber +1 Gesundheit.","item.cuchilla_oxidada.name":"Rostige Klinge","item.diente_leche.desc":"Zähne wachsen +1 mehr pro Zug.","item.diente_leche.name":"Milchzahn","item.espejo_roto.desc":"+2 Mult. Start mit −2 Verstand. Eine Entscheidung pro Partie wiederholbar (−5 Verstand).","item.espejo_roto.name":"Zerbrochener Spiegel","item.ficha_negra.desc":"Einsätze multiplizieren +0,15 mehr. Entscheidung für 50 Schulden zurücknehmen.","item.ficha_negra.name":"Schwarzer Chip","item.guante_crupier.desc":"+1 Zug pro Runde.","item.guante_crupier.name":"Handschuh des Croupiers","item.libro_cuentas.desc":"Schuldzinsen werden halbiert.","item.libro_cuentas.name":"Rechnungsbuch","item.llave_hueso.desc":"Start-Schild 4. Öffnet die verborgene Tür. Ermöglicht das Ende der Tür.","item.llave_hueso.name":"Knochenschlüssel","item.moneda_mordida.desc":"+5 Geld pro gewonnener Runde. Vergoldete Karten geben +2 mehr.","item.moneda_mordida.name":"Angebissene Münze","item.ojo_vidrio.desc":"+1 Karte auf der Hand. Nebel wirkt nicht auf dich.","item.ojo_vidrio.name":"Glasauge","item.reloj_parado.desc":"Ziele sinken um 8 %. Schulden wachsen 50 % schneller.","item.reloj_parado.name":"Stehengebliebene Uhr","know.clue":"Hinweis auf den Croupier","know.k_chair_founder.name":"Der Gründer","know.k_chair_founder.text":"Der Mann auf dem Stuhl gründete das Haus und blieb sitzen.","know.k_child_self.name":"Das Kind bist du","know.k_child_self.text":"Das Kind im Geburtstagskleid warst du. Seine Regel „Blinde Augen“ blendet dich nicht mehr.","know.k_dealer_deck.name":"Das Deck des Croupiers","know.k_dealer_deck.text":"Der Croupier gibt immer von unten. Sein Deck hat keinen König.","know.k_dealer_ledger.name":"Das Buch des Croupiers","know.k_dealer_ledger.text":"In seinem Rechnungsbuch ist jede Zeile eine Partie. Die letzte fehlt.","know.k_dealer_no_name.name":"Der Croupier hat keinen Namen","know.k_dealer_no_name.text":"Niemand erinnert sich an den Namen des Croupiers. Er selbst auch nicht.","know.k_door_same.name":"Alle Türen sind dieselbe","know.k_door_same.text":"Jede Tür führt in denselben Raum. Das muss man wissen, um die Wahrheit zu sehen.","know.k_drowned_paid.name":"Der Ertrunkene hat bezahlt","know.k_drowned_paid.text":"Der Ertrunkene zahlte seine Schuld mit Wasser. Seine Regel „Ertrinken“ lässt dich nicht mehr sinken.","know.k_girl_lies.name":"Worüber das Mädchen lügt","know.k_girl_lies.text":"Das Mädchen mit dem vernähten Auge lügt, wenn es die Wahrheit sagt. Seine Regel „Keine Wiederholung“ bindet dich nicht mehr.","know.k_moon.name":"Der Mond im Fenster","know.k_moon.text":"Der Mond im Fenster ist ein Scheinwerfer. Ohne seine Kälte verliert der Mann auf dem Stuhl seine Regel.","know.k_players.name":"Die Spieler","know.k_players.text":"Alle hier haben schon vorher gespielt. Alle.","know.k_reflection.name":"Dein Spiegelbild","know.k_reflection.text":"Im Spiegel bist nicht du es, der sich zuerst bewegt.","know.k_room13.name":"Raum 13","know.k_room13.text":"Es gibt einen Raum, der auf keinem Plan steht.","know.k_watcher.name":"Jemand sieht zu","know.k_watcher.text":"Jemand sieht der Partie von außerhalb des Hauses zu.","legal.back":"ZURÜCK ZUM SPIEL","legal.lang":"Sprache","legal.privacy.s1.h":"1. Was das Spiel speichert","legal.privacy.s1.t":"Das Spiel speichert deinen Spielstand und deine Einstellungen (Sprache, Lautstärke, Barrierefreiheit) im lokalen Speicher deines Browsers. Diese Daten bleiben auf deinem Gerät: Das Spiel sendet sie an keinen Server.\nDu kannst sie mit FORTSCHRITT ZURÜCKSETZEN im Menü oder in den Browsereinstellungen löschen. Wenn du sie löschst, verlierst du deinen Spielstand.","legal.privacy.s2.h":"2. Keine Dienste von Drittanbietern","legal.privacy.s2.t":"Das Spiel enthält weder Werbung noch Analyse, verwendet keine Cookies und lädt keine Ressourcen von anderen Websites. Es erhebt keine personenbezogenen Daten.","legal.privacy.s3.h":"3. Hosting","legal.privacy.s3.t":"Wie jede Website kann das Hosting, auf dem das Spiel veröffentlicht ist (derzeit GitHub Pages), technische Daten der Besuche, etwa die IP-Adresse, nach eigenen Bedingungen protokollieren. Das Spiel erhält diese Daten nicht.","legal.privacy.s4.h":"4. Inhaltshinweis","legal.privacy.s4.t":"THE HOUSE ALWAYS WATCHES ist ein fiktives Horrorwerk: Die Figuren, Orte und Ereignisse sind erfunden.\nDas Geld, die Chips, die Wetten und die Schulden im Spiel sind fiktiv: Sie haben keinen realen Wert, lassen sich weder kaufen noch gegen echtes Geld eintauschen, und das Spiel ist kein Glücksspielangebot.\nEs enthält Flacker- und Wackeleffekte sowie visuelle Verzerrungen, wenn der Verstand sinkt. Du kannst die Effekte unter EINSTELLUNGEN → Effekte reduzieren verringern. Wenn du an photosensibler Epilepsie oder anderen Beschwerden leidest, sprich vor dem Spielen mit einer Fachperson.","legal.title.privacy":"Datenschutz und Hinweise","legal.updated":"Zuletzt aktualisiert: 2026-10-01","log.round_lost":"Du hast die Runde verloren. Das Haus kassiert.","log.round_won":"Runde gewonnen.","map.enter":"EINTRETEN","map.info.event":"Etwas wartet auf dich. Du weißt nicht was.","map.info.merchant":"Ein Verkäufer von Dingen, die man nicht verkaufen sollte.","map.info.rest":"Eine Ecke zum Durchatmen.","map.info.secret":"Eine Knochentür, die sonst niemand sieht.","map.locked":"außer Reichweite","map.opp":"Gegner: {name}","map.pick":"Wähle deinen nächsten Raum.","map.shotgun":"Schrotflintenduell. Du setzt etwas Eigenes.","map.title":"Raum {n}/{total}","map.visited":"besucht","mem.m01.name":"Der erste Schlag","mem.m01.text":"Einmal zu sterben lehrte dich, etwas Geld dabeizuhaben. +10 Geld zu Beginn.","mem.m02.name":"Ersatzhände","mem.m02.text":"Du hast gelernt, ohne Zögern abzulegen. +1 Ablage pro Runde.","mem.m03.name":"Narben","mem.m03.text":"Der Körper erinnert sich. +10 maximale Gesundheit.","mem.m04.name":"Die Münze des Mädchens","mem.m04.text":"Du startest mit Paar auf Stufe 1.","mem.m05.name":"Das Salz des Stuhls","mem.m05.text":"Du startest mit einem Salz.","mem.m06.name":"Luft unter Wasser","mem.m06.text":"Gewinne 3 Verstand zurück, wenn du eine Runde gewinnst.","mem.m07.name":"Spielen wie ein Kind","mem.m07.text":"+1 Zug pro Runde.","mem.m08.name":"Die falsche Kugel","mem.m08.text":"Du startest mit einem Zeugen.","mem.m09.name":"Feines Gehör","mem.m09.text":"Lauschen in Duellen ist zu 85 % verlässlich.","mem.m10.name":"Klare Rechnung","mem.m10.text":"Schuldzinsen werden halbiert.","mem.m11.name":"Knochen aus Raum 13","mem.m11.text":"Du startest mit einem Glatten Knochen im Stapel.","mem.m12.name":"Ein Ende gesehen","mem.m
