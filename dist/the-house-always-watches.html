agó con las manos. Aún toca la única pieza que recuerda.","bio.puppet":"Habla con la voz de quien le pagó. Repite el guion del Crupier palabra por palabra… y a veces, una antes.","bio.woman":"Baila con un vestido que ya no se quita. El Pianista toca para ella y ella nunca le pide que pare.","boss.chair.a":"«Siéntate. Aquí la sangre se enfría y tus cartas no dan calor.»","boss.chair.l":"«La silla siempre gana. Es lo único que sé de ella.»","boss.chair.w":"«Me levanto. Llevo tanto sentado que no recuerdo cómo se hace.»","boss.child.a":"«¿Te acuerdas de mí? Yo de ti sí. No cierres los ojos… ah, ya los tienes cerrados.»","boss.child.l":"«Otra vez. Siempre pierdes aquí. Siempre vuelves.»","boss.child.w":"«Me has ganado. Yo quería que me ganaras. Ahora tienes que crecer.»","boss.cook.a":"«Aquí se pasa hambre. Pon más sobre la mesa y no te quejes del vapor.»","boss.cook.l":"«Sin deuda no hay casa. Siéntate, que se enfría.»","boss.cook.w":"«Has dejado el plato limpio. Llévate algo antes de que lo venda mi hermano.»","boss.dealer.a":"«La última mano. Sin apuestas ni trucos. Todo a la vista.»","boss.dealer.l":"«Siempre fue mi mesa. Levántate; ya volveremos a empezar.»","boss.dealer.w":"«Bien jugado. Por un instante creí que sería yo quien no se levantara.»","boss.drowned.a":"«Respira mientras puedas. Cada carta que juegues te hundirá un poco.»","boss.drowned.l":"«Bebe, bebe. Es solo agua. Es solo una deuda.»","boss.drowned.w":"«Ya pagué. O eso creía. Sube; aquí abajo no queda nada.»","boss.fight":"JUGAR LA PARTIDA","boss.girl.a":"«Jugamos a que no te repites. Yo lo noto todo con el ojo que no veo.»","boss.girl.l":"«Otra vez lo mismo, otra vez lo mismo. Me aburres.»","boss.girl.w":"«Me has ganado y no me has mentido. Qué raro. Coge lo que quieras.»","boss.no_rules":"Sin reglas especiales","boss.nun.a":"«Confiesa tus manos antes de jugarlas. Lo que se repite se recuerda, y lo que se recuerda se paga.»","boss.nun.l":"«Reza, hijo. La casa no oye, pero apunta.»","boss.nun.w":"«Te perdono lo que me debes. Lo del Crupier es otra cuenta. Pasa.»","boss.nurse.a":"«Respira hondo, cielo. Los ojos no te servirán de nada aquí, y el aire se acaba.»","boss.nurse.l":"«Tranquilo, solo es un pinchazo. Todos dicen lo mismo y todos vuelven a la cama.»","boss.nurse.w":"«Estás curado. Qué raro; aquí nadie lo está. Vete antes de que cambie de opinión.»","boss.rules":"Reglas de esta partida","boss.title":"GUARDIÁN","boss.weakened":"debilitada","card.base":"{rank} de {suit}","card.carta_doble.desc":"Repite el efecto de la carta que puntúa justo antes.","card.carta_doble.name":"Carta Doble","card.colmillo.desc":"+8 fichas. Crece +2 cada vez que puntúa (máx. +40).","card.colmillo.name":"Colmillo","card.corazon.desc":"+2 mult. Recuperas 2 de Salud.","card.corazon.name":"Corazón","card.cursed":"Maldita","card.dado_trucado.desc":"+6 fichas. Comodín de palo.","card.dado_trucado.name":"Dado Trucado","card.el_ahogado.desc":"+40 fichas (+80 si tu Cordura es menor de 40). −4 Cordura.","card.el_ahogado.name":"El Ahogado","card.el_hambre.desc":"+6 mult. Cuesta 3 de Salud.","card.el_hambre.name":"El Hambre","card.hueso_liso.desc":"+20 fichas.","card.hueso_liso.name":"Hueso Liso","card.la_deuda.desc":"Fichas = Deuda ÷ 6 (máx. 90). +10 Deuda.","card.la_deuda.name":"La Deuda","card.la_mujer.desc":"Comodín total. ×4 al puntuar. +25 Deuda y −6 Cordura.","card.la_mujer.name":"La Mujer de Rojo","card.la_septima.desc":"+7 fichas. Multiplica ×(1 + 0,5 por muerte), máx. ×5.","card.la_septima.name":"La Séptima","card.llave_maestra.desc":"+10 fichas y +4 de Escudo.","card.llave_maestra.name":"Llave Maestra","card.moneda_gemela.desc":"+4 fichas. Ganas 4 de Dinero.","card.moneda_gemela.name":"Moneda Gemela","card.ojo_vigia.desc":"+12 fichas. Revela 3 cartas del mazo.","card.ojo_vigia.name":"Ojo Vigía","card.sangre_pacto.desc":"+3 mult. Cuesta 2 de Salud.","card.sangre_pacto.name":"Pacto de Sangre","card.sombra.desc":"+5 fichas. Comodín de valor. +1 de Escudo.","card.sombra.name":"Sombra", try":"VOLVER A LA MESA","death.sub":"La partida no ha terminado.","death.title":"HAS MUERTO","debug.title":"Depuración","dlg.final.1":"Has llegado a la última mesa. Siempre llegan hasta aquí.","dlg.final.2":"Una mano más. Reparto yo. Nadie apuesta nada: todo se ve.","dlg.final.3":"Si ganas, hablaremos de la puerta. Si pierdes, empezarás otra vez. Es lo mismo, en realidad.","dlg.final.4":"Bien. Queda la última bala. Una cosa más y te dejo ir.","dlg.final.5":"Seis cámaras. Cuatro marcas cada uno. Esta vez no mira nadie… salvo la casa.","dlg.final.duel_lost":"«La última bala fue mía. Otra vez.»","dlg.final.duel_won":"«Se acabó la partida. Solo queda la puerta.»","dlg.final.lost":"«Has perdido la última mano. La casa cobra con intereses.»","dlg.final.won":"«Has ganado la mano. La casa calla.»","door.hint":"Cada final pide algo distinto. Elige con cuidado.","door.open":"Disponible","door.req.crupier":"Requiere: 3 pistas sobre el Crupier.","door.req.deuda":"Siempre disponible.","door.req.espectador":"Requiere: «Alguien mira» y «Tu reflejo».","door.req.partida":"Requiere: «Los jugadores» y haber conocido a 5 personajes.","door.req.puerta":"Requiere: la Llave de hueso.","door.req.verdad":"Requiere: 5 finales vistos y «Todas las puertas son la misma».","door.seen":"Final ya visto","door.title":"La Puerta","duel.announce":"{name} anuncia: {n} de 6 cámaras cargadas.","duel.announce_note":"Puede estar mintiendo.","duel.anomaly":"«Esa no era la bala que esperaba.»","duel.cap.back":"¡REBOTE!","duel.cap.bang":"¡BANG!","duel.cap.click":"CLIC…","duel.cap.safe":"SEGURO","duel.chambers":"Cámaras","duel.contract.honest":"No mentía: la Deuda sube 20.","duel.contract.lied":"El contrato muerde: {name} pierde una marca.","duel.ev.f_shot_click":"{name} dispara. Clic.","duel.ev.f_shot_hit":"{name} dispara: pierdes una marca.","duel.ev.f_table_backfire":"La Mesa se vuelve contra {name}: pierde una marca.","duel.ev.f_table_safe":"{name} tienta a la Mesa. Nada.","duel.ev.p_shot_click":"Clic. La cámara estaba vacía.","duel.ev.p_shot_hit":"Disparas: {name} pierde una marca.","duel.ev.p_table_backfire":"La Mesa te devuelve la bala: pierdes una marca.","duel.ev.p_table_safe":"La Mesa calla. Sigues con el turno.","duel.ev.reload":"La escopeta se recarga.","duel.ev.skipped":"{name} olvida su turno.","duel.final":"LA ÚLTIMA BALA","duel.heard_empty":"Crees oír… vacío.","duel.heard_loaded":"Crees oír… una bala.","duel.listen":"ESCUCHAR (−{c} Cordura)","duel.lose":"«La casa cobra.»","duel.marks_foe":"Marcas del rival","duel.marks_you":"Tus marcas","duel.n.backfire_f":"La Mesa le devuelve la bala a {name}.","duel.n.backfire_p":"La Mesa te devuelve la bala.","duel.n.empty":"Clic… La cámara {k} estaba VACÍA.","duel.n.f_aim_p":"{name} te apunta y aprieta el gatillo…","duel.n.f_aim_table":"{name} tienta a la Mesa…","duel.n.f_loses":"{name} pierde una marca. Le quedan {n}.","duel.n.loaded":"¡BANG! La cámara {k} estaba CARGADA.","duel.n.p_aim_foe":"Apuntas a {name} y aprietas el gatillo…","duel.n.p_aim_table":"Tientas a la Mesa: apoyas el cañón sobre el tapete…","duel.n.p_loses":"Pierdes una marca. Te quedan {n}.","duel.n.pass_f":"El turno pasa a {name}.","duel.n.pass_p":"El turno vuelve a ti.","duel.n.reload":"La escopeta se recarga: seis cámaras nuevas. {name} anuncia {n} balas.","duel.n.safe_f":"La Mesa guarda silencio: {name} sigue con el turno.","duel.n.safe_p":"La Mesa guarda silencio: sigues con el turno.","duel.n.skip_hint":"Toca la pantalla para acelerar.","duel.n.skipped":"{name} olvida su turno.","duel.n.turn_of":"Turno de {name}","duel.setup.note":"Si ganas: +10 Dinero extra. Si pierdes: −12 Salud además de la apuesta. Nadie te obliga a creer lo que anuncian.","duel.setup.sub":"¿Qué pones sobre la mesa?","duel.shoot_foe":"DISPARAR AL RIVAL","duel.shoot_table":"TENTAR A LA MESA","duel.stake.card.lose":"Si pierdes: pierdes una carta","duel.stake.card.name":"Una carta de tu mazo","duel.stake.card.win":"Si ganas: una carta especial","duel.stake.debt.lose":"Si pierdes: +{n} Deuda","duel.stake.debt.name":"{n} de Deuda","duel.stake.debt.win":"Si ganas: −60 Deuda","duel.stake.money.lose":"Si pierdes: −{n} Dinero","duel.stake.money.name":"{n} de Dinero","duel.stake.money.win":"Si ganas: +25 Dinero","duel.stake.sanity.lose":"Si pierdes: −{n} Cordura","duel.stake.sanity.name":"{n} de Cordura","duel.stake.sanity.win":"Si ganas: +8 Cordura","duel.title":"LA ESCOPETA","duel.tool.memory":"El rival olvidará su próximo turno.","duel.truth":"Testigo: había {n} balas reales.","duel.truth.honest":"Decía la verdad.","duel.truth.lied":"Te mintieron.","duel.turn_foe":"Turno del rival…","duel.turn_you":"Tu turno","duel.win":"«La casa paga.»","duel.you":"Tú","egg.arrepentido.hint":"Comprar y vender, sin salir de la tienda.","egg.arrepentido.name":"Compra y arrepiéntete","egg.arrepentido.text":"Compraste un comodín y lo vendiste en la misma visita. El Vendedor suspira: «Siempre vuelven».","egg.ases.hint":"Todos los As, en una sola jugada.","egg.ases.name":"Cuatro Ases","egg.ases.text":"Cuatro Ases en una mano. Nadie reparte así por casualidad.","egg.cinco.hint":"Una mano tiene cinco dedos; una corte, cinco comodines.","egg.cinco.name":"Cinco bufones","egg.cinco.text":"Una corte entera de comodines murmura a tu espalda. Tendrás que pagar la fiesta.","egg.colapso.hint":"Mirar demasiado tiempo lo que no se debe.","egg.colapso.name":"Cordura cero","egg.colapso.text":"Tu mente se quebró por completo. La casa lo anota con una sonrisa y te devuelve lo justo para seguir.","egg.jackpot.hint":"Tres números de la suerte, juntos, en una mano.","egg.jackpot.name":"Triple siete","egg.jackpot.text":"Tres sietes en una mano. Suenan campanas que no existen.","egg.konami.hint":"Un código de teclas de otra época, tecleado en el menú.","egg.konami.name":"Código antiguo","egg.konami.text":"Una vieja combinación de otra época. El Crupier finge no haberla visto.","egg.limite.hint":"Ganar sin ningún margen: a la última jugada.","egg.limite.name":"Por los pelos","egg.limite.text":"Ganaste en tu última jugada, con la casa ya sonriendo.","egg.mesa3.hint":"En el duelo, tienta a la Mesa y que no responda… tres veces seguidas.","egg.mesa3.name":"La Mesa calla","egg.mesa3.text":"Tentaste a la Mesa tres veces seguidas y las tres calló. Nadie le había hablado así.","egg.ojos.hint":"En el menú, los ojos del Crupier no se apartan de ti. Tócalos, una y otra vez.","egg.ojos.name":"Te mira de vuelta","egg.ojos.text":"Siete veces miraste al Crupier a los ojos. Él, por primera vez, parpadea.","egg.paciencia.hint":"La casa tiene toda la noche. Quizá tú también.","egg.paciencia.name":"Paciencia","egg.paciencia.text":"Esperaste un minuto entero sin tocar nada. La casa agradece a quien sabe esperar; casi nunca se lo devuelve.","egg.poliglota.hint":"Cuatro lenguas, una sola deuda.","egg.poliglota.name":"La casa habla todos los idiomas","egg.poliglota.text":"Español, inglés, francés, alemán: la deuda se entiende igual en los cuatro.","egg.real.hint":"La mano más noble de la baraja completa, del 10 al As.","egg.real.name":"Escalera real","egg.real.text":"Diez, Jota, Reina, Rey y As del mismo palo. El Crupier deja de barajar un segundo… y vuelve a barajar.","egg.unlocked":"Secreto descubierto: {name}","ending.crupier.epi":"Alguien se sienta por primera vez frente a ti. Sonríes sin mover la boca.","ending.crupier.text":"Le pides que se quite la sonrisa. Debajo no hay cara: hay un espejo con tu edad. «Gané hace tanto que olvidé cómo salir», dice. Te entrega el mazo y se sienta en tu silla. Ahora el que reparte eres tú.","ending.crupier.title":"El Crupier","ending.deuda.epi":"La Casa siempre gana. Pero hoy ha tardado más.","ending.deuda.text":"Juegas la última mano y ganas. La Casa anota la victoria en su libro y te devuelve una ficha negra. «Quedas a deber una partida», dice. Te levantas. La puerta sigue cerrada, pero ya sabes contar.","ending.deuda.title":"La Deuda","ending.espectador.epi":"Quien mira también está en la partida.","ending.espectador.text":"Miras hacia fuera de la sala, donde nadie debería mirar. Detrás del cristal hay una cara iluminada por una pantalla. Eres tú, o alguien que te ve jugar. Os observáis un segundo. Luego la casa baja el telón.","ending.espectador.title":"El Espectador","ending.first":"NUEVO FINAL","ending.memories":"Recuerdos ganados","ending.n":"FINAL {n} / {total}","ending.partida.epi":"Sin jugadores, la casa es solo una sala con luces.","ending.partida.text":"Los llamas por su nombre, uno a uno: la chica, el hombre de la silla, el ahogado, la archivista, el niño. Cada uno se levanta de su mesa. Nadie recordaba haber sido jugador. Dejan caer las cartas a la vez. La partida termina porque ya no queda nadie que quiera seguir.","ending.partida.title":"La Partida","ending.puerta.epi":"La puerta se cierra sola. Esta vez, del lado correcto.","ending.puerta.text":"La llave de hueso gira sin ruido. Detrás de la puerta hay un pasillo y, al final, otra puerta igual. La cruzas igualmente. Fuera hay aire de verdad y un cartel: CERRADO POR REFORMAS. Por primera vez, nadie te mira.","ending.puerta.title":"La Puerta","ending.to_menu":"VOLVER AL MENÚ","ending.true_hint":"Has visto cinco finales. Queda una puerta más.","ending.verdad.epi":"Gracias por jugar. Ya puedes dejar de mirar.","ending.verdad.text":"Has visto todos los finales. Sabes que todas las puertas son la misma y que el que mira eres tú. Cierras el libro de cuentas y escribes la última línea. La casa se apaga. No hay más partida: solo queda quien la jugó, y el silencio al otro lado de la pantalla.","ending.verdad.title":"La Verdad","event.archive_ledger.a":"Leer el libro","event.archive_ledger.b":"Cerrarlo","event.archive_ledger.ra":"Las columnas de cifras son partidas. Todas acaban en la misma puerta. Entiendes que no hay tantas puertas.","event.archive_ledger.rb":"«Sabia decisión», dice ella. «Aunque tampoco cambia nada.» Te da unas monedas por tu discreción.","event.archive_ledger.text":"Una mujer de gafas gruesas archiva libros de cuentas que gotean tinta. «Todos los nombres están aquí», dice. «Y todas las puertas son la misma.»","event.archive_ledger.title":"La Archivista","event.blood_vending.a":"Pagar con sangre","event.blood_vending.b":"Pasar de largo","event.blood_vending.ra":"La máquina zumba, satisfecha, y escupe una carta tibia.","event.blood_vending.rb":"La máquina se apaga con un suspiro. Por un instante pareció decepcionada.","event.blood_vending.text":"Una máquina expende cartas por un pinchazo en el dedo. Un cartel dice: «Sin cambio».","event.blood_vending.title":"La máquina de cartas","event.chair_bet.a":"Aceptar la apuesta","event.chair_bet.b":"Rechazarla","event.chair_bet.ra":"Tira los dados sin mirar. Los oyes rodar y detenerse justo cuando dejas de escuchar.","event.chair_bet.rb":"«Lo entiendo», murmura. «Yo también preferiría no levantarme.»","event.chair_bet.text":"El Hombre de la Silla no se levanta, y quizá no puede. «Apuesto la silla», dice con voz gastada. «Contra tu paciencia.»","event.chair_bet.title":"La silla","event.chair_secret.a":"Escucharlo","event.chair_secret.b":"Interrumpirlo","event.chair_secret.ra":"Habla durante horas, o segundos. Al final entiendes de quién es esa silla y por qué la guarda.","event.chair_secret.rb":"Se calla. La casa entera parece contener el aliento hasta que te alejas.","event.chair_secret.text":"«Esta casa la fundó un jugador cansado», dice el Hombre de la Silla. «Que se quedó esperando a los demás.» La silla cruje.","event.chair_secret.title":"El fundador","event.chapel_candles.a":"Encender la tuya","event.chapel_candles.b":"Apagar las demás","event.chapel_candles.ra":"La llama es fría y firme. Algo en la capilla suspira. Te guardas un cabo para después.","event.chapel_candles.rb":"Soplas una a una. En la oscuridad, la capilla parece más grande y más tuya. Encuentras monedas de ofrenda en el suelo.","event.chapel_candles.text":"Hay velas por todas partes y ninguna se consume. Cada una lleva un nombre escrito con cera. La tuya está sin encender.","event.chapel_candles.title":"Mil velas","event.child_1.a":"«Sí»","event.child_1.b":"«No»","event.child_1.ra":"Asiente, satisfecho. «Yo también.» Te da un caramelo con sabor a metal.","event.child_1.rb":"«Mentiroso», dice sin rencor. De cerca, su cara se parece a una foto tuya de niño que nunca viste.","event.child_1.text":"Un niño con un vestido de cumpleaños te tira de la manga. «¿Ya perdiste otra vez?», pregunta. No es una pregunta.","event.child_1.title":"El niño","event.child_2.a":"Quedarte el dibujo","event.child_2.b":"Dejarlo","event.child_2.ra":"Doblas el papel. Pesa. En algún lugar de la casa, un pasillo ha girado para colocar una puerta nueva.","event.child_2.rb":"Se encoge de hombros y tacha la puerta. Al rato, la tiza vuelve a dibujarse sola.","event.child_2.text":"El niño dibuja una puerta con tiza roja y escribe encima un número: 13. «Está en el pasillo. Solo abre si sabes cuál.»","event.child_2.title":"El dibujo","event.confession_booth.a":"Confesarte","event.confession_booth.b":"Marcharte","event.confession_booth.h":"Preguntar por el libro","event.confession_booth.ra":"Hablas de más. Sales más ligero... y en algún libro, algo pesa un poco más.","event.confession_booth.rb":"Al alejarte oyes tu propia voz confesándose al otro lado.","event.confession_booth.rh":"«Una parte se puede borrar», susurra. «Pero hay que quererlo.» La deuda afloja.","event.confession_booth.text":"Un confesionario entre dos mesas. Del otro lado alguien respira despacio y espera a que hables primero.","event.confession_booth.title":"El confesionario","event.cook_1.a":"Comer","event.cook_1.b":"Rechazarla","event.cook_1.ra":"Está caliente y sabe a algo que recuerdas sin haberlo vivido. Te sientes mejor; la cuenta, también lo nota.","event.cook_1.rb":"Se encoge de hombros. «Más para el Niño», dice, y aparta un plato que nadie viene a recoger.","event.cook_1.text":"En la cocina, un hombre de delantal manchado remueve una olla enorme. «Come», dice el Cocinero, «que aquí todo se aprovecha». No sabes de qué es la sopa.","event.cook_1.title":"La sopa del día","event.cook_2.a":"Abrir un tarro","event.cook_2.b":"Dejarle un recuerdo tuyo","event.cook_2.ra":"Huele a lluvia y a una cocina que no es esta. Por un instante entiendes cómo mejorar tus manos. El recuerdo se evapora, y la etiqueta con él.","event.cook_2.rb":"Eliges uno de tus recuerdos y lo guarda en un tarro vacío. «Buen precio», dice, y te cuenta unas monedas. No echas nada de menos. Eso es lo raro.","event.cook_2.text":"En la despensa hay estantes de tarros con etiquetas: un cumpleaños, una despedida, un lunes cualquiera. «Recuerdos en conserva», explica el Cocinero. «Mi hermano se lleva los que sobran.»","event.cook_2.title":"Los tarros","event.cook_3.a":"Llevarla sin abrir","event.cook_3.b":"Abrirla","event.cook_3.ra":"El Vendedor la recibe sin darte las gracias y te paga. «Mi hermano cocina bien», dice. «Es lo único que no cobra.» Ya no te mira con indiferencia.","event.cook_3.rb":"Dentro hay una nota de una sola línea y una carta que no recuerdas haber visto. El Cocinero lo sabe antes de que salgas de la despensa.","event.cook_3.text":"El Cocinero te da una caja atada con cordel. «Para mi hermano», dice. «El que vende lo que yo guardo. No la abras.»","event.cook_3.title":"Un encargo para el Vendedor","event.cracked_clock.a":"Darle cuerda","event.cracked_clock.b":"Dejarlo así","event.cracked_clock.ra":"Algo cruje dentro. El reloj se te queda en la mano, parado, y ya no sabes qué hora es.","event.cracked_clock.rb":"Es más seguro no tocar el tiempo aquí. Encuentras unas monedas bajo el péndulo.","event.cracked_clock.text":"Un reloj de pared marca siempre las 3:33. Si lo miras mucho, el segundero tiembla, como pidiendo algo.","event.cracked_clock.title":"El reloj parado","event.dealer_offer.a":"Firmar","event.dealer_offer.b":"Rechazar","event.dealer_offer.ra":"La tinta está caliente. El papel se pliega solo dentro de tu abrigo. Te sientes ligero, y vigilado.","event.dealer_offer.rb":"Recoge el contrato sin insistir. «La oferta caduca.» Te deja unas monedas por las molestias. Es peor así.","event.dealer_offer.text":"El Crupier desliza un contrato por la mesa. «Una firma y esa deuda desaparece.» La letra pequeña se mueve.","event.dealer_offer.title":"La oferta","event.dealer_question.a":"«Sí, lo recuerdo»","event.dealer_question.b":"«No lo recuerdo»","event.dealer_question.h":"Preguntar por la baraja","event.dealer_question.ra":"Anota algo. «Qué curioso. Nadie lo recuerda.» Te mira como si acabaras de mentirle a un espejo.","event.dealer_question.rb":"«Yo tampoco», admite, y por primera vez la baraja se detiene. Le preguntas su nombre. Calla. No tiene.","event.dealer_question.rh":"«Cincuenta y dos cartas», dice, sin sorpresa. «Cuatro palos, trece cada uno, del As al Rey. Y una que no está.» Sonríe.","event.dealer_question.text":"«¿Recuerdas cómo llegaste?», pregunta el Crupier, barajando sin mirar. «Antes de la primera mano.»","event.dealer_question.title":"Una pregunta","event.dealer_tea.a":"Beber","event.dealer_tea.b":"Rechazar la taza","event.dealer_tea.ra":"Está caliente, dulce y demasiado familiar. Dentro de la taza, grabado, tu nombre. Aun así estás mejor.","event.dealer_tea.rb":"Retira la taza sin ofenderse. «Cuando quieras.» Ambos sabéis que no es cortesía.","event.dealer_tea.text":"El Crupier sirve té en dos tazas idénticas. «Descansa un poco. La casa invita.» El vapor dibuja una cifra.","event.dealer_tea.title":"El té del Crupier","event.debt_collector.a":"Pagar una parte","event.debt_collector.b":"Negarte a pagar","event.debt_collector.ra":"Cuenta los billetes dos veces y anota algo. «Un placer.»","event.debt_collector.rb":"«Lo anotaré con intereses.» Se marcha sin hacer ruido. El frío se queda.","event.debt_collector.text":"Un hombre de traje gris te espera con un recibo. «Su deuda, señor. Lleva su firma.» No recuerdas haber firmado.","event.debt_collector.title":"El cobrador","event.dice_pit.a":"Tirar los dados","event.dice_pit.b":"Retirarte","event.dice_pit.ra":"Los dados ruedan y se detienen. La voz ya sabía el resultado.","event.dice_pit.rb":"La voz chasquea la lengua. «Otra vez será.» La oyes reír abajo.","event.dice_pit.text":"Un foso de arena con dados de hueso. Una voz sin cuerpo pregunta: «¿Cara o cruz?». Los dados no tienen caras. Ni cruces.","event.dice_pit.title":"El foso de los dados","event.drowned_pier.a":"Tenderle la mano","event.drowned_pier.b":"Alejarte","event.drowned_pier.ra":"Te agarra. Pesa, está helado, y susurra su pago: alguien lo hundió por una deuda que era tuya. Te deja un puñado de sal.","event.drowned_pier.rb":"Los golpes siguen a tu espalda, siempre a la misma distancia.","event.drowned_pier.text":"Un muelle de madera sin agua. Abajo, un hombre empapado hasta los huesos golpea el suelo con los nudillos, muy despacio.","event.drowned_pier.title":"El muelle seco","event.first_chip.a":"Aceptar la ficha","event.first_chip.b":"Dejarla rodar","event.first_chip.ra":"Pesa más de lo que parece. Algo, en un libro que no ves, acaba de anotarse.","event.first_chip.rb":"La ficha se pierde en la oscuridad. El Crupier asiente, como si lo hubiera esperado.","event.first_chip.text":"Una ficha negra rueda hasta tus pies. El Crupier sonríe sin mover la boca: «Es tuya. Siempre fue tuya.»","event.first_chip.title":"La ficha negra","event.girl_1.a":"Jugar a cara o cruz","event.girl_1.b":"Negarte","event.girl_1.ra":"La moneda gira demasiado tiempo. Cae, o no cae; ella ya ha apartado la vista.","event.girl_1.rb":"«Qué aburrido», dice, y guarda la moneda. Te sigue con el ojo bueno hasta perderte.","event.girl_1.text":"Una chica con un ojo cosido con hilo rojo hace girar una moneda. «Cara o cruz. Tú eliges. Yo miro.»","event.girl_1.title":"La Chica del Ojo Cosido","event.girl_2.a":"Creerla","event.girl_2.b":"Dudar de ella","event.girl_2.ra":"Le das las gracias. Aceptas su consejo y su dinero; ambos resultan falsos, aunque útiles.","event.girl_2.rb":"Sonríe con la boca torcida. «Listo.» Aprendes su gesto: miente cuando mira al suelo.","event.girl_2.text":"«Te lo aviso: la Casa no miente», dice la chica del ojo cosido. Lo dice mirando el suelo. Es la clase de frase que se dice mintiendo.","event.girl_2.title":"Lo que dice la chica","event.girl_3.a":"Aceptar el ojo","event.girl_3.b":"Rechazarlo","event.girl_3.ra":"Te lo colocas y ves más: las cartas, la sala, algo detrás de la sala. Ella se queda con el hilo.","event.girl_3.rb":"«Otra vez, entonces.» Cierra la mano, y el ojo, si era un ojo, desaparece.","event.girl_3.text":"La chica ofrece en la palma de la mano un ojo de cristal. «Este ve más. Cuesta más también.» El hilo rojo se ha soltado un poco.","event.girl_3.title":"El hilo rojo","event.kitchen_fire.a":"Echar un pagaré","event.kitchen_fire.b":"Remover la olla","event.kitchen_fire.ra":"Eliges uno con tu firma y lo arrojas. Arde azul. La deuda se aligera… y algo dentro de ti, también.","event.kitchen_fire.rb":"Remueves despacio. Por un momento el caldo parece tu cara. Te sirves un cazo; te sienta bien, y la casa cobra por ello.","event.kitchen_fire.text":"Bajo la olla grande arden papeles viejos: pagarés, recibos, promesas. El Cocinero no está. El fuego te mira con hambre.","event.kitchen_fire.title":"El fogón","event.merchant_memory.a":"Comprar un frasco","event.merchant_memory.b":"Rechazar","event.merchant_memory.ra":"Lo destapas y, de pronto, sabes jugar mejor una mano concreta. No sabes por qué.","event.merchant_memory.rb":"«Cuando quieras.» Se ofende un poco. Es el único vendedor que nunca da la espalda.","event.merchant_memory.text":"El Vendedor vende recuerdos en frascos. «Este huele a tu primer casino. Este otro, a tu última mano.»","event.merchant_memory.title":"Un recuerdo en venta","event.mirror_hall.a":"Tocar el cristal","event.mirror_hall.b":"Apartar la vista","event.mirror_hall.h":"Decirle tu nombre","event.mirror_hall.ra":"Está tibio, como una mano. Tu reflejo sonríe medio segundo antes que tú.","event.mirror_hall.rb":"Cuentas los pasos hasta la salida. Nadie te sigue. Nadie, salvo uno.","event.mirror_hall.rh":"El reflejo asiente. Por primera vez sientes que alguien de ese lado juega a tu favor.","event.mirror_hall.text":"Cada espejo te devuelve el gesto con un segundo de retraso. El último no te sigue: te mira.","event.mirror_hall.title":"El pasillo de espejos","event.moon_window.a":"Abrirla","event.moon_window.b":"Cerrarla","event.moon_window.ra":"El aire huele a cera. Sabes algo que antes no sabías: el Hombre de la Silla no soporta esta luz.","event.moon_window.rb":"La cierras despacio. Al otro lado del cristal algo golpea dos veces, con educación.","event.moon_window.text":"Una ventana sin pared muestra una luna enorme. En el resto del casino es de día.","event.moon_window.title":"La ventana","event.nun_1.a":"Confesarte","event.nun_1.b":"Callar","event.nun_1.ra":"Hablas durante lo que parece una noche entera. Sales más ligero… y con la cuenta un poco más larga. Ella anota algo en las cuentas de su rosario.","event.nun_1.rb":"Asiente despacio. «El silencio también es una deuda», dice, y enciende una vela sin pedirte nada.","event.nun_1.text":"Una monja de velo negro te hace sitio en el confesionario. «Cuéntame lo que debes», dice la Hermana. «Aquí todo se dice, aunque nadie escuche.»","event.nun_1.title":"El velo","event.nun_2.a":"Preguntar por él","event.nun_2.b":"Rezar con ella","event.nun_2.h":"Preguntar por el nombre del Crupier","event.nun_2.ra":"«Tenía una deuda y le ofrecí agua. Aceptó. Ya está pagada, aunque él no lo cree.» Entiendes por fin qué le pasó al Ahogado.","event.nun_2.rb":"Rezáis sin palabras. Sientes el peso de una mano que no está. Sales con menos miedo y con los zapatos húmedos.","event.nun_2.rh":"La Hermana se santigua. «Lo sé. Lo confesó una vez, hace mucho, antes de la primera mano.» Aprieta los labios: no te lo dirá. Pero ahora sabes que existió un nombre.","event.nun_2.text":"«Bauticé a uno demasiado tiempo», murmura la Hermana mirando la pila de agua. «Ahora vive abajo y no se seca.» Las velas se inclinan hacia el suelo.","event.nun_2.title":"El bautizo","event.nun_3.a":"Absolverla","event.nun_3.b":"Dejarla rezando","event.nun_3.ra":"Pronuncias palabras que no recuerdas haber aprendido. Ella llora sin ruido y, al levantarse, te tiende algo que tampoco recuerdas haber perdido.","event.nun_3.rb":"Te alejas con su murmullo detrás. En el cepillo hay unas monedas; no sabes si son tuyas o suyas.","event.nun_3.text":"Esta vez es la Hermana quien se arrodilla. «Yo confesé primero», dice. «Y le di la absolución antes de que tuviera nada que perdonar.»","event.nun_3.title":"La última confesión","event.nurse_1.a":"Dejar que te cosa","event.nurse_1.b":"Rehusar","event.nurse_1.ra":"No duele. Te cierra heridas que no sabías que tenías y deja otras sin abrir. «Ya está», dice. «Ahora, a la cama.» No te quedas.","event.nurse_1.rb":"Te mira largo rato. «Como quieras.» Deja la aguja en una bandeja con una docena más. No es la primera vez que le dicen que no.","event.nurse_1.text":"Una enfermera de mascarilla verde descorre una cortina. «Siéntate, cielo. Tienes mala cara. Aquí nadie se cura, pero todos mejoran un poquito.» Sostiene una aguja ya enhebrada.","event.nurse_1.title":"La enfermería","event.nurse_2.a":"Preguntar por la niña","event.nurse_2.b":"Coger el hilo","event.nurse_2.ra":"«Veía lo que hay detrás de la baraja. El Crupier me lo pidió con buenos modales.» Entiendes por qué la Chica miente: es lo único que no le cosieron.","event.nurse_2.rb":"El hilo negro se te enreda en los dedos y una de tus cartas queda marcada con una puntada. Parece que siempre estuvo así.","event.nurse_2.text":"En la bandeja hay agujas, hilo negro y un ojo de cristal. «Es de la Chica», dice la Enfermera. «Se lo cosí para que dejara de ver. Ahora me pide que se lo cosa cada noche.»","event.nurse_2.title":"La bandeja","event.nurse_3.a":"Empujar su silla","event.nurse_3.b":"Cambiar la dosis","event.nurse_3.ra":"Recorres el pasillo despacio. Él habla de cuando la casa era un solo salón y una sola mesa. «Me quedé a esperar a los demás», repite. Y los demás llegaron.","event.nurse_3.rb":"Cambias la etiqueta. Él no protesta; la Enfermera tampoco. «Si se levanta, ya veremos quién se sienta», dice por fin. Hay algo que ya no te cobran.","event.nurse_3.text":"El Hombre de la Silla espera en el pasillo de la enfermería. Una jeringuilla descansa en su regazo. «Mi dosis», murmura. «Para no levantarme.» La Enfermera te mira desde la puerta.","event.nurse_3.title":"La dosis","event.old_photograph.a":"Descolgarla","event.old_photograph.b":"Dejarla en su sitio","event.old_photograph.ra":"Detrás hay nombres. Muchos. Ninguno se repite... salvo el tuyo.","event.old_photograph.rb":"La dejas. Te sigues sintiendo observado, pero con cierta amabilidad. Casi.","event.old_photograph.text":"En la pared hay una foto de grupo: jugadores alrededor de esta mesa, de todas las épocas. En la última fila, tu cara.","event.old_photograph.title":"La fotografía","event.phone_call.a":"Contestar","event.phone_call.b":"Colgar sin oír","event.phone_call.ra":"Una respiración y, debajo, un rumor de aplausos lejanos. «¿Sigues ahí?», dice alguien que no está en la sala. «Nosotros sí.»","event.phone_call.rb":"El teléfono calla en cuanto lo tocas. Al colgar se oye un suspiro colectivo.","event.phone_call.text":"Un teléfono de baquelita suena en medio de la mesa. Es para ti. Siempre es para ti, a partir de la segunda vez.","event.phone_call.title":"El teléfono","event.pianist_1.a":"Escuchar hasta el final","event.pianist_1.b":"Pedirle otra","event.pianist_1.h":"Preguntar por sus manos","event.pianist_1.ra":"Dura lo que dura. Te sientes ligero, casi perdonado. Dejas una moneda en el bolsillo de su frac.","event.pianist_1.rb":"«Solo sé esa.» La toca otra vez, igual de perfecta. Cuando termina, te tiende un puño vacío: dentro hay unas monedas que no recuerdas haber dejado.","event.pianist_1.rh":"«Las dejé en pago», dice. «El Crupier las quiso para su primera baraja. Ahora las guarda la Archivista en un cajón que no se abre.» Y sigue tocando.","event.pianist_1.text":"Un pianista de puños vacíos toca el órgano de la capilla. No hay manos en sus mangas, pero la música suena. «Es la única pieza que recuerdo», dice sin volverse.","event.pianist_1.title":"El organista","event.pianist_2.a":"Bailar con ella","event.pianist_2.b":"Mirar desde lejos","event.pianist_2.ra":"Giráis hasta que el suelo se olvida de ti. Te sientes mejor, y peor. Ella susurra: «Gracias por no soltarme».","event.pianist_2.rb":"Os miráis sin hablar. Su vestido ondea sin viento. El Pianista toca más bajo, como pidiendo perdón.","event.pianist_2.text":"La Mujer de Rojo baila sola entre los bancos al ritmo del órgano. Si el Pianista parara, ¿qué sería de ella? Te tiende una mano enguantada.","event.pianist_2.title":"El baile","event.puppet_1.a":"Hablar con él","event.puppet_1.b":"Quitarle la cuerda","event.puppet_1.ra":"Repite frases enteras: las mismas que el Crupier dijo a los anteriores. Notas una pausa antes de cada una, como si alguien soplara el guion desde detrás.","event.puppet_1.rb":"Cae inerte con un golpe de madera. En su bolsillo hay unas monedas y una nota sin firmar: «Sigue sin mirar atrás».","event.puppet_1.text":"Un muñeco de ventrílocuo descansa sobre una silla vacía. Sin que nadie lo mueva, la mandíbula baja: «Bienvenido», dice con una voz que has oído antes. «Te estábamos esperando.»","event.puppet_1.title":"El muñeco","event.puppet_2.a":"Seguir el guion","event.puppet_2.b":"Romper el guion","event.puppet_2.ra":"Dices exactamente lo que estaba escrito y todo sale bien, demasiado bien. La cuenta se aligera. El Crupier, desde algún sitio, parece sonreír.","event.puppet_2.rb":"Pronuncias una frase que no estaba. El Muñeco se queda con la boca abierta. Por un instante, la casa entera tiene que improvisar.","event.puppet_2.text":"El Muñeco vuelve a hablar. Esta vez no repite al Crupier: te lee tus propias frases, antes de que las digas. «Página treinta», anuncia. «Aquí es donde dudas.»","event.puppet_2.title":"El guion","event.room_13.a":"Entrar","event.room_13.b":"Cerrar la puerta","event.room_13.ra":"Dentro, el Niño espera con las cartas en las manos. «¿Ya perdiste otra vez?»","event.room_13.rb":"La cierras. La puerta se disuelve en la pared como si nunca hubiera estado.","event.room_13.text":"Al fondo del pasillo hay una puerta que no estaba: 13. Detrás, el sonido de un niño barajando, muy despacio.","event.room_13.title":"La Habitación 13","event.secret_bone_door.a":"Abrirla","event.secret_bone_door.b":"Registrar la sala","event.secret_bone_door.ra":"La llave de hueso ya estaba en tu bolsillo desde siempre. Detrás hay una sala sin salida y un aire que huele a aire de verdad.","event.secret_bone_door.rb":"Encuentras unas monedas junto a la puerta. La puerta espera.","event.secret_bone_door.text":"Una puerta hecha de huesos pequeños y pulidos. Tiene cerradura. Y tiene tu llave, aunque todavía no la has visto.","event.secret_bone_door.title":"La puerta de hueso","event.secret_stage.a":"Sentarte en tu butaca","event.secret_stage.b":"Quedarte de pie","event.secret_stage.ra":"Desde tu butaca ves una mesa, una baraja y una silla vacía. Entiendes que no eres el único que juega aquí. Ni el único que mira.","event.secret_stage.rb":"Prefieres seguir de pie. Un descanso corto, y un aire algo más ligero.","event.secret_stage.text":"Un escenario de casino con butacas vacías. Cada una lleva una placa con un nombre. Una lleva el tuyo. Otra, la del Crupier: está en blanco.","event.secret_stage.title":"El escenario vacío","event.secret_watcher.a":"Devolverle la mirada","event.secret_watcher.b":"Bajar la vista","event.secret_watcher.ra":"Te mira. Tú lo miras. Y por un instante sientes que alguien más os mira a ambos, desde fuera de la sala.","event.secret_watcher.rb":"Bajas la vista. El ojo del techo parece aliviado, como si temiera que lo miraran.","event.secret_watcher.text":"Una sala sin puertas con un ojo pintado en el techo. Nadie lo pintó. Parpadea cuando tú parpadeas.","event.secret_watcher.title":"El que mira","event.signed_receipt.a":"Leerlo entero","event.signed_receipt.b":"Romperlo","event.signed_receipt.ra":"Es una lista de partidas. Todas perdidas. Todas tuyas.","event.signed_receipt.rb":"Lo rompes en trozos. Al cerrar el puño vuelve a estar entero en tu bolsillo, pero más ligero.","event.signed_receipt.text":"Un recibo doblado cae de tu bolsillo. Lleva tu letra, una cantidad que no entiendes y la fecha de mañana.","event.signed_receipt.title":"El recibo firmado","event.staff_room.a":"Mirar los turnos","event.staff_room.b":"Borrar tu nombre","event.staff_room.ra":"Todos cubren turnos de huéspedes que no se fueron. Entiendes algo incómodo: cada uno de ellos jugó antes. Todos.","event.staff_room.rb":"Pasas el dedo por tu nombre y se borra. Reaparece al otro lado de la sala. Al menos hay unas monedas olvidadas en una taquilla.","event.staff_room.text":"Una sala con taquillas y un tablón de turnos: Crupier, Archivista, Vendedor, Cocinero, Enfermera, Hermana, Pianista… Hay un hueco con tu nombre en el último turno de la noche.","event.staff_room.title":"La sala del personal","event.wall_notes.a":"Seguir leyendo","event.wall_notes.b":"Taparte los ojos","event.wall_notes.ra":"Hay más: apuestas, deudas, un par de chistes. Entre los garabatos, algo de dinero olvidado en una grieta.","event.wall_notes.rb":"Dicen que quien lo lee entero se queda a vivir aquí. Prefieres no comprobarlo.","event.wall_notes.text":"Alguien ha escrito en la pared, con tiza, con carbón, con sangre: «La Enfermera cosió el ojo.» «El Cocinero guarda los recuerdos.» «El Vendedor los vende.» «La Hermana conoce el nombre.» «El Pianista pagó con las manos.» Debajo, más pequeño: «Nadie recuerda quién escribe esto.»","event.wall_notes.title":"Notas en la pared","event.wet_footprints.a":"Seguirlas","event.wet_footprints.b":"Ignorarlas","event.wet_footprints.ra":"Detrás de la puerta hay una mesa vacía y un puñado de fichas húmedas. Nadie las reclama.","event.wet_footprints.rb":"Prefieres no saber. El suelo, en cambio, sigue mojándose detrás de ti.","event.wet_footprints.text":"Huellas descalzas y mojadas cruzan la alfombra y se pierden bajo una puerta. Alguien acaba de pasar.","event.wet_footprints.title":"Huellas mojadas","event.woman_dress.a":"Tomar la carta","event.woman_dress.b":"Rechazarla","event.woman_dress.ra":"La carta se calienta. Al girarla ves a alguien que lloró mucho y no se arrepiente.","event.woman_dress.rb":"Guarda la carta sin insistir. Sabes que volverá a ofrecértela.","event.woman_dress.text":"Una mujer con un vestido rojo oscuro tiende una carta bocabajo. «Cuatro veces más de todo», dice. «Incluidas las deudas.»","event.woman_dress.title":"La Mujer de Rojo","finale.stage1":"LA ÚLTIMA MANO","finale.stage2":"LA ÚLTIMA BALA","fx.abandoned":"Abandonaste la sala a medias. La casa cobró algo.","fx.collapse":"Tu mente se quiebra: pierdes Salud y recuperas algo de Cordura.","fx.interest":"Interés de la deuda: +{n}","fx.revive_candle":"La vela corta te vuelve a encender.","fx.revive_life":"Una vida extra te arranca de la muerte.","fxbanner.big":"¡GRAN JUGADA!","fxbanner.good":"¡BUENA JUGADA!","fxbanner.huge":"¡DEVASTADOR!","fxbanner.target":"¡OBJETIVO ALCANZADO!","hand.five":"Quintilla","hand.flush":"Color","hand.four":"Póker","hand.full":"Full","hand.high":"Carta alta","hand.pair":"Pareja","hand.sflush":"Escalera de color","hand.straight":"Escalera","hand.three":"Trío","hand.twopair":"Doble pareja","help.combos":"Combinaciones especiales","help.goal":"Llega al OBJETIVO de puntos antes de quedarte sin jugadas. Si no lo logras, la casa cobra.","help.hands":"Manos (fichas × mult)","help.score":"Cada jugada puntúa FICHAS × MULT. La mano (pareja, trío, escalera…) da la base; cada carta y cada combinación suman más. Mira siempre el coste antes de jugar. Cada carta suma fichas según su valor: As 11, figuras (J, Q, K) 10 y el resto su número.","help.stakes":"Apostar multiplica la jugada, pero cuesta Salud, Cordura, Dinero o Deuda. Algunas reglas las prohíben.","help.stakes_title":"Apuestas","help.suits":"Palos","help.tips":"Descarta cartas malas, guarda una en el Bolsillo para la jugada perfecta y cuida la Cordura: si baja, la pantalla se distorsiona y, si llega a 0, colapsas (+25 Cordura, −20 Salud).","help.tips_title":"Consejos","help.title":"Guía rápida","hint.boss":"Cada ala tiene un Guardián con reglas propias que cambian la partida. Léelas antes de jugar: vencerlo te acerca al final.","hint.event":"Aquí decides entre dos opciones: RECHAZAR (← o A) o ACEPTAR (→ o D). Lo que cambia —Salud, Cordura, Dinero o Deuda— lo verás después. Con Salud 0 mueres, con poca Cordura la casa se distorsiona y la Deuda crece con intereses.","hint.map":"Toca una sala para ver qué es y vuelve a tocarla para entrar. Si te pierdes, el botón ? de arriba te explica el juego cuando quieras.","hint.merchant":"Aquí todo se compra con Dinero. Y también se presta: los préstamos suman Deuda, y la Deuda crece con intereses tras cada sala.","hint.rest":"Un respiro: elige una sola cosa. Dormir recupera Salud, respirar recupera Cordura, pagar baja la Deuda y estudiar sube de nivel una mano.","howto.cards":"VER MANOS Y PALOS","howto.s1.h":"Objetivo","howto.s1.t":"Bajas por la casa sala a sala. En cada piso eliges tu camino en el mapa: juegas mesas de cartas, decides en sucesos y, a veces, te juegas algo en el duelo de la escopeta. Cada ala termina con un Guardián; después llegan el Crupier, su última mano y La Puerta.\nMorir no es el final: conservas recuerdos y conocimiento, y vuelves a bajar.","howto.s2.h":"El mapa","howto.s2.t":"Cada sala es un nodo. Toca uno para ver qué es y vuelve a tocarlo (o pulsa ENTRAR) para entrar. Solo puedes ir a las salas conectadas con la tuya.\nHay mesas de cartas, sucesos, el Vendedor, descansos, la escopeta (duelo en el que apuestas algo tuyo), una puerta de hueso secreta y el Guardián.","howto.s3.h":"Tus recursos","howto.s3.t":"• Salud: si llega a 0, mueres. Una vela extra te levanta una vez, con el 40 % de Salud.\n• Cordura: baja con cartas, apuestas y sucesos. Con poca, la pantalla se distorsiona y aparecen susurros; si llega a 0, colapsas: recuperas 25 de Cordura y pierdes 20 de Salud.\n• Dinero: sirve para comprar en la tienda y para pagar deuda.\n• Deuda: sube con préstamos y apuestas, y tras cada sala se le suma un 3 % de interés. Con mucha deuda, la Casa sube el objetivo de las mesas un 5 % por cada 100 por encima de 200 (hasta un 25 %).\n• Escudo: absorbe el coste en Salud de las cartas.","howto.s4.h":"Mesas de cartas","howto.s4.t":"Elige de 1 a 5 cartas de tu mano y juega: la mano (pareja, trío, escalera…) da fichas × multiplicador, y cada carta y combinación suma más. Llega al objetivo antes de quedarte sin jugadas; si no, pagas con Salud, Cordura y Deuda.\nPuedes descartar, guardar una carta en el Bolsillo o apostar (multiplica la jugada, pero cuesta). Cada rival trae una regla propia, visible en la mesa. Mira siempre el coste antes de jugar.","howto.s5.h":"Sucesos","howto.s5.t":"Son decisiones de dos opciones: RECHAZAR (← o A) o ACEPTAR (→ o D); en el móvil, desliza. A veces aparece una tercera opción oculta (H), según lo que sepas o lleves encima. Lo que cambia tu decisión se muestra al terminar, y algunas herramientas permiten rehacerla.","howto.s6.h":"Duelo de la escopeta","howto.s6.t":"Apuestas algo tuyo (Dinero, Cordura, Deuda o una carta). La escopeta tiene 6 cámaras, algunas cargadas. El rival anuncia cuántas balas hay… y puede mentir.\nEn tu turno puedes disparar al rival (si la cámara está cargada, pierde una marca; si no, pasa el turno), tentar a la Mesa (si está vacía conservas el turno; si no, pierdes una marca) o escuchar (cuesta Cordura y no siempre acierta). Gana quien deje al otro sin marcas.","howto.s7.h":"Tienda y descanso","howto.s7.t":"El Vendedor vende objetos, herramientas y cartas a cambio de Dinero, y también presta: los préstamos suman Deuda.\nEn un descanso eliges una sola cosa: dormir (Salud), respirar (Cordura), pagar deuda o estudiar una mano para subirla de nivel.","howto.s8.h":"Morir y recordar","howto.s8.t":"Al morir ves tu DEUDA ACTUAL (una parte se arrastra a la siguiente bajada) y los RECUERDOS CONSERVADOS: ventajas permanentes que se ganan al hacer ciertas cosas. Lo que descubres se guarda como conocimiento y abre opciones ocultas y puertas.\nHay 6 finales; La Puerta pide cosas distintas para cada uno.","howto.title":"Cómo se juega","hud.debt":"Deuda","hud.deck":"Mazo","hud.health":"Salud","hud.howto":"Cómo se juega","hud.inventory":"Inventario","hud.items":"Objetos","hud.jokers":"Jokers","hud.levels":"Niveles de mano","hud.lives":"Velas","hud.money":"Dinero","hud.no_items":"Nada todavía.","hud.sanity":"Cordura","hud.settings":"Ajustes","hud.tools":"Herramientas","intro.1":"¿Estás despierto?","intro.2":"Por fin.","intro.3":"Tenemos que terminar una partida.","intro.4":"¿Qué partida?","intro.5":"La anterior.","intro.6":"Siéntate. Te enseñaré cómo se juega aquí.","item.campanilla.desc":"+1 descarte por ronda.","item.campanilla.name":"Campanilla","item.ceniza.desc":"+15 fichas por jugada. −2 Cordura al terminar cada sala.","item.ceniza.name":"Ceniza","item.cuchilla_oxidada.desc":"La Sangre da +1 mult más, pero cuesta +1 de Salud.","item.cuchilla_oxidada.name":"Cuchilla oxidada","item.diente_leche.desc":"Los Dientes crecen +1 más por jugada.","item.diente_leche.name":"Diente de leche","item.espejo_roto.desc":"+2 mult. Empiezas con −2 de Cordura. Puedes rehacer una decisión por partida (−5 Cordura).","item.espejo_roto.name":"Espejo roto","item.ficha_negra.desc":"Las apuestas multiplican +0,15 más. Puedes deshacer una decisión pagando 50 de Deuda.","item.ficha_negra.name":"Ficha negra","item.guante_crupier.desc":"+1 jugada por ronda.","item.guante_crupier.name":"Guante del Crupier","item.libro_cuentas.desc":"El interés de la deuda se reduce a la mitad.","item.libro_cuentas.name":"Libro de cuentas","item.llave_hueso.desc":"Escudo inicial de 4. Abre la puerta oculta. Permite el final de la Puerta.","item.llave_hueso.name":"Llave de hueso","item.moneda_mordida.desc":"+5 de Dinero por ronda ganada. Las cartas Doradas dan +2 más.","item.moneda_mordida.name":"Moneda mordida","item.ojo_vidrio.desc":"+1 carta en mano. La Niebla no te afecta.","item.ojo_vidrio.name":"Ojo de vidrio","item.reloj_parado.desc":"Los objetivos bajan un 8%. La deuda crece un 50% más rápido.","item.reloj_parado.name":"Reloj parado","joker.abaco.desc":"+1 mult permanente por cada ronda ganada en este descenso.","joker.abaco.name":"El Ábaco Oxidado","joker.as_manga.desc":"×1,5 por cada As que puntúa.","joker.as_manga.name":"El As en la Manga","joker.bufon.desc":"+4 de multiplicador.","joker.bufon.name":"El Bufón Mudo","joker.casa_gana.desc":"×1,4 si apuestas en la jugada.","joker.casa_gana.name":"La Casa Siempre Gana","joker.colmillo_dorado.desc":"+10 fichas por cada carta de Diente que puntúa.","joker.colmillo_dorado.name":"El Colmillo Dorado","joker.corona_podrida.desc":"×2 si la jugada es Color o mejor (Color, Full, Póker, Escalera de color).","joker.corona_podrida.name":"La Corona Podrida","joker.escalera_sin_fin.desc":"+40 fichas y +4 mult si la jugada es una Escalera.","joker.escalera_sin_fin.name":"La Escalera Sin Fin","joker.gemelos.desc":"×1,5 si la jugada es Doble pareja o Full.","joker.gemelos.name":"Los Gemelos","joker.llavero_roto.desc":"+8 fichas y +1 de Escudo por cada Llave que puntúa.","joker.llavero_roto.name":"El Llavero Roto","joker.monja_ciega.desc":"×1,25 por cada figura (J, Q, K) que puntúa.","joker.monja_ciega.name":"La Monja Ciega","joker.ojo_nuca.desc":"+12 fichas por cada carta de Ojo que puntúa.","joker.ojo_nuca.name":"El Ojo en la Nuca","joker.peaje.desc":"Ganas 2 de Dinero por cada carta que puntúa.","joker.peaje.name":"El Peaje del Barquero","joker.sanguijuela.desc":"+2 mult por cada carta de Sangre que puntúa.","joker.sanguijuela.name":"La Sanguijuela","joker.sombrero.desc":"×1,3 en todas tus jugadas, pero cada jugada cuesta 2 de Cordura.","joker.sombrero.name":"El Sombrero del Crupier","joker.sonrisa.desc":"+30 fichas si la jugada contiene una pareja o mejor.","joker.sonrisa.name":"La Sonrisa Fija","joker.trapero.desc":"+1 mult por cada 40 de Deuda (máx. +10).","joker.trapero.name":"El Trapero","joker.ultima_oportunidad.desc":"+10 mult en tu última jugada de la ronda.","joker.ultima_oportunidad.name":"La Última Oportunidad","joker.ultimo_aliento.desc":"×3 si tu Salud está por debajo del 30 %.","joker.ultimo_aliento.name":"El Último Aliento","joker.vela_viuda.desc":"×1,5 si tu Cordura es menor de 40.","joker.vela_viuda.name":"La Vela de la Viuda","know.clue":"Pista sobre el Crupier","know.k_chair_founder.name":"El fundador","know.k_chair_founder.text":"El Hombre de la Silla fundó la casa y se quedó sentado.","know.k_child_self.name":"El niño eres tú","know.k_child_self.text":"El niño del vestido de cumpleaños fuiste tú. Su regla de «ojos ciegos» ya no te ciega.","know.k_cook_jars.name":"Los tarros","know.k_cook_jars.text":"El Cocinero conserva recuerdos en tarros y el Vendedor los vende. Sabes de dónde sale su hambre: ya no te exige de más.","know.k_dealer_deck.name":"La baraja del Crupier","know.k_dealer_deck.text":"El Crupier reparte siempre del fondo. Su baraja no tiene rey.","know.k_dealer_ledger.name":"El libro del Crupier","know.k_dealer_ledger.text":"En su libro de cuentas cada línea es una partida. Falta la última.","know.k_dealer_no_name.name":"El Crupier no tiene nombre","know.k_dealer_no_name.text":"Nadie recuerda cómo se llama el Crupier. Él tampoco.","know.k_door_same.name":"Todas las puertas son la misma","know.k_door_same.text":"Todas las puertas llevan a la misma sala. Hace falta saberlo para ver la verdad.","know.k_drowned_paid.name":"El Ahogado ya pagó","know.k_drowned_paid.text":"El Ahogado pagó su deuda con agua. Su regla de «ahogo» ya no te hunde.","know.k_girl_lies.name":"Lo que miente la chica","know.k_girl_lies.text":"La chica del ojo cosido miente cuando dice la verdad. Su regla de «sin repetir» ya no te ata.","know.k_moon.name":"La luna de la ventana","know.k_moon.text":"La luna de la ventana es un foco. Sin su frío, el Hombre de la Silla pierde su regla.","know.k_nun_name.name":"El nombre del Crupier","know.k_nun_name.text":"La Hermana sabe cómo se llamaba el Crupier y no lo dirá. Pero sabes que tuvo un nombre. Su castigo por repetir jugadas ya no te alcanza.","know.k_nurse_eye.name":"El ojo cosido","know.k_nurse_eye.text":"La Enfermera cosió el ojo de la Chica porque veía demasiado. Sabes qué ocultan sus mentiras, y los Ojos vuelven a servirte contra la Enfermera.","know.k_pianist_hands.name":"Las manos del Pianista","know.k_pianist_hands.text":"El Pianista pagó con las manos la primera baraja de la casa. La Archivista las guarda en un cajón que no se abre.","know.k_players.name":"Los jugadores","know.k_players.text":"Todos los que están aquí jugaron antes. Todos.","know.k_puppet_script.name":"El guion","know.k_puppet_script.text":"El Muñeco repite el guion del Crupier. Todo lo que se dice aquí está escrito; falta saber por quién.","know.k_reflection.name":"Tu reflejo","know.k_reflection.text":"En el espejo no eres tú quien se mueve primero.","know.k_room13.name":"La Habitación 13","know.k_room13.text":"Hay una habitación que no aparece en ningún plano.","know.k_watcher.name":"Alguien mira","know.k_watcher.text":"Hay alguien mirando la partida desde fuera de la casa.","legal.back":"VOLVER AL JUEGO","legal.lang":"Idioma","legal.privacy.s1.h":"1. Qué guarda el juego","legal.privacy.s1.t":"El juego guarda en el almacenamiento local de tu navegador tu partida y tus ajustes (idioma, volumen, accesibilidad). Estos datos permanecen en tu dispositivo: el juego no los envía a ningún servidor.\nPuedes borrarlos con REINICIAR PROGRESO en el menú o desde los ajustes de tu navegador. Si los borras, pierdes la partida.","legal.privacy.s2.h":"2. Sin servicios de terceros","legal.privacy.s2.t":"El juego no incluye publicidad ni analítica, no usa cookies y no carga recursos de otros sitios. No recoge datos personales.","legal.privacy.s3.h":"3. Alojamiento","legal.privacy.s3.t":"Como cualquier sitio web, el alojamiento donde se publica el juego (actualmente GitHub Pages) puede registrar datos técnicos de las visitas, como la dirección IP, según sus propias condiciones. El juego no recibe esos datos.","legal.privacy.s4.h":"4. Aviso de contenido","legal.privacy.s4.t":"THE HOUSE ALWAYS WATCHES es una obra de ficción de terror: los personajes, lugares y sucesos son imaginarios.\nEl dinero, las fichas, las apuestas y las deudas del juego son ficticios: no tienen valor real, no se compran ni se canjean por dinero real, y el juego no es un servicio de juego de azar.\nIncluye efectos de parpadeo y sacudidas, y distorsión visual cuando baja la Cordura. Puedes reducirlos en AJUSTES → Reducir efectos. Si tienes epilepsia fotosensible u otras molestias, consulta con un profesional antes de jugar.","legal.title.privacy":"Privacidad y aviso","legal.updated":"Última actualización: 2026-10-01","log.round_lost":"Has perdido la ronda. La casa cobra.","log.round_won":"Ronda ganada.","map.enter":"ENTRAR","map.info.event":"Algo te espera. No sabes qué.","map.info.merchant":"Un vendedor de cosas que no deberían venderse.","map.info.rest":"Un rincón para recuperar el aliento.","map.info.secret":"Una puerta de hueso que nadie más ve.","map.locked":"fuera de alcance","map.opp":"Rival: {name}","map.pick":"Elige tu próxima sala.","map.shotgun":"Duelo de la escopeta. Apuestas algo tuyo.","map.title":"Sala {n}/{total}","map.visited":"visitada","mem.m01.name":"El primer golpe","mem.m01.text":"Morir una vez te enseñó a llevar algo de dinero encima. +10 Dinero al empezar.","mem.m02.name":"Manos de repuesto","mem.m02.text":"Has aprendido a descartar sin dudar. +1 descarte por ronda.","mem.m03.name":"Cicatrices","mem.m03.text":"El cuerpo recuerda. +10 de Salud máxima.","mem.m04.name"
