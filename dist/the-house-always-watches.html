a con intereses.»","dlg.final.won":"«Has ganado la mano. La casa calla.»","door.hint":"Cada final pide algo distinto. Elige con cuidado.","door.open":"Disponible","door.req.crupier":"Requiere: 3 pistas sobre el Crupier.","door.req.deuda":"Siempre disponible.","door.req.espectador":"Requiere: «Alguien mira» y «Tu reflejo».","door.req.partida":"Requiere: «Los jugadores» y haber conocido a 5 personajes.","door.req.puerta":"Requiere: la Llave de hueso.","door.req.verdad":"Requiere: 5 finales vistos y «Todas las puertas son la misma».","door.seen":"Final ya visto","door.title":"La Puerta","duel.announce":"{name} anuncia: {n} de 6 cámaras cargadas.","duel.announce_note":"Puede estar mintiendo.","duel.anomaly":"«Esa no era la bala que esperaba.»","duel.chambers":"Cámaras","duel.contract.honest":"No mentía: la Deuda sube 20.","duel.contract.lied":"El contrato muerde: {name} pierde una marca.","duel.ev.f_shot_click":"{name} dispara. Clic.","duel.ev.f_shot_hit":"{name} dispara: pierdes una marca.","duel.ev.f_table_backfire":"La Mesa se vuelve contra {name}: pierde una marca.","duel.ev.f_table_safe":"{name} tienta a la Mesa. Nada.","duel.ev.p_shot_click":"Clic. La cámara estaba vacía.","duel.ev.p_shot_hit":"Disparas: {name} pierde una marca.","duel.ev.p_table_backfire":"La Mesa te devuelve la bala: pierdes una marca.","duel.ev.p_table_safe":"La Mesa calla. Sigues con el turno.","duel.ev.reload":"La escopeta se recarga.","duel.ev.skipped":"{name} olvida su turno.","duel.final":"LA ÚLTIMA BALA","duel.heard_empty":"Crees oír… vacío.","duel.heard_loaded":"Crees oír… una bala.","duel.listen":"ESCUCHAR (−{c} Cordura)","duel.lose":"«La casa cobra.»","duel.marks_foe":"Marcas del rival","duel.marks_you":"Tus marcas","duel.setup.note":"Si ganas: +10 Dinero extra. Si pierdes: −12 Salud además de la apuesta. Nadie te obliga a creer lo que anuncian.","duel.setup.sub":"¿Qué pones sobre la mesa?","duel.shoot_foe":"DISPARAR AL RIVAL","duel.shoot_table":"TENTAR A LA MESA","duel.stake.card.lose":"Si pierdes: pierdes una carta","duel.stake.card.name":"Una carta de tu mazo","duel.stake.card.win":"Si ganas: una carta especial","duel.stake.debt.lose":"Si pierdes: +{n} Deuda","duel.stake.debt.name":"{n} de Deuda","duel.stake.debt.win":"Si ganas: −60 Deuda","duel.stake.money.lose":"Si pierdes: −{n} Dinero","duel.stake.money.name":"{n} de Dinero","duel.stake.money.win":"Si ganas: +25 Dinero","duel.stake.sanity.lose":"Si pierdes: −{n} Cordura","duel.stake.sanity.name":"{n} de Cordura","duel.stake.sanity.win":"Si ganas: +8 Cordura","duel.title":"LA ESCOPETA","duel.tool.memory":"El rival olvidará su próximo turno.","duel.truth":"Testigo: había {n} balas reales.","duel.truth.honest":"Decía la verdad.","duel.truth.lied":"Te mintieron.","duel.turn_foe":"Turno del rival…","duel.turn_you":"Tu turno","duel.win":"«La casa paga.»","ending.crupier.epi":"Alguien se sienta por primera vez frente a ti. Sonríes sin mover la boca.","ending.crupier.text":"Le pides que se quite la sonrisa. Debajo no hay cara: hay un espejo con tu edad. «Gané hace tanto que olvidé cómo salir», dice. Te entrega el mazo y se sienta en tu silla. Ahora el que reparte eres tú.","ending.crupier.title":"El Crupier","ending.deuda.epi":"La Casa siempre gana. Pero hoy ha tardado más.","ending.deuda.text":"Juegas la última mano y ganas. La Casa anota la victoria en su libro y te devuelve una ficha negra. «Quedas a deber una partida», dice. Te levantas. La puerta sigue cerrada, pero ya sabes contar.","ending.deuda.title":"La Deuda","ending.espectador.epi":"Quien mira también está en la partida.","ending.espectador.text":"Miras hacia fuera de la sala, donde nadie debería mirar. Detrás del cristal hay una cara iluminada por una pantalla. Eres tú, o alguien que te ve jugar. Os observáis un segundo. Luego la casa baja el telón.","ending.espectador.title":"El Espectador","ending.first":"NUEVO FINAL","ending.memories":"Recuerdos ganados","ending.n":"FINAL {n} / {total}","ending.partida.epi":"Sin jugadores, la casa es solo una sala con luces.","ending.partida.text":"Los llamas por su nombre, uno a uno: la chica, el hombre de la silla, el ahogado, la archivista, el niño. Cada uno se levanta de su mesa. Nadie recordaba haber sido jugador. Dejan caer las cartas a la vez. La partida termina porque ya no queda nadie que quiera seguir.","ending.partida.title":"La Partida","ending.puerta.epi":"La puerta se cierra sola. Esta vez, del lado correcto.","ending.puerta.text":"La llave de hueso gira sin ruido. Detrás de la puerta hay un pasillo y, al final, otra puerta igual. La cruzas igualmente. Fuera hay aire de verdad y un cartel: CERRADO POR REFORMAS. Por primera vez, nadie te mira.","ending.puerta.title":"La Puerta","ending.to_menu":"VOLVER AL MENÚ","ending.true_hint":"Has visto cinco finales. Queda una puerta más.","ending.verdad.epi":"Gracias por jugar. Ya puedes dejar de mirar.","ending.verdad.text":"Has visto todos los finales. Sabes que todas las puertas son la misma y que el que mira eres tú. Cierras el libro de cuentas y escribes la última línea. La casa se apaga. No hay más partida: solo queda quien la jugó, y el silencio al otro lado de la pantalla.","ending.verdad.title":"La Verdad","event.archive_ledger.a":"Leer el libro","event.archive_ledger.b":"Cerrarlo","event.archive_ledger.ra":"Las columnas de cifras son partidas. Todas acaban en la misma puerta. Entiendes que no hay tantas puertas.","event.archive_ledger.rb":"«Sabia decisión», dice ella. «Aunque tampoco cambia nada.» Te da unas monedas por tu discreción.","event.archive_ledger.text":"Una mujer de gafas gruesas archiva libros de cuentas que gotean tinta. «Todos los nombres están aquí», dice. «Y todas las puertas son la misma.»","event.archive_ledger.title":"La Archivista","event.blood_vending.a":"Pagar con sangre","event.blood_vending.b":"Pasar de largo","event.blood_vending.ra":"La máquina zumba, satisfecha, y escupe una carta tibia.","event.blood_vending.rb":"La máquina se apaga con un suspiro. Por un instante pareció decepcionada.","event.blood_vending.text":"Una máquina expende cartas por un pinchazo en el dedo. Un cartel dice: «Sin cambio».","event.blood_vending.title":"La máquina de cartas","event.chair_bet.a":"Aceptar la apuesta","event.chair_bet.b":"Rechazarla","event.chair_bet.ra":"Tira los dados sin mirar. Los oyes rodar y detenerse justo cuando dejas de escuchar.","event.chair_bet.rb":"«Lo entiendo», murmura. «Yo también preferiría no levantarme.»","event.chair_bet.text":"El Hombre de la Silla no se levanta, y quizá no puede. «Apuesto la silla», dice con voz gastada. «Contra tu paciencia.»","event.chair_bet.title":"La silla","event.chair_secret.a":"Escucharlo","event.chair_secret.b":"Interrumpirlo","event.chair_secret.ra":"Habla durante horas, o segundos. Al final entiendes de quién es esa silla y por qué la guarda.","event.chair_secret.rb":"Se calla. La casa entera parece contener el aliento hasta que te alejas.","event.chair_secret.text":"«Esta casa la fundó un jugador cansado», dice el Hombre de la Silla. «Que se quedó esperando a los demás.» La silla cruje.","event.chair_secret.title":"El fundador","event.child_1.a":"«Sí»","event.child_1.b":"«No»","event.child_1.ra":"Asiente, satisfecho. «Yo también.» Te da un caramelo con sabor a metal.","event.child_1.rb":"«Mentiroso», dice sin rencor. De cerca, su cara se parece a una foto tuya de niño que nunca viste.","event.child_1.text":"Un niño con un vestido de cumpleaños te tira de la manga. «¿Ya perdiste otra vez?», pregunta. No es una pregunta.","event.child_1.title":"El niño","event.child_2.a":"Quedarte el dibujo","event.child_2.b":"Dejarlo","event.child_2.ra":"Doblas el papel. Pesa. En algún lugar de la casa, un pasillo ha girado para colocar una puerta nueva.","event.child_2.rb":"Se encoge de hombros y tacha la puerta. Al rato, la tiza vuelve a dibujarse sola.","event.child_2.text":"El niño dibuja una puerta con tiza roja y escribe encima un número: 13. «Está en el pasillo. Solo abre si sabes cuál.»","event.child_2.title":"El dibujo","event.confession_booth.a":"Confesarte","event.confession_booth.b":"Marcharte","event.confession_booth.h":"Preguntar por el libro","event.confession_booth.ra":"Hablas de más. Sales más ligero... y en algún libro, algo pesa un poco más.","event.confession_booth.rb":"Al alejarte oyes tu propia voz confesándose al otro lado.","event.confession_booth.rh":"«Una parte se puede borrar», susurra. «Pero hay que quererlo.» La deuda afloja.","event.confession_booth.text":"Un confesionario entre dos mesas. Del otro lado alguien respira despacio y espera a que hables primero.","event.confession_booth.title":"El confesionario","event.cracked_clock.a":"Darle cuerda","event.cracked_clock.b":"Dejarlo así","event.cracked_clock.ra":"Algo cruje dentro. El reloj se te queda en la mano, parado, y ya no sabes qué hora es.","event.cracked_clock.rb":"Es más seguro no tocar el tiempo aquí. Encuentras unas monedas bajo el péndulo.","event.cracked_clock.text":"Un reloj de pared marca siempre las 3:33. Si lo miras mucho, el segundero tiembla, como pidiendo algo.","event.cracked_clock.title":"El reloj parado","event.dealer_offer.a":"Firmar","event.dealer_offer.b":"Rechazar","event.dealer_offer.ra":"La tinta está caliente. El papel se pliega solo dentro de tu abrigo. Te sientes ligero, y vigilado.","event.dealer_offer.rb":"Recoge el contrato sin insistir. «La oferta caduca.» Te deja unas monedas por las molestias. Es peor así.","event.dealer_offer.text":"El Crupier desliza un contrato por la mesa. «Una firma y esa deuda desaparece.» La letra pequeña se mueve.","event.dealer_offer.title":"La oferta","event.dealer_question.a":"«Sí, lo recuerdo»","event.dealer_question.b":"«No lo recuerdo»","event.dealer_question.h":"Preguntar por la baraja","event.dealer_question.ra":"Anota algo. «Qué curioso. Nadie lo recuerda.» Te mira como si acabaras de mentirle a un espejo.","event.dealer_question.rb":"«Yo tampoco», admite, y por primera vez la baraja se detiene. Le preguntas su nombre. Calla. No tiene.","event.dealer_question.rh":"«Cuarenta cartas», dice, sin sorpresa. «Cuatro palos, diez cada uno. Y una que no está.» Sonríe.","event.dealer_question.text":"«¿Recuerdas cómo llegaste?», pregunta el Crupier, barajando sin mirar. «Antes de la primera mano.»","event.dealer_question.title":"Una pregunta","event.dealer_tea.a":"Beber","event.dealer_tea.b":"Rechazar la taza","event.dealer_tea.ra":"Está caliente, dulce y demasiado familiar. Dentro de la taza, grabado, tu nombre. Aun así estás mejor.","event.dealer_tea.rb":"Retira la taza sin ofenderse. «Cuando quieras.» Ambos sabéis que no es cortesía.","event.dealer_tea.text":"El Crupier sirve té en dos tazas idénticas. «Descansa un poco. La casa invita.» El vapor dibuja una cifra.","event.dealer_tea.title":"El té del Crupier","event.debt_collector.a":"Pagar una parte","event.debt_collector.b":"Negarte a pagar","event.debt_collector.ra":"Cuenta los billetes dos veces y anota algo. «Un placer.»","event.debt_collector.rb":"«Lo anotaré con intereses.» Se marcha sin hacer ruido. El frío se queda.","event.debt_collector.text":"Un hombre de traje gris te espera con un recibo. «Su deuda, señor. Lleva su firma.» No recuerdas haber firmado.","event.debt_collector.title":"El cobrador","event.dice_pit.a":"Tirar los dados","event.dice_pit.b":"Retirarte","event.dice_pit.ra":"Los dados ruedan y se detienen. La voz ya sabía el resultado.","event.dice_pit.rb":"La voz chasquea la lengua. «Otra vez será.» La oyes reír abajo.","event.dice_pit.text":"Un foso de arena con dados de hueso. Una voz sin cuerpo pregunta: «¿Cara o cruz?». Los dados no tienen caras. Ni cruces.","event.dice_pit.title":"El foso de los dados","event.drowned_pier.a":"Tenderle la mano","event.drowned_pier.b":"Alejarte","event.drowned_pier.ra":"Te agarra. Pesa, está helado, y susurra su pago: alguien lo hundió por una deuda que era tuya. Te deja un puñado de sal.","event.drowned_pier.rb":"Los golpes siguen a tu espalda, siempre a la misma distancia.","event.drowned_pier.text":"Un muelle de madera sin agua. Abajo, un hombre empapado hasta los huesos golpea el suelo con los nudillos, muy despacio.","event.drowned_pier.title":"El muelle seco","event.first_chip.a":"Aceptar la ficha","event.first_chip.b":"Dejarla rodar","event.first_chip.ra":"Pesa más de lo que parece. Algo, en un libro que no ves, acaba de anotarse.","event.first_chip.rb":"La ficha se pierde en la oscuridad. El Crupier asiente, como si lo hubiera esperado.","event.first_chip.text":"Una ficha negra rueda hasta tus pies. El Crupier sonríe sin mover la boca: «Es tuya. Siempre fue tuya.»","event.first_chip.title":"La ficha negra","event.girl_1.a":"Jugar a cara o cruz","event.girl_1.b":"Negarte","event.girl_1.ra":"La moneda gira demasiado tiempo. Cae, o no cae; ella ya ha apartado la vista.","event.girl_1.rb":"«Qué aburrido», dice, y guarda la moneda. Te sigue con el ojo bueno hasta perderte.","event.girl_1.text":"Una chica con un ojo cosido con hilo rojo hace girar una moneda. «Cara o cruz. Tú eliges. Yo miro.»","event.girl_1.title":"La Chica del Ojo Cosido","event.girl_2.a":"Creerla","event.girl_2.b":"Dudar de ella","event.girl_2.ra":"Le das las gracias. Aceptas su consejo y su dinero; ambos resultan falsos, aunque útiles.","event.girl_2.rb":"Sonríe con la boca torcida. «Listo.» Aprendes su gesto: miente cuando mira al suelo.","event.girl_2.text":"«Te lo aviso: la Casa no miente», dice la chica del ojo cosido. Lo dice mirando el suelo. Es la clase de frase que se dice mintiendo.","event.girl_2.title":"Lo que dice la chica","event.girl_3.a":"Aceptar el ojo","event.girl_3.b":"Rechazarlo","event.girl_3.ra":"Te lo colocas y ves más: las cartas, la sala, algo detrás de la sala. Ella se queda con el hilo.","event.girl_3.rb":"«Otra vez, entonces.» Cierra la mano, y el ojo, si era un ojo, desaparece.","event.girl_3.text":"La chica ofrece en la palma de la mano un ojo de cristal. «Este ve más. Cuesta más también.» El hilo rojo se ha soltado un poco.","event.girl_3.title":"El hilo rojo","event.merchant_memory.a":"Comprar un frasco","event.merchant_memory.b":"Rechazar","event.merchant_memory.ra":"Lo destapas y, de pronto, sabes jugar mejor una mano concreta. No sabes por qué.","event.merchant_memory.rb":"«Cuando quieras.» Se ofende un poco. Es el único vendedor que nunca da la espalda.","event.merchant_memory.text":"El Vendedor vende recuerdos en frascos. «Este huele a tu primer casino. Este otro, a tu última mano.»","event.merchant_memory.title":"Un recuerdo en venta","event.mirror_hall.a":"Tocar el cristal","event.mirror_hall.b":"Apartar la vista","event.mirror_hall.h":"Decirle tu nombre","event.mirror_hall.ra":"Está tibio, como una mano. Tu reflejo sonríe medio segundo antes que tú.","event.mirror_hall.rb":"Cuentas los pasos hasta la salida. Nadie te sigue. Nadie, salvo uno.","event.mirror_hall.rh":"El reflejo asiente. Por primera vez sientes que alguien de ese lado juega a tu favor.","event.mirror_hall.text":"Cada espejo te devuelve el gesto con un segundo de retraso. El último no te sigue: te mira.","event.mirror_hall.title":"El pasillo de espejos","event.moon_window.a":"Abrirla","event.moon_window.b":"Cerrarla","event.moon_window.ra":"El aire huele a cera. Sabes algo que antes no sabías: el Hombre de la Silla no soporta esta luz.","event.moon_window.rb":"La cierras despacio. Al otro lado del cristal algo golpea dos veces, con educación.","event.moon_window.text":"Una ventana sin pared muestra una luna enorme. En el resto del casino es de día.","event.moon_window.title":"La ventana","event.old_photograph.a":"Descolgarla","event.old_photograph.b":"Dejarla en su sitio","event.old_photograph.ra":"Detrás hay nombres. Muchos. Ninguno se repite... salvo el tuyo.","event.old_photograph.rb":"La dejas. Te sigues sintiendo observado, pero con cierta amabilidad. Casi.","event.old_photograph.text":"En la pared hay una foto de grupo: jugadores alrededor de esta mesa, de todas las épocas. En la última fila, tu cara.","event.old_photograph.title":"La fotografía","event.phone_call.a":"Contestar","event.phone_call.b":"Colgar sin oír","event.phone_call.ra":"Una respiración y, debajo, un rumor de aplausos lejanos. «¿Sigues ahí?», dice alguien que no está en la sala. «Nosotros sí.»","event.phone_call.rb":"El teléfono calla en cuanto lo tocas. Al colgar se oye un suspiro colectivo.","event.phone_call.text":"Un teléfono de baquelita suena en medio de la mesa. Es para ti. Siempre es para ti, a partir de la segunda vez.","event.phone_call.title":"El teléfono","event.room_13.a":"Entrar","event.room_13.b":"Cerrar la puerta","event.room_13.ra":"Dentro, el Niño espera con las cartas en las manos. «¿Ya perdiste otra vez?»","event.room_13.rb":"La cierras. La puerta se disuelve en la pared como si nunca hubiera estado.","event.room_13.text":"Al fondo del pasillo hay una puerta que no estaba: 13. Detrás, el sonido de un niño barajando, muy despacio.","event.room_13.title":"La Habitación 13","event.secret_bone_door.a":"Abrirla","event.secret_bone_door.b":"Registrar la sala","event.secret_bone_door.ra":"La llave de hueso ya estaba en tu bolsillo desde siempre. Detrás hay una sala sin salida y un aire que huele a aire de verdad.","event.secret_bone_door.rb":"Encuentras unas monedas junto a la puerta. La puerta espera.","event.secret_bone_door.text":"Una puerta hecha de huesos pequeños y pulidos. Tiene cerradura. Y tiene tu llave, aunque todavía no la has visto.","event.secret_bone_door.title":"La puerta de hueso","event.secret_stage.a":"Sentarte en tu butaca","event.secret_stage.b":"Quedarte de pie","event.secret_stage.ra":"Desde tu butaca ves una mesa, una baraja y una silla vacía. Entiendes que no eres el único que juega aquí. Ni el único que mira.","event.secret_stage.rb":"Prefieres seguir de pie. Un descanso corto, y un aire algo más ligero.","event.secret_stage.text":"Un escenario de casino con butacas vacías. Cada una lleva una placa con un nombre. Una lleva el tuyo. Otra, la del Crupier: está en blanco.","event.secret_stage.title":"El escenario vacío","event.secret_watcher.a":"Devolverle la mirada","event.secret_watcher.b":"Bajar la vista","event.secret_watcher.ra":"Te mira. Tú lo miras. Y por un instante sientes que alguien más os mira a ambos, desde fuera de la sala.","event.secret_watcher.rb":"Bajas la vista. El ojo del techo parece aliviado, como si temiera que lo miraran.","event.secret_watcher.text":"Una sala sin puertas con un ojo pintado en el techo. Nadie lo pintó. Parpadea cuando tú parpadeas.","event.secret_watcher.title":"El que mira","event.signed_receipt.a":"Leerlo entero","event.signed_receipt.b":"Romperlo","event.signed_receipt.ra":"Es una lista de partidas. Todas perdidas. Todas tuyas.","event.signed_receipt.rb":"Lo rompes en trozos. Al cerrar el puño vuelve a estar entero en tu bolsillo, pero más ligero.","event.signed_receipt.text":"Un recibo doblado cae de tu bolsillo. Lleva tu letra, una cantidad que no entiendes y la fecha de mañana.","event.signed_receipt.title":"El recibo firmado","event.wet_footprints.a":"Seguirlas","event.wet_footprints.b":"Ignorarlas","event.wet_footprints.ra":"Detrás de la puerta hay una mesa vacía y un puñado de fichas húmedas. Nadie las reclama.","event.wet_footprints.rb":"Prefieres no saber. El suelo, en cambio, sigue mojándose detrás de ti.","event.wet_footprints.text":"Huellas descalzas y mojadas cruzan la alfombra y se pierden bajo una puerta. Alguien acaba de pasar.","event.wet_footprints.title":"Huellas mojadas","event.woman_dress.a":"Tomar la carta","event.woman_dress.b":"Rechazarla","event.woman_dress.ra":"La carta se calienta. Al girarla ves a alguien que lloró mucho y no se arrepiente.","event.woman_dress.rb":"Guarda la carta sin insistir. Sabes que volverá a ofrecértela.","event.woman_dress.text":"Una mujer con un vestido rojo oscuro tiende una carta bocabajo. «Cuatro veces más de todo», dice. «Incluidas las deudas.»","event.woman_dress.title":"La Mujer de Rojo","finale.stage1":"LA ÚLTIMA MANO","finale.stage2":"LA ÚLTIMA BALA","fx.abandoned":"Abandonaste la sala a medias. La casa cobró algo.","fx.collapse":"Tu mente se quiebra: pierdes Salud y recuperas algo de Cordura.","fx.interest":"Interés de la deuda: +{n}","fx.revive_candle":"La vela corta te vuelve a encender.","fx.revive_life":"Una vida extra te arranca de la muerte.","hand.five":"Quintilla","hand.flush":"Color","hand.four":"Póker","hand.full":"Full","hand.high":"Carta alta","hand.pair":"Pareja","hand.sflush":"Escalera de color","hand.straight":"Escalera","hand.three":"Trío","hand.twopair":"Doble pareja","help.combos":"Combinaciones especiales","help.goal":"Llega al OBJETIVO de puntos antes de quedarte sin jugadas. Si no lo logras, la casa cobra.","help.hands":"Manos (fichas × mult)","help.score":"Cada jugada puntúa FICHAS × MULT. La mano (pareja, trío, escalera…) da la base; cada carta y cada combinación suman más. Mira siempre el coste antes de jugar.","help.stakes":"Apostar multiplica la jugada, pero cuesta Salud, Cordura, Dinero o Deuda. Algunas reglas las prohíben.","help.stakes_title":"Apuestas","help.suits":"Palos","help.tips":"Descarta cartas malas, guarda una en el Bolsillo para la jugada perfecta y cuida la Cordura: si baja, la pantalla se distorsiona y, si llega a 0, colapsas (+25 Cordura, −20 Salud).","help.tips_title":"Consejos","help.title":"Guía rápida","hint.boss":"Cada ala tiene un Guardián con reglas propias que cambian la partida. Léelas antes de jugar: vencerlo te acerca al final.","hint.event":"Aquí decides entre dos opciones: RECHAZAR (← o A) o ACEPTAR (→ o D). Lo que cambia —Salud, Cordura, Dinero o Deuda— lo verás después. Con Salud 0 mueres, con poca Cordura la casa se distorsiona y la Deuda crece con intereses.","hint.map":"Toca una sala para ver qué es y vuelve a tocarla para entrar. Si te pierdes, el botón ? de arriba te explica el juego cuando quieras.","hint.merchant":"Aquí todo se compra con Dinero. Y también se presta: los préstamos suman Deuda, y la Deuda crece con intereses tras cada sala.","hint.rest":"Un respiro: elige una sola cosa. Dormir recupera Salud, respirar recupera Cordura, pagar baja la Deuda y estudiar sube de nivel una mano.","howto.cards":"VER MANOS Y PALOS","howto.s1.h":"Objetivo","howto.s1.t":"Bajas por la casa sala a sala. En cada piso eliges tu camino en el mapa: juegas mesas de cartas, decides en sucesos y, a veces, te juegas algo en el duelo de la escopeta. Cada ala termina con un Guardián; después llegan el Crupier, su última mano y La Puerta.\nMorir no es el final: conservas recuerdos y conocimiento, y vuelves a bajar.","howto.s2.h":"El mapa","howto.s2.t":"Cada sala es un nodo. Toca uno para ver qué es y vuelve a tocarlo (o pulsa ENTRAR) para entrar. Solo puedes ir a las salas conectadas con la tuya.\nHay mesas de cartas, sucesos, el Vendedor, descansos, la escopeta (duelo en el que apuestas algo tuyo), una puerta de hueso secreta y el Guardián.","howto.s3.h":"Tus recursos","howto.s3.t":"• Salud: si llega a 0, mueres. Una vela extra te levanta una vez, con el 40 % de Salud.\n• Cordura: baja con cartas, apuestas y sucesos. Con poca, la pantalla se distorsiona y aparecen susurros; si llega a 0, colapsas: recuperas 25 de Cordura y pierdes 20 de Salud.\n• Dinero: sirve para comprar en la tienda y para pagar deuda.\n• Deuda: sube con préstamos y apuestas, y tras cada sala se le suma un 3 % de interés. Con mucha deuda, la Casa sube el objetivo de las mesas un 5 % por cada 100 por encima de 200 (hasta un 25 %).\n• Escudo: absorbe el coste en Salud de las cartas.","howto.s4.h":"Mesas de cartas","howto.s4.t":"Elige de 1 a 5 cartas de tu mano y juega: la mano (pareja, trío, escalera…) da fichas × multiplicador, y cada carta y combinación suma más. Llega al objetivo antes de quedarte sin jugadas; si no, pagas con Salud, Cordura y Deuda.\nPuedes descartar, guardar una carta en el Bolsillo o apostar (multiplica la jugada, pero cuesta). Cada rival trae una regla propia, visible en la mesa. Mira siempre el coste antes de jugar.","howto.s5.h":"Sucesos","howto.s5.t":"Son decisiones de dos opciones: RECHAZAR (← o A) o ACEPTAR (→ o D); en el móvil, desliza. A veces aparece una tercera opción oculta (H), según lo que sepas o lleves encima. Lo que cambia tu decisión se muestra al terminar, y algunas herramientas permiten rehacerla.","howto.s6.h":"Duelo de la escopeta","howto.s6.t":"Apuestas algo tuyo (Dinero, Cordura, Deuda o una carta). La escopeta tiene 6 cámaras, algunas cargadas. El rival anuncia cuántas balas hay… y puede mentir.\nEn tu turno puedes disparar al rival (si la cámara está cargada, pierde una marca; si no, pasa el turno), tentar a la Mesa (si está vacía conservas el turno; si no, pierdes una marca) o escuchar (cuesta Cordura y no siempre acierta). Gana quien deje al otro sin marcas.","howto.s7.h":"Tienda y descanso","howto.s7.t":"El Vendedor vende objetos, herramientas y cartas a cambio de Dinero, y también presta: los préstamos suman Deuda.\nEn un descanso eliges una sola cosa: dormir (Salud), respirar (Cordura), pagar deuda o estudiar una mano para subirla de nivel.","howto.s8.h":"Morir y recordar","howto.s8.t":"Al morir ves tu DEUDA ACTUAL (una parte se arrastra a la siguiente bajada) y los RECUERDOS CONSERVADOS: ventajas permanentes que se ganan al hacer ciertas cosas. Lo que descubres se guarda como conocimiento y abre opciones ocultas y puertas.\nHay 6 finales; La Puerta pide cosas distintas para cada uno.","howto.title":"Cómo se juega","hud.debt":"Deuda","hud.deck":"Mazo","hud.health":"Salud","hud.howto":"Cómo se juega","hud.inventory":"Inventario","hud.items":"Objetos","hud.levels":"Niveles de mano","hud.lives":"Velas","hud.money":"Dinero","hud.no_items":"Nada todavía.","hud.sanity":"Cordura","hud.settings":"Ajustes","hud.tools":"Herramientas","intro.1":"¿Estás despierto?","intro.2":"Por fin.","intro.3":"Tenemos que terminar una partida.","intro.4":"¿Qué partida?","intro.5":"La anterior.","intro.6":"Siéntate. Te enseñaré cómo se juega aquí.","item.campanilla.desc":"+1 descarte por ronda.","item.campanilla.name":"Campanilla","item.ceniza.desc":"+15 fichas por jugada. −2 Cordura al terminar cada sala.","item.ceniza.name":"Ceniza","item.cuchilla_oxidada.desc":"La Sangre da +1 mult más, pero cuesta +1 de Salud.","item.cuchilla_oxidada.name":"Cuchilla oxidada","item.diente_leche.desc":"Los Dientes crecen +1 más por jugada.","item.diente_leche.name":"Diente de leche","item.espejo_roto.desc":"+2 mult. Empiezas con −2 de Cordura. Puedes rehacer una decisión por partida (−5 Cordura).","item.espejo_roto.name":"Espejo roto","item.ficha_negra.desc":"Las apuestas multiplican +0,15 más. Puedes deshacer una decisión pagando 50 de Deuda.","item.ficha_negra.name":"Ficha negra","item.guante_crupier.desc":"+1 jugada por ronda.","item.guante_crupier.name":"Guante del Crupier","item.libro_cuentas.desc":"El interés de la deuda se reduce a la mitad.","item.libro_cuentas.name":"Libro de cuentas","item.llave_hueso.desc":"Escudo inicial de 4. Abre la puerta oculta. Permite el final de la Puerta.","item.llave_hueso.name":"Llave de hueso","item.moneda_mordida.desc":"+5 de Dinero por ronda ganada. Las cartas Doradas dan +2 más.","item.moneda_mordida.name":"Moneda mordida","item.ojo_vidrio.desc":"+1 carta en mano. La Niebla no te afecta.","item.ojo_vidrio.name":"Ojo de vidrio","item.reloj_parado.desc":"Los objetivos bajan un 8%. La deuda crece un 50% más rápido.","item.reloj_parado.name":"Reloj parado","know.clue":"Pista sobre el Crupier","know.k_chair_founder.name":"El fundador","know.k_chair_founder.text":"El Hombre de la Silla fundó la casa y se quedó sentado.","know.k_child_self.name":"El niño eres tú","know.k_child_self.text":"El niño del vestido de cumpleaños fuiste tú. Su regla de «ojos ciegos» ya no te ciega.","know.k_dealer_deck.name":"La baraja del Crupier","know.k_dealer_deck.text":"El Crupier reparte siempre del fondo. Su baraja no tiene rey.","know.k_dealer_ledger.name":"El libro del Crupier","know.k_dealer_ledger.text":"En su libro de cuentas cada línea es una partida. Falta la última.","know.k_dealer_no_name.name":"El Crupier no tiene nombre","know.k_dealer_no_name.text":"Nadie recuerda cómo se llama el Crupier. Él tampoco.","know.k_door_same.name":"Todas las puertas son la misma","know.k_door_same.text":"Todas las puertas llevan a la misma sala. Hace falta saberlo para ver la verdad.","know.k_drowned_paid.name":"El Ahogado ya pagó","know.k_drowned_paid.text":"El Ahogado pagó su deuda con agua. Su regla de «ahogo» ya no te hunde.","know.k_girl_lies.name":"Lo que miente la chica","know.k_girl_lies.text":"La chica del ojo cosido miente cuando dice la verdad. Su regla de «sin repetir» ya no te ata.","know.k_moon.name":"La luna de la ventana","know.k_moon.text":"La luna de la ventana es un foco. Sin su frío, el Hombre de la Silla pierde su regla.","know.k_players.name":"Los jugadores","know.k_players.text":"Todos los que están aquí jugaron antes. Todos.","know.k_reflection.name":"Tu reflejo","know.k_reflection.text":"En el espejo no eres tú quien se mueve primero.","know.k_room13.name":"La Habitación 13","know.k_room13.text":"Hay una habitación que no aparece en ningún plano.","know.k_watcher.name":"Alguien mira","know.k_watcher.text":"Hay alguien mirando la partida desde fuera de la casa.","legal.back":"VOLVER AL JUEGO","legal.lang":"Idioma","legal.privacy.s1.h":"1. Qué guarda el juego","legal.privacy.s1.t":"El juego guarda en el almacenamiento local de tu navegador tu partida y tus ajustes (idioma, volumen, accesibilidad). Estos datos permanecen en tu dispositivo: el juego no los envía a ningún servidor.\nPuedes borrarlos con REINICIAR PROGRESO en el menú o desde los ajustes de tu navegador. Si los borras, pierdes la partida.","legal.privacy.s2.h":"2. Sin servicios de terceros","legal.privacy.s2.t":"El juego no incluye publicidad ni analítica, no usa cookies y no carga recursos de otros sitios. No recoge datos personales.","legal.privacy.s3.h":"3. Alojamiento","legal.privacy.s3.t":"Como cualquier sitio web, el alojamiento donde se publica el juego (actualmente GitHub Pages) puede registrar datos técnicos de las visitas, como la dirección IP, según sus propias condiciones. El juego no recibe esos datos.","legal.privacy.s4.h":"4. Aviso de contenido","legal.privacy.s4.t":"THE HOUSE ALWAYS WATCHES es una obra de ficción de terror: los personajes, lugares y sucesos son imaginarios.\nEl dinero, las fichas, las apuestas y las deudas del juego son ficticios: no tienen valor real, no se compran ni se canjean por dinero real, y el juego no es un servicio de juego de azar.\nIncluye efectos de parpadeo y sacudidas, y distorsión visual cuando baja la Cordura. Puedes reducirlos en AJUSTES → Reducir efectos. Si tienes epilepsia fotosensible u otras molestias, consulta con un profesional antes de jugar.","legal.title.privacy":"Privacidad y aviso","legal.updated":"Última actualización: 2026-10-01","log.round_lost":"Has perdido la ronda. La casa cobra.","log.round_won":"Ronda ganada.","map.enter":"ENTRAR","map.info.event":"Algo te espera. No sabes qué.","map.info.merchant":"Un vendedor de cosas que no deberían venderse.","map.info.rest":"Un rincón para recuperar el aliento.","map.info.secret":"Una puerta de hueso que nadie más ve.","map.locked":"fuera de alcance","map.opp":"Rival: {name}","map.pick":"Elige tu próxima sala.","map.shotgun":"Duelo de la escopeta. Apuestas algo tuyo.","map.title":"Sala {n}/{total}","map.visited":"visitada","mem.m01.name":"El primer golpe","mem.m01.text":"Morir una vez te enseñó a llevar algo de dinero encima. +10 Dinero al empezar.","mem.m02.name":"Manos de repuesto","mem.m02.text":"Has aprendido a descartar sin dudar. +1 descarte por ronda.","mem.m03.name":"Cicatrices","mem.m03.text":"El cuerpo recuerda. +10 de Salud máxima.","mem.m04.name":"La moneda de la chica","mem.m04.text":"Empiezas con Pareja a nivel 1.","mem.m05.name":"La sal de la silla","mem.m05.text":"Empiezas con una Sal.","mem.m06.name":"Aire bajo el agua","mem.m06.text":"Recuperas 3 de Cordura al ganar una AN","boss.weakened":"weakened","card.base":"{rank} of {suit}","card.carta_doble.desc":"Repeats the effect of the card scored just before it.","card.carta_doble.name":"Double Card","card.colmillo.desc":"+8 chips. Grows +2 each time it scores (max +40).","card.colmillo.name":"Fang","card.corazon.desc":"+2 mult. Heal 2 Health.","card.corazon.name":"Heart","card.cursed":"Cursed","card.dado_trucado.desc":"+6 chips. Suit wild.","card.dado_trucado.name":"Loaded Die","card.el_ahogado.desc":"+40 chips (+80 if your Sanity is below 40). −4 Sanity.","card.el_ahogado.name":"The Drowned Man","card.el_hambre.desc":"+6 mult. Costs 3 Health.","card.el_hambre.name":"The Hunger","card.hueso_liso.desc":"+20 chips.","card.hueso_liso.name":"Smooth Bone","card.la_deuda.desc":"Chips = Debt ÷ 6 (max 90). +10 Debt.","card.la_deuda.name":"The Debt","card.la_mujer.desc":"Total wild. ×4 when scoring. +25 Debt and −6 Sanity.","card.la_mujer.name":"The Woman in Red","card.la_septima.desc":"+7 chips. Multiplies ×(1 + 0.5 per death), max ×5.","card.la_septima.name":"The Seventh","card.llave_maestra.desc":"+10 chips and +4 Shield.","card.llave_maestra.name":"Master Key","card.moneda_gemela.desc":"+4 chips. Earn 4 Money.","card.moneda_gemela.name":"Twin Coin","card.ojo_vigia.desc":"+12 chips. Reveals 3 cards of the deck.","card.ojo_vigia.name":"Watchful Eye","card.sangre_pacto.desc":"+3 mult. Costs 2 Health.","card.sangre_pacto.name":"Blood Pact","card.sombra.desc":"+5 chips. Rank wild. +1 Shield.","card.sombra.name":"Shadow","char.archivist":"The Archivist","char.chair":"The Man in the Chair","char.child":"The Child","char.dealer":"The Dealer","char.drowned":"The Drowned Man","char.girl":"The Girl with the Stitched Eye","char.merchant":"The Vendor","char.unknown":"???","char.woman":"The Woman in Red","combo.arcoiris.desc":"All 4 suits in the play: +8 mult and earn 5 Money.","combo.arcoiris.name":"THE FOUR SUITS","combo.cerradura.desc":"3 or more Keys: +20 chips and +4 Shield.","combo.cerradura.name" “You lost the last hand. The house collects with interest.”","dlg.final.won":"“You won the hand. The house falls silent.”","door.hint":"Each ending asks for something different. Choose carefully.","door.open":"Available","door.req.crupier":"Requires: 3 clues about the Dealer.","door.req.deuda":"Always available.","door.req.espectador":"Requires: “Someone is watching” and “Your reflection”.","door.req.partida":"Requires: “The players” and having met 5 characters.","door.req.puerta":"Requires: the Bone key.","door.req.verdad":"Requires: 5 endings seen and “All the doors are the same”.","door.seen":"Ending already seen","door.title":"The Door","duel.announce":"{name} announces: {n} of 6 chambers loaded.","duel.announce_note":"It may be lying.","duel.anomaly":"“That was not the bullet I expected.”","duel.chambers":"Chambers","duel.contract.honest":"It wasn’t lying: Debt rises by 20.","duel.contract.lied":"The contract bites: {name} loses a mark.","duel.ev.f_shot_click":"{name} shoots. Click.","duel.ev.f_shot_hit":"{name} shoots: you lose a mark.","duel.ev.f_table_backfire":"The Table turns on {name}: it loses a mark.","duel.ev.f_table_safe":"{name} tempts the Table. Nothing.","duel.ev.p_shot_click":"Click. The chamber was empty.","duel.ev.p_shot_hit":"You shoot: {name} loses a mark.","duel.ev.p_table_backfire":"The Table sends the bullet back: you lose a mark.","duel.ev.p_table_safe":"The Table stays silent. You keep your turn.","duel.ev.reload":"The shotgun reloads.","duel.ev.skipped":"{name} forgets its turn.","duel.final":"THE LAST BULLET","duel.heard_empty":"You think you hear… nothing.","duel.heard_loaded":"You think you hear… a bullet.","duel.listen":"LISTEN (−{c} Sanity)","duel.lose":"“The house collects.”","duel.marks_foe":"Foe’s marks","duel.marks_you":"Your marks","duel.setup.note":"If you win: +10 extra Money. If you lose: −12 Health on top of the stake. Nobody makes you believe what they announce.","duel.setup.sub":"What do you put on the table?","duel.shoot_foe":"SHOOT THE FOE","duel.shoot_table":"TEMPT THE TABLE","duel.stake.card.lose":"If you lose: you lose a card","duel.stake.card.name":"A card from your deck","duel.stake.card.win":"If you win: a special card","duel.stake.debt.lose":"If you lose: +{n} Debt","duel.stake.debt.name":"{n} Debt","duel.stake.debt.win":"If you win: −60 Debt","duel.stake.money.lose":"If you lose: −{n} Money","duel.stake.money.name":"{n} Money","duel.stake.money.win":"If you win: +25 Money","duel.stake.sanity.lose":"If you lose: −{n} Sanity","duel.stake.sanity.name":"{n} Sanity","duel.stake.sanity.win":"If you win: +8 Sanity","duel.title":"THE SHOTGUN","duel.tool.memory":"The foe will forget its next turn.","duel.truth":"Witness: there were {n} real bullets.","duel.truth.honest":"It told the truth.","duel.truth.lied":"You were lied to.","duel.turn_foe":"Foe’s turn…","duel.turn_you":"Your turn","duel.win":"“The house pays.”","ending.crupier.epi":"Someone sits across from you for the first time. You smile without moving your mouth.","ending.crupier.text":"You ask him to take off the smile. Beneath it there is no face: only a mirror showing your age. “I won so long ago I forgot how to leave,” he says. He hands you the deck and sits in your chair. Now you are the one who deals.","ending.crupier.title":"The Dealer","ending.deuda.epi":"The House always wins. But today it took longer.","ending.deuda.text":"You play the last hand and win. The House writes the win in its ledger and hands you back a black chip. “You still owe me a game,” it says. You stand. The door stays shut, but now you can count.","ending.deuda.title":"The Debt","ending.espectador.epi":"Whoever watches is also in the game.","ending.espectador.text":"You look out of the room, where nobody should look. Behind the glass there is a face lit by a screen. It is you, or someone watching you play. You study each other for a second. Then the house lowers the curtain.","ending.espectador.title":"The Spectator","ending.first":"NEW ENDING","ending.memories":"Memories gained","ending.n":"ENDING {n} / {total}","ending.partida.epi":"Without players, the house is just a room with lights.","ending.partida.text":"You call them by name, one by one: the girl, the man in the chair, the drowned man, the archivist, the child. Each rises from their table. Nobody remembered being a player. They drop their cards all at once. The game ends because nobody is left who wants to go on.","ending.partida.title":"The Game","ending.puerta.epi":"The door closes by itself. This time, on the right side.","ending.puerta.text":"The bone key turns without a sound. Behind the door is a corridor and, at its end, another identical door. You cross it anyway. Outside there is real air and a sign: CLOSED FOR RENOVATION. For the first time, nobody is watching you.","ending.puerta.title":"The Door","ending.to_menu":"BACK TO MENU","ending.true_hint":"You have seen five endings. One more door remains.","ending.verdad.epi":"Thank you for playing. You can stop watching now.","ending.verdad.text":"You have seen every ending. You know all the doors are the same and that the one watching is you. You close the ledger and write the last line. The house goes dark. There is no more game: only the one who played it, and the silence on the other side of the screen.","ending.verdad.title":"The Truth","event.archive_ledger.a":"Read the ledger","event.archive_ledger.b":"Close it","event.archive_ledger.ra":"The columns of figures are games. All end at the same door. You understand there aren’t so many doors.","event.archive_ledger.rb":"“Wise choice,” she says. “Though it changes nothing.” She gives you a few coins for your discretion.","event.archive_ledger.text":"A woman in thick glasses files ledgers that drip ink. “Every name is here,” she says. “And every door is the same.”","event.archive_ledger.title":"The Archivist","event.blood_vending.a":"Pay in blood","event.blood_vending.b":"Walk past","event.blood_vending.ra":"The machine hums, satisfied, and spits out a warm card.","event.blood_vending.rb":"The machine powers down with a sigh. For a moment it seemed disappointed.","event.blood_vending.text":"A machine dispenses cards for a pinprick on the finger. A sign reads: “No change given.”","event.blood_vending.title":"The card machine","event.chair_bet.a":"Take the bet","event.chair_bet.b":"Decline","event.chair_bet.ra":"He throws the dice without looking. You hear them roll and stop just as you stop listening.","event.chair_bet.rb":"“I understand,” he murmurs. “I would rather not get up, either.”","event.chair_bet.text":"The Man in the Chair does not stand, and perhaps cannot. “I bet the chair,” he says in a worn voice. “Against your patience.”","event.chair_bet.title":"The chair","event.chair_secret.a":"Listen","event.chair_secret.b":"Interrupt him","event.chair_secret.ra":"He speaks for hours, or seconds. In the end you understand whose chair it is and why he guards it.","event.chair_secret.rb":"He falls silent. The whole house seems to hold its breath until you walk away.","event.chair_secret.text":"“This house was founded by a tired player,” says the Man in the Chair. “Who stayed to wait for the others.” The chair creaks.","event.chair_secret.title":"The founder","event.child_1.a":"“Yes”","event.child_1.b":"“No”","event.child_1.ra":"It nods, satisfied. “Me too.” It hands you a candy that tastes of metal.","event.child_1.rb":"“Liar,” it says without malice. Up close its face resembles a childhood photo of you that you never saw.","event.child_1.text":"A child in a birthday dress tugs your sleeve. “Did you lose again?” it asks. It isn’t a question.","event.child_1.title":"The child","event.child_2.a":"Keep the drawing","event.child_2.b":"Leave it","event.child_2.ra":"You fold the paper. It is heavy. Somewhere in the house a corridor has turned to make room for a new door.","event.child_2.rb":"It shrugs and crosses out the door. A moment later the chalk redraws it by itself.","event.child_2.text":"The child draws a door in red chalk and writes a number above it: 13. “It’s in the corridor. It only opens if you know which.”","event.child_2.title":"The drawing","event.confession_booth.a":"Confess","event.confession_booth.b":"Walk away","event.confession_booth.h":"Ask about the ledger","event.confession_booth.ra":"You say too much. You leave lighter... and somewhere in a ledger, something weighs a little more.","event.confession_booth.rb":"As you walk away you hear your own voice confessing on the other side.","event.confession_booth.rh":"“Part of it can be erased,” it whispers. “But you have to want it.” The debt loosens.","event.confession_booth.text":"A confessional between two tables. On the other side someone breathes slowly and waits for you to speak first.","event.confession_booth.title":"The confessional","event.cracked_clock.a":"Wind it","event.cracked_clock.b":"Leave it","event.cracked_clock.ra":"Something creaks inside. The clock stays in your hand, stopped, and you no longer know what time it is.","event.cracked_clock.rb":"It is safer not to touch time here. You find a few coins under the pendulum.","event.cracked_clock.text":"A wall clock always reads 3:33. If you stare at it, the second hand trembles, as if asking for something.","event.cracked_clock.title":"The stopped clock","event.dealer_offer.a":"Sign","event.dealer_offer.b":"Refuse","event.dealer_offer.ra":"The ink is warm. The paper folds itself inside your coat. You feel light, and watched.","event.dealer_offer.rb":"He takes the contract back without pressing. “The offer expires.” He leaves you a few coins for the trouble. That is worse.","event.dealer_offer.text":"The Dealer slides a contract across the table. “One signature and that debt disappears.” The small print moves.","event.dealer_offer.title":"The offer","event.dealer_question.a":"“Yes, I remember”","event.dealer_question.b":"“I don’t remember”","event.dealer_question.h":"Ask about the deck","event.dealer_question.ra":"He writes something down. “How curious. Nobody remembers.” He looks at you as if you had just lied to a mirror.","event.dealer_question.rb":"“Neither do I,” he admits, and for the first time the deck stops. You ask his name. He is silent. He has none.","event.dealer_question.rh":"“Forty cards,” he says, unsurprised. “Four suits, ten each. And one that isn’t there.” He smiles.","event.dealer_question.text":"“Do you remember how you got here?” asks the Dealer, shuffling without looking. “Before the first hand.”","event.dealer_question.title":"A question","event.dealer_tea.a":"Drink","event.dealer_tea.b":"Refuse the cup","event.dealer_tea.ra":"Warm, sweet, far too familiar. Inside the cup, engraved, your name. You feel better anyway.","event.dealer_tea.rb":"He withdraws the cup, unoffended. “Whenever you like.” You both know it isn’t politeness.","event.dealer_tea.text":"The Dealer pours tea into two identical cups. “Rest a little. The house is paying.” The steam draws a number.","event.dealer_tea.title":"The Dealer’s tea","event.debt_collector.a":"Pay part of it","event.debt_collector.b":"Refuse to pay","event.debt_collector.ra":"He counts the bills twice and writes something down. “A pleasure.”","event.debt_collector.rb":"“I shall note it with interest.” He leaves without a sound. The cold stays.","event.debt_collector.text":"A man in a grey suit waits with a receipt. “Your debt, sir. It bears your signature.” You don’t remember signing.","event.debt_collector.title":"The collector","event.dice_pit.a":"Roll the dice","event.dice_pit.b":"Back away","event.dice_pit.ra":"The dice roll and stop. The voice already knew the result.","event.dice_pit.rb":"The voice clicks its tongue. “Another time.” You hear it laughing below.","event.dice_pit.text":"A sand pit with bone dice. A bodiless voice asks: “Heads or tails?” The dice have neither.","event.dice_pit.title":"The dice pit","event.drowned_pier.a":"Reach out a hand","event.drowned_pier.b":"Walk away","event.drowned_pier.ra":"He grips you. Heavy, freezing, he whispers his payment: someone sank him over a debt that was yours. He leaves you a handful of salt.","event.drowned_pier.rb":"The knocking follows behind you, always at the same distance.","event.drowned_pier.text":"A wooden pier with no water. Below, a man soaked to the bone knocks on the floor with his knuckles, very slowly.","event.drowned_pier.title":"The dry pier","event.first_chip.a":"Take the chip","event.first_chip.b":"Let it roll away","event.first_chip.ra":"It weighs more than it looks. Something in a book you cannot see has just been written down.","event.first_chip.rb":"The chip vanishes into the dark. The Dealer nods, as if he had expected it.","event.first_chip.text":"A black chip rolls to your feet. The Dealer smiles without moving his mouth: “It’s yours. It always was.”","event.first_chip.title":"The black chip","event.girl_1.a":"Play heads or tails","event.girl_1.b":"Decline","event.girl_1.ra":"The coin spins far too long. It lands, or it doesn’t; she has already looked away.","event.girl_1.rb":"“How dull,” she says, pocketing the coin. She follows you with her good eye until you are gone.","event.girl_1.text":"A girl with one eye sewn shut with red thread spins a coin. “Heads or tails. You choose. I watch.”","event.girl_1.title":"The Girl with the Stitched Eye","event.girl_2.a":"Believe her","event.girl_2.b":"Doubt her","event.girl_2.ra":"You thank her. You accept her advice and her money; both turn out false, though useful.","event.girl_2.rb":"She smiles crookedly. “Clever.” You learn her tell: she lies when she looks at the floor.","event.girl_2.text":"“I’m warning you: the House doesn’t lie,” says the girl with the stitched eye. She says it staring at the floor. It is the kind of sentence said while lying.","event.girl_2.title":"What the girl says","event.girl_3.a":"Accept the eye","event.girl_3.b":"Refuse it","event.girl_3.ra":"You put it in and see more: the cards, the room, something behind the room. She keeps the thread.","event.girl_3.rb":"“Another time, then.” She closes her hand, and the eye, if it was an eye, is gone.","event.girl_3.text":"The girl offers a glass eye on her open palm. “This one sees more. It costs more, too.” The red thread has come loose a little.","event.girl_3.title":"The red thread","event.merchant_memory.a":"Buy a jar","event.merchant_memory.b":"Decline","event.merchant_memory.ra":"You uncork it and suddenly you play one hand better. You don’t know why.","event.merchant_memory.rb":"“Whenever you like.” He is slightly offended. He is the only merchant who never turns his back.","event.merchant_memory.text":"The Peddler sells memories in jars. “This one smells like your first casino. That one, like your last hand.”","event.merchant_memory.title":"A memory for sale","event.mirror_hall.a":"Touch the glass","event.mirror_hall.b":"Look away","event.mirror_hall.h":"Say your name to it","event.mirror_hall.ra":"It is warm, like a hand. Your reflection smiles half a second before you do.","event.mirror_hall.rb":"You count the steps to the exit. Nobody follows you. Nobody, except one.","event.mirror_hall.rh":"The reflection nods. For the first time you feel that someone on that side plays in your favor.","event.mirror_hall.text":"Every mirror returns your gesture a second late. The last one does not follow you: it watches you.","event.mirror_hall.title":"The hall of mirrors","event.moon_window.a":"Open it","event.moon_window.b":"Close it","event.moon_window.ra":"The air smells of wax. You know something you didn’t: the Man in the Chair cannot bear this light.","event.moon_window.rb":"You close it slowly. On the other side of the glass something knocks twice, politely.","event.moon_window.text":"A wall-less window shows an enormous moon. In the rest of the casino it is daytime.","event.moon_window.title":"The window","event.old_photograph.a":"Take it down","event.old_photograph.b":"Leave it","event.old_photograph.ra":"Behind it there are names. Many. None repeats... except yours.","event.old_photograph.rb":"You leave it. You still feel watched, but with a certain kindness. Almost.","event.old_photograph.text":"A group photo hangs on the wall: players around this table, from every era. In the back row, your face.","event.old_photograph.title":"The photograph","event.phone_call.a":"Answer","event.phone_call.b":"Hang up unheard","event.phone_call.ra":"A breath and, beneath it, a murmur of distant applause. “Are you still there?” says someone who isn’t in the room. “We are.”","event.phone_call.rb":"The phone falls silent the moment you touch it. As you hang up, a collective sigh is heard.","event.phone_call.text":"A bakelite phone rings in the middle of the table. It’s for you. It’s always for you, from the second time on.","event.phone_call.title":"The telephone","event.room_13.a":"Enter","event.room_13.b":"Shut the door","event.room_13.ra":"Inside, the Child waits with the cards in its hands. “Did you lose again?”","event.room_13.rb":"You shut it. The door dissolves into the wall as if it had never been there.","event.room_13.text":"At the end of the corridor stands a door that wasn’t there: 13. Behind it, the sound of a child shuffling, very slowly.","event.room_13.title":"Room 13","event.secret_bone_door.a":"Open it","event.secret_bone_door.b":"Search the room","event.secret_bone_door.ra":"The bone key was in your pocket all along. Behind the door: a room with no exit and air that smells like real air.","event.secret_bone_door.rb":"You find a few coins by the door. The door waits.","event.secret_bone_door.text":"A door made of small, polished bones. It has a lock. And it has your key, though you haven’t seen it yet.","event.secret_bone_door.title":"The bone door","event.secret_stage.a":"Sit in your seat","event.secret_stage.b":"Remain standing","event.secret_stage.ra":"From your seat you see a table, a deck and an empty chair. You understand you are not the only one playing here. Nor the only one watching.","event.secret_stage.rb":"You prefer to remain standing. A short rest, and slightly lighter air.","event.secret_stage.text":"A casino stage with empty seats. Each one bears a name plate. One bears yours. Another, the Dealer’s: it is blank.","event.secret_stage.title":"The empty stage","event.secret_watcher.a":"Stare back","event.secret_watcher.b":"Look down","event.secret_watcher.ra":"It looks at you. You look at it. And for a moment you feel that someone else is watching you both, from outside the room.","event.secret_watcher.rb":"You look down. The eye on the ceiling seems relieved, as if it feared being looked at.","event.secret_watcher.text":"A room without doors with an eye painted on the ceiling. Nobody painted it. It blinks when you blink.","event.secret_watcher.title":"The one who watches","event.signed_receipt.a":"Read it all","event.signed_receipt.b":"Tear it up","event.signed_receipt.ra":"It is a list of games. All lost. All yours.","event.signed_receipt.rb":"You tear it to pieces. When you close your fist it is whole again in your pocket, but lighter.","event.signed_receipt.text":"A folded receipt falls from your pocket. It has your handwriting, an amount you don’t understand, and tomorrow’s date.","event.signed_receipt.title":"The signed receipt","event.wet_footprints.a":"Follow them","event.wet_footprints.b":"Ignore them","event.wet_footprints.ra":"Behind the door there is an empty table and a handful of damp chips. Nobody claims them.","event.wet_footprints.rb":"You prefer not to know. The floor, however, keeps getting wet behind you.","event.wet_footprints.text":"Wet, bare footprints cross the carpet and disappear under a door. Someone has just passed.","event.wet_footprints.title":"Wet footprints","event.woman_dress.a":"Take the card","event.woman_dress.b":"Refuse it","event.woman_dress.ra":"The card grows warm. Turned over, it shows someone who wept a great deal and regrets nothing.","event.woman_dress.rb":"She pockets the card without insisting. You know she will offer it again.","event.woman_dress.text":"A woman in a dark red dress holds out a card face down. “Four times as much of everything,” she says. “Debts included.”","event.woman_dress.title":"The Woman in Red","finale.stage1":"THE LAST HAND","finale.stage2":"THE LAST BULLET","fx.abandoned":"You left the room half-finished. The house took something.","fx.collapse":"Your mind cracks: you lose Health and regain some Sanity.","fx.interest":"Debt interest: +{n}","fx.revive_candle":"The short candle lights you again.","fx.revive_life":"An extra life drags you back from death.","hand.five":"Five of a kind","hand.flush":"Flush","hand.four":"Four of a kind","hand.full":"Full house","hand.high":"High card","hand.pair":"Pair","hand.sflush":"Straight flush","hand.straight":"Straight","hand.three":"Three of a kind","hand.twopair":"Two pair","help.combos":"Special combos","help.goal":"Reach the point TARGET before you run out of plays. If you don’t, the house collects.","help.hands":"Hands (chips × mult)","help.score":"Each play scores CHIPS × MULT. The hand (pair, three of a kind, straight…) sets the base; every card and combo adds more. Always check the cost before playing.","help.stakes":"Staking multiplies the play but costs Health, Sanity, Money or Debt. Some rules forbid it.","help.stakes_title":"Stakes","help.suits":"Suits","help.tips":"Discard weak cards, keep one in the Pocket for the perfect play, and watch your Sanity: when it drops, the screen distorts, and at 0 you collapse (+25 Sanity, −20 Health).","help.tips_title":"Tips","help.title":"Quick guide","hint.boss":"Each wing has a Guardian with rules of its own that change the game. Read them before you play: defeating it brings you closer to the end.","hint.event":"Here you choose between two options: REJECT (← or A) or ACCEPT (→ or D). What changes —Health, Sanity, Money or Debt— you will see afterwards. At 0 Health you die, with low Sanity the house distorts, and Debt grows with interest.","hint.map":"Tap a room to see what it is and tap it again to enter. If you get lost, the ? button at the top explains the game whenever you like.","hint.merchant":"Everything here is bought with Money. And money is lent too: loans add Debt, and Debt grows with interest after every room.","hint.rest":"A breather: choose just one thing. Sleeping restores Health, breathing restores Sanity, paying lowers Debt and studying levels up a hand.","howto.cards":"SEE HANDS AND SUITS","howto.s1.h":"Goal","howto.s1.t":"You descend through the house room by room. On each floor you choose your path on the map: you play card tables, decide in events and, sometimes, stake something in the shotgun duel. Each wing ends with a Guardian; after that come the Dealer, his last hand and The Door.\nDying is not the end: you keep memories and knowledge, and you go down again.","howto.s2.h":"The map","howto.s2.t":"Each room is a node. Tap one to see what it is and tap it again (or press ENTER) to go in. You can only move to rooms connected to yours.\nThere are card tables, events, the Vendor, rests, the shotgun (a duel where you stake something of yours), a secret bone door and the Guardian.","howto.s3.h":"Your resources","howto.s3.t":"• Health: at 0 you die. An extra candle lifts you back up once, with 40% Health.\n• Sanity: it drops with cards, stakes and events. When low, the screen distorts and whispers appear; at 0 you collapse: you regain 25 Sanity but lose 20 Health.\n• Money: buys things at the shop and pays off debt.\n• Debt: it grows with loans and stakes, and 3% interest is added after every room. With a lot of debt, the House raises the table targets by 5% for every 100 over 200 (up to 25%).\n• Shield: absorbs the Health cost of cards.","howto.s4.h":"Card tables","howto.s4.t":"Pick 1 to 5 cards from your hand and play: the hand (pair, three of a kind, straight…) gives chips × multiplier, and each card and combo adds more. Reach the target before you run out of plays; if you don’t, you pay with Health, Sanity and Debt.\nYou can discard, keep a card in the Pocket or stake (it multiplies the play, but it costs). Each opponent brings a rule of its own, shown on the table. Always check the cost before playing.","howto.s5.h":"Events","howto.s5.t":"They are two-option decisions: REJECT (← or A) or ACCEPT (→ or D); on a phone, swipe. Sometimes a third, hidden option (H) appears, depending on what you know or carry. What your decision changes is shown afterwards, and some tools let you redo it.","howto.s6.h":"Shotgun duel","howto.s6.t":"You stake something of yours (Money, Sanity, Debt or a card). The shotgun has 6 chambers, some loaded. The opponent announces how many bullets there are… and may lie.\nOn your turn you can shoot the opponent (if the chamber is loaded, it loses a mark; if not, the turn passes), tempt the Table (if it is empty you keep your turn; if not, you lose a mark) or listen (it costs Sanity and is not always right). Whoever leaves the other with no marks wins.","howto.s7.h":"Shop and rest","howto.s7.t":"The Vendor sells items, tools and cards for Money, and he also lends: loans add Debt.\nAt a rest you choose just one thing: sleep (Health), breathe (Sanity), pay debt or study a hand to level it up.","howto.s8.h":"Dying and remembering","howto.s8.t":"When you die you see your CURRENT DEBT (part of it carries over to your next descent) and your MEMORIES KEPT: permanent perks earned by doing certain things. What you discover is saved as knowledge and opens hidden options and doors.\nThere are 6 endings; The Door asks for different things for each one.","howto.title":"How to play","hud.debt":"Debt","hud.deck":"Deck","hud.health":"Health","hud.howto":"How to play","hud.inventory":"Inventory","hud.items":"Items","hud.levels":"Hand levels","hud.lives":"Lives","hud.money":"Money","hud.no_items":"Nothing yet.","hud.sanity":"Sanity","hud.settings":"Settings","hud.tools":"Tools","intro.1":"Are you awake?","intro.2":"At last.","intro.3":"We have to finish a game.","intro.4":"What game?","intro.5":"The last one.","intro.6":"Sit down. I’ll show you how we play here.","item.campanilla.desc":"+1 discard per round.","item.campanilla.name":"Little bell","item.ceniza.desc":"+15 chips per play. −2 Sanity after each room.","item.ceniza.name":"Ash","item.cuchilla_oxidada.desc":"Blood gives +1 more mult but costs +1 Health.","item.cuchilla_oxidada.name":"Rusty blade","item.diente_leche.desc":"Teeth grow +1 more per play.","item.diente_leche.name":"Milk tooth","item.espejo_roto.desc":"+2 mult. Start with −2 Sanity. Redo one decision per run (−5 Sanity).","item.espejo_roto.name":"Broken mirror","item.ficha_negra.desc":"Stakes multiply +0.15 more. Undo a decision by paying 50 Debt.","item.ficha_negra.name":"Black chip","item.guante_crupier.desc":"+1 play per round.","item.guante_crupier.name":"Dealer’s glove","item.libro_cuentas.desc":"Debt interest is halved.","item.libro_cuentas.name":"Ledger","item.llave_hueso.desc":"Starting Shield of 4. Opens the hidden door. Enables the Door ending.","item.llave_hueso.name":"Bone key","item.moneda_mordida.desc":"+5 Money per round won. Gilded cards give +2 more.","item.moneda_mordida.name":"Bitten coin","item.ojo_vidrio.desc":"+1 card in hand. Mist does not affect you.","item.ojo_vidrio.name":"Glass eye","item.reloj_parado.desc":"Targets drop 8%. Debt grows 50% faster.","item.reloj_parado.name":"Stopped clock","know.clue":"Clue about the Dealer","know.k_chair_founder.name":"The founder","know.k_chair_founder.text":"The Man in the Chair founded the house and never got up.","know.k_child_self.name":"The child is you","know.k_child_self.text":"The child in the birthday dress was you. Its “blind eyes” rule no longer blinds you.","know.k_dealer_deck.name":"The Dealer’s deck","know.k_dealer_deck.text":"The Dealer always deals from the bottom. His deck has no king.","know.k_dealer_ledger.name":"The Dealer’s ledger","know.k_dealer_ledger.text":"In his ledger every line is a game. The last one is missing.","know.k_dealer_no_name.name":"The Dealer has no name","know.k_dealer_no_name.text":"Nobody remembers the Dealer’s name. Neither does he.","know.k_door_same.name":"All the doors are the same","know.k_door_same.text":"Every door leads to the same room. You need to know this to see the truth.","know.k_drowned_paid.name":"The Drowned Man has paid","know.k_drowned_paid.text":"The Drowned Man paid his debt in water. His “drowning” rule no longer sinks you.","know.k_girl_lies.name":"What the girl lies about","know.k_girl_lies.text":"The girl with the stitched eye lies when she tells the truth. Her “no repeats” rule no longer binds you.","know.k_moon.name":"The window’s moon","know.k_moon.text":"The window’s moon is a spotlight. Without its cold, the Man in the Chair loses his rule.","know.k_players.name":"The players","know.k_players.text":"Everyone here played before. Everyone.","know.k_reflection.name":"Your reflection","know.k_reflection.text":"In the mirror, you are not the one who moves first.","know.k_room13.name":"Room 13","know.k_room13.text":"There is a room that appears on no floor plan.","know.k_watcher.name":"Someone is watching","know.k_watcher.text":"Someone is watching the game from outside the house.","legal.back":"BACK TO THE GAME","legal.lang":"Language","legal.privacy.s1.h":"1. What the game stores","legal.privacy.s1.t":"The game stores your save and your settings (language, volume, accessibility) in your browser’s local storage. This data stays on your device: the game does not send it to any server.\nYou can erase it with RESET PROGRESS in the menu or from your browser settings. If you erase it, you lose your save.","legal.privacy.s2.h":"2. No third-party services","legal.privacy.s2.t":"The game includes no advertising or analytics, uses no cookies and loads no resources from other sites. It does not collect personal data.","legal.privacy.s3.h":"3. Hosting","legal.privacy.s3.t":"Like any website, the hosting where the game is published (currently GitHub Pages) may log technical data about visits, such as the IP address, under its own terms. The game does not receive that data.","legal.privacy.s4.h":"4. Content notice","legal.privacy.s4.t":"THE HOUSE ALWAYS WATCHES is a work of horror fiction: the characters, places and events are imaginary.\nThe money, chips, bets and debts in the game are fictional: they have no real value, they cannot be bought or exchanged for real money, and the game is not a gambling service.\nIt includes flicker and shaking effects, and visual distortion when Sanity drops. You can reduce them in SETTINGS → Reduce effects. If you have photosensitive epilepsy or other discomfort, talk to a professional before playing.","legal.title.privacy":"Privacy and notice","legal.updated":"Last updated: 2026-10-01","log.round_lost":"You lost the round. The house collects.","log.round_won":"Round won.","map.enter":"ENTER","map.info.event":"Something awaits. You don’t know what.","map.info.merchant":"A seller of things that should not be sold.","map.info.rest":"A corner to catch your breath.","map.info.secret":"A bone door nobody else sees.","map.locked":"out of reach","map.opp":"Opponent: {name}","map.pick":"Choose your next room.","map.shotgun":"Shotgun duel. You stake something of yours.","map.title":"Room {n}/{total}","map.visited":"visited","mem.m01.name":"The first blow","mem.m01.text":"Dying once taught you to carry some cash. +10 Money at the start.","mem.m02.name":"Spare hands","mem.m02.text":"You learned to discard without doubt. +1 discard per round.","mem.m03.name":"Scars","mem.m03.text":"The body remembers. +10 max Health.","mem.m04.name":"The girl’s coin","mem.m04.text":"You start with Pair at level 1.","mem.m05.name":"The chair’s salt","mem.m05.text":"You start with a Salt.","mem.m06.name":"Air beneath the water","mem.m06.text":"Recover 3 Sanity when you win a round.","mem.m07.name":"Playing like a child","mem.m07.text":"+1 play per round.","mem.m08.name":"The wrong bullet","mem.m08.text":"You start with a Witness.","mem.m09.name":"Sharp ears","mem.m09.text":"Listening in duels is 85% reliable.","mem.m10.name":"Clear accounts","mem.m10.text":"Debt interest is halved.","mem.m11.name":"Bone from Room 13","mem.m11.text":"You start with a Smooth Bone in your deck.","mem.m12.name":"An ending seen","mem.m12.text":"Knowing how it ends brings some calm. +5 Money at the start.","menu.confirm_new.text":"You will abandon the current descent. You keep memories, knowledge and endings.","menu.confirm_new.title":"New game","menu.confirm_reset.text":"This will erase EVERYTHING: deaths, memories, knowledge and endings.","menu.confirm_reset.text2":"Are you sure? This cannot be undone.","menu.confirm_reset.title":"Reset progress","menu.continue":"CONTINUE","menu.cookies":"Cookies","menu.deaths":"{n} deaths","menu.howto":"HOW TO PLAY","menu.legal.privacy":"Privacy and notice","menu.new":"NEW GAME","menu.reset":"RESET PROGRESS","menu.secret":"???","menu.settings":"SETTINGS","menu.tagline":"The house is always watching.","menu.version":"v{v}","mod.edge.desc":"+10 chips when scoring.","mod.edge.name":"Edge","mod.glass.desc":"×2 when scoring. 25% chance to break.","mod.glass.name":"Glass","mod.gold.desc":"Earn 3 Money when scoring.","mod.gold.name":"Gilded","mod.hex.desc":"+30 chips. −2 Sanity.","mod.hex.name":"Hex","mod.red.desc":"+4 mult when scoring.","mod.red.name":"Red seal","node.boss":"Guardian","node.event":"Event","node.game":"Card table","node.merchant":"The Vendor","node.rest":"Rest","node.secret":"Bone door","node.shotgun":"The shotgun","opp.gambler_a":"Gambler with a crooked tie","opp.gambler_b":"Gambler with no reflection","opp.gambler_c":"Faceless gambler","rest.calm.desc":"Regain 25 Sanity.","rest.calm.name":"Breathe","rest.done.calm":"You breathe deeply. Regain {n} Sanity.","rest.done.heal":"You sleep without dreaming. Heal {n} Health.","rest.done.pay":"You pay {n}. The debt shrinks, but doesn’t vanish.","rest.done.study":"You study until the cards look back. {hand} levels up.", runs":"Descentes terminées","archive.stats":"Statistiques","archive.title":"???","archive.unknown":"???","boss.chair.a":"« Assieds-toi. Ici le sang refroidit et tes cartes ne donnent aucune chaleur. »","boss.chair.l":"« La chaise gagne toujours. C’est la seule chose que j’en sais. »","boss.chair.w":"« Je me lève. J’ai été assis si longtemps que j’ai oublié comment on fait. »","boss.child.a":"« Tu te souviens de moi ? Moi de toi, oui. Ne ferme pas les yeux… ah, ils le sont déjà. »","boss.child.l":"« Encore. Tu perds toujours ici. Tu reviens toujours. »","boss.child.w":"« Tu m’as battu. Je le voulais. Maintenant tu dois grandir. »","boss.dealer.a":"« La dernière main. Sans mises ni tours. Tout à découvert. »","boss.dealer.l":"« Ça a toujours été ma table. Lève-toi ; nous recommencerons. »","boss.dealer.w":"« Bien joué. Un instant, j’ai cru que c’est moi qui ne me relèverais pas. »","boss.drowned.a":"« Respire tant que tu peux. Chaque carte jouée te fera couler un peu. »","boss.drowned.l":"« Bois, bois. Ce n’est que de l’eau. Ce n’est qu’une dette. »","boss.drowned.w":"« J’ai déjà payé. Du moins je le croyais. Monte ; il ne reste rien ici. »","boss.fight":"JOUER LA PARTIE","boss.girl.a":"« On joue à ne pas se répéter. Je remarque tout avec l’œil qui ne voit pas. »","boss.girl.l":"« Encore la même chose, encore la même chose. Tu m’ennuies. »","boss.girl.w":"« Tu m’as battue sans mentir. Comme c’est étrange. Prends ce que tu veux. »","boss.no_rules":"Aucune règle spéciale","boss.rules":"Règles de cette partie","boss.title":"GARDIEN","boss.weakened":"affaiblie","card.base":"{suit} {rank}","card.carta_doble.desc":"Répète l’effet de la carte comptée juste avant.","card.carta_doble.name":"Carte Double","card.colmillo.desc":"+8 jetons. Gagne +2 à chaque point (max +40).","card.colmillo.name":"Croc","card.corazon.desc":"+2 mult. Rend 2 Santé.","card.corazon.name":"Cœur","card.cursed":"Maudite","card.dado_trucado.desc":"+6 jetons. Joker de couleur.","card.dado_trucado.name":"Dé
