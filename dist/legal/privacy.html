<script>window.__LOCALES__={"es":{"legal.back":"VOLVER AL JUEGO","legal.lang":"Idioma","legal.load_error":"No se pudo cargar el texto en {lang}. Se muestra en inglés.","legal.privacy.s1.h":"1. Qué guarda el juego","legal.privacy.s1.t":"El juego guarda en el almacenamiento local de tu navegador tu partida y tus ajustes (idioma, volumen, accesibilidad). Estos datos permanecen en tu dispositivo: el juego no los envía a ningún servidor.\nPuedes borrarlos con REINICIAR PROGRESO en el menú o desde los ajustes de tu navegador. Si los borras, pierdes la partida.","legal.privacy.s2.h":"2. Sin servicios de terceros","legal.privacy.s2.t":"El juego no incluye publicidad ni analítica, no usa cookies y no carga recursos de otros sitios. No recoge datos personales.","legal.privacy.s3.h":"3. Alojamiento","legal.privacy.s3.t":"Como cualquier sitio web, el alojamiento donde se publica el juego (actualmente GitHub Pages) puede registrar datos técnicos de las visitas, como la dirección IP, según sus propias condiciones. El juego no recibe esos datos.","legal.privacy.s4.h":"4. Aviso de contenido","legal.privacy.s4.t":"THE HOUSE ALWAYS WATCHES es una obra de ficción de terror: los personajes, lugares y sucesos son imaginarios.\nEl dinero, las fichas, las apuestas y las deudas del juego son ficticios: no tienen valor real, no se compran ni se canjean por dinero real, y el juego no es un servicio de juego de azar.\nIncluye efectos de parpadeo y sacudidas, y distorsión visual cuando baja la Cordura. Puedes reducirlos en AJUSTES → Reducir efectos. Si tienes epilepsia fotosensible u otras molestias, consulta con un profesional antes de jugar.","legal.title.privacy":"Privacidad y aviso","legal.updated":"Última actualización: 2026-10-01"},"en":{"legal.back":"BACK TO THE GAME","legal.lang":"Language","legal.load_error":"The text could not be loaded in {lang}. Showing it in English.","legal.privacy.s1.h":"1. What the game stores","legal.privacy.s1.t":"The game stores your save and your settings (language, volume, accessibility) in your browser’s local storage. This data stays on your device: the game does not send it to any server.\nYou can erase it with RESET PROGRESS in the menu or from your browser settings. If you erase it, you lose your save.","legal.privacy.s2.h":"2. No third-party services","legal.privacy.s2.t":"The game includes no advertising or analytics, uses no cookies and loads no resources from other sites. It does not collect personal data.","legal.privacy.s3.h":"3. Hosting","legal.privacy.s3.t":"Like any website, the hosting where the game is published (currently GitHub Pages) may log technical data about visits, such as the IP address, under its own terms. The game does not receive that data.","legal.privacy.s4.h":"4. Content notice","legal.privacy.s4.t":"THE HOUSE ALWAYS WATCHES is a work of horror fiction: the characters, places and events are imaginary.\nThe money, chips, bets and debts in the game are fictional: they have no real value, they cannot be bought or exchanged for real money, and the game is not a gambling service.\nIt includes flicker and shaking effects, and visual distortion when Sanity drops. You can reduce them in SETTINGS → Reduce effects. If you have photosensitive epilepsy or other discomfort, talk to a professional before playing.","legal.title.privacy":"Privacy and notice","legal.updated":"Last updated: 2026-10-01"},"fr":{"legal.back":"RETOUR AU JEU","legal.lang":"Langue","legal.load_error":"Le texte n’a pas pu être chargé en {lang}. Affichage en anglais.","legal.privacy.s1.h":"1. Ce que le jeu enregistre","legal.privacy.s1.t":"Le jeu enregistre dans le stockage local de ton navigateur ta partie et tes paramètres (langue, volume, accessibilité). Ces données restent sur ton appareil : le jeu ne les envoie à aucun serveur.\nTu peux les effacer avec RÉINITIALISER LA PROGRESSION dans le menu ou depuis les paramètres de ton navigateur. Si tu les effaces, tu perds ta partie.","legal.privacy.s2.h":"2. Aucun service tiers","legal.privacy.s2.t":"Le jeu ne comporte ni publicité ni outil d’analyse, n’utilise aucun cookie et ne charge aucune ressource d’autres sites. Il ne collecte aucune donnée personnelle.","legal.privacy.s3.h":"3. Hébergement","legal.privacy.s3.t":"Comme tout site web, l’hébergement où le jeu est publié (actuellement GitHub Pages) peut enregistrer des données techniques sur les visites, comme l’adresse IP, selon ses propres conditions. Le jeu ne reçoit pas ces données.","legal.privacy.s4.h":"4. Avertissement de contenu","legal.privacy.s4.t":"THE HOUSE ALWAYS WATCHES est une œuvre de fiction d’horreur : les personnages, lieux et événements sont imaginaires.\nL’argent, les jetons, les paris et les dettes du jeu sont fictifs : ils n’ont aucune valeur réelle, ne s’achètent ni ne s’échangent contre de l’argent réel, et le jeu n’est pas un service de jeux d’argent.\nIl comprend des effets de clignotement et de secousses, et une distorsion visuelle quand la Raison baisse. Tu peux les réduire dans PARAMÈTRES → Réduire les effets. Si tu as une épilepsie photosensible ou d’autres troubles, demande l’avis d’un professionnel avant de jouer.","legal.title.privacy":"Confidentialité et avertissement","legal.updated":"Dernière mise à jour : 2026-10-01"},"de":{"legal.back":"ZURÜCK ZUM SPIEL","legal.lang":"Sprache","legal.load_error":"Der Text konnte nicht auf {lang} geladen werden. Er wird auf Englisch angezeigt.","legal.privacy.s1.h":"1. Was das Spiel speichert","legal.privacy.s1.t":"Das Spiel speichert deinen Spielstand und deine Einstellungen (Sprache, Lautstärke, Barrierefreiheit) im lokalen Speicher deines Browsers. Diese Daten bleiben auf deinem Gerät: Das Spiel sendet sie an keinen Server.\nDu kannst sie mit FORTSCHRITT ZURÜCKSETZEN im Menü oder in den Browsereinstellungen löschen. Wenn du sie löschst, verlierst du deinen Spielstand.","legal.privacy.s2.h":"2. Keine Dienste von Drittanbietern","legal.privacy.s2.t":"Das Spiel enthält weder Werbung noch Analyse, verwendet keine Cookies und lädt keine Ressourcen von anderen Websites. Es erhebt keine personenbezogenen Daten.","legal.privacy.s3.h":"3. Hosting","legal.privacy.s3.t":"Wie jede Website kann das Hosting, auf dem das Spiel veröffentlicht ist (derzeit GitHub Pages), technische Daten der Besuche, etwa die IP-Adresse, nach eigenen Bedingungen protokollieren. Das Spiel erhält diese Daten nicht.","legal.privacy.s4.h":"4. Inhaltshinweis","legal.privacy.s4.t":"THE HOUSE ALWAYS WATCHES ist ein fiktives Horrorwerk: Die Figuren, Orte und Ereignisse sind erfunden.\nDas Geld, die Chips, die Wetten und die Schulden im Spiel sind fiktiv: Sie haben keinen realen Wert, lassen sich weder kaufen noch gegen echtes Geld eintauschen, und das Spiel ist kein Glücksspielangebot.\nEs enthält Flacker- und Wackeleffekte sowie visuelle Verzerrungen, wenn der Verstand sinkt. Du kannst die Effekte unter EINSTELLUNGEN → Effekte reduzieren verringern. Wenn du an photosensibler Epilepsie oder anderen Beschwerden leidest, sprich vor dem Spielen mit einer Fachperson.","legal.title.privacy":"Datenschutz und Hinweise","legal.updated":"Zuletzt aktualisiert: 2026-10-01"},"eu":{"legal.back":"JOKORA ITZULI","legal.lang":"Hizkuntza","legal.load_error":"Ezin izan da testua {lang} hizkuntzan kargatu. Ingelesez erakusten da.","legal.privacy.s1.h":"1. Zer gordetzen duen jokoak","legal.privacy.s1.t":"Jokoak zure partida eta ezarpenak (hizkuntza, bolumena, irisgarritasuna) zure nabigatzailearen tokiko biltegiratzean gordetzen ditu. Datu hauek zure gailuan geratzen dira: jokoak ez ditu inongo zerbitzaritara bidaltzen.\nAURRERAPENA BERRABIARAZI aukerarekin edo zure nabigatzailearen ezarpenetatik ezaba ditzakezu. Ezabatzen badituzu, partida galtzen duzu.","legal.privacy.s2.h":"2. Hirugarrenen zerbitzurik ez","legal.privacy.s2.t":"Jokoak ez dauka publizitaterik ez analitikarik, ez ditu cookieak erabiltzen eta ez ditu beste guneetako baliabideak kargatzen. Ez ditu datu pertsonalak biltzen.","legal.privacy.s3.h":"3. Ostatatzea","legal.privacy.s3.t":"Edozein web gunek bezala, jokoa argitaratzen den ostatatzeak (gaur egun GitHub Pages) bisiten datu teknikoak erregistra ditzake, hala nola IP helbidea, bere baldintzen arabera. Jokoak ez ditu datu horiek jasotzen.","legal.privacy.s4.h":"4. Edukiaren oharra","legal.privacy.s4.t":"THE HOUSE ALWAYS WATCHES beldurrezko fikziozko lan bat da: pertsonaiak, lekuak eta gertaerak imajinarioak dira.\nJokoko dirua, fitxak, apustuak eta zorrak fikziozkoak dira: ez dute balio errealik, ez dira diru errealagatik erosten edo trukatzen, eta jokoa ez da zorizko jokoen zerbitzu bat.\nKliskatze- eta astinaldi-efektuak ditu, eta distortsio bisuala Zentzutasuna jaisten denean. Murriztu ditzakezu EZARPENAK → Efektuak murriztu aukeran. Epilepsia fotosentikorra edo bestelako eragozpenak badituzu, kontsultatu profesional batekin jokatu aurretik.","legal.title.privacy":"Pribatutasuna eta oharra","legal.updated":"Azken eguneraketa: 2026-10-01"}};</script>
<script>/* legal.js — pinta la página «Privacidad y aviso» desde locales/<lang>.json o desde window.__LOCALES__ (build de un solo archivo).

          .then(function (j) { if (!j || typeof j !== 'object' || Object.keys(j).length < 20) throw new Error('vacío'); cache[l] = j; resolve(j); })
          .catch(function () { if (++n < 3) setTimeout(attempt, n === 1 ? 250 : 900); else resolve(null); });
