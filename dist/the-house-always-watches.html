 guztiak, jokaldi bakarrean.","egg.ases.name":"Lau Asak","egg.ases.text":"Lau As esku batean. Inork ez du horrela banatzen kasualitatez.","egg.cinco.hint":"Esku batek bost hatz ditu; gorte batek, bost komodin.","egg.cinco.name":"Bost pailazo","egg.cinco.text":"Komodinen gorte oso batek marmar egiten du zure atzean. Jaia ordaindu beharko duzu.","egg.colapso.hint":"Ez dena denbora gehiegiz begiratzea.","egg.colapso.name":"Zentzutasuna zero","egg.colapso.text":"Zure burua erabat apurtu zen. Etxeak irribarrez idazten du eta jarraitzeko beharrezkoa dena itzultzen dizu.","egg.jackpot.hint":"Hiru zenbaki zoriontsu, elkarrekin, esku batean.","egg.jackpot.name":"Hiru zazpiko","egg.jackpot.text":"Hiru zazpi esku batean. Existitzen ez diren kanpaiak jotzen dira.","egg.konami.hint":"Beste garai bateko tekla-kode bat, menuan idatzia.","egg.konami.name":"Kode zaharra","egg.konami.text":"Beste garai bateko konbinazio zahar bat. Krupierrak ikusi ez duela egiten du.","egg.limite.hint":"Inolako marjinarik gabe irabazi: azken jokaldian.","egg.limite.name":"Ile-puntan","egg.limite.text":"Zure azken jokaldian irabazi zenuen, etxeak dagoeneko irribarre egiten zuela.","egg.mesa3.hint":"Duelo batean, probokatu Mahaia eta ez dezala erantzun… hiru aldiz jarraian.","egg.mesa3.name":"Mahaia isiltzen da","egg.mesa3.text":"Hiru aldiz jarraian probokatu zenuen Mahaia eta hirurak isildu zen. Inork ez zion inoiz horrela hitz egin.","egg.ojos.hint":"Menuan, Krupierraren begiek ez dizute begirada kentzen. Ukitu, behin eta berriz.","egg.ojos.name":"Begirada itzultzen dizu","egg.ojos.text":"Zazpi aldiz Krupierraren begietara begiratu zenion. Berak, lehen aldiz, kliskatzen du.","egg.paciencia.hint":"Etxeak gau osoa du. Agian zuk ere bai.","egg.paciencia.name":"Pazientzia","egg.paciencia.text":"Minutu oso bat itxaron zenuen ezer ukitu gabe. Etxeak eskertzen du itxaroten dakienari; ia inoiz ez dio itzultzen.","egg.poliglota.hint":"Bost hizkuntza, zor bakarra.","egg.poliglota.name":"Etxeak hizkuntza guztiak hitz egiten ditu","egg.poliglota.text":"Gaztelania, ingelesa, frantsesa, alemana eta euskara: zorra berdin ulertzen da bostetan.","egg.real.hint":"Sorta osoko esku nobleena, 10etik Asera.","egg.real.name":"Eskala erreala","egg.real.text":"Hamarra, Jota, Erregina, Errege eta Asa palu berekoak. Krupierrak segundo batez nahasteari uzten dio… eta berriro nahasten du.","egg.unlocked":"Sekretua aurkitua: {name}","ending.crupier.epi":"Norbait lehen aldiz esertzen da zure aurrean. Ahoa mugitu gabe irribarre egiten duzu.","ending.crupier.text":"Irribarrea kentzeko eskatzen diozu. Azpian ez dago aurpegirik: zure adinako ispilu bat dago. «Hainbeste denbora duela irabazi nuen, ahaztu egin zait nola irten», dio. Sorta ematen dizu eta zure aulkian esertzen da. Orain banatzen duena zu zara.","ending.crupier.title":"Krupierra","ending.deuda.epi":"Etxeak beti irabazten du. Baina gaur gehiago luzatu da.","ending.deuda.text":"Azken eskua jokatu eta irabazten duzu. Etxeak garaipena bere liburuan idazten du eta fitxa beltz bat itzultzen dizu. «Partida bat zor duzu», dio. Zutitzen zara. Atea itxita jarraitzen du, baina badakizu kontatzen.","ending.deuda.title":"Zorra","ending.espectador.epi":"Begiratzen duenak ere partidan dago.","ending.espectador.text":"Gelatik kanpora begiratzen duzu, inork begiratu behar ez lukeen tokira. Beirateen atzean pantaila batek argitutako aurpegi bat dago. Zu zara, edo zu jolasten ikusten zaituen norbait. Segundo batez elkar behatzen duzue. Gero etxeak oihala jaisten du.","ending.espectador.title":"Ikuslea","ending.first":"AMAIERA BERRIA","ending.memories":"Irabazitako oroitzapenak","ending.n":"{n} / {total} AMAIERA","ending.partida.epi":"Jokalaririk gabe, etxea argiak dituen gela bat besterik ez da.","ending.partida.text":"Izenez deitzen diezu, banan-banan: neska, aulkiko gizona, itotakoa, artxibozaina, haurra. Bakoitza bere mahaitik zutitzen da. Inork ez zuen gogoratzen jokalari izan zenik. Kartak batera uzten dituzte erortzen. Partida amaitzen da, jarraitu nahi duen inor ez dagoelako.","ending.partida.title":"Partida","ending.puerta.epi":"Atea bere kasa ixten da. Oraingoan, alde zuzenetik.","ending.puerta.text":"Hezur-giltzak zarata egin gabe biratzen du. Atearen atzean pasabide bat dago eta, amaieran, beste ate berdin bat. Hala ere zeharkatzen duzu. Kanpoan benetako airea dago eta kartel bat: ITXITA, BERRIKUNTZAK DIRELA ETA. Lehen aldiz, inork ez zaitu begiratzen.","ending.puerta.title":"Atea","ending.to_menu":"MENURA ITZULI","ending.true_hint":"Bost amaiera ikusi dituzu. Ate bat gehiago geratzen da.","ending.verdad.epi":"Eskerrik asko jolasteagatik. Dagoeneko begiratzeari utz diezaiokezu.","ending.verdad.text":"Amaiera guztiak ikusi dituzu. Badakizu ate guztiak berdinak direla eta begiratzen duena zu zarela. Kontu-liburua ixten duzu eta azken lerroa idazten duzu. Etxea itzaltzen da. Ez dago partida gehiagorik: jolastu zuena eta pantailaren beste aldeko isiltasuna besterik ez da geratzen.","ending.verdad.title":"Egia","event.archive_ledger.a":"Liburua irakurri","event.archive_ledger.b":"Itxi","event.archive_ledger.ra":"Zifra-zutabeak partidak dira. Guztiak ate berean amaitzen dira. Ulertzen duzu ez daudela hainbeste ate.","event.archive_ledger.rb":"«Erabaki jakintsua», dio berak. «Nahiz eta ez duen ezer aldatzen.» Txanpon batzuk ematen dizkizu zure zuhurtziagatik.","event.archive_ledger.text":"Betaurreko lodiak dituen emakume batek tinta tanta egiten duten kontu-liburuak artxibatzen ditu. «Izen guztiak hemen daude», dio. «Eta ate guztiak berdinak dira.»","event.archive_ledger.title":"Artxibozaina","event.blood_vending.a":"Odolez ordaindu","event.blood_vending.b":"Aurrera egin","event.blood_vending.ra":"Makinak durrundatzen du, pozik, eta karta epel bat tutik botatzen du.","event.blood_vending.rb":"Makina hasperen batekin itzaltzen da. Une batez etsita zegoela ematen zuen.","event.blood_vending.text":"Makina batek kartak ematen ditu hatzean zulo bat eginda. Kartel batek dio: «Itzulketarik ez».","event.blood_vending.title":"Karta-makina","event.camera_13.a":"Pantaila ukitu","event.camera_13.b":"Entxufetik atera","event.camera_13.ra":"Beira epela dago. Irudian, norbait poliki kamerara biratzen da… eta zure berdina da zehazki. Pantailak txanpon batzuk botatzen ditu bere zirrikitutik.","event.camera_13.rb":"Kablea tiratzen duzu. Irudia itzaltzen da eta, une batez, gela osoak arnasa hartzen du. Beldur bat aurreztu berri duen baten itxura duzu.","event.camera_13.text":"Izkina batean, pantaila batek gela huts bat erakusten du eserleku batekin. Eserlekuaren gainean, zure berokia. Beiraren azpian, etiketa bat: «13. kamera — zuzenean».","event.camera_13.title":"13. kamera","event.chair_bet.a":"Apustua onartu","event.chair_bet.b":"Baztertu","event.chair_bet.ra":"Dadoak botatzen ditu begiratu gabe. Errodatzen eta gelditzen entzuten dituzu entzuteari uzten diozunean bertan.","event.chair_bet.rb":"«Ulertzen dut», xuxurlatzen du. «Nik ere nahiago nuke ez zutitzea.»","event.chair_bet.text":"Aulkiko Gizona ez da zutitzen, eta agian ezin du. «Aulkia apustu egiten dut», dio ahots higatuarekin. «Zure pazientziaren kontra.»","event.chair_bet.title":"Aulkia","event.chair_secret.a":"Entzun","event.chair_secret.b":"Eten","event.chair_secret.ra":"Orduak ematen ditu hitz egiten, edo segundoak. Amaieran ulertzen duzu zeinena den aulki hori eta zergatik gordetzen duen.","event.chair_secret.rb":"Isiltzen da. Etxe osoak arnasa eusten duela dirudi aldentzen zaren arte.","event.chair_secret.text":"«Etxe hau jokalari nekatu batek sortu zuen», dio Aulkiko Gizonak. «Besteen zain geratu zena.» Aulkiak karraskatzen du.","event.chair_secret.title":"Sortzailea","event.chapel_candles.a":"Zurea piztu","event.chapel_candles.b":"Besteak itzali","event.chapel_candles.ra":"Garra hotza eta tinkoa da. Zerbaitek hasperen egiten du kaperan. Kandela-zati bat gordetzen duzu geroagorako.","event.chapel_candles.rb":"Banan-banan putz egiten duzu. Iluntasunean, kapera handiagoa eta zureagoa dirudi. Eskaintzako txanponak aurkitzen dituzu lurrean.","event.chapel_candles.text":"Kandelak nonahi daude eta bat ere ez da gastatzen. Bakoitzak argizariz idatzitako izen bat darama. Zurea piztu gabe dago.","event.chapel_candles.title":"Mila kandela","event.child_1.a":"«Bai»","event.child_1.b":"«Ez»","event.child_1.ra":"Baiezkoa egiten du, pozik. «Nik ere.» Metal zaporeko goxoki bat ematen dizu.","event.child_1.rb":"«Gezurtia», dio sumindu gabe. Gertutik, haren aurpegia inoiz ikusi ez zenuen haurtzaroko zure argazki baten antzekoa da.","event.child_1.text":"Urtebetetze soineko bat daraman haur batek mahukatik tira egiten dizu. «Berriro galdu duzu?», galdetzen du. Ez da galdera bat.","event.child_1.title":"Haurra","event.child_2.a":"Marrazkia gorde","event.child_2.b":"Utzi","event.child_2.ra":"Papera tolesten duzu. Pisatzen du. Etxeko nonbait, pasabide bat biratu da ate berri bat kokatzeko.","event.child_2.rb":"Sorbaldak altxatzen ditu eta atea gurutzatzen du. Pixka batera, klarionak bere kabuz marrazten du berriro.","event.child_2.text":"Haurrak ate bat marrazten du klariona gorriz eta gainean zenbaki bat idazten du: 13. «Pasabidean dago. Zein den badakizu bakarrik irekitzen da.»","event.child_2.title":"Marrazkia","event.concierge_1.a":"Gela ordaindu","event.concierge_1.b":"Irteeraz galdetu","event.concierge_1.ra":"Gelak izpilikuaren eta paper zaharraren usaina du. Urteetan lo egin ez bezala lo egiten duzu. Hurrengo goizean Atezainak buruaz agurtzen zaitu: «Itzuli nahi duzunean; inor ez da inoiz joaten».","event.concierge_1.rb":"Hortzak erakutsi gabe irribarre egiten du eta giltza-sorta astintzen du. «Ate bakoitzerako giltza dut. Bat izan ezik.» Horman amu huts bati begira geratzen da. «Hori beste norbaitek du.»","event.concierge_1.text":"Ile zuriko gizon batek giltza-sorta erraldoi batekin kanpaitxo bati kolpatzen dio. «Ongi etorri, Gonbidatu. Gau baterako gela: hogei. Hemen lo egiteagatik, irteteagatik eta sartzeagatik kobratzen dugu.»","event.concierge_1.title":"Harrera","event.concierge_2.a":"Zinta moztu","event.concierge_2.b":"Dagoen lekuan utzi","event.concierge_2.ra":"Giltza zure eskuan hozten da eta sortan ez zegoen karta bihurtzen da. Atezaina ez da esnatzen, baina bere irribarrea okertzen da, ordaintzeko dauden kontuekin ametsetan balego bezala.","event.concierge_2.rb":"Burua besoen gainean jartzen diozu. Esnatzean, ez du ezer esaten, baina zerbait apuntatzen du zure kontuan: marra bat gutxiago. «Etxearen opari gisa», xuxurlatzen du.","event.concierge_2.text":"Atezaina mostradorean lo geratu da. Giltza nagusia lepotik zintzilik dago zinta mehe batekin. Harrerako txirrina zain dago, bere eskua ia ukitzen.","event.concierge_2.title":"Giltza nagusia","event.confession_booth.a":"Aitortu","event.confession_booth.b":"Alde egin","event.confession_booth.h":"Liburuaz galdetu","event.confession_booth.ra":"Gehiegi hitz egiten duzu. Arinago irteten zara... eta liburu batean, zerbaitek pixka bat gehiago pisatzen du.","event.confession_booth.rb":"Aldentzean, zure ahotsa entzuten duzu beste aldean aitortzen.","event.confession_booth.rh":"«Zati bat ezaba daiteke», xuxurlatzen du. «Baina nahi izan behar da.» Zorra askatzen da.","event.confession_booth.text":"Bi mahaien artean aitorleku bat. Beste aldean norbaitek poliki arnasa hartzen du eta zu lehenengo hitz egiten duzun zain dago.","event.confession_booth.title":"Aitorlekua","event.cook_1.a":"Jan","event.cook_1.b":"Baztertu","event.cook_1.ra":"Beroa da eta bizi gabe gogoratzen duzun zerbaiten zaporea du. Hobeto sentitzen zara; kontuak ere nabaritzen du.","event.cook_1.rb":"Sorbaldak altxatzen ditu. «Gehiago Haurrarentzat», dio, eta inork jasotzera etortzen ez den plater bat apartatzen du.","event.cook_1.text":"Sukaldean, mantal zikinarekin gizon batek lapiko erraldoi bat nahasten du. «Jan», dio Sukaldariak, «hemen dena aprobetxatzen da». Ez dakizu zerez den zopa.","event.cook_1.title":"Eguneko zopa","event.cook_2.a":"Poto bat ireki","event.cook_2.b":"Zure oroitzapen bat utzi","event.cook_2.ra":"Euriaren usaina du eta ez den beste sukalde batena. Une batez ulertzen duzu nola hobetu zure eskuak. Oroitzapena lurrunduz doa, eta etiketa harekin batera.","event.cook_2.rb":"Zure oroitzapenetako bat aukeratzen duzu eta poto huts batean gordetzen du. «Prezio ona», dio, eta txanpon batzuk kontatzen dizkizu. Ez duzu ezer faltan botatzen. Hori da arraroa.","event.cook_2.text":"Despentsan etiketadun poto-apalak daude: urtebetetze bat, agur bat, edozein astelehen. «Kontserbako oroitzapenak», azaltzen du Sukaldariak. «Nire anaiak soberan geratzen direnak eramaten ditu.»","event.cook_2.title":"Potoak","event.cook_3.a":"Ireki gabe eraman","event.cook_3.b":"Ireki","event.cook_3.ra":"Saltzaileak eskerrik eman gabe jasotzen du eta ordaintzen dizu. «Nire anaiak ondo sukaldatzen du», dio. «Kobratzen ez duen gauza bakarra da.» Ez zaitu jada axolagabekeriaz begiratzen.","event.cook_3.rb":"Barruan lerro bakarreko ohar bat dago eta ikusi duzula gogoratzen ez duzun karta bat. Sukaldariak badaki despentsatik irten aurretik.","event.cook_3.text":"Sukaldariak sokaz lotutako kaxa bat ematen dizu. «Nire anaiarentzat», dio. «Nik gordetzen dudana saltzen duenarentzat. Ez ireki.»","event.cook_3.title":"Saltzailearentzako agindu bat","event.cracked_clock.a":"Soka eman","event.cracked_clock.b":"Horrela utzi","event.cracked_clock.ra":"Zerbait kraskatzen da barruan. Erlojua eskuan geratzen zaizu, geldituta, eta ez dakizu jada zer ordu den.","event.cracked_clock.rb":"Seguruago da hemen denborari ez ukitzea. Txanpon batzuk aurkitzen dituzu pendulupean.","event.cracked_clock.text":"Horma-erloju batek beti 3:33 markatzen du. Asko begiratzen badiozu, segundero-orratzak dar-dar egiten du, zerbait eskatzen balu bezala.","event.cracked_clock.title":"Geldituriko erlojua","event.dealer_offer.a":"Sinatu","event.dealer_offer.b":"Uko egin","event.dealer_offer.ra":"Tinta beroa dago. Papera bere kasa tolesten da zure berokiaren barruan. Arin sentitzen zara, eta zelatatua.","event.dealer_offer.rb":"Kontratua jasotzen du tematu gabe. «Eskaintza iraungitzen da.» Txanpon batzuk uzten dizkizu eragozpenengatik. Okerrago da horrela.","event.dealer_offer.text":"Krupierrak kontratu bat irristatzen du mahaian zehar. «Sinadura bat eta zor hori desagertzen da.» Letra txikia mugitzen da.","event.dealer_offer.title":"Eskaintza","event.dealer_question.a":"«Bai, gogoratzen dut»","event.dealer_question.b":"«Ez dut gogoratzen»","event.dealer_question.h":"Sortaz galdetu","event.dealer_question.ra":"Zerbait idazten du. «Zer bitxia. Inork ez du gogoratzen.» Ispilu bati gezurra esan berri bazenio bezala begiratzen dizu.","event.dealer_question.rb":"«Nik ere ez», onartzen du, eta lehen aldiz sorta gelditzen da. Izena galdetzen diozu. Isiltzen da. Ez du.","event.dealer_question.rh":"«Berrogeita hamabi karta», dio, harritu gabe. «Lau palu, hamahiru bakoitzak, Asetik Erregera. Eta bat falta dena.» Irribarre egiten du.","event.dealer_question.text":"«Gogoratzen zara nola iritsi zinen?», galdetzen du Krupierrak, begiratu gabe nahasten. «Lehen eskuaren aurretik.»","event.dealer_question.title":"Galdera bat","event.dealer_tea.a":"Edan","event.dealer_tea.b":"Katilua baztertu","event.dealer_tea.ra":"Beroa da, gozoa eta gehiegi ezaguna. Katiluaren barruan, grabatuta, zure izena. Hala ere hobeto zaude.","event.dealer_tea.rb":"Katilua kentzen du iraindu gabe. «Nahi duzunean.» Biok dakizue ez dela adeitasuna.","event.dealer_tea.text":"Krupierrak tea zerbitzatzen du bi katilu berdinetan. «Atseden apur bat hartu. Etxeak gonbidatzen du.» Lurrunak zifra bat marrazten du.","event.dealer_tea.title":"Krupierraren tea","event.debt_collector.a":"Zati bat ordaindu","event.debt_collector.b":"Ordaintzeari uko egin","event.debt_collector.ra":"Billeteak birritan kontatzen ditu eta zerbait idazten du. «Plazer bat.»","event.debt_collector.rb":"«Interesekin idatziko dut.» Zaratarik egin gabe joaten da. Hotza geratzen da.","event.debt_collector.text":"Traje grisezko gizon batek zain zaitu ordainagiri batekin. «Zure zorra, jauna. Zure sinadura darama.» Ez zara gogoratzen sinatu duzunik.","event.debt_collector.title":"Kobratzailea","event.dice_pit.a":"Dadoak bota","event.dice_pit.b":"Alde egin","event.dice_pit.ra":"Dadoak errodatu eta gelditzen dira. Ahotsak bazekien emaitza.","event.dice_pit.rb":"Ahotsak mihia txaskatzen du. «Beste batean.» Behean barrez entzuten duzu.","event.dice_pit.text":"Hezurrezko dadoak dituen hare-zulo bat. Gorputzik gabeko ahots batek galdetzen du: «Aurpegia ala gurutzea?». Dadoek ez dute aurpegirik. Ezta gurutzerik ere.","event.dice_pit.title":"Dadoen zuloa","event.drowned_pier.a":"Eskua luzatu","event.drowned_pier.b":"Aldendu","event.drowned_pier.ra":"Heldu egiten dizu. Pisatzen du, izoztuta dago, eta bere ordainketa xuxurlatzen du: norbaitek hondoratu zuen zurea zen zor bat zela eta. Gatz-ukitu bat uzten dizu.","event.drowned_pier.rb":"Kolpeek zure atzean jarraitzen dute, beti distantzia berera.","event.drowned_pier.text":"Urik gabeko egurrezko kai bat. Behean, hezurretaraino busti den gizon batek lurra kolpatzen du ukabilekin, oso poliki.","event.drowned_pier.title":"Kai lehorra","event.first_chip.a":"Fitxa onartu","event.first_chip.b":"Errodatzen utzi","event.first_chip.ra":"Dirudiena baino gehiago pisatzen du. Zerbait, ikusten ez duzun liburu batean, oraintxe idatzi da.","event.first_chip.rb":"Fitxa iluntasunean galtzen da. Krupierrak baiezkoa egiten du buruarekin, espero balu bezala.","event.first_chip.text":"Fitxa beltz bat zure oinetaraino errodatzen da. Krupierrak irribarre egiten du ahoa mugitu gabe: «Zurea da. Beti izan zen zurea.»","event.first_chip.title":"Fitxa beltza","event.girl_1.a":"Aurpegia ala gurutzea jokatu","event.girl_1.b":"Uko egin","event.girl_1.ra":"Txanponak denbora gehiegi biratzen du. Erortzen da, edo ez; neskak dagoeneko begirada aldendu du.","event.girl_1.rb":"«Zer aspergarria», dio, eta txanpona gordetzen du. Begi onarekin jarraitzen zaitu galtzen zaren arte.","event.girl_1.text":"Begi bat hari gorriz josita duen neska batek txanpon bat biratzen du. «Aurpegia ala gurutzea. Zuk aukeratu. Nik begiratzen dut.»","event.girl_1.title":"Begi Josiko Neska","event.girl_2.a":"Sinetsi","event.girl_2.b":"Zalantzan jarri","event.girl_2.ra":"Eskerrak ematen dizkiozu. Haren aholkua eta dirua onartzen dituzu; biak faltsuak dira, baina baliagarriak.","event.girl_2.rb":"Aho okerrarekin irribarre egiten du. «Argia.» Haren keinua ikasten duzu: gezurretan ari da lurrera begiratzen duenean.","event.girl_2.text":"«Abisatzen dizut: Etxeak ez du gezurrik esaten», dio begi josiko neskak. Lurrera begira esaten du. Gezurretan esaten den esaldi mota da.","event.girl_2.title":"Neskak dioena","event.girl_3.a":"Begia onartu","event.girl_3.b":"Baztertu","event.girl_3.ra":"Jartzen duzu eta gehiago ikusten duzu: kartak, gela, gelaren atzean zerbait. Neskak haria gordetzen du.","event.girl_3.rb":"«Berriz orduan.» Eskua ixten du, eta begia, begi bat bazen, desagertzen da.","event.girl_3.text":"Neskak kristalezko begi bat eskaintzen du ahurrean. «Honek gehiago ikusten du. Gehiago kostatzen du ere.» Hari gorria pixka bat askatu da.","event.girl_3.title":"Hari gorria","event.kitchen_fire.a":"Ordainagiri bat bota","event.kitchen_fire.b":"Lapikoa nahasi","event.kitchen_fire.ra":"Zure sinadura duen bat aukeratzen duzu eta botatzen duzu. Urdin erretzen da. Zorra arintzen da… eta zure barruan zerbait ere bai.","event.kitchen_fire.rb":"Poliki nahasten duzu. Une batez salda zure aurpegia dirudi. Kazu bat zerbitzatzen duzu; ondo egiten dizu, eta etxeak kobratzen du horregatik.","event.kitchen_fire.text":"Lapiko handiaren azpian paper zaharrak erretzen dira: ordainagiriak, kontuak, promesak. Sukaldaria ez dago. Suak goseak begiratzen dizu.","event.kitchen_fire.title":"Sutondoa","event.merchant_memory.a":"Poto bat erosi","event.merchant_memory.b":"Baztertu","event.merchant_memory.ra":"Tapa kentzen diozu eta, bat-batean, esku zehatz bat hobeto jokatzen dakizu. Ez dakizu zergatik.","event.merchant_memory.rb":"«Nahi duzunean.» Pixka bat mintzen da. Inoiz bizkarra ematen ez duen saltzaile bakarra da.","event.merchant_memory.text":"Saltzaileak oroitzapenak saltzen ditu potoetan. «Honek zure lehen kasinoaren usaina du. Beste honek, zure azken eskuarena.»","event.merchant_memory.title":"Oroitzapen bat salgai","event.mirror_hall.a":"Beira ukitu","event.mirror_hall.b":"Begirada aldendu","event.mirror_hall.h":"Zure izena esan","event.mirror_hall.ra":"Epela da, esku bat bezala. Zure islada zu baino segundo erdi lehenago irribarre egiten du.","event.mirror_hall.rb":"Irteerarainoko pausoak zenbatzen dituzu. Inork ez zaitu jarraitzen. Inork ez, bat izan ezik.","event.mirror_hall.rh":"Islada baiezkoa egiten du buruarekin. Lehen aldiz, alde hartako norbait zure alde jolasten ari dela sentitzen duzu.","event.mirror_hall.text":"Ispilu bakoitzak zure keinua segundo bateko atzerapenarekin itzultzen dizu. Azkenak ez zaitu jarraitzen: begiratu egiten dizu.","event.mirror_hall.title":"Ispiluen pasabidea","event.moon_window.a":"Ireki","event.moon_window.b":"Itxi","event.moon_window.ra":"Airea argizariaren usainekoa da. Lehen ez zenekien zerbait dakizu: Aulkiko Gizonak ezin du argi hau jasan.","event.moon_window.rb":"Poliki ixten duzu. Beiraren beste aldean zerbaitek bi aldiz jotzen du, adeitasunez.","event.moon_window.text":"Hormarik gabeko leiho batek ilargi erraldoi bat erakusten du. Kasinoaren gainerakoan eguna da.","event.moon_window.title":"Leihoa","event.nun_1.a":"Aitortu","event.nun_1.b":"Isildu","event.nun_1.ra":"Gau oso bat dirudien denboran hitz egiten duzu. Arinago irteten zara… eta kontua pixka bat luzeagoarekin. Berak zerbait apuntatzen du bere errosarioaren aleetan.","event.nun_1.rb":"Poliki baiezkoa egiten du. «Isiltasuna ere zor bat da», dio, eta kandela bat pizten du ezer eskatu gabe.","event.nun_1.text":"Belo beltzeko moja batek tokia egiten dizu aitorlekuan. «Kontatu zor duzuna», dio Ahizpak. «Hemen dena esaten da, inork entzuten ez badu ere.»","event.nun_1.title":"Beloa","event.nun_2.a":"Berari buruz galdetu","event.nun_2.b":"Berarekin erreza","event.nun_2.h":"Krupierraren izenaz galdetu","event.nun_2.ra":"«Zorra zuen eta ura eskaini nion. Onartu zuen. Ordainduta dago, berak sinetsi ez arren.» Azkenik ulertzen duzu zer gertatu zitzaion Itotakoari.","event.nun_2.rb":"Hitzik gabe errezatzen duzue. Ez dagoen esku baten pisua sentitzen duzu. Beldur gutxiagorekin irteten zara eta oinetako hezeekin.","event.nun_2.rh":"Ahizpak kurutzea egiten du. «Badakit. Behin aitortu zuen, orain dela asko, lehen eskuaren aurretik.» Ezpainak estutzen ditu: ez dizu esango. Baina orain badakizu izen bat izan zela.","event.nun_2.text":"«Bat denbora gehiegi bataiatu nuen», xuxurlatzen du Ahizpak ur-ontziari begira. «Orain behean bizi da eta ez da lehortzen.» Kandelak lurrerantz makurtzen dira.","event.nun_2.title":"Bataioa","event.nun_3.a":"Absolbitu","event.nun_3.b":"Errezatzen utzi","event.nun_3.ra":"Ikasi duzula gogoratzen ez duzun hitzak esaten dituzu. Berak zarata gabe negar egiten du eta, zutitzean, galdu duzula ere gogoratzen ez duzun zerbait luzatzen dizu.","event.nun_3.rb":"Haren marmarra atzean duzula aldentzen zara. Limosna-kutxan txanpon batzuk daude; ez dakizu zureak ala berarenak diren.","event.nun_3.text":"Oraingoan Ahizpa da belaunikatzen dena. «Nik aitortu nuen lehenengo», dio. «Eta absoluzioa eman nion barkatzeko ezer izan aurretik.»","event.nun_3.title":"Azken aitormena","event.nurse_1.a":"Josten utzi","event.nurse_1.b":"Uko egin","event.nurse_1.ra":"Ez du minik ematen. Baduzula jakin gabe zenituen zauriak ixten dizkizu eta beste batzuk irekita uzten ditu. «Kito», dio. «Orain, ohera.» Ez zara gelditzen.","event.nurse_1.rb":"Denbora luzez begiratzen dizu. «Nahi duzun bezala.» Orratza beste dozena bat dituen erretilu batean uzten du. Ez da lehen aldia ezetz esaten diotena.","event.nurse_1.text":"Maskara berdea duen erizain batek gortina bat zabaltzen du. «Eseri, laztana. Aurpegi txarra duzu. Hemen inor ez da sendatzen, baina guztiak pixka bat hobetzen dira.» Orratz bat dauka, hariaz janzita.","event.nurse_1.title":"Erizaintza","event.nurse_2.a":"Neskari buruz galdetu","event.nurse_2.b":"Haria hartu","event.nurse_2.ra":"«Karta-sortaren atzean dagoena ikusten zuen. Krupierrak adeitasunez eskatu zidan.» Ulertzen duzu zergatik gezurretan ari den Neska: josi ez zioten gauza bakarra da.","event.nurse_2.rb":"Hari beltza hatzetan nahasten zaizu eta zure kartetako bat josturaz markatuta geratzen da. Betidanik horrela egon dela dirudi.","event.nurse_2.text":"Erretiluan orratzak, hari beltza eta kristalezko begi bat daude. «Neskarena da», dio Erizainak. «Josi nion ikusteari utz ziezaion. Orain gauero josteko eskatzen dit.»","event.nurse_2.title":"Erretilua","event.nurse_3.a":"Bere aulkia bultzatu","event.nurse_3.b":"Dosia aldatu","event.nurse_3.ra":"Poliki zeharkatzen duzu pasabidea. Etxea gela bakarra eta mahai bakarra zenean hitz egiten du. «Besteen zain geratu nintzen», errepikatzen du. Eta besteak iritsi ziren.","event.nurse_3.rb":"Etiketa aldatzen duzu. Berak ez du protestatzen; Erizainak ere ez. «Zutitzen bada, ikusiko dugu nor esertzen den», dio azkenean. Zerbait dago jada kobratzen ez dizutena.","event.nurse_3.text":"Aulkiko Gizona erizaintzako pasabidean zain dago. Xiringa bat dago bere altzoan. «Nire dosia», xuxurlatzen du. «Zutitu ez nadin.» Erizainak atetik begiratzen zaitu.","event.nurse_3.title":"Dosia","event.old_photograph.a":"Jaitsi","event.old_photograph.b":"Bere lekuan utzi","event.old_photograph.ra":"Atzean izenak daude. Asko. Bat ere ez da errepikatzen... zurea izan ezik.","event.old_photograph.rb":"Utzi egiten duzu. Behatuta sentitzen zara oraindik, baina nolabaiteko adeitasunez. Ia.","event.old_photograph.text":"Horman talde-argazki bat dago: mahai honen inguruko jokalariak, garai guztietakoak. Azken lerroan, zure aurpegia.","event.old_photograph.title":"Argazkia","event.phone_call.a":"Erantzun","event.phone_call.b":"Entzun gabe esegi","event.phone_call.ra":"Arnasa bat eta, azpian, urruneko txalo-marmar bat. «Hor jarraitzen duzu?», dio gelan ez dagoen norbaitek. «Gu bai.»","event.phone_call.rb":"Telefonoa isiltzen da ukitu orduko. Esegitzean, hasperen kolektibo bat entzuten da.","event.phone_call.text":"Bakelitazko telefono bat jotzen da mahaiaren erdian. Zuretzat da. Beti da zuretzat, bigarren aldiaz geroztik.","event.phone_call.title":"Telefonoa","event.pianist_1.a":"Amaierara arte entzun","event.pianist_1.b":"Beste bat eskatu","event.pianist_1.h":"Bere eskuez galdetu","event.pianist_1.ra":"Irauten duen artean irauten du. Arin sentitzen zara, ia barkatuta. Txanpon bat uzten duzu bere fraken poltsikoan.","event.pianist_1.rb":"«Hori bakarrik dakit.» Berriro jotzen du, berdin perfektu. Amaitzen duenean, ukabil huts bat luzatzen dizu: barruan utzi duzula gogoratzen ez duzun txanpon batzuk daude.","event.pianist_1.rh":"«Ordainketa gisa utzi nituen», dio. «Krupierrak bere lehen sortarako nahi zituen. Orain Artxibozainak irekitzen ez den tiradera batean gordetzen ditu.» Eta jotzen jarraitzen du.","event.pianist_1.text":"Ukabil hutsak dituen piano-jole batek kaperako organoa jotzen du. Ez dago eskurik bere mahukatan, baina musika entzuten da. «Gogoratzen dudan pieza bakarra da», dio itzuli gabe.","event.pianist_1.title":"Organo-jolea","event.pianist_2.a":"Berarekin dantzatu","event.pianist_2.b":"Urrunetik begiratu","event.pianist_2.ra":"Biratzen duzue lurrak zu ahazten zaituen arte. Hobeto sentitzen zara, eta okerrago. Berak xuxurlatzen du: «Eskerrik asko ez nauzulako askatu».","event.pianist_2.rb":"Hitz egin gabe elkarri begiratzen diozue. Haren soinekoa haizerik gabe uhintzen da. Piano-joleak baxuago jotzen du, barkamena eskatzen balu bezala.","event.pianist_2.text":"Gorriz Jantzitako Emakumeak bakarrik dantzatzen du bankuen artean organoaren erritmoan. Piano-joleak gelditzen balitz, zer izango litzateke harekin? Eskularruz jantzitako esku bat luzatzen dizu.","event.pianist_2.title":"Dantza","event.prompter_1.a":"Haren xuxurla jarraitu","event.prompter_1.b":"Belarriak estali","event.prompter_1.h":"Txotxongiloaz galdetu","event.prompter_1.ra":"“Gabon” esaten duzu eta eztul egiten duzu. Ez dagoen publikoak txalo egiten du. Norbaitek txanpon batzuk uzten ditu maskorrean; Apuntatzaileak zuregana bultzatzen ditu begiratu gabe.","event.prompter_1.rb":"Isiltasunak ondo egiten dizu. Berak hasperen egiten du haria galdu duen batek bezala eta esaldi bat marmar egiten du hutsera. Une batez, inork ez dizu esaten zer esan.","event.prompter_1.rh":"«Txotxongiloa? Nik xuxurlatzen diot, hemendik. Baina maskorrak ez du hondorik: ez dakit nondik datorren nire testua ere.» Barrura begiratzen duzu: egia da, iluntasun gehiago besterik ez dago.","event.prompter_1.text":"Eszenatokiaren azpian, maskorraren forma duen txabola bat. Barruan, betaurreko fineko gizon batek zure esaldia xuxurlatzen dizu pentsatu aurretik: «Esan “gabon”, gero eztul egin». Apuntatzailea da.","event.prompter_1.title":"Maskorra","event.prompter_2.a":"Azken lerroa irakurri","event.prompter_2.b":"Orrialdea atera","event.prompter_2.ra":"Begiak estutzen dituzu irakurri arte: «Krupierrak ere paper bat du hemen». Ulertzen duzu etxeko guztiek paper bat betetzen dutela… eta norbaitek banatzen dituela.","event.prompter_2.rb":"Orrialdea auts hotz bezala desegiten da zure eskuan. Apuntatzaileak ez du protestatzen: «Noizbait atera behar zen». Hobeto arnasten duzu.","event.prompter_2.text":"Apuntatzaileak koadernatutako gidoia erakusten dizu. Zure izena orrialde guztietan agertzen da. Azkenean, letra txikiagoa bihurtu eta desagertzen da: «Hemen publikoak inprobisatzen du», dio.","event.prompter_2.title":"Hirugarren ekitaldia","event.puppet_1.a":"Berarekin hitz egin","event.puppet_1.b":"Sokak moztu","event.puppet_1.ra":"Esaldi osoak errepikatzen ditu: Krupierrak aurrekoei esandako berberak. Pausa bat nabaritzen duzu bakoitzaren aurretik, norbaitek atzetik gidoia xuxurlatuko balu bezala.","event.puppet_1.rb":"Egurrezko kolpe batekin erortzen da bizirik gabe. Bere poltsikoan txanpon batzuk eta sinatu gabeko ohar bat daude: «Jarraitu atzera begiratu gabe».","event.puppet_1.text":"Bentrilokoaren txotxongilo bat aulki huts baten gainean dago. Inork mugitu gabe, masailezurra jaisten da: «Ongi etorri», dio lehen entzun duzun ahots batekin. «Zure zain geunden.»","event.puppet_1.title":"Txotxongiloa","event.puppet_2.a":"Gidoia jarraitu","event.puppet_2.b":"Gidoia hautsi","event.puppet_2.ra":"Idatzita zegoena zehazki esaten duzu eta dena ondo ateratzen da, gehiegi ondo. Kontua arintzen da. Krupierrak, nonbaitetik, irribarre egiten duela dirudi.","event.puppet_2.rb":"Ez zegoen esaldi bat esaten duzu. Txotxongiloak ahoa zabalik geratzen da. Une batez, etxe osoak inprobisatu behar du.","event.puppet_2.text":"Txotxongiloak berriro hitz egiten du. Oraingoan ez du Krupierra errepikatzen: zure esaldiak irakurtzen dizkizu, zuk esan aurretik. «Hogeita hamargarren orrialdea», iragartzen du. «Hemen zalantzan jartzen zara.»","event.puppet_2.title":"Gidoia","event.room_13.a":"Sartu","event.room_13.b":"Atea itxi","event.room_13.ra":"Barruan, Haurra kartak eskuetan dituela zain dago. «Berriro galdu duzu?»","event.room_13.rb":"Ixten duzu. Atea hormaren barruan disolbatzen da inoiz egon ez balitz bezala.","event.room_13.text":"Pasabidearen hondoan ez zegoen ate bat dago: 13. Atzean, haur bat oso poliki nahasten duenaren soinua.","event.room_13.title":"13. gela","event.secret_bone_door.a":"Ireki","event.secret_bone_door.b":"Gela arakatu","event.secret_bone_door.ra":"Hezur-giltza betidanik zegoen zure poltsikoan. Atzean irteerarik gabeko gela bat dago eta benetako airearen usaina duen aire bat.","event.secret_bone_door.rb":"Txanpon batzuk aurkitzen dituzu atearen ondoan. Atea zain dago.","event.secret_bone_door.text":"Hezur txiki eta leunduz egindako ate bat. Sarraila du. Eta zure giltza du, oraindik ikusi ez baduzu ere.","event.secret_bone_door.title":"Hezurrezko atea","event.secret_stage.a":"Zure eserlekuan eseri","event.secret_stage.b":"Zutik geratu","event.secret_stage.ra":"Zure eserlekutik mahai bat, sorta bat eta aulki huts bat ikusten dituzu. Ulertzen duzu ez zarela hemen jolasten duen bakarra. Ezta begiratzen duen bakarra ere.","event.secret_stage.rb":"Nahiago duzu zutik jarraitu. Atsedenaldi labur bat, eta aire arinago pixka bat.","event.secret_stage.text":"Kasino bateko oholtza bat, eserleku hutsekin. Bakoitzak izen bat duen plaka bat darama. Batek zurea. Beste batek, Krupierrarena: hutsik dago.","event.secret_stage.title":"Oholtza hutsa","event.secret_watcher.a":"Begirada itzuli","event.secret_watcher.b":"Begirada jaitsi","event.secret_watcher.ra":"Begiratzen dizu. Zuk begiratzen diozu. Eta une batez norbaitek beste batek begiratzen zaituztela sentitzen duzu biok, gelatik kanpotik.","event.secret_watcher.rb":"Begirada jaisten duzu. Sabaiko begia lasaituta dagoela dirudi, begiratzeko beldurra izango balu bezala.","event.secret_watcher.text":"Atirik gabeko gela bat sabaian begi bat margotuta. Inork ez zuen margotu. Zuk parpadeatzen duzunean parpadeatzen du.","event.secret_watcher.title":"Begiratzen duena","event.signed_receipt.a":"Osorik irakurri","event.signed_receipt.b":"Hautsi","event.signed_receipt.ra":"Partiden zerrenda bat da. Denak galduak. Denak zureak.","event.signed_receipt.rb":"Zatitan hausten duzu. Ukabila ixtean, berriro osorik dago zure poltsikoan, baina arinago.","event.signed_receipt.text":"Tolestutako ordainagiri bat erortzen da zure poltsikotik. Zure letra du, ulertzen ez duzun kopuru bat eta bihartaren data.","event.signed_receipt.title":"Sinatutako ordainagiria","event.staff_room.a":"Txandak begiratu","event.staff_room.b":"Zure izena ezabatu","event.staff_room.ra":"Guztiek ez joan ziren gonbidatuen txandak betetzen dituzte. Zerbait deserosoa ulertzen duzu: haietako bakoitzak lehen jokatu zuen. Guztiek.","event.staff_room.rb":"Hatza zure izenean pasatzen duzu eta ezabatzen da. Gelaren beste aldean berriro agertzen da. Gutxienez ahaztutako txanpon batzuk daude armairu batean.","event.staff_room.text":"Armairuak eta txanda-taula bat dituen gela bat: Krupierra, Artxibozaina, Saltzailea, Sukaldaria, Erizaina, Ahizpa, Piano-jolea… Zure izena duen hutsune bat dago gauaren azken txandan.","event.staff_room.title":"Langile-gela","event.theatre_seats.a":"Agurra egin","event.theatre_seats.b":"Isilik irten","event.theatre_seats.ra":"Makurtzen zara. Txaloak biderkatzen dira, belarriak ixten dituzten arte ozen bihurtzen dira… eta bat-batean gelditzen dira. Oholtzan zuretzako zerbait dago: zinta batekin loturiko txanpon-poltsa bat.","event.theatre_seats.rb":"Puntetan irteten zara. Berokiak ez dira mugitzen. Atea ixten duzunean bakarrik, atzean etsipenezko hasperen bat entzuten duzu, mila ahotatik.","event.theatre_seats.text":"Aretoa berokiz eta kapelaz beteta dago eserlekuen gainean, barruan inor gabe. Sartzean, berokiak guztiak batera zuregana biratzen dira. Txalo bat entzuten da, bakarra, mantsoa.","event.theatre_seats.title":"Patioa","event.usher_1.a":"Eseri","event.usher_1.b":"Zutik geratu","event.usher_1.ra":"Belusean hondoratzen zara. Gogoratzen ez zenuen bezala atseden hartzen duzu. Emanaldia hasten da eta inor ez da oholtzara ateratzen… baina irteeran sarrera kobratzen dute.","event.usher_1.rb":"«Nahi duzun bezala.» Berak izpia itzaltzen du eta zure ondoan geratzen da, mugitu gabe. Txanpon bat erortzen da lurrera; ez dakizu nork utzi zuen.","event.usher_1.text":"Mandatari-txapela duen emakume batek zure oinetakoei lanpara bat zuzentzen die. «Hemendik, mesedez. Hamahirugarren ilara, hamahirugarren eserlekua. Zure zain geunden.» Eserlekua beroa dago.","event.usher_1.title":"Zure eserlekua","event.usher_2.a":"Izpia jarraitu","event.usher_2.b":"Lanpara itzali","event.usher_2.ra":"Hamahirugarrenean zure neurriko berokia dago eta zure inizialak dituen kapela. Beste izen guztiak marratuta daude. Zurea, ez. Ikusia sentitzen zara, eta ez berak bakarrik.","event.usher_2.rb":"Iluntasuna erabatekoa da. Berak ahopean barre egiten du. «Hori bai dela emanaldia.» Eserlekuen artean ahaztutako txanponak ukitzen dituzu eta presaz irteten zara.","event.usher_2.text":"Eserleku-gidariak ilarak zeharkatzen ditu bere lanpararekin. Eserleku bakoitzean, berokia tolestuta, kapela, makila. «Inor ez da joaten», xuxurlatzen du. «Beren gauzak uzten dituzte eta geratzen dira. Begiratu hamahirugarrenari.»","event.usher_2.title":"Argi-izpia","event.wall_notes.a":"Irakurtzen jarraitu","event.wall_notes.b":"Begiak estali","event.wall_notes.ra":"Gehiago dago: apustuak, zorrak, txiste pare bat. Zirriborroen artean, arrakala batean ahaztutako diru apur bat.","event.wall_notes.rb":"Diotenez, osorik irakurtzen duenak hemen bizitzen geratzen da. Nahiago duzu ez egiaztatzea.","event.wall_notes.text":"Norbaitek horman idatzi du, klariona, ikatza, odolarekin: «Erizainak begia josi zuen.» «Sukaldariak oroitzapenak gordetzen ditu.» «Saltzaileak saltzen ditu.» «Ahizpak badaki izena.» «Piano-joleak eskuekin ordaindu zuen.» Azpian, txikiago: «Inork ez du gogoratzen nork idazten duen hau.»","event.wall_notes.title":"Oharrak horman","event.watcher_1.a":"Zure pantaila begiratu","event.watcher_1.b":"Kanala aldatu","event.watcher_1.h":"Zelataria nork zelatatzen duen galdetu","event.watcher_1.ra":"Zeure burua ikusten duzu, goitik, zain. Ikusten duzu ezpainak mugitzen dituzula esaldi honetan bertan. Zelatariak zerbait apuntatzen du eta txanpon batzuk irristatzen dizkizu: «Eragozpenagatik».","event.watcher_1.rb":"Botoi bat sakatzen duzu eta irudia gela huts batera jauzi egiten du, gero beste batera, gero zenbakirik gabeko gela batera. Zelatariak lehen aldiz begiratzen dizu: «Hori ez luke irten behar».","event.watcher_1.rh":"Ez du erantzuten. Baina haren begirada segundo batez horma-izkina batera jaisten da, inolako pantailak igeltsua estaltzen ez duen tokira. «Hutsune bat dago hor», aitortzen du ahots oso baxuan. «Ez dakit zer dagoen barruan. Inork ez du ikusten.»","event.watcher_1.text":"Pantaila berde eta urdinez egindako horma bat: Aretoa, Pasabidea, Kapera, Sukaldeak… Batean, zure bizkarra. Txapela duen gizon batek ez du begirada kentzen: «Eseri. Ez hitz egin. Nik apuntatuko dut».","event.watcher_1.title":"Monitoreak","event.watcher_2.a":"Puntu itsura hurbildu","event.watcher_2.b":"Aurpegia estali","event.watcher_2.ra":"Segundo batzuetan, inork ez zaitu ikusten. Ia minik ematen duen isiltasuna da. Ikasten duzu non hasten eta non amaitzen den, eta hemendik etxea ez dirudiela hain zaintzailea.","event.watcher_2.rb":"Eskuak aurpegian dituzula eusten duzu. Pantaila batek dir-dir egiten du eta zu jarraitzeari uzten dio. Zelatariak ezer ikusi ez duela egiten du. Pixka bat arinago sentitzen zara.","event.watcher_2.text":"Zelatariak sabaiko izkina bat erakusten dizu. «Kamera hori hormara begira dago. Beti. Norbaitek orain dela urte asko biratu zuen». Azpian, pantailarik gabeko horma-karratu bat, hautsik gabe, itzalik gabe.","event.watcher_2.title":"Puntu itsua","event.wet_footprints.a":"Jarraitu","event.wet_footprints.b":"Ez ikusiarena egin","event.wet_footprints.ra":"Atearen atzean mahai huts bat dago eta fitxa heze pusketa bat. Inork ez ditu aldarrikatzen.","event.wet_footprints.rb":"Nahiago duzu ez jakitea. Lurra, aldiz, zure atzean bustitzen jarraitzen du.","event.wet_footprints.text":"Oin hutsezko aztarna bustiek alfonbra zeharkatzen dute eta ate baten azpian galtzen dira. Norbait oraintxe pasa da.","event.wet_footprints.title":"Aztarna bustiak","event.woman_dress.a":"Karta hartu","event.woman_dress.b":"Baztertu","event.woman_dress.ra":"Karta berotzen da. Biratzean, asko negar egin duen eta damutzen ez den norbait ikusten duzu.","event.woman_dress.rb":"Karta gordetzen du tematu gabe. Badakizu berriro eskainiko dizula.","event.woman_dress.text":"Soineko gorri ilun bat daraman emakume batek karta bat luzatzen du aurpegia behera. «Dena lau aldiz gehiago», dio. «Zorrak barne.»","event.woman_dress.title":"Gorriz Jantzitako Emakumea","finale.stage1":"AZKEN ESKUA","finale.stage2":"AZKEN BALA","fx.abandoned":"Gela erdian utzi zenuen. Etxeak zerbait kobratu zuen.","fx.collapse":"Zure burua apurtzen da: Osasuna galtzen duzu eta Zentzutasun apur bat berreskuratzen duzu.","fx.interest":"Zorraren interesa: +{n}","fx.revive_candle":"Kandela laburrak berriro pizten zaitu.","fx.revive_life":"Bizitza gehigarri batek heriotzatik erauzten zaitu.","fxbanner.big":"JOKALDI HANDIA!","fxbanner.good":"JOKALDI ONA!","fxbanner.huge":"SUNTSITZAILEA!","fxbanner.target":"HELBURUA LORTUTA!","hand.five":"Repokerra","hand.flush":"Kolorea","hand.four":"Pokerra","hand.full":"Full","hand.high":"Karta altua","hand.pair":"Bikotea","hand.royal":"Eskala erreala","hand.sflush":"Kolore-eskala","hand.straight":"Eskala","hand.three":"Hirukotea","hand.twopair":"Bikote bikoitza","help.combos":"Konbinazio bereziak","help.goal":"Heldu puntuen HELBURURA jokaldirik gabe gelditu aurretik. Lortzen ez baduzu, etxeak kobratzen du.","help.hands":"Eskuak (fitxak × mult)","help.score":"Jokaldi bakoitzak FITXAK × MULT puntuatzen ditu. Eskuak (bikotea, hirukotea, eskala…) oinarria ematen du; karta eta konbinazio bakoitzak gehiago gehitzen du. Begiratu beti kostua jokatu aurretik. Karta bakoitzak fitxak gehitzen ditu bere balioaren arabera: As 11, figurak (J, Q, K) 10 eta gainerakoak beren zenbakia.","help.stakes":"Apustuak jokaldia biderkatzen du, baina Osasuna, Zentzutasuna, Dirua edo Zorra kostatzen du. Arau batzuek debekatu egiten dituzte.","help.stakes_title":"Apustuak","help.suits":"Paluak","help.tips":"Baztertu karta txarrak, gorde bi arte batera Poltsikoan jokaldi perfektuarako eta zaindu Zentzutasuna: jaisten bada, pantaila distortsionatzen da eta, 0ra iristen bada, erori egiten zara (+25 Zentzutasun, −20 Osasun).","help.tips_title":"Aholkuak","help.title":"Gida azkarra","hint.boss":"Hegal bakoitzak Zaindari bat du, partida aldatzen duten arau propioekin. Irakurri jokatu aurretik: garaitzeak amaierara hurbiltzen zaitu.","hint.event":"Hemen bi aukeraren artean erabakitzen duzu: BAZTERTU (← edo A) edo ONARTU (→ edo D). Aldatzen dena —Osasuna, Zentzutasuna, Dirua edo Zorra— ondoren ikusiko duzu. Osasuna 0 denean hil egiten zara, Zentzutasun gutxirekin etxea distortsionatu egiten da eta Zorra interesekin hazten da.","hint.map":"Ukitu gela bat zer den ikusteko eta ukitu berriro sartzeko.","hint.merchant":"Hemen dena Diruarekin erosten da. Eta maileguak ere ematen dira: maileguek Zorra gehitzen dute, eta Zorra interesekin hazten da gela bakoitzaren ondoren.","hint.rest":"Arnasaldi bat: aukeratu gauza bakarra. Lo egiteak Osasuna berreskuratzen du, arnasa hartzeak Zentzutasuna, ordaintzeak Zorra jaisten du eta aztertzeak esku baten maila igotzen du.","howto.cards":"ESKUAK ETA PALUAK IKUSI","howto.s1.h":"Helburua","howto.s1.t":"Etxean zehar jaisten zara, gelaz gela. Solairu bakoitzean zure bidea aukeratzen duzu mapan: karta-mahaiak jokatzen dituzu, gertaeretan erabakitzen duzu eta, batzuetan, zerbait apustu egiten duzu eskopeta-dueloan. Hegal bakoitza Zaindari batekin amaitzen da; ondoren Krupierra, haren azken eskua eta Atea iristen dira.\nHiltzea ez da amaiera: oroitzapenak eta ezagutza gordetzen dituzu, eta berriro jaisten zara.","howto.s2.h":"Mapa","howto.s2.t":"Gela bakoitza nodo bat da. Ukitu bat zer den ikusteko eta ukitu berriro (edo sakatu SARTU) sartzeko. Zure gelarekin konektatuta dauden gelatara bakarrik joan zaitezke.\nKarta-mahaiak, gertaerak, Saltzailea, atsedenak, eskopeta (zerbait apustu egiten duzun dueloa), hezurrezko ate sekretu bat eta Zaindaria daude.","howto.s3.h":"Zure baliabideak","howto.s3.t":"• Osasuna: 0ra iristen bada, hil egiten zara. Kandela gehigarri batek behin altxatzen zaitu, Osasunaren %40rekin.\n• Zentzutasuna: kartekin, apustuekin eta gertaerekin jaisten da. Gutxirekin, pantaila distortsionatzen da eta xuxurlak agertzen dira; 0ra iristen bada, erori egiten zara: 25 Zentzutasun berreskuratzen dituzu eta 20 Osasun galtzen dituzu.\n• Dirua: dendan erosteko eta zorra ordaintzeko balio du.\n• Zorra: mailegu eta apustuekin igotzen da, eta gela bakoitzaren ondoren %1,4ko interesa gehitzen zaio. Zor askorekin, Etxeak mahaien helburua %5 igotzen du 200tik gorako 100 bakoitzeko (%25era arte).\n• Ezkutua: kartek Osasunean duten kostua xurgatzen du.","howto.s4.h":"Karta-mahaiak","howto.s4.t":"Aukeratu zure eskuko 1etik 5era karta eta jokatu: eskuak (bikotea, hirukotea, eskala…) fitxak × biderkatzailea ematen du, eta karta eta konbinazio bakoitzak gehiago gehitzen du. Heldu helburura jokaldirik gabe gelditu aurretik; bestela, Osasunarekin, Zentzutasunarekin eta Zorrarekin ordaintzen duzu.\nBaztertu dezakezu, bi karta arte batera Poltsikoan gorde (handik jokatu daitezke eta eskua berriro betetzen da) edo apustu egin (jokaldia biderkatzen du, baina kostatzen du). Arerio bakoitzak bere araua dakar, mahaian ikusgai. Begiratu beti kostua jokatu aurretik.","howto.s5.h":"Gertaerak","howto.s5.t":"Bi aukerako erabakiak dira: BAZTERTU (← edo A) edo ONARTU (→ edo D); mugikorrean, irristatu. Batzuetan hirugarren aukera ezkutu bat agertzen da (H), dakizunaren edo daramazunaren arabera. Zure erabakiak aldatzen duena amaieran erakusten da, eta tresna batzuek berregiteko aukera ematen dute.","howto.s6.h":"Eskopeta-dueloa","howto.s6.t":"Zurea den zerbait apustu egiten duzu (Dirua, Zentzutasuna, Zorra edo karta bat). Eskopetak 6 ganbera ditu, batzuk kargatuta. Arerioak zenbat bala dauden iragartzen du… eta gezurretan ari daiteke.\nZure txandan arerioari tiro egin diezaiokezu (ganbera kargatuta badago, marka bat galtzen du; ez bada, txanda pasatzen da), Mahaia probokatu (hutsik badago txandari eusten diozu; ez bada, marka bat galtzen duzu) edo entzun (Zentzutasuna kostatzen du eta ez du beti asmatzen). Besteari markarik gabe uzten duenak irabazten du.","howto.s7.h":"Denda eta atsedena","howto.s7.t":"Saltzaileak objektuak, tresnak eta kartak saltzen ditu Diruaren truke, eta maileguak ere ematen ditu: maileguek Zorra gehitzen dute.\nAtseden batean gauza bakarra aukeratzen duzu: lo egin (Osasuna), arnasa hartu (Zentzutasuna), zorra ordaindu edo esku bat aztertu maila igotzeko.","howto.s8.h":"Hil eta gogoratu","howto.s8.t":"Hiltzean UNEKO ZORRA ikusten duzu (zati bat hurrengo jaitsierara garraiatzen da) eta GORDETAKO OROITZAPENAK: gauza batzuk eginez irabazten diren abantaila iraunkorrak. Aurkitzen duzuna ezagutza gisa gordetzen da eta aukera ezkutuak eta ateak irekitzen ditu.\nBadira 6 amaiera; Ateak gauza desberdinak eskatzen ditu bakoitzerako.","howto.s9.h":"Ezkutua","howto.s9.t":"Karta batzuek Osasuna kostatzen dute puntuatzean (Odola, Gosea…). EZKUTUA lehenengo gastatzen da: puntu bakoitzak Osasun-puntu bat xurgatzen du.\n• Giltzek eta karta berezi eta objektu batzuek ematen dute.\n• Zure jokaldien ondoan ikusten da eta txanda osoan irauten du.\n• Ez ditu apustuak ezta arerioen efektuak geldiarazten.","howto.title":"Nola jokatzen den","hud.debt":"Zorra","hud.debt.tip":"Etxeari zor diozuna: maileguekin, apustuekin eta interesarekin hazten da. Handia denean, helburuak igotzen dira (%25era arte). Horren truke, karta eta komodin batzuek puntu bihurtzen dute. Atsedenetan ordaintzen da.","hud.deck":"Sorta","hud.deck.tip":"Ikusi zure karta guztiak, bereziak nabarmenduta. Palu, balio, berezi edo berrien arabera ordena ditzakezu.","hud.health":"Osasuna","hud.health.tip":"Zure bizitza. 0ra iristen bada, hil egiten zara. Odol-kartek, Osasun-apustuek eta galdutako txandek gastatzen dute; atseden batean lo eginez edo dendako bendekin berreskuratzen da.","hud.howto":"Nola jokatzen den","hud.inventory":"Inbentarioa","hud.items":"Objektuak","hud.jokers":"Komodinak","hud.levels":"Esku-mailak","hud.lives":"Kandelak","hud.lives.tip":"Kandela bakoitza bizitza bat da. Batekin hasten zara; Osasuna 0ra iristen bada eta beste bat baduzu, kontsumitu egiten da eta Osasunaren %40rekin itzultzen zara.","hud.money":"Dirua","hud.money.tip":"Dendan erosteko balio du (komodinak, objektuak, kartak, bendak…) eta atseden batean Zorra ordaintzeko. Txandak eta dueloak irabazita lortzen da.","hud.no_items":"Oraindik ezer ez.","hud.sanity":"Zentzutasuna","hud.sanity.tip":"Zure burua. Dueloan entzutean eta apustuek, karta madarikatuek eta gertaerek gastatzen dute. Gutxi dagoenean pantaila distortsionatzen da; 0 denean erori egiten zara (−20 Osasun, +25 Zentzutasun). Atseden batean arnasa hartuz berreskuratzen da.","hud.settings":"Ezarpenak","hud.tools":"Tresnak","i18n.load_error":"Ezin izan da {lang} hizkuntza kargatu. Ingelesez erakusten da; berriro saiatuko da.","intro.1":"Esna zaude?","intro.2":"Azkenean.","intro.3":"Partida bat amaitu behar dugu.","intro.4":"Zein partida?","intro.5":"Aurrekoa.","intro.6":"Eseri. Hemen nola jokatzen den erakutsiko dizut.","item.campanilla.desc":"+1 baztertze txanda bakoitzeko.","item.campanilla.name":"Kanpaitxoa","item.ceniza.desc":"+15 fitxa jokaldiko. −1 Zentzutasun gela bakoitza amaitzean.","item.ceniza.name":"Errauts","item.cuchilla_oxidada.desc":"Odolak +1 mult gehiago ematen du, baina +1 Osasun gehiago kostatzen du.","item.cuchilla_oxidada.name":"Labana herdoilduta","item.diente_leche.desc":"Hortzek +1 gehiago hazten dira jokaldiko.","item.diente_leche.name":"Esne-hortza","item.espejo_roto.desc":"+2 mult. −2 Zentzutasunekin hasten zara. Erabaki bat berregin dezakezu partida bakoitzeko (−5 Zentzutasun).","item.espejo_roto.name":"Ispilu hautsia","item.ficha_negra.desc":"Apustuek +0,15 gehiago biderkatzen dute. Erabaki bat desegin dezakezu 50 Zor ordainduta.","item.ficha_negra.name":"Fitxa beltza","item.guante_crupier.desc":"+1 jokaldi txanda bakoitzeko.","item.guante_crupier.name":"Krupierraren eskularrua","item.libro_cuentas.desc":"Zorraren interesa erdira murrizten da.","item.libro_cuentas.name":"Kontu-liburua","item.llave_hueso.desc":"Hasierako Ezkutua: 4. Ezkutuko atea irekitzen du. Ate-amaiera ahalbidetzen du.","item.llave_hueso.name":"Hezur-giltza","item.moneda_mordida.desc":"+5 Diru irabazitako txanda bakoitzeko. Urrezko kartek +2 gehiago ematen dute.","item.moneda_mordida.name":"Hozkatutako txanpona","item.ojo_vidrio.desc":"+1 karta eskuan. Lainoak ez zaitu eragiten.","item.ojo_vidrio.name":"Beirazko begia","item.reloj_parado.desc":"Helburuak % atcher_blind.text":"Inolako kamerak erakusten ez duen gela bat dago, eta Zelatariak ez zekien. Badakizu nora begiratu, eta haren Zaintzak ez dizu jada eskuak lotzen.","legal.back":"JOKORA ITZULI","legal.lang":"Hizkuntza","legal.load_error":"Ezin izan da testua {lang} hizkuntzan kargatu. Ingelesez erakusten da.","legal.privacy.s1.h":"1. Zer gordetzen duen jokoak","legal.privacy.s1.t":"Jokoak zure partida eta ezarpenak (hizkuntza, bolumena, irisgarritasuna) zure nabigatzailearen tokiko biltegiratzean gordetzen ditu. Datu hauek zure gailuan geratzen dira: jokoak ez ditu inongo zerbitzaritara bidaltzen.\nAURRERAPENA BERRABIARAZI aukerarekin edo zure nabigatzailearen ezarpenetatik ezaba ditzakezu. Ezabatzen badituzu, partida galtzen duzu.","legal.privacy.s2.h":"2. Hirugarrenen zerbitzurik ez","legal.privacy.s2.t":"Jokoak ez dauka publizitaterik ez analitikarik, ez ditu cookieak erabiltzen eta ez ditu beste guneetako baliabideak kargatzen. Ez ditu datu pertsonalak biltzen.","legal.privacy.s3.h":"3. Ostatatzea","legal.privacy.s3.t":"Edozein web gunek bezala, jokoa argitaratzen den ostatatzeak (gaur egun GitHub Pages) bisiten datu teknikoak erregistra ditzake, hala nola IP helbidea, bere baldintzen arabera. Jokoak ez ditu datu horiek jasotzen.","legal.privacy.s4.h":"4. Edukiaren oharra","legal.privacy.s4.t":"THE HOUSE ALWAYS WATCHES beldurrezko fikziozko lan bat da: pertsonaiak, lekuak eta gertaerak imajinarioak dira.\nJokoko dirua, fitxak, apustuak eta zorrak fikziozkoak dira: ez dute balio errealik, ez dira diru errealagatik erosten edo trukatzen, eta jokoa ez da zorizko jokoen zerbitzu bat.\nKliskatze- eta astinaldi-efektuak ditu, eta distortsio bisuala Zentzutasuna jaisten denean. Murriztu ditzakezu EZARPENAK → Efektuak murriztu aukeran. Epilepsia fotosentikorra edo bestelako eragozpenak badituzu, kontsultatu profesional batekin jokatu aurretik.","legal.title.privacy":"Pribatutasuna eta oharra","legal.updated":"Azken eguneraketa: 2026-10-01","log.round_lost":"Txanda gal
