+8 Verstand","duel.title":"DIE SCHROTFLINTE","duel.tool.memory":"Der Gegner vergisst seinen nächsten Zug.","duel.truth":"Zeuge: Es waren {n} echte Kugeln.","duel.truth.honest":"Es sagte die Wahrheit.","duel.truth.lied":"Man hat dich belogen.","duel.turn_foe":"Zug des Gegners …","duel.turn_you":"Du bist dran","duel.win":"„Das Haus zahlt.“","duel.you":"Du","egg.arrepentido.hint":"Kaufen und verkaufen, ohne den Laden zu verlassen.","egg.arrepentido.name":"Kaufen und bereuen","egg.arrepentido.text":"Du hast einen Joker gekauft und im selben Besuch wieder verkauft. Der Händler seufzt: „Sie kommen immer zurück.“","egg.ases.hint":"Alle Asse in einem einzigen Zug.","egg.ases.name":"Vier Asse","egg.ases.text":"Vier Asse in einer Hand. So teilt niemand zufällig aus.","egg.cinco.hint":"Eine Hand hat fünf Finger; ein Hofstaat, fünf Joker.","egg.cinco.name":"Fünf Narren","egg.cinco.text":"Ein ganzer Hofstaat aus Jokern flüstert hinter dir. Die Feier wirst du bezahlen müssen.","egg.colapso.hint":"Zu lange hinsehen, wohin man nicht soll.","egg.colapso.name":"Verstand null","egg.colapso.text":"Dein Verstand ist völlig zerbrochen. Das Haus notiert es lächelnd und gibt dir gerade genug, um weiterzumachen.","egg.jackpot.hint":"Drei Glückszahlen zusammen in einer Hand.","egg.jackpot.name":"Dreifach-Sieben","egg.jackpot.text":"Drei Siebenen in einer Hand. Glocken läuten, die es nicht gibt.","egg.konami.hint":"Ein Tastencode aus einer anderen Zeit, im Menü eingegeben.","egg.konami.name":"Alter Code","egg.konami.text":"Eine alte Tastenkombination aus einer anderen Zeit. Der Croupier tut, als hätte er sie nicht gesehen.","egg.limite.hint":"Ohne jeden Spielraum gewinnen: im letzten Zug.","egg.limite.name":"Haarscharf","egg.limite.text":"Du hast im allerletzten Zug gewonnen, während das Haus schon lächelte.","egg.mesa3.hint":"Fordere im Duell den Tisch heraus, und er antwortet nicht … dreimal hintereinander.","egg.mesa3.name":"Der Tisch schweigt","egg.mesa3.text":"Du hast den Tisch dreimal hintereinander herausgefordert, und dreimal schwieg er. So hatte noch niemand mit ihm gesprochen.","egg.ojos.hint":"Im Menü weichen die Augen des Croupiers nie von dir. Berühre sie, immer wieder.","egg.ojos.name":"Er sieht zurück","egg.ojos.text":"Siebenmal hast du dem Croupier in die Augen gesehen. Zum ersten Mal blinzelt er.","egg.paciencia.hint":"Das Haus hat die ganze Nacht. Vielleicht du auch.","egg.paciencia.name":"Geduld","egg.paciencia.text":"Du hast eine volle Minute gewartet, ohne etwas zu berühren. Das Haus schätzt, wer warten kann; zurück gibt es kaum etwas.","egg.poliglota.hint":"Vier Sprachen, eine Schuld.","egg.poliglota.name":"Das Haus spricht jede Sprache","egg.poliglota.text":"Spanisch, Englisch, Französisch, Deutsch: Die Schuld versteht man in allen vieren gleich.","egg.real.hint":"Die edelste Hand des vollen Blatts, von der Zehn bis zum Ass.","egg.real.name":"Royal Flush","egg.real.text":"Zehn, Bube, Dame, König und Ass einer Farbe. Der Croupier hört eine Sekunde auf zu mischen … und mischt weiter.","egg.unlocked":"Geheimnis entdeckt: {name}","ending.crupier.epi":"Zum ersten Mal setzt sich jemand dir gegenüber. Du lächelst, ohne den Mund zu bewegen.","ending.crupier.text":"Du bittest ihn, das Lächeln abzulegen. Darunter ist kein Gesicht: ein Spiegel in deinem Alter. „Ich habe vor so langer Zeit gewonnen, dass ich vergaß, wie man geht“, sagt er. Er reicht dir das Deck und setzt sich auf deinen Stuhl. Jetzt teilst du aus.","ending.crupier.title":"Der Croupier","ending.deuda.epi":"Das Haus gewinnt immer. Aber heute hat es länger gedauert.","ending.deuda.text":"Du spielst die letzte Hand und gewinnst. Das Haus trägt den Sieg in sein Buch ein und gibt dir einen schwarzen Chip zurück. „Du schuldest mir noch eine Partie“, sagt es. Du stehst auf. Die Tür bleibt zu, aber du kannst jetzt zählen.","ending.deuda.title":"Die Schuld","ending.espectador.epi":"Wer zusieht, spielt auch mit.","ending.espectador.text":"Du blickst aus dem Raum hinaus, wohin niemand blicken sollte. Hinter dem Glas ist ein Gesicht, von einem Bildschirm beleuchtet. Du selbst, oder jemand, der dir beim Spielen zusieht. Ihr betrachtet euch eine Sekunde lang. Dann lässt das Haus den Vorhang fallen.","ending.espectador.title":"Der Zuschauer","ending.first":"NEUES ENDE","ending.memories":"Gewonnene Erinnerungen","ending.n":"ENDE {n} / {total}","ending.partida.epi":"Ohne Spieler ist das Haus nur ein Raum mit Lichtern.","ending.partida.text":"Du rufst sie beim Namen, einen nach dem anderen: das Mädchen, den Mann auf dem Stuhl, den Ertrunkenen, die Archivarin, das Kind. Jeder erhebt sich von seinem Tisch. Niemand erinnerte sich, Spieler gewesen zu sein. Sie lassen die Karten gleichzeitig fallen. Die Partie endet, weil keiner mehr weiterspielen will.","ending.partida.title":"Die Partie","ending.puerta.epi":"Die Tür schließt sich von selbst. Diesmal auf der richtigen Seite.","ending.puerta.text":"Der Knochenschlüssel dreht sich lautlos. Hinter der Tür liegt ein Gang und an dessen Ende eine weitere, gleiche Tür. Du gehst trotzdem hindurch. Draußen ist echte Luft und ein Schild: WEGEN UMBAU GESCHLOSSEN. Zum ersten Mal sieht dir niemand zu.","ending.puerta.title":"Die Tür","ending.to_menu":"ZURÜCK ZUM MENÜ","ending.true_hint":"Du hast fünf Enden gesehen. Eine Tür bleibt noch.","ending.verdad.epi":"Danke fürs Spielen. Du darfst aufhören zuzusehen.","ending.verdad.text":"Du hast alle Enden gesehen. Du weißt, dass alle Türen dieselbe sind und dass der Zuschauer du bist. Du schließt das Rechnungsbuch und schreibst die letzte Zeile. Das Haus erlischt. Es gibt keine Partie mehr: nur den, der sie gespielt hat, und die Stille auf der anderen Seite des Bildschirms.","ending.verdad.title":"Die Wahrheit","event.archive_ledger.a":"Das Buch lesen","event.archive_ledger.b":"Es schließen","event.archive_ledger.ra":"Die Zahlenkolonnen sind Partien. Alle enden an derselben Tür. Du begreifst, dass es gar nicht so viele Türen gibt.","event.archive_ledger.rb":"„Weise Entscheidung“, sagt sie. „Auch wenn es nichts ändert.“ Für deine Diskretion gibt sie dir ein paar Münzen.","event.archive_ledger.text":"Eine Frau mit dicker Brille archiviert Hauptbücher, die Tinte tropfen. „Alle Namen stehen hier“, sagt sie. „Und alle Türen sind dieselbe.“","event.archive_ledger.title":"Die Archivarin","event.blood_vending.a":"Mit Blut zahlen","event.blood_vending.b":"Vorbeigehen","event.blood_vending.ra":"Der Automat summt zufrieden und spuckt eine warme Karte aus.","event.blood_vending.rb":"Der Automat schaltet sich seufzend ab. Einen Moment lang wirkte er enttäuscht.","event.blood_vending.text":"Ein Automat gibt Karten gegen einen Stich in den Finger aus. Ein Schild sagt: „Kein Wechselgeld.“","event.blood_vending.title":"Der Kartenautomat","event.chair_bet.a":"Die Wette annehmen","event.chair_bet.b":"Ablehnen","event.chair_bet.ra":"Er wirft die Würfel, ohne hinzusehen. Du hörst sie rollen und liegen bleiben, genau als du aufhörst zuzuhören.","event.chair_bet.rb":"„Ich verstehe“, murmelt er. „Ich würde auch lieber nicht aufstehen.“","event.chair_bet.text":"Der Mann auf dem Stuhl steht nicht auf, vielleicht kann er es nicht. „Ich setze den Stuhl“, sagt er mit verbrauchter Stimme. „Gegen deine Geduld.“","event.chair_bet.title":"Der Stuhl","event.chair_secret.a":"Zuhören","event.chair_secret.b":"Ihn unterbrechen","event.chair_secret.ra":"Er spricht Stunden oder Sekunden. Am Ende verstehst du, wessen Stuhl das ist und warum er ihn bewacht.","event.chair_secret.rb":"Er verstummt. Das ganze Haus scheint den Atem anzuhalten, bis du gehst.","event.chair_secret.text":"„Dieses Haus gründete ein müder Spieler“, sagt der Mann auf dem Stuhl. „Der blieb, um auf die anderen zu warten.“ Der Stuhl knarrt.","event.chair_secret.title":"Der Gründer","event.chapel_candles.a":"Deine anzünden","event.chapel_candles.b":"Die anderen löschen","event.chapel_candles.ra":"Die Flamme ist kalt und ruhig. Etwas in der Kapelle seufzt. Du behältst einen Stummel für später.","event.chapel_candles.rb":"Du bläst sie eine nach der anderen aus. Im Dunkeln wirkt die Kapelle größer und mehr deine. Auf dem Boden findest du Opfermünzen.","event.chapel_candles.text":"Überall stehen Kerzen, und keine brennt herunter. Jede trägt einen Namen in Wachs. Deine ist nicht angezündet.","event.chapel_candles.title":"Tausend Kerzen","event.child_1.a":"„Ja“","event.child_1.b":"„Nein“","event.child_1.ra":"Es nickt zufrieden. „Ich auch.“ Es gibt dir ein Bonbon, das nach Metall schmeckt.","event.child_1.rb":"„Lügner“, sagt es ohne Groll. Aus der Nähe ähnelt sein Gesicht einem Kinderfoto von dir, das du nie gesehen hast.","event.child_1.text":"Ein Kind im Geburtstagskleid zupft an deinem Ärmel. „Hast du schon wieder verloren?“, fragt es. Es ist keine Frage.","event.child_1.title":"Das Kind","event.child_2.a":"Die Zeichnung behalten","event.child_2.b":"Sie liegen lassen","event.child_2.ra":"Du faltest das Papier. Es ist schwer. Irgendwo im Haus hat sich ein Gang gedreht, um Platz für eine neue Tür zu schaffen.","event.child_2.rb":"Es zuckt mit den Schultern und streicht die Tür durch. Kurz darauf zeichnet die Kreide sie von selbst neu.","event.child_2.text":"Das Kind zeichnet mit roter Kreide eine Tür und schreibt eine Zahl darüber: 13. „Sie ist im Gang. Sie öffnet sich nur, wenn du weißt, welche.“","event.child_2.title":"Die Zeichnung","event.confession_booth.a":"Beichten","event.confession_booth.b":"Weggehen","event.confession_booth.h":"Nach dem Buch fragen","event.confession_booth.ra":"Du sagst zu viel. Du gehst leichter... und irgendwo in einem Buch wiegt etwas ein wenig mehr.","event.confession_booth.rb":"Beim Weggehen hörst du auf der anderen Seite deine eigene Stimme beichten.","event.confession_booth.rh":"„Einen Teil kann man tilgen“, flüstert es. „Aber man muss es wollen.“ Die Schuld lockert sich.","event.confession_booth.text":"Ein Beichtstuhl zwischen zwei Tischen. Auf der anderen Seite atmet jemand langsam und wartet, dass du zuerst sprichst.","event.confession_booth.title":"Der Beichtstuhl","event.cook_1.a":"Essen","event.cook_1.b":"Ablehnen","event.cook_1.ra":"Sie ist heiß und schmeckt nach etwas, woran du dich erinnerst, ohne es erlebt zu haben. Du fühlst dich besser; die Rechnung merkt es auch.","event.cook_1.rb":"Er zuckt mit den Schultern. „Mehr für das Kind“, sagt er und stellt einen Teller beiseite, den niemand abholt.","event.cook_1.text":"In der Küche rührt ein Mann in fleckiger Schürze in einem riesigen Topf. „Iss“, sagt der Koch, „hier wird alles verwertet.“ Du weißt nicht, woraus die Suppe besteht.","event.cook_1.title":"Die Tagessuppe","event.cook_2.a":"Ein Glas öffnen","event.cook_2.b":"Ihm eine eigene Erinnerung überlassen","event.cook_2.ra":"Es riecht nach Regen und nach einer Küche, die nicht diese ist. Für einen Moment verstehst du, wie du deine Hände verbessern kannst. Die Erinnerung verfliegt, und mit ihr das Etikett.","event.cook_2.rb":"Du suchst eine deiner Erinnerungen aus, und er füllt sie in ein leeres Glas. „Fairer Preis“, sagt er und zählt dir ein paar Münzen hin. Dir fehlt nichts. Das ist das Seltsame.","event.cook_2.text":"In der Speisekammer stehen Regale voller beschrifteter Gläser: ein Geburtstag, ein Abschied, ein gewöhnlicher Montag. „Erinnerungen, eingemacht“, erklärt der Koch. „Mein Bruder nimmt, was übrig bleibt.“","event.cook_2.title":"Die Gläser","event.cook_3.a":"Ungeöffnet überbringen","event.cook_3.b":"Sie öffnen","event.cook_3.ra":"Der Händler nimmt sie entgegen, ohne sich zu bedanken, und bezahlt dich. „Mein Bruder kocht gut“, sagt er. „Es ist das Einzige, wofür er nichts verlangt.“ Er sieht dich nicht mehr gleichgültig an.","event.cook_3.rb":"Darin liegen ein einzeiliger Zettel und eine Karte, die du noch nie gesehen hast. Der Koch weiß es, bevor du die Speisekammer verlässt.","event.cook_3.text":"Der Koch gibt dir eine mit Schnur verschnürte Schachtel. „Für meinen Bruder“, sagt er. „Den, der verkauft, was ich aufbewahre. Mach sie nicht auf.“","event.cook_3.title":"Ein Auftrag für den Händler","event.cracked_clock.a":"Sie aufziehen","event.cracked_clock.b":"Es dabei belassen","event.cracked_clock.ra":"Im Inneren knirscht etwas. Die Uhr bleibt in deiner Hand, stehen, und du weißt nicht mehr, wie spät es ist.","event.cracked_clock.rb":"Hier ist es sicherer, die Zeit nicht anzufassen. Unter dem Pendel findest du ein paar Münzen.","event.cracked_clock.text":"Eine Wanduhr zeigt immer 3:33. Wenn du sie lange ansiehst, zittert der Sekundenzeiger, als würde er um etwas bitten.","event.cracked_clock.title":"Die stehengebliebene Uhr","event.dealer_offer.a":"Unterschreiben","event.dealer_offer.b":"Ablehnen","event.dealer_offer.ra":"Die Tinte ist warm. Das Papier faltet sich von selbst in deinem Mantel. Du fühlst dich leicht und beobachtet.","event.dealer_offer.rb":"Er nimmt den Vertrag zurück, ohne zu drängen. „Das Angebot verfällt.“ Er lässt dir ein paar Münzen für die Mühe. Das ist schlimmer.","event.dealer_offer.text":"Der Croupier schiebt einen Vertrag über den Tisch. „Eine Unterschrift und die Schuld verschwindet.“ Das Kleingedruckte bewegt sich.","event.dealer_offer.title":"Das Angebot","event.dealer_question.a":"„Ja, ich erinnere mich“","event.dealer_question.b":"„Ich erinnere mich nicht“","event.dealer_question.h":"Nach dem Kartenspiel fragen","event.dealer_question.ra":"Er notiert etwas. „Wie seltsam. Niemand erinnert sich.“ Er sieht dich an, als hättest du gerade einen Spiegel belogen.","event.dealer_question.rb":"„Ich auch nicht“, gibt er zu, und zum ersten Mal hält das Kartenspiel inne. Du fragst nach seinem Namen. Er schweigt. Er hat keinen.","event.dealer_question.rh":"„Zweiundfünfzig Karten“, sagt er ohne Überraschung. „Vier Farben, je dreizehn, vom Ass bis zum König. Und eine, die fehlt.“ Er lächelt.","event.dealer_question.text":"„Erinnerst du dich, wie du hergekommen bist?“, fragt der Croupier und mischt, ohne hinzusehen. „Vor der ersten Hand.“","event.dealer_question.title":"Eine Frage","event.dealer_tea.a":"Trinken","event.dealer_tea.b":"Die Tasse ablehnen","event.dealer_tea.ra":"Warm, süß und viel zu vertraut. In der Tasse eingraviert dein Name. Es geht dir trotzdem besser.","event.dealer_tea.rb":"Er zieht die Tasse zurück, ohne beleidigt zu sein. „Wann immer du willst.“ Ihr beide wisst, dass das keine Höflichkeit ist.","event.dealer_tea.text":"Der Croupier schenkt Tee in zwei identische Tassen ein. „Ruh dich ein wenig aus. Das Haus lädt ein.“ Der Dampf zeichnet eine Zahl.","event.dealer_tea.title":"Der Tee des Croupiers","event.debt_collector.a":"Einen Teil zahlen","event.debt_collector.b":"Die Zahlung verweigern","event.debt_collector.ra":"Er zählt die Scheine zweimal und notiert etwas. „Ein Vergnügen.“","event.debt_collector.rb":"„Ich vermerke es samt Zinsen.“ Er geht lautlos. Die Kälte bleibt.","event.debt_collector.text":"Ein Mann im grauen Anzug erwartet dich mit einer Quittung. „Ihre Schuld, mein Herr. Sie trägt Ihre Unterschrift.“ Du erinnerst dich nicht, unterschrieben zu haben.","event.debt_collector.title":"Der Eintreiber","event.dice_pit.a":"Würfeln","event.dice_pit.b":"Zurückweichen","event.dice_pit.ra":"Die Würfel rollen und bleiben liegen. Die Stimme kannte das Ergebnis schon.","event.dice_pit.rb":"Die Stimme schnalzt. „Ein andermal.“ Du hörst sie unten lachen.","event.dice_pit.text":"Eine Sandgrube mit Knochenwürfeln. Eine körperlose Stimme fragt: „Kopf oder Zahl?“ Die Würfel haben weder das eine noch das andere.","event.dice_pit.title":"Die Würfelgrube","event.drowned_pier.a":"Ihm die Hand reichen","event.drowned_pier.b":"Weggehen","event.drowned_pier.ra":"Er packt dich. Schwer, eiskalt, flüstert er seine Zahlung: Jemand hat ihn wegen einer Schuld versenkt, die deine war. Er lässt dir eine Handvoll Salz.","event.drowned_pier.rb":"Das Klopfen folgt dir im Rücken, immer im gleichen Abstand.","event.drowned_pier.text":"Ein Holzsteg ohne Wasser. Darunter klopft ein bis auf die Knochen durchnässter Mann sehr langsam mit den Knöcheln auf den Boden.","event.drowned_pier.title":"Der trockene Steg","event.first_chip.a":"Den Chip nehmen","event.first_chip.b":"Ihn weiterrollen lassen","event.first_chip.ra":"Er wiegt mehr, als er aussieht. In einem Buch, das du nicht sehen kannst, wurde soeben etwas notiert.","event.first_chip.rb":"Der Chip verschwindet im Dunkeln. Der Croupier nickt, als hätte er es erwartet.","event.first_chip.text":"Ein schwarzer Chip rollt vor deine Füße. Der Croupier lächelt, ohne den Mund zu bewegen: „Er gehört dir. Er hat dir immer gehört.“","event.first_chip.title":"Der schwarze Chip","event.girl_1.a":"Kopf oder Zahl spielen","event.girl_1.b":"Ablehnen","event.girl_1.ra":"Die Münze kreiselt viel zu lange. Sie fällt oder nicht; sie hat schon weggesehen.","event.girl_1.rb":"„Wie langweilig“, sagt sie und steckt die Münze weg. Mit dem guten Auge folgt sie dir, bis du verschwunden bist.","event.girl_1.text":"Ein Mädchen mit einem rot vernähten Auge lässt eine Münze kreiseln. „Kopf oder Zahl. Du wählst. Ich sehe zu.“","event.girl_1.title":"Das Mädchen mit dem vernähten Auge","event.girl_2.a":"Ihr glauben","event.girl_2.b":"Ihr misstrauen","event.girl_2.ra":"Du dankst ihr. Du nimmst ihren Rat und ihr Geld an; beides ist falsch, aber nützlich.","event.girl_2.rb":"Sie lächelt schief. „Schlau.“ Du lernst ihr Zeichen: Sie lügt, wenn sie zu Boden sieht.","event.girl_2.text":"„Ich warne dich: Das Haus lügt nicht“, sagt das Mädchen mit dem vernähten Auge. Sie sagt es und starrt zu Boden. So einen Satz sagt man, wenn man lügt.","event.girl_2.title":"Was das Mädchen sagt","event.girl_3.a":"Das Auge annehmen","event.girl_3.b":"Es ablehnen","event.girl_3.ra":"Du setzt es ein und siehst mehr: die Karten, den Raum, etwas hinter dem Raum. Sie behält den Faden.","event.girl_3.rb":"„Dann eben ein andermal.“ Sie schließt die Hand, und das Auge, falls es eines war, ist fort.","event.girl_3.text":"Das Mädchen hält ein Glasauge auf der flachen Hand hin. „Dieses sieht mehr. Es kostet auch mehr.“ Der rote Faden hat sich ein wenig gelöst.","event.girl_3.title":"Der rote Faden","event.kitchen_fire.a":"Einen Schuldschein hineinwerfen","event.kitchen_fire.b":"Im Topf rühren","event.kitchen_fire.ra":"Du suchst einen mit deiner Unterschrift aus und wirfst ihn hinein. Er brennt blau. Die Schuld wird leichter … und etwas in dir auch.","event.kitchen_fire.rb":"Du rührst langsam. Einen Moment lang sieht die Brühe aus wie dein Gesicht. Du schöpfst dir eine Kelle; sie tut dir gut, und das Haus berechnet es dir.","event.kitchen_fire.text":"Unter dem großen Topf verbrennen alte Papiere: Schuldscheine, Quittungen, Versprechen. Der Koch ist fort. Das Feuer sieht dich hungrig an.","event.kitchen_fire.title":"Der Herd","event.merchant_memory.a":"Ein Glas kaufen","event.merchant_memory.b":"Ablehnen","event.merchant_memory.ra":"Du entkorkst es und spielst plötzlich eine bestimmte Hand besser. Du weißt nicht, warum.","event.merchant_memory.rb":"„Wann immer du willst.“ Er ist ein wenig gekränkt. Er ist der einzige Händler, der nie den Rücken kehrt.","event.merchant_memory.text":"Der Händler verkauft Erinnerungen in Gläsern. „Dieses riecht nach deinem ersten Casino. Jenes nach deiner letzten Hand.“","event.merchant_memory.title":"Eine Erinnerung zu verkaufen","event.mirror_hall.a":"Das Glas berühren","event.mirror_hall.b":"Wegsehen","event.mirror_hall.h":"Ihm deinen Namen sagen","event.mirror_hall.ra":"Es ist warm, wie eine Hand. Dein Spiegelbild lächelt eine halbe Sekunde vor dir.","event.mirror_hall.rb":"Du zählst die Schritte bis zum Ausgang. Niemand folgt dir. Niemand außer einem.","event.mirror_hall.rh":"Das Spiegelbild nickt. Zum ersten Mal spürst du, dass jemand auf der anderen Seite für dich spielt.","event.mirror_hall.text":"Jeder Spiegel gibt deine Geste eine Sekunde zu spät zurück. Der letzte folgt dir nicht: Er beobachtet dich.","event.mirror_hall.title":"Der Spiegelgang","event.moon_window.a":"Es öffnen","event.moon_window.b":"Es schließen","event.moon_window.ra":"Die Luft riecht nach Wachs. Du weißt jetzt etwas Neues: Der Mann auf dem Stuhl erträgt dieses Licht nicht.","event.moon_window.rb":"Du schließt es langsam. Auf der anderen Seite des Glases klopft etwas zweimal, höflich.","event.moon_window.text":"Ein Fenster ohne Wand zeigt einen riesigen Mond. Im Rest des Casinos ist es Tag.","event.moon_window.title":"Das Fenster","event.nun_1.a":"Beichten","event.nun_1.b":"Schweigen","event.nun_1.ra":"Du sprichst, was wie eine ganze Nacht wirkt. Du gehst leichter … und mit etwas höherer Rechnung. Sie notiert etwas auf den Perlen ihres Rosenkranzes.","event.nun_1.rb":"Sie nickt langsam. „Schweigen ist auch eine Schuld“, sagt sie und zündet eine Kerze an, ohne etwas zu verlangen.","event.nun_1.text":"Eine Nonne mit schwarzem Schleier macht dir im Beichtstuhl Platz. „Sag mir, was du schuldest“, sagt die Schwester. „Hier wird alles gesagt, auch wenn niemand zuhört.“","event.nun_1.title":"Der Schleier","event.nun_2.a":"Nach ihm fragen","event.nun_2.b":"Mit ihr beten","event.nun_2.h":"Nach dem Namen des Croupiers fragen","event.nun_2.ra":"„Er hatte eine Schuld, und ich bot ihm Wasser an. Er nahm an. Sie ist bezahlt, auch wenn er es nicht glaubt.“ Endlich verstehst du, was dem Ertrunkenen geschah.","event.nun_2.rb":"Ihr betet ohne Worte. Du spürst das Gewicht einer Hand, die nicht da ist. Du gehst mit weniger Angst und feuchten Schuhen.","event.nun_2.rh":"Die Schwester bekreuzigt sich. „Ich kenne ihn. Er hat ihn einmal gebeichtet, vor langer Zeit, vor der ersten Hand.“ Sie presst die Lippen zusammen: Sie wird ihn dir nicht sagen. Aber nun weißt du, dass es einen Namen gab.","event.nun_2.text":"„Einen habe ich zu lange getauft“, murmelt die Schwester und blickt auf das Becken. „Jetzt lebt er unten und trocknet nie.“ Die Kerzen neigen sich zum Boden.","event.nun_2.title":"Die Taufe","event.nun_3.a":"Sie lossprechen","event.nun_3.b":"Sie beten lassen","event.nun_3.ra":"Du sprichst Worte, von denen du nicht weißt, dass du sie gelernt hast. Sie weint lautlos und reicht dir beim Aufstehen etwas, von dem du auch nicht weißt, dass du es verloren hast.","event.nun_3.rb":"Du gehst, ihr Murmeln im Rücken. Im Opferstock liegen ein paar Münzen; du weißt nicht, ob sie dir oder ihr gehören.","event.nun_3.text":"Diesmal kniet die Schwester nieder. „Ich habe zuerst gebeichtet“, sagt sie. „Und ich erteilte ihm die Absolution, bevor er etwas zu vergeben hatte.“","event.nun_3.title":"Die letzte Beichte","event.nurse_1.a":"Sich nähen lassen","event.nurse_1.b":"Ablehnen","event.nurse_1.ra":"Es tut nicht weh. Sie schließt Wunden, von denen du nichts wusstest, und lässt andere ungeöffnet. „So“, sagt sie. „Jetzt ab ins Bett.“ Du bleibst nicht.","event.nurse_1.rb":"Sie sieht dich lange an. „Wie du willst.“ Sie legt die Nadel auf ein Tablett zu einem Dutzend weiterer. Es ist nicht das erste Mal, dass man ihr Nein sagt.","event.nurse_1.text":"Eine Krankenschwester mit grüner Maske zieht einen Vorhang auf. „Setz dich, Liebes. Du siehst schlecht aus. Hier wird niemand geheilt, aber allen geht es ein bisschen besser.“ Sie hält eine eingefädelte Nadel.","event.nurse_1.title":"Das Krankenrevier","event.nurse_2.a":"Nach dem Mädchen fragen","event.nurse_2.b":"Den Faden nehmen","event.nurse_2.ra":"„Sie sah, was hinter dem Blatt liegt. Der Croupier bat mich höflich darum.“ Du verstehst, warum das Mädchen lügt: Es ist das Einzige, was man ihr nicht zugenäht hat.","event.nurse_2.rb":"Der schwarze Faden verheddert sich in deinen Fingern, und eine deiner Karten trägt plötzlich einen Stich. Es sieht aus, als wäre sie schon immer so gewesen.","event.nurse_2.text":"Auf dem Tablett liegen Nadeln, schwarzer Faden und ein Glasauge. „Es gehört dem Mädchen“, sagt die Krankenschwester. „Ich habe ihres zugenäht, damit sie aufhört zu sehen. Jetzt bittet sie mich jede Nacht, es erneut zu tun.“","event.nurse_2.title":"Das Tablett","event.nurse_3.a":"Seinen Stuhl schieben","event.nurse_3.b":"Die Dosis tauschen","event.nurse_3.ra":"Du schiebst ihn langsam den Gang entlang. Er erzählt von der Zeit, als das Haus nur ein Salon und ein Tisch war. „Ich blieb, um auf die anderen zu warten“, wiederholt er. Und die anderen kamen.","event.nurse_3.rb":"Du tauschst das Etikett. Er protestiert nicht; die Krankenschwester auch nicht. „Wenn er aufsteht, sehen wir, wer sich setzt“, sagt sie schließlich. Etwas wird dir nicht mehr berechnet.","event.nurse_3.text":"Der Mann auf dem Stuhl wartet im Gang des Reviers. Eine Spritze liegt in seinem Schoß. „Meine Dosis“, murmelt er. „Damit ich nicht aufstehe.“ Die Krankenschwester beobachtet dich von der Tür aus.","event.nurse_3.title":"Die Dosis","event.old_photograph.a":"Es abhängen","event.old_photograph.b":"Es hängen lassen","event.old_photograph.ra":"Dahinter stehen Namen. Viele. Keiner wiederholt sich... außer deinem.","event.old_photograph.rb":"Du lässt es hängen. Du fühlst dich weiter beobachtet, aber mit einer gewissen Freundlichkeit. Fast.","event.old_photograph.text":"An der Wand hängt ein Gruppenfoto: Spieler an diesem Tisch, aus allen Zeiten. In der letzten Reihe dein Gesicht.","event.old_photograph.title":"Das Foto","event.phone_call.a":"Abheben","event.phone_call.b":"Auflegen, ohne zuzuhören","event.phone_call.ra":"Ein Atmen und darunter ein Rauschen fernen Applauses. „Bist du noch da?“, sagt jemand, der nicht im Raum ist. „Wir schon.“","event.phone_call.rb":"Das Telefon verstummt, sobald du es berührst. Beim Auflegen ist ein gemeinsames Seufzen zu hören.","event.phone_call.text":"Ein Bakelit-Telefon klingelt mitten auf dem Tisch. Es ist für dich. Es ist immer für dich, ab dem zweiten Mal.","event.phone_call.title":"Das Telefon","event.pianist_1.a":"Bis zum Ende zuhören","event.pianist_1.b":"Um ein anderes Stück bitten","event.pianist_1.h":"Nach seinen Händen fragen","event.pianist_1.ra":"Es dauert, so lange es dauert. Du fühlst dich leicht, fast vergeben. Du lässt eine Münze in seiner Fracktasche.","event.pianist_1.rb":"„Ich kenne nur dieses.“ Er spielt es noch einmal, genauso vollkommen. Als es endet, hält er dir eine leere Manschette hin: Darin liegen Münzen, von denen du nicht weißt, dass du sie dagelassen hast.","event.pianist_1.rh":"„Ich ließ sie als Bezahlung da“, sagt er. „Der Croupier wollte sie für sein erstes Blatt. Jetzt verwahrt die Archivarin sie in einer Schublade, die sich nie öffnet.“ Und er spielt weiter.","event.pianist_1.text":"Ein Pianist mit leeren Manschetten spielt die Orgel der Kapelle. In seinen Ärmeln stecken keine Hände, doch die Musik erklingt. „Es ist das einzige Stück, an das ich mich erinnere“, sagt er, ohne sich umzudrehen.","event.pianist_1.title":"Der Organist","event.pianist_2.a":"Mit ihr tanzen","event.pianist_2.b":"Von weitem zusehen","event.pianist_2.ra":"Ihr dreht euch, bis der Boden dich vergisst. Du fühlst dich besser und schlechter. Sie flüstert: „Danke, dass du mich nicht losgelassen hast.“","event.pianist_2.rb":"Ihr seht euch wortlos an. Ihr Kleid wiegt sich ohne Wind. Der Pianist spielt leiser, als bäte er um Verzeihung.","event.pianist_2.text":"Die Frau in Rot tanzt allein zwischen den Bänken im Takt der Orgel. Wenn der Pianist aufhörte, was würde aus ihr? Sie reicht dir eine behandschuhte Hand.","event.pianist_2.title":"Der Tanz","event.puppet_1.a":"Mit ihr sprechen","event.puppet_1.b":"Ihre Schnüre kappen","event.puppet_1.ra":"Sie wiederholt ganze Sätze: dieselben, die der Croupier den Vorgängern sagte. Vor jedem merkst du eine Pause, als souffliere jemand von hinten.","event.puppet_1.rb":"Sie sackt mit einem Holzklopfen zusammen. In ihrer Tasche stecken ein paar Münzen und ein unsignierter Zettel: „Geh weiter, ohne dich umzusehen.“","event.puppet_1.text":"Eine Bauchrednerpuppe sitzt auf einem leeren Stuhl. Ohne dass jemand sie bewegt, klappt der Unterkiefer herunter: „Willkommen“, sagt sie mit einer Stimme, die du schon einmal gehört hast. „Wir haben dich erwartet.“","event.puppet_1.title":"Die Puppe","event.puppet_2.a":"Dem Skript folgen","event.puppet_2.b":"Das Skript brechen","event.puppet_2.ra":"Du sagst genau, was geschrieben stand, und alles läuft gut, zu gut. Die Rechnung wird leichter. Irgendwo scheint der Croupier zu lächeln.","event.puppet_2.rb":"Du sprichst einen Satz, der nicht vorgesehen war. Die Puppe bleibt mit offenem Mund stehen. Für einen Augenblick muss das ganze Haus improvisieren.","event.puppet_2.text":"Die Puppe spricht wieder. Diesmal wiederholt sie nicht den Croupier: Sie liest deine eigenen Sätze vor, bevor du sie sagst. „Seite dreißig“, verkündet sie. „Hier zögerst du.“","event.puppet_2.title":"Das Skript","event.room_13.a":"Eintreten","event.room_13.b":"Die Tür schließen","event.room_13.ra":"Drinnen wartet das Kind mit den Karten in den Händen. „Hast du schon wieder verloren?“","event.room_13.rb":"Du schließt sie. Die Tür löst sich in der Wand auf, als wäre sie nie da gewesen.","event.room_13.text":"Am Ende des Ganges steht eine Tür, die vorher nicht da war: 13. Dahinter das Geräusch eines Kindes, das sehr langsam mischt.","event.room_13.title":"Zimmer 13","event.secret_bone_door.a":"Sie öffnen","event.secret_bone_door.b":"Den Raum durchsuchen","event.secret_bone_door.ra":"Der Knochenschlüssel steckte die ganze Zeit in deiner Tasche. Dahinter: ein Raum ohne Ausgang und Luft, die nach echter Luft riecht.","event.secret_bone_door.rb":"Du findest ein paar Münzen neben der Tür. Die Tür wartet.","event.secret_bone_door.text":"Eine Tür aus kleinen, polierten Knochen. Sie hat ein Schloss. Und sie hat deinen Schlüssel, auch wenn du ihn noch nicht gesehen hast.","event.secret_bone_door.title":"Die Knochentür","event.secret_stage.a":"Dich auf deinen Platz setzen","event.secret_stage.b":"Stehen bleiben","event.secret_stage.ra":"Von deinem Platz aus siehst du einen Tisch, ein Kartenspiel und einen leeren Stuhl. Du begreifst, dass du nicht der Einzige bist, der hier spielt. Und nicht der Einzige, der zusieht.","event.secret_stage.rb":"Du bleibst lieber stehen. Eine kurze Rast und etwas leichtere Luft.","event.secret_stage.text":"Eine Casinobühne mit leeren Sesseln. Jeder trägt ein Namensschild. Eines trägt deinen Namen. Ein anderes das des Croupiers: Es ist leer.","event.secret_stage.title":"Die leere Bühne","event.secret_watcher.a":"Zurückstarren","event.secret_watcher.b":"Den Blick senken","event.secret_watcher.ra":"Es sieht dich an. Du siehst es an. Und für einen Moment spürst du, dass noch jemand euch beide beobachtet, von außerhalb des Raums.","event.secret_watcher.rb":"Du senkst den Blick. Das Auge an der Decke wirkt erleichtert, als fürchte es, angesehen zu werden.","event.secret_watcher.text":"Ein Raum ohne Türen mit einem Auge an der Decke. Niemand hat es gemalt. Es blinzelt, wenn du blinzelst.","event.secret_watcher.title":"Der Beobachter","event.signed_receipt.a":"Alles lesen","event.signed_receipt.b":"Zerreißen","event.signed_receipt.ra":"Es ist eine Liste von Partien. Alle verloren. Alle deine.","event.signed_receipt.rb":"Du zerreißt es in Stücke. Wenn du die Faust schließt, steckt es wieder ganz in deiner Tasche, aber leichter.","event.signed_receipt.text":"Eine gefaltete Quittung fällt aus deiner Tasche. Deine Handschrift, ein Betrag, den du nicht verstehst, das Datum von morgen.","event.signed_receipt.title":"Die unterschriebene Quittung","event.staff_room.a":"Die Schichten ansehen","event.staff_room.b":"Deinen Namen löschen","event.staff_room.ra":"Jeder von ihnen deckt die Schicht eines Gastes, der nie ging. Du begreifst etwas Unangenehmes: Jeder von ihnen hat zuvor gespielt. Alle.","event.staff_room.rb":"Du fährst mit dem Finger über deinen Namen, und er verschwindet. Er taucht auf der anderen Seite des Raums wieder auf. Immerhin liegen ein paar vergessene Münzen in einem Spind.","event.staff_room.text":"Ein Raum mit Spinden und einer Schichttafel: Croupier, Archivarin, Händler, Koch, Krankenschwester, Schwester, Pianist … In der letzten Nachtschicht steht ein Platz mit deinem Namen.","event.staff_room.title":"Der Personalraum","event.wall_notes.a":"Weiterlesen","event.wall_notes.b":"Die Augen bedecken","event.wall_notes.ra":"Es gibt mehr: Wetten, Schulden, ein paar Witze. Zwischen den Kritzeleien steckt vergessenes Geld in einem Spalt.","event.wall_notes.rb":"Es heißt, wer alles liest, bleibt hier wohnen. Das willst du lieber nicht herausfinden.","event.wall_notes.text":"Jemand hat an die Wand geschrieben, mit Kreide, mit Kohle, mit Blut: „Die Krankenschwester nähte das Auge zu.“ „Der Koch bewahrt die Erinnerungen auf.“ „Der Händler verkauft sie.“ „Die Schwester kennt den Namen.“ „Der Pianist zahlte mit den Händen.“ Darunter, kleiner: „Niemand erinnert sich, wer das schreibt.“","event.wall_notes.title":"Notizen an der Wand","event.wet_footprints.a":"Ihnen folgen","event.wet_footprints.b":"Sie ignorieren","event.wet_footprints.ra":"Hinter der Tür stehen ein leerer Tisch und eine Handvoll feuchter Chips. Niemand beansprucht sie.","event.wet_footprints.rb":"Du willst es lieber nicht wissen. Der Boden hinter dir wird trotzdem weiter nass.","event.wet_footprints.text":"Nasse, nackte Fußspuren führen über den Teppich und verschwinden unter einer Tür. Jemand ist gerade hier gewesen.","event.wet_footprints.title":"Nasse Fußspuren","event.woman_dress.a":"Die Karte nehmen","event.woman_dress.b":"Ablehnen","event.woman_dress.ra":"Die Karte wird warm. Umgedreht zeigt sie jemanden, der sehr geweint hat und nichts bereut.","event.woman_dress.rb":"Sie steckt die Karte weg, ohne zu drängen. Du weißt, dass sie sie wieder anbieten wird.","event.woman_dress.text":"Eine Frau in einem dunkelroten Kleid hält eine verdeckte Karte hin. „Viermal so viel von allem“, sagt sie. „Schulden eingeschlossen.“","event.woman_dress.title":"Die Frau in Rot","finale.stage1":"DIE LETZTE HAND","finale.stage2":"DIE LETZTE KUGEL","fx.abandoned":"Du hast den Raum halb verlassen. Das Haus hat sich etwas genommen.","fx.collapse":"Dein Geist bricht: Du verlierst Gesundheit und gewinnst etwas Verstand zurück.","fx.interest":"Schuldzinsen: +{n}","fx.revive_candle":"Die kurze Kerze entzündet dich neu.","fx.revive_life":"Ein Extraleben reißt dich vom Tod zurück.","fxbanner.big":"GROSSER ZUG!","fxbanner.good":"GUTER ZUG!","fxbanner.huge":"VERHEEREND!","fxbanner.target":"ZIEL ERREICHT!","hand.five":"Fünfling","hand.flush":"Flush","hand.four":"Vierling","hand.full":"Full House","hand.high":"Hohe Karte","hand.pair":"Paar","hand.sflush":"Straight Flush","hand.straight":"Straße","hand.three":"Drilling","hand.twopair":"Zwei Paare","help.combos":"Sonderkombinationen","help.goal":"Erreiche das Punkteziel, bevor dir die Züge ausgehen. Sonst kassiert das Haus.","help.hands":"Hände (Chips × Mult)","help.score":"Jeder Zug zählt CHIPS × MULT. Die Hand (Paar, Drilling, Straße …) gibt die Basis; jede Karte und Kombination addiert mehr. Prüfe vor dem Spielen immer die Kosten. Jede Karte bringt Chips nach ihrem Wert: Ass 11, Bildkarten (B, D, K) 10, die übrigen ihre Zahl.","help.stakes":"Einsätze vervielfachen den Zug, kosten aber Gesundheit, Verstand, Geld oder Schulden. Manche Regeln verbieten sie.","help.stakes_title":"Einsätze","help.suits":"Farben","help.tips":"Lege schwache Karten ab, behalte eine in der Tasche für den perfekten Zug und achte auf deinen Verstand: Sinkt er, verzerrt sich der Bildschirm, und bei 0 brichst du zusammen (+25 Verstand, −20 Gesundheit).","help.tips_title":"Tipps","help.title":"Kurzanleitung","hint.boss":"Jeder Flügel hat einen Wächter mit eigenen Regeln, die das Spiel verändern. Lies sie, bevor du spielst: Ihn zu besiegen bringt dich dem Ende näher.","hint.event":"Hier entscheidest du zwischen zwei Optionen: ABLEHNEN (← oder A) oder ANNEHMEN (→ oder D). Was sich ändert —Gesundheit, Verstand, Geld oder Schulden— siehst du danach. Bei 0 Gesundheit stirbst du, bei wenig Verstand verzerrt sich das Haus, und die Schulden wachsen mit Zinsen.","hint.map":"Tippe einen Raum an, um zu sehen, was es ist, und tippe ihn noch einmal an, um einzutreten. Wenn du dich verirrst, erklärt dir die Schaltfläche ? oben das Spiel, wann immer du willst.","hint.merchant":"Hier wird alles mit Geld bezahlt. Und es wird auch verliehen: Darlehen erhöhen die Schulden, und die Schulden wachsen nach jedem Raum mit Zinsen.","hint.rest":"Eine Verschnaufpause: Wähle nur eine Sache. Schlafen stellt Gesundheit wieder her, Atmen stellt Verstand wieder her, Zahlen senkt die Schulden und Studieren steigert eine Hand.","howto.cards":"HÄNDE UND FARBEN ANSEHEN","howto.s1.h":"Ziel","howto.s1.t":"Du steigst Raum für Raum durch das Haus hinab. Auf jeder Etage wählst du auf der Karte deinen Weg: Du spielst Kartentische, entscheidest bei Ereignissen und setzt manchmal im Schrotflintenduell etwas ein. Jeder Flügel endet mit einem Wächter; danach folgen der Croupier, seine letzte Hand und Die Tür.\nSterben ist nicht das Ende: Du behältst Erinnerungen und Wissen und steigst erneut hinab.","howto.s2.h":"Die Karte","howto.s2.t":"Jeder Raum ist ein Knoten. Tippe einen an, um zu sehen, was es ist, und tippe ihn noch einmal an (oder drücke EINTRETEN), um hineinzugehen. Du kannst nur in Räume gehen, die mit deinem verbunden sind.\nEs gibt Kartentische, Ereignisse, den Händler, Rasten, die Schrotflinte (ein Duell, bei dem du etwas Eigenes einsetzt), eine geheime Knochentür und den Wächter.","howto.s3.h":"Deine Ressourcen","howto.s3.t":"• Gesundheit: Bei 0 stirbst du. Eine zusätzliche Kerze holt dich einmal mit 40 % Gesundheit zurück.\n• Verstand: Er sinkt durch Karten, Einsätze und Ereignisse. Ist er niedrig, verzerrt sich der Bildschirm und Flüstern erscheint; bei 0 brichst du zusammen: Du gewinnst 25 Verstand zurück, verlierst aber 20 Gesundheit.\n• Geld: Man kauft damit im Laden und zahlt Schulden ab.\n• Schulden: Sie steigen durch Darlehen und Einsätze, und nach jedem Raum kommen 3 % Zinsen dazu. Bei hohen Schulden erhöht das Haus das Ziel der Tische um 5 % pro 100 über 200 (bis zu 25 %).\n• Schild: Er absorbiert die Gesundheitskosten von Karten.","howto.s4.h":"Kartentische","howto.s4.t":"Wähle 1 bis 5 Karten aus deiner Hand und spiele: Die Hand (Paar, Drilling, Straße …) ergibt Chips × Multiplikator, und jede Karte und Kombination addiert mehr. Erreiche das Ziel, bevor dir die Züge ausgehen; sonst zahlst du mit Gesundheit, Verstand und Schulden.\nDu kannst ablegen, eine Karte in der Tasche behalten oder einen Einsatz machen (er vervielfacht den Zug, kostet aber). Jeder Gegner bringt eine eigene Regel mit, die am Tisch angezeigt wird. Prüfe vor dem Spielen immer die Kosten.","howto.s5.h":"Ereignisse","howto.s5.t":"Es sind Entscheidungen mit zwei Optionen: ABLEHNEN (← oder A) oder ANNEHMEN (→ oder D); am Handy wischst du. Manchmal erscheint eine dritte, verborgene Option (H), je nachdem, was du weißt oder bei dir trägst. Was deine Entscheidung ändert, wird danach angezeigt, und manche Werkzeuge erlauben es, sie zu wiederholen.","howto.s6.h":"Schrotflintenduell","howto.s6.t":"Du setzt etwas Eigenes ein (Geld, Verstand, Schulden oder eine Karte). Die Schrotflinte hat 6 Kammern, einige geladen. Der Gegner sagt an, wie viele Kugeln es sind … und er kann lügen.\nAm Zug kannst du auf den Gegner schießen (ist die Kammer geladen, verliert er eine Marke; sonst geht der Zug weiter), den Tisch versuchen (ist er leer, bleibst du am Zug; sonst verlierst du eine Marke) oder lauschen (kostet Verstand und liegt nicht immer richtig). Wer den anderen ohne Marken zurücklässt, gewinnt.","howto.s7.h":"Laden und Rast","howto.s7.t":"Der Händler verkauft Gegenstände, Werkzeuge und Karten gegen Geld und verleiht auch Geld: Darlehen erhöhen die Schulden.\nBei einer Rast wählst du nur eine Sache: schlafen (Gesundheit), atmen (Verstand), Schulden zahlen oder eine Hand studieren, um sie eine Stufe zu steigern.","howto.s8.h":"Sterben und Erinnern","howto.s8.t":"Wenn du stirbst, siehst du deine AKTUELLEN SCHULDEN (ein Teil wird in den nächsten Abstieg übernommen) und deine BEHALTENEN ERINNERUNGEN: dauerhafte Vorteile, die man durch bestimmte Taten verdient. Was du entdeckst, wird als Wissen gespeichert und öffnet verborgene Optionen und Türen.\nEs gibt 6 Enden; Die Tür verlangt für jedes etwas anderes.","howto.title":"So wird gespielt","hud.debt":"Schulden","hud.deck":"Stapel","hud.health":"Gesundheit","hud.howto":"So wird gespielt","hud.inventory":"Inventar","hud.items":"Gegenstände","hud.jokers":"Joker","hud.levels":"Handstufen","hud.lives":"Leben","hud.money":"Geld","hud.no_items":"Noch nichts.","hud.sanity":"Verstand","hud.settings":"Einstellungen","hud.tools":"Werkzeuge","intro.1":"Bist du wach?","intro.2":"Endlich.","intro.3":"Wir müssen eine Partie zu Ende spielen.","intro.4":"Welche Partie?","intro.5":"Die vorige.","intro.6":"Setz dich. Ich zeige dir, wie man hier spielt.","item.campanilla.desc":"+1 Ablage pro Runde.","item.campanilla.name":"Glöckchen","item.ceniza.desc":"+15 Chips pro Zug. −2 Verstand nach jedem Raum.","item.ceniza.name":"Asche","item.cuchilla_oxidada.desc":"Blut gibt +1 Mult mehr, kostet aber +1 Gesundheit.","item.cuchilla_oxidada.name":"Rostige Klinge","item.diente_leche.desc":"Zähne wachsen +1 mehr pro Zug.","item.diente_leche.name":"Milchzahn","item.espejo_roto.desc":"+2 Mult. Start mit −2 Verstand. Eine Entscheidung pro Partie wiederholbar (−5 Verstand).","item.espejo_roto.name":"Zerbrochener Spiegel","item.ficha_negra.desc":"Einsätze multiplizieren +0,15 mehr. Entscheidung für 50 Schulden zurücknehmen.","item.ficha_negra.name":"Schwarzer Chip","item.guante_crupier.desc":"+1 Zug pro Runde.","item.guante_crupier.name":"Handschuh des Croupiers","item.libro_cuentas.desc":"Schuldzinsen werden halbiert.","item.libro_cuentas.name":"Rechnungsbuch","item.llave_hueso.desc":"Start-Schild 4. Öffnet die verborgene Tür. Ermöglicht das Ende der Tür.","item.llave_hueso.name":"Knochenschlüssel","item.moneda_mordida.desc":"+5 Geld pro gewonnener Runde. Vergoldete Karten geben +2 mehr.","item.moneda_mordida.name":"Angebissene Münze","item.ojo_vidrio.desc":"+1 Karte auf der Hand. Nebel wirkt nicht auf dich.","item.ojo_vidrio.name":"Glasauge","item.reloj_parado.desc":"Ziele sinken um 8 %. Schulden wachsen 50 % schneller.","item.reloj_parado.na imo_aliento.desc":"×3, wenn deine Gesundheit unter 30 % liegt.","joker.ultimo_aliento.name":"Der letzte Atemzug","joker.vela_viuda.desc":"×1,5, wenn dein Verstand unter 40 liegt.","joker.vela_viuda.name":"Die Kerze der Witwe","know.clue":"Hinweis auf den Croupier","know.k_chair_founder.name":"Der Gründer","know.k_chair_founder.text":"Der Mann auf dem Stuhl gründete das Haus und blieb sitzen.","know.k_child_self.name":"Das Kind bist du","know.k_child_self.text":"Das Kind im Geburtstagskleid warst du. Seine Regel „Blinde Augen“ blendet dich nicht mehr.","know.k_cook_jars.name":"Die Gläser","know.k_cook_jars.text":"Der Koch macht Erinnerungen in Gläsern ein, und der Händler verkauft sie. Du weißt, woher sein Hunger kommt: Er verlangt nicht mehr zu viel von dir.","know.k_dealer_deck.name":"Das Deck des Croupiers","know.k_dealer_deck.text":"Der Croupier gibt immer von unten. Sein Deck hat keinen König.","know.k_dealer_ledger.name":"Das Buch des Croupiers","know.k_dealer_ledger.text":"In seinem Rechnungsbuch ist jede Zeile eine Partie. Die letzte fehlt.","know.k_dealer_no_name.name":"Der Croupier hat keinen Namen","know.k_dealer_no_name.text":"Niemand erinnert sich an den Namen des Croupiers. Er selbst auch nicht.","know.k_door_same.name":"Alle Türen sind dieselbe","know.k_door_same.text":"Jede Tür führt in denselben Raum. Das muss man wissen, um die Wahrheit zu sehen.","know.k_drowned_paid.name":"Der Ertrunkene hat bezahlt","know.k_drowned_paid.text":"Der Ertrunkene zahlte seine Schuld mit Wasser. Seine Regel „Ertrinken“ lässt dich nicht mehr sinken.","know.k_girl_lies.name":"Worüber das Mädchen lügt","know.k_girl_lies.text":"Das Mädchen mit dem vernähten Auge lügt, wenn es die Wahrheit sagt. Seine Regel „Keine Wiederholung“ bindet dich nicht mehr.","know.k_moon.name":"Der Mond im Fenster","know.k_moon.text":"Der Mond im Fenster ist ein Scheinwerfer. Ohne seine Kälte verliert der Mann auf dem Stuhl seine Regel.","know.k_nun_name.name":"Der Name des Croupiers","know.k_nun_name.text":"Die Schwester weiß, wie der Croupier hieß, und wird es nicht sagen. Aber du weißt, dass er einmal einen Namen hatte. Ihre Strafe fürs Wiederholen von Zügen trifft dich nicht mehr.","know.k_nurse_eye.name":"Das vernähte Auge","know.k_nurse_eye.text":"Die Krankenschwester nähte das Auge des Mädchens zu, weil es zu viel sah. Du weißt, was ihre Lügen verbergen, und Augen nützen dir gegen die Krankenschwester wieder.","know.k_pianist_hands.name":"Die Hände des Pianisten","know.k_pianist_hands.text":"Der Pianist bezahlte mit seinen Händen das erste Blatt des Hauses. Die Archivarin verwahrt sie in einer Schublade, die sich nie öffnet.","know.k_players.name":"Die Spieler","know.k_players.text":"Alle hier haben schon vorher gespielt. Alle.","know.k_puppet_script.name":"Das Skript","know.k_puppet_script.text":"Die Puppe wiederholt das Skript des Croupiers. Alles, was hier gesagt wird, steht geschrieben; offen bleibt, von wem.","know.k_reflection.name":"Dein Spiegelbild","know.k_reflection.text":"Im Spiegel bist nicht du es, der sich zuerst bewegt.","know.k_room13.name":"Raum 13","know.k_room13.text":"Es gibt einen Raum, der auf keinem Plan steht.","know.k_watcher.name":"Jemand sieht zu","know.k_watcher.text":"Jemand sieht der Partie von außerhalb des Hauses zu.","legal.back":"ZURÜCK ZUM SPIEL","legal.lang":"Sprache","legal.privacy.s1.h":"1. Was das Spiel speichert","legal.privacy.s1.t":"Das Spiel speichert deinen Spielstand und deine Einstellungen (Sprache, Lautstärke, Barrierefreiheit) im lokalen Speicher deines Browsers. Diese Daten bleiben auf deinem Gerät: Das Spiel sendet sie an keinen Server.\nDu kannst sie mit FORTSCHRITT ZURÜCKSETZEN im Menü oder in den Browsereinstellungen löschen. Wenn du sie löschst, verlierst du deinen Spielstand.","legal.privacy.s2.h":"2. Keine Dienste von Drittanbietern","legal.privacy.s2.t":"Das Spiel enthält weder Werbung noch Analyse, verwendet keine Cookies und lädt keine Ressourcen von anderen Websites. Es erhebt keine personenbezogenen Daten.","legal.privacy.s3.h":"3. Hosting","legal.privacy.s3.t":"Wie jede Website kann das Hosting, auf dem das Spiel veröffentlicht ist (derzeit GitHub Pages), technische Daten der Besuche, etwa die IP-Adresse, nach eigenen Bedingungen protokollieren. Das Spiel erhält diese Daten nicht.","legal.privacy.s4.h":"4. Inhaltshinweis","legal.privacy.s4.t":"THE HOUSE ALWAYS WATCHES ist ein fiktives Horrorwerk: Die Figuren, Orte und Ereignisse sind erfunden.\nDas Geld, die Chips, die Wetten und die Schulden im Spiel sind fiktiv: Sie haben keinen realen Wert, lassen sich weder kaufen noch gegen echtes Geld eintauschen, und das Spiel ist kein Glücksspielangebot.\nEs enthält Flacker- und Wackeleffekte sowie visuelle Verzerrungen, wenn der Verstand sinkt. Du kannst die Effekte unter EINSTELLUNGEN → Effekte reduzieren verringern. Wenn du an photosensibler Epilepsie oder anderen Beschwerden leidest, sprich vor dem Spielen mit einer Fachperson.","legal.title.privacy":"Datenschutz und Hinweise","legal.updated":"Zuletzt aktualisiert: 2026-10-01","log.round_lost":"Du hast die Runde verloren. Das Haus kassiert.","log.round_won":"Runde gewonnen.","map.enter":"EINTRETEN","map.info.event":"Etwas wartet auf dich. Du weißt nicht was.","map.info.merchant":"Ein Verkäufer von Dingen, die man nicht verkaufen sollte.","map.info.rest":"Eine Ecke zum Durchatmen.","map.info.secret":"Eine Knochentür, die sonst niemand sieht.","map.locked":"außer Reichweite","map.opp":"Gegner: {name}","map.pick":"Wähle deinen nächsten Raum.","map.shotgun":"Schrotflintenduell. Du setzt etwas Eigenes.","map.title":"Raum {n}/{total}","map.visited":"besucht","mem.m01.name":"Der erste Schlag","mem.m01.text":"Einmal zu sterben lehrte dich, etwas Geld dabeizuhaben. +10 Geld zu Beginn.","mem.m02.name":"Ersatzhände","mem.m02.text":"Du hast gelernt, ohne Zögern abzulegen. +1 Ablage pro Runde.","mem.m03.name":"Narben","mem.m03.text":"Der Körper erinnert sich. +10 maximale Gesundheit.","mem.m04.name":"Die Münze des Mäd
