la dernière table. Ils arrivent toujours jusqu’ici.","dlg.final.2":"Une dernière main. C’est moi qui distribue. Personne ne mise : tout se voit.","dlg.final.3":"Si tu gagnes, nous parlerons de la porte. Si tu perds, tu recommences. C’est pareil, en fait.","dlg.final.4":"Bien. Il reste la dernière balle. Une dernière chose et je te laisse partir.","dlg.final.5":"Six chambres. Quatre marques chacun. Cette fois, personne ne regarde… sauf la maison.","dlg.final.duel_lost":"« La dernière balle était à moi. Encore. »","dlg.final.duel_won":"« La partie est finie. Il ne reste que la porte. »","dlg.final.lost":"« Tu as perdu la dernière main. La maison encaisse avec intérêts. »","dlg.final.won":"« Tu as gagné la main. La maison se tait. »","door.hint":"Chaque fin exige quelque chose de différent. Choisis avec soin.","door.open":"Disponible","door.req.crupier":"Requiert : 3 indices sur le Croupier.","door.req.deuda":"Toujours disponible.","door.req.espectador":"Requiert : « Quelqu’un regarde » et « Ton reflet ».","door.req.partida":"Requiert : « Les joueurs » et avoir rencontré 5 personnages.","door.req.puerta":"Requiert : la Clé d’os.","door.req.verdad":"Requiert : 5 fins vues et « Toutes les portes sont la même ».","door.seen":"Fin déjà vue","door.title":"La Porte","duel.announce":"{name} annonce : {n} chambres chargées sur 6.","duel.announce_note":"Il ment peut-être.","duel.anomaly":"« Ce n’était pas la balle que j’attendais. »","duel.cap.back":"RICOCHET !","duel.cap.bang":"BANG !","duel.cap.click":"CLIC…","duel.cap.safe":"SANS DANGER","duel.chambers":"Chambres","duel.contract.honest":"Ce n’était pas un mensonge : la Dette monte de 20.","duel.contract.lied":"Le contrat mord : {name} perd une marque.","duel.ev.f_shot_click":"{name} tire. Clic.","duel.ev.f_shot_hit":"{name} tire : tu perds une marque.","duel.ev.f_table_backfire":"La Table se retourne contre {name} : il perd une marque.","duel.ev.f_table_safe":"{name} tente la Table. Rien.","duel.ev.p_shot_click":"Clic. La chambre était vide.","duel.ev.p_shot_hit":"Tu tires : {name} perd une marque.","duel.ev.p_table_backfire":"La Table te renvoie la balle : tu perds une marque.","duel.ev.p_table_safe":"La Table se tait. Tu gardes la main.","duel.ev.reload":"Le fusil se recharge.","duel.ev.skipped":"{name} oublie son tour.","duel.final":"LA DERNIÈRE BALLE","duel.heard_empty":"Tu crois entendre… le vide.","duel.heard_loaded":"Tu crois entendre… une balle.","duel.listen":"ÉCOUTER (−{c} Raison)","duel.lose":"« La maison encaisse. »","duel.marks_foe":"Marques de l’adversaire","duel.marks_you":"Tes marques","duel.n.backfire_f":"La Table renvoie la balle à {name}.","duel.n.backfire_p":"La Table te renvoie la balle.","duel.n.empty":"Clic… La chambre {k} était VIDE.","duel.n.f_aim_p":"{name} te vise et presse la détente…","duel.n.f_aim_table":"{name} tente la Table…","duel.n.f_loses":"{name} perd une marque. Il lui en reste {n}.","duel.n.loaded":"BANG ! La chambre {k} était CHARGÉE.","duel.n.p_aim_foe":"Tu vises {name} et tu presses la détente…","duel.n.p_aim_table":"Tu tentes la Table : tu poses le canon sur le tapis…","duel.n.p_loses":"Tu perds une marque. Il t’en reste {n}.","duel.n.pass_f":"Le tour passe à {name}.","duel.n.pass_p":"Le tour revient à toi.","duel.n.reload":"Le fusil se recharge : six chambres neuves. {name} annonce {n} balles.","duel.n.safe_f":"La Table se tait : {name} garde la main.","duel.n.safe_p":"La Table se tait : tu gardes la main.","duel.n.skip_hint":"Touche l’écran pour accélérer.","duel.n.skipped":"{name} oublie son tour.","duel.n.turn_of":"Tour de {name}","duel.setup.note":"Si tu gagnes : +10 d’Argent en plus. Si tu perds : −12 de Santé en plus de la mise. Personne ne t’oblige à croire ce qu’on annonce.","duel.setup.sub":"Que mets-tu sur la table ?","duel.shoot_foe":"TIRER SUR L’ADVERSAIRE","duel.shoot_table":"TENTER LA TABLE","duel.stake.card.lose":"Si tu perds : tu perds une carte","duel.stake.card.name":"Une carte de ton paquet","duel.stake.card.win":"Si tu gagnes : une carte spéciale","duel.stake.debt.lose":"Si tu perds : +{n} de Dette","duel.stake.debt.name":"{n} de Dette","duel.stake.debt.win":"Si tu gagnes : −60 de Dette","duel.stake.money.lose":"Si tu perds : −{n} d’Argent","duel.stake.money.name":"{n} d’Argent","duel.stake.money.win":"Si tu gagnes : +25 d’Argent","duel.stake.sanity.lose":"Si tu perds : −{n} de Raison","duel.stake.sanity.name":"{n} de Raison","duel.stake.sanity.win":"Si tu gagnes : +8 de Raison","duel.title":"LE FUSIL","duel.tool.memory":"L’adversaire oubliera son prochain tour.","duel.truth":"Témoin : il y avait {n} vraies balles.","duel.truth.honest":"Il disait vrai.","duel.truth.lied":"On t’a menti.","duel.turn_foe":"Tour de l’adversaire…","duel.turn_you":"À toi","duel.win":"« La maison paie. »","duel.you":"Toi","egg.arrepentido.hint":"Acheter et vendre sans quitter la boutique.","egg.arrepentido.name":"Achète et regrette","egg.arrepentido.text":"Tu as acheté un joker et tu l’as revendu pendant la même visite. Le Vendeur soupire : « Ils reviennent toujours. »","egg.ases.hint":"Tous les As, en un seul coup.","egg.ases.name":"Quatre As","egg.ases.text":"Quatre As dans une main. Personne ne distribue ainsi par hasard.","egg.cinco.hint":"Une main a cinq doigts ; une cour, cinq jokers.","egg.cinco.name":"Cinq bouffons","egg.cinco.text":"Toute une cour de jokers murmure dans ton dos. Il va falloir payer la fête.","egg.colapso.hint":"Regarder trop longtemps ce qu’il ne faut pas.","egg.colapso.name":"Raison à zéro","egg.colapso.text":"Ton esprit s’est brisé complètement. La maison le note avec un sourire et te rend juste de quoi continuer.","egg.jackpot.hint":"Trois chiffres porte-bonheur, ensemble, dans une main.","egg.jackpot.name":"Triple sept","egg.jackpot.text":"Trois sept dans une main. Des cloches sonnent qui n’existent pas.","egg.konami.hint":"Un code de touches d’une autre époque, tapé dans le menu.","egg.konami.name":"Code ancien","egg.konami.text":"Une vieille combinaison d’une autre époque. Le Croupier fait semblant de ne pas l’avoir vue.","egg.limite.hint":"Gagner sans aucune marge : au dernier coup.","egg.limite.name":"De justesse","egg.limite.text":"Tu as gagné au tout dernier coup, la maison souriant déjà.","egg.mesa3.hint":"Pendant le duel, tente la Table et qu’elle ne réponde pas… trois fois de suite.","egg.mesa3.name":"La Table se tait","egg.mesa3.text":"Tu as tenté la Table trois fois de suite et elle s’est tue les trois fois. Personne ne lui avait jamais parlé ainsi.","egg.ojos.hint":"Dans le menu, les yeux du Croupier ne te quittent pas. Touche-les, encore et encore.","egg.ojos.name":"Il te regarde en retour","egg.ojos.text":"Sept fois tu as soutenu le regard du Croupier. Pour une fois, il cligne des yeux.","egg.paciencia.hint":"La maison a toute la nuit. Toi aussi, peut-être.","egg.paciencia.name":"Patience","egg.paciencia.text":"Tu as attendu une minute entière sans rien toucher. La maison apprécie ceux qui savent attendre ; elle ne le leur rend presque jamais.","egg.poliglota.hint":"Quatre langues, une seule dette.","egg.poliglota.name":"La maison parle toutes les langues","egg.poliglota.text":"Espagnol, anglais, français, allemand : la dette se comprend pareil dans les quatre.","egg.real.hint":"La main la plus noble du jeu complet, du dix à l’As.","egg.real.name":"Quinte flush royale","egg.real.text":"Dix, Valet, Dame, Roi et As de la même couleur. Le Croupier cesse de battre les cartes une seconde… puis recommence.","egg.unlocked":"Secret découvert : {name}","ending.crupier.epi":"Quelqu’un s’assoit pour la première fois en face de toi. Tu souris sans bouger la bouche.","ending.crupier.text":"Tu lui demandes d’ôter son sourire. Dessous, pas de visage : un miroir à ton âge. « J’ai gagné il y a si longtemps que j’ai oublié comment sortir », dit-il. Il te tend le paquet et s’assoit sur ta chaise. C’est toi qui distribues, maintenant.","ending.crupier.title":"Le Croupier","ending.deuda.epi":"La Maison gagne toujours. Mais aujourd’hui, elle a mis plus de temps.","ending.deuda.text":"Tu joues la dernière main et tu gagnes. La Maison inscrit la victoire dans son livre et te rend un jeton noir. « Tu me dois encore une partie », dit-elle. Tu te lèves. La porte reste fermée, mais tu sais compter.","ending.deuda.title":"La Dette","ending.espectador.epi":"Qui regarde fait aussi partie de la partie.","ending.espectador.text":"Tu regardes hors de la salle, là où personne ne devrait regarder. Derrière la vitre, un visage éclairé par un écran. C’est toi, ou quelqu’un qui te regarde jouer. Vous vous observez une seconde. Puis la maison baisse le rideau.","ending.espectador.title":"Le Spectateur","ending.first":"NOUVELLE FIN","ending.memories":"Souvenirs gagnés","ending.n":"FIN {n} / {total}","ending.partida.epi":"Sans joueurs, la maison n’est qu’une salle éclairée.","ending.partida.text":"Tu les appelles par leur nom, un à un : la fille, l’homme à la chaise, le noyé, l’archiviste, l’enfant. Chacun se lève de sa table. Personne ne se souvenait d’avoir été joueur. Ils lâchent leurs cartes en même temps. La partie s’arrête faute de quelqu’un qui veuille continuer.","ending.partida.title":"La Partie","ending.puerta.epi":"La porte se referme toute seule. Cette fois, du bon côté.","ending.puerta.text":"La clé d’os tourne sans bruit. Derrière la porte : un couloir et, au bout, une autre porte identique. Tu la franchis quand même. Dehors, il y a de l’air véritable et une pancarte : FERMÉ POUR TRAVAUX. Pour la première fois, personne ne te regarde.","ending.puerta.title":"La Porte","ending.to_menu":"RETOUR AU MENU","ending.true_hint":"Tu as vu cinq fins. Il reste une porte.","ending.verdad.epi":"Merci d’avoir joué. Tu peux cesser de regarder.","ending.verdad.text":"Tu as vu toutes les fins. Tu sais que toutes les portes sont la même et que celui qui regarde, c’est toi. Tu fermes le livre de comptes et tu écris la dernière ligne. La maison s’éteint. Il n’y a plus de partie : il ne reste que celui qui l’a jouée, et le silence de l’autre côté de l’écran.","ending.verdad.title":"La Vérité","event.archive_ledger.a":"Lire le registre","event.archive_ledger.b":"Le refermer","event.archive_ledger.ra":"Les colonnes de chiffres sont des parties. Toutes finissent à la même porte. Tu comprends qu’il n’y a pas tant de portes.","event.archive_ledger.rb":"« Sage décision », dit-elle. « Même si cela ne change rien. » Elle te donne quelques pièces pour ta discrétion.","event.archive_ledger.text":"Une femme aux lunettes épaisses range des registres qui gouttent d’encre. « Tous les noms sont ici », dit-elle. « Et toutes les portes sont la même. »","event.archive_ledger.title":"L’Archiviste","event.blood_vending.a":"Payer de ton sang","event.blood_vending.b":"Passer ton chemin","event.blood_vending.ra":"Le distributeur ronronne, satisfait, et crache une carte tiède.","event.blood_vending.rb":"Le distributeur s’éteint dans un soupir. Un instant, il a paru déçu.","event.blood_vending.text":"Un distributeur délivre des cartes contre une piqûre au doigt. Une pancarte : « Pas de monnaie rendue ».","event.blood_vending.title":"Le distributeur de cartes","event.chair_bet.a":"Accepter le pari","event.chair_bet.b":"Refuser","event.chair_bet.ra":"Il lance les dés sans regarder. Tu les entends rouler et s’arrêter juste quand tu cesses d’écouter.","event.chair_bet.rb":"« Je comprends », murmure-t-il. « Moi aussi, je préférerais ne pas me lever. »","event.chair_bet.text":"L’Homme à la Chaise ne se lève pas, et peut-être ne le peut-il pas. « Je mise la chaise », dit-il d’une voix usée. « Contre ta patience. »","event.chair_bet.title":"La chaise","event.chair_secret.a":"L’écouter","event.chair_secret.b":"L’interrompre","event.chair_secret.ra":"Il parle des heures, ou des secondes. À la fin, tu comprends à qui est cette chaise et pourquoi il la garde.","event.chair_secret.rb":"Il se tait. La maison entière semble retenir son souffle jusqu’à ce que tu t’éloignes.","event.chair_secret.text":"« Cette maison a été fondée par un joueur fatigué », dit l’Homme à la Chaise. « Qui est resté attendre les autres. » La chaise craque.","event.chair_secret.title":"Le fondateur","event.chapel_candles.a":"Allumer la tienne","event.chapel_candles.b":"Éteindre les autres","event.chapel_candles.ra":"La flamme est froide et ferme. Quelque chose soupire dans la chapelle. Tu gardes un bout de bougie pour plus tard.","event.chapel_candles.rb":"Tu les souffles une à une. Dans le noir, la chapelle paraît plus grande, et plus à toi. Tu trouves des pièces d’offrande par terre.","event.chapel_candles.text":"Il y a des bougies partout et aucune ne se consume. Chacune porte un nom écrit à la cire. La tienne n’est pas allumée.","event.chapel_candles.title":"Mille bougies","event.child_1.a":"« Oui »","event.child_1.b":"« Non »","event.child_1.ra":"Il acquiesce, satisfait. « Moi aussi. » Il te donne un bonbon au goût de métal.","event.child_1.rb":"« Menteur », dit-il sans rancune. De près, son visage ressemble à une photo de toi enfant que tu n’as jamais vue.","event.child_1.text":"Un enfant en robe d’anniversaire te tire par la manche. « Tu as encore perdu ? » demande-t-il. Ce n’est pas une question.","event.child_1.title":"L’enfant","event.child_2.a":"Garder le dessin","event.child_2.b":"Le laisser","event.child_2.ra":"Tu plies le papier. Il est lourd. Quelque part dans la maison, un couloir a pivoté pour placer une nouvelle porte.","event.child_2.rb":"Il hausse les épaules et raye la porte. Un instant plus tard, la craie la redessine toute seule.","event.child_2.text":"L’enfant dessine une porte à la craie rouge et écrit un numéro au-dessus : 13. « Elle est dans le couloir. Elle ne s’ouvre que si tu sais laquelle. »","event.child_2.title":"Le dessin","event.confession_booth.a":"Te confesser","event.confession_booth.b":"Partir","event.confession_booth.h":"Interroger sur le registre","event.confession_booth.ra":"Tu en dis trop. Tu ressors plus léger... et dans un registre, quelque chose pèse un peu plus.","event.confession_booth.rb":"En t’éloignant, tu entends ta propre voix se confesser de l’autre côté.","event.confession_booth.rh":"« Une partie peut être effacée », murmure-t-elle. « Mais il faut le vouloir. » La dette se desserre.","event.confession_booth.text":"Un confessionnal entre deux tables. De l’autre côté, quelqu’un respire lentement et attend que tu parles le premier.","event.confession_booth.title":"Le confessionnal","event.cook_1.a":"Manger","event.cook_1.b":"La refuser","event.cook_1.ra":"Elle est chaude et a le goût de quelque chose dont tu te souviens sans l’avoir vécu. Tu te sens mieux ; la note aussi s’en aperçoit.","event.cook_1.rb":"Il hausse les épaules. « Plus pour l’Enfant », dit-il, et il met de côté une assiette que personne ne vient chercher.","event.cook_1.text":"Dans la cuisine, un homme au tablier taché remue une énorme marmite. « Mange », dit le Cuisinier, « ici tout se récupère ». Tu ne sais pas de quoi est faite la soupe.","event.cook_1.title":"La soupe du jour","event.cook_2.a":"Ouvrir un bocal","event.cook_2.b":"Lui laisser un souvenir à toi","event.cook_2.ra":"Il sent la pluie et une cuisine qui n’est pas celle-ci. Un instant, tu comprends comment améliorer tes mains. Le souvenir s’évapore, et l’étiquette avec lui.","event.cook_2.rb":"Tu choisis l’un de tes souvenirs et il le met dans un bocal vide. « Bon prix », dit-il en comptant quelques pièces. Rien ne te manque. C’est ça, l’étrange.","event.cook_2.text":"Dans le garde-manger, des étagères de bocaux étiquetés : un anniversaire, un adieu, un lundi quelconque. « Des souvenirs en conserve », explique le Cuisinier. « Mon frère prend ce qui reste. »","event.cook_2.title":"Les bocaux","event.cook_3.a":"La porter sans l’ouvrir","event.cook_3.b":"L’ouvrir","event.cook_3.ra":"Le Vendeur la reçoit sans te remercier et te paie. « Mon frère cuisine bien », dit-il. « C’est la seule chose qu’il ne fait pas payer. » Il ne te regarde plus avec indifférence.","event.cook_3.rb":"Dedans, il y a un mot d’une seule ligne et une carte que tu ne te souviens pas d’avoir vue. Le Cuisinier le sait avant que tu sortes du garde-manger.","event.cook_3.text":"Le Cuisinier te donne une boîte ficelée. « Pour mon frère », dit-il. « Celui qui vend ce que je garde. Ne l’ouvre pas. »","event.cook_3.title":"Une course pour le Vendeur","event.cracked_clock.a":"La remonter","event.cracked_clock.b":"La laisser ainsi","event.cracked_clock.ra":"Quelque chose craque à l’intérieur. L’horloge te reste dans la main, arrêtée, et tu ne sais plus l’heure.","event.cracked_clock.rb":"Mieux vaut ne pas toucher au temps ici. Tu trouves quelques pièces sous le balancier.","event.cracked_clock.text":"Une horloge murale indique toujours 3 h 33. Si tu la fixes, la trotteuse tremble, comme si elle réclamait quelque chose.","event.cracked_clock.title":"L’horloge arrêtée","event.dealer_offer.a":"Signer","event.dealer_offer.b":"Refuser","event.dealer_offer.ra":"L’encre est chaude. Le papier se plie tout seul dans ton manteau. Tu te sens léger, et surveillé.","event.dealer_offer.rb":"Il reprend le contrat sans insister. « L’offre expire. » Il te laisse quelques pièces pour le dérangement. C’est pire ainsi.","event.dealer_offer.text":"Le Croupier fait glisser un contrat sur la table. « Une signature et cette dette disparaît. » Les petites lignes bougent.","event.dealer_offer.title":"L’offre","event.dealer_question.a":"« Oui, je m’en souviens »","event.dealer_question.b":"« Non, je ne m’en souviens pas »","event.dealer_question.h":"Interroger sur le paquet","event.dealer_question.ra":"Il note quelque chose. « Curieux. Personne ne s’en souvient. » Il te regarde comme si tu venais de mentir à un miroir.","event.dealer_question.rb":"« Moi non plus », avoue-t-il, et pour la première fois le paquet s’arrête. Tu lui demandes son nom. Il se tait. Il n’en a pas.","event.dealer_question.rh":"« Cinquante-deux cartes », dit-il sans surprise. « Quatre couleurs, treize chacune, de l’As au Roi. Et une qui manque. » Il sourit.","event.dealer_question.text":"« Tu te souviens comment tu es arrivé ? » demande le Croupier en battant sans regarder. « Avant la première main. »","event.dealer_question.title":"Une question","event.dealer_tea.a":"Boire","event.dealer_tea.b":"Refuser la tasse","event.dealer_tea.ra":"Chaud, sucré, bien trop familier. Au fond de la tasse, gravé, ton nom. Tu te sens mieux malgré tout.","event.dealer_tea.rb":"Il retire la tasse sans se vexer. « Quand tu voudras. » Vous savez tous deux que ce n’est pas de la politesse.","event.dealer_tea.text":"Le Croupier sert du thé dans deux tasses identiques. « Repose-toi un peu. La maison offre. » La vapeur dessine un chiffre.","event.dealer_tea.title":"Le thé du Croupier","event.debt_collector.a":"En payer une partie","event.debt_collector.b":"Refuser de payer","event.debt_collector.ra":"Il compte les billets deux fois et note quelque chose. « Un plaisir. »","event.debt_collector.rb":"« Je le noterai avec les intérêts. » Il part sans bruit. Le froid reste.","event.debt_collector.text":"Un homme en costume gris t’attend avec un reçu. « Votre dette, monsieur. Elle porte votre signature. » Tu ne te souviens pas d’avoir signé.","event.debt_collector.title":"Le percepteur","event.dice_pit.a":"Lancer les dés","event.dice_pit.b":"Te retirer","event.dice_pit.ra":"Les dés roulent et s’arrêtent. La voix connaissait déjà le résultat.","event.dice_pit.rb":"La voix claque la langue. « Une autre fois. » Tu l’entends rire plus bas.","event.dice_pit.text":"Une fosse de sable avec des dés en os. Une voix sans corps demande : « Pile ou face ? » Les dés n’ont ni l’un ni l’autre.","event.dice_pit.title":"La fosse aux dés","event.drowned_pier.a":"Lui tendre la main","event.drowned_pier.b":"T’éloigner","event.drowned_pier.ra":"Il t’agrippe. Lourd, glacé, il murmure son paiement : on l’a coulé pour une dette qui était la tienne. Il te laisse une poignée de sel.","event.drowned_pier.rb":"Les coups te suivent dans le dos, toujours à la même distance.","event.drowned_pier.text":"Une jetée en bois sans eau. En dessous, un homme trempé jusqu’aux os frappe le sol du bout des doigts, très lentement.","event.drowned_pier.title":"La jetée à sec","event.first_chip.a":"Prendre le jeton","event.first_chip.b":"Le laisser rouler","event.first_chip.ra":"Il pèse plus qu’il n’en a l’air. Quelque chose vient d’être noté dans un livre que tu ne vois pas.","event.first_chip.rb":"Le jeton se perd dans l’obscurité. Le Croupier hoche la tête, comme s’il s’y attendait.","event.first_chip.text":"Un jeton noir roule jusqu’à tes pieds. Le Croupier sourit sans bouger la bouche : « Il est à toi. Il l’a toujours été. »","event.first_chip.title":"Le jeton noir","event.girl_1.a":"Jouer à pile ou face","event.girl_1.b":"Refuser","event.girl_1.ra":"La pièce tourne trop longtemps. Elle retombe, ou pas ; elle a déjà détourné le regard.","event.girl_1.rb":"« Quel ennui », dit-elle en rangeant la pièce. Elle te suit de son bon œil jusqu’à ce que tu disparaisses.","event.girl_1.text":"Une fille dont un œil est cousu au fil rouge fait tourner une pièce. « Pile ou face. Tu choisis. Moi, je regarde. »","event.girl_1.title":"La Fille à l’Œil Cousu","event.girl_2.a":"La croire","event.girl_2.b":"Douter d’elle","event.girl_2.ra":"Tu la remercies. Tu acceptes son conseil et son argent ; les deux sont faux, mais utiles.","event.girl_2.rb":"Elle sourit de travers. « Malin. » Tu apprends son tic : elle ment quand elle regarde le sol.","event.girl_2.text":"« Je t’avertis : la Maison ne ment pas », dit la fille à l’œil cousu. Elle le dit en fixant le sol. C’est le genre de phrase qu’on dit en mentant.","event.girl_2.title":"Ce que dit la fille","event.girl_3.a":"Accepter l’œil","event.girl_3.b":"Le refuser","event.girl_3.ra":"Tu le mets et tu vois davantage : les cartes, la salle, quelque chose derrière la salle. Elle garde le fil.","event.girl_3.rb":"« Une autre fois, alors. » Elle referme la main, et l’œil, si c’en était un, disparaît.","event.girl_3.text":"La fille tend un œil de verre sur sa paume. « Celui-ci voit davantage. Il coûte aussi davantage. » Le fil rouge s’est un peu défait.","event.girl_3.title":"Le fil rouge","event.kitchen_fire.a":"Jeter une reconnaissance de dette","event.kitchen_fire.b":"Remuer la marmite","event.kitchen_fire.ra":"Tu en choisis un à ta signature et tu le jettes. Il brûle bleu. La dette s’allège… et quelque chose en toi aussi.","event.kitchen_fire.rb":"Tu remues lentement. Un instant, le bouillon ressemble à ton visage. Tu te sers une louche ; ça te fait du bien, et la maison te le fait payer.","event.kitchen_fire.text":"Sous la grande marmite brûlent de vieux papiers : reconnaissances de dette, reçus, promesses. Le Cuisinier est absent. Le feu te regarde avec faim.","event.kitchen_fire.title":"Le fourneau","event.merchant_memory.a":"Acheter un bocal","event.merchant_memory.b":"Refuser","event.merchant_memory.ra":"Tu le débouches et tu sais soudain mieux jouer une main précise. Tu ne sais pas pourquoi.","event.merchant_memory.rb":"« Quand tu voudras. » Il est un peu vexé. C’est le seul marchand qui ne tourne jamais le dos.","event.merchant_memory.text":"Le Colporteur vend des souvenirs en bocaux. « Celui-ci sent ton premier casino. Celui-là, ta dernière main. »","event.merchant_memory.title":"Un souvenir à vendre","event.mirror_hall.a":"Toucher la vitre","event.mirror_hall.b":"Détourner les yeux","event.mirror_hall.h":"Lui dire ton nom","event.mirror_hall.ra":"Il est tiède, comme une main. Ton reflet sourit une demi-seconde avant toi.","event.mirror_hall.rb":"Tu comptes les pas jusqu’à la sortie. Personne ne te suit. Personne, sauf un.","event.mirror_hall.rh":"Le reflet acquiesce. Pour la première fois, tu sens que quelqu’un de l’autre côté joue pour toi.","event.mirror_hall.text":"Chaque miroir te renvoie ton geste avec une seconde de retard. Le dernier ne te suit pas : il te regarde.","event.mirror_hall.title":"Le couloir des miroirs","event.moon_window.a":"L’ouvrir","event.moon_window.b":"La fermer","event.moon_window.ra":"L’air sent la cire. Tu sais désormais que l’Homme à la Chaise ne supporte pas cette lumière.","event.moon_window.rb":"Tu la refermes doucement. De l’autre côté de la vitre, quelque chose frappe deux fois, poliment.","event.moon_window.text":"Une fenêtre sans mur montre une lune immense. Dans le reste du casino, il fait jour.","event.moon_window.title":"La fenêtre","event.nun_1.a":"Te confesser","event.nun_1.b":"Te taire","event.nun_1.ra":"Tu parles pendant ce qui semble une nuit entière. Tu sors plus léger… et avec une note un peu plus longue. Elle note quelque chose sur les grains de son chapelet.","event.nun_1.rb":"Elle hoche lentement la tête. « Le silence aussi est une dette », dit-elle, et elle allume une bougie sans rien te demander.","event.nun_1.text":"Une nonne au voile noir te fait de la place dans le confessionnal. « Dis-moi ce que tu dois », dit la Sœur. « Ici tout se dit, même si personne n’écoute. »","event.nun_1.title":"Le voile","event.nun_2.a":"Poser des questions sur lui","event.nun_2.b":"Prier avec elle","event.nun_2.h":"Demander le nom du Croupier","event.nun_2.ra":"« Il avait une dette et je lui ai offert de l’eau. Il a accepté. Elle est payée, même s’il n’y croit pas. » Tu comprends enfin ce qui est arrivé au Noyé.","event.nun_2.rb":"Vous priez sans mots. Tu sens le poids d’une main absente. Tu repars avec moins de peur et les chaussures humides.","event.nun_2.rh":"La Sœur se signe. « Je le connais. Il me l’a confessé une fois, il y a longtemps, avant la première main. » Elle serre les lèvres : elle ne te le dira pas. Mais tu sais maintenant qu’il y a eu un nom.","event.nun_2.text":"« J’en ai baptisé un trop longtemps », murmure la Sœur en regardant les fonts. « Maintenant il vit en bas et ne sèche jamais. » Les bougies se penchent vers le sol.","event.nun_2.title":"Le baptême","event.nun_3.a":"L’absoudre","event.nun_3.b":"La laisser prier","event.nun_3.ra":"Tu prononces des mots que tu ne te souviens pas d’avoir appris. Elle pleure sans bruit et, en se relevant, te tend quelque chose que tu ne te souviens pas non plus d’avoir perdu.","event.nun_3.rb":"Tu t’éloignes, son murmure dans ton dos. Dans le tronc, il y a quelques pièces ; tu ne sais pas si elles sont à toi ou à elle.","event.nun_3.text":"Cette fois, c’est la Sœur qui s’agenouille. « J’ai confessé la première », dit-elle. « Et je lui ai donné l’absolution avant qu’il ait rien à se faire pardonner. »","event.nun_3.title":"La dernière confession","event.nurse_1.a":"La laisser te recoudre","event.nurse_1.b":"Refuser","event.nurse_1.ra":"Ça ne fait pas mal. Elle referme des plaies dont tu ignorais l’existence et en laisse d’autres closes. « Voilà », dit-elle. « Maintenant, au lit. » Tu ne restes pas.","event.nurse_1.rb":"Elle te regarde longuement. « Comme tu voudras. » Elle repose l’aiguille sur un plateau avec une douzaine d’autres. Ce n’est pas la première fois qu’on lui dit non.","event.nurse_1.text":"Une infirmière au masque vert tire un rideau. « Assieds-toi, ma belle. Tu as mauvaise mine. Ici personne ne guérit, mais tout le monde va un peu mieux. » Elle tient une aiguille enfilée.","event.nurse_1.title":"L’infirmerie","event.nurse_2.a":"Poser des questions sur la fille","event.nurse_2.b":"Prendre le fil","event.nurse_2.ra":"« Elle voyait ce qu’il y a derrière le jeu. Le Croupier me l’a demandé poliment. » Tu comprends pourquoi la Fille ment : c’est la seule chose qu’on ne lui a pas cousue.","event.nurse_2.rb":"Le fil noir s’emmêle à tes doigts et l’une de tes cartes se retrouve marquée d’un point de couture. On dirait qu’elle a toujours été ainsi.","event.nurse_2.text":"Sur le plateau : des aiguilles, du fil noir et un œil de verre. « C’est celui de la Fille », dit l’Infirmière. « Je lui ai cousu l’œil pour qu’elle cesse de voir. Maintenant elle me demande de le refaire chaque nuit. »","event.nurse_2.title":"Le plateau","event.nurse_3.a":"Pousser sa chaise","event.nurse_3.b":"Changer la dose","event.nurse_3.ra":"Tu parcours le couloir lentement. Il parle du temps où la maison n’était qu’un salon et qu’une table. « Je suis resté pour attendre les autres », répète-t-il. Et les autres sont venus.","event.nurse_3.rb":"Tu échanges l’étiquette. Il ne proteste pas ; l’Infirmière non plus. « S’il se lève, on verra qui s’assoit », dit-elle enfin. Il y a quelque chose qu’on ne te fait plus payer.","event.nurse_3.text":"L’Homme à la Chaise attend dans le couloir de l’infirmerie. Une seringue repose sur ses genoux. « Ma dose », murmure-t-il. « Pour ne pas me lever. » L’Infirmière te regarde depuis la porte.","event.nurse_3.title":"La dose","event.old_photograph.a":"La décrocher","event.old_photograph.b":"La laisser en place","event.old_photograph.ra":"Derrière, des noms. Beaucoup. Aucun ne se répète... sauf le tien.","event.old_photograph.rb":"Tu la laisses. Tu te sens toujours observé, mais avec une certaine douceur. Presque.","event.old_photograph.text":"Sur le mur, une photo de groupe : des joueurs autour de cette table, de toutes les époques. Au dernier rang, ton visage.","event.old_photograph.title":"La photographie","event.phone_call.a":"Décrocher","event.phone_call.b":"Raccrocher sans écouter","event.phone_call.ra":"Une respiration et, dessous, un bruit d’applaudissements lointains. « Tu es toujours là ? » dit quelqu’un qui n’est pas dans la salle. « Nous, oui. »","event.phone_call.rb":"Le téléphone se tait dès que tu le touches. En raccrochant, on entend un soupir collectif.","event.phone_call.text":"Un téléphone en bakélite sonne au milieu de la table. C’est pour toi. C’est toujours pour toi, à partir de la deuxième fois.","event.phone_call.title":"Le téléphone","event.pianist_1.a":"Écouter jusqu’au bout","event.pianist_1.b":"En demander une autre","event.pianist_1.h":"Demander pour ses mains","event.pianist_1.ra":"Cela dure ce que cela dure. Tu te sens léger, presque pardonné. Tu laisses une pièce dans la poche de son frac.","event.pianist_1.rb":"« Je n’en connais qu’un. » Il le rejoue, tout aussi parfait. Quand il finit, il te tend un poignet vide : dedans, quelques pièces que tu ne te souviens pas d’avoir laissées.","event.pianist_1.rh":"« Je les ai laissées en paiement », dit-il. « Le Croupier les a voulues pour son premier jeu. Maintenant l’Archiviste les garde dans un tiroir qui ne s’ouvre pas. » Et il continue à jouer.","event.pianist_1.text":"Un pianiste aux poignets vides joue de l’orgue de la chapelle. Il n’y a pas de mains dans ses manches, mais la musique résonne. « C’est le seul morceau dont je me souvienne », dit-il sans se retourner.","event.pianist_1.title":"L’organiste","event.pianist_2.a":"Danser avec elle","event.pianist_2.b":"Regarder de loin","event.pianist_2.ra":"Vous tournez jusqu’à ce que le sol t’oublie. Tu te sens mieux, et pire. Elle murmure : « Merci de ne pas m’avoir lâchée. »","event.pianist_2.rb":"Vous vous regardez sans un mot. Sa robe ondoie sans vent. Le Pianiste joue plus bas, comme pour s’excuser.","event.pianist_2.text":"La Femme en Rouge danse seule entre les bancs au rythme de l’orgue. Si le Pianiste s’arrêtait, que deviendrait-elle ? Elle te tend une main gantée.","event.pianist_2.title":"Le bal","event.puppet_1.a":"Lui parler","event.puppet_1.b":"Lui couper les fils","event.puppet_1.ra":"Il répète des phrases entières : les mêmes que le Croupier a dites à ceux d’avant. Tu remarques une pause avant chacune, comme si quelqu’un soufflait le texte par derrière.","event.puppet_1.rb":"Il s’affaisse avec un bruit de bois. Dans sa poche, quelques pièces et un mot non signé : « Continue sans te retourner. »","event.puppet_1.text":"Un pantin de ventriloque est posé sur une chaise vide. Sans que personne le manipule, sa mâchoire s’abaisse : « Bienvenue », dit-il d’une voix que tu as déjà entendue. « On t’attendait. »","event.puppet_1.title":"Le pantin","event.puppet_2.a":"Suivre le texte","event.puppet_2.b":"Briser le texte","event.puppet_2.ra":"Tu dis exactement ce qui était écrit et tout se passe bien, trop bien. La note s’allège. Quelque part, le Croupier semble sourire.","event.puppet_2.rb":"Tu prononces une phrase qui n’y était pas. Le Pantin reste bouche bée. Un instant, toute la maison doit improviser.","event.puppet_2.text":"Le Pantin parle de nouveau. Cette fois, il ne répète pas le Croupier : il lit tes propres répliques, avant que tu les dises. « Page trente », annonce-t-il. « C’est ici que tu hésites. »","event.puppet_2.title":"Le texte","event.room_13.a":"Entrer","event.room_13.b":"Fermer la porte","event.room_13.ra":"À l’intérieur, l’Enfant attend, les cartes en main. « Tu as encore perdu ? »","event.room_13.rb":"Tu la fermes. La porte se dissout dans le mur comme si elle n’avait jamais existé.","event.room_13.text":"Au bout du couloir se dresse une porte qui n’y était pas : 13. Derrière, le bruit d’un enfant qui bat les cartes, très lentement.","event.room_13.title":"La chambre 13","event.secret_bone_door.a":"L’ouvrir","event.secret_bone_door.b":"Fouiller la salle","event.secret_bone_door.ra":"La clé d’os était dans ta poche depuis toujours. Derrière : une salle sans issue et un air qui sent le vrai air.","event.secret_bone_door.rb":"Tu trouves quelques pièces près de la porte. La porte attend.","event.secret_bone_door.text":"Une porte faite de petits os polis. Elle a une serrure. Et elle a ta clé, même si tu ne l’as pas encore vue.","event.secret_bone_door.title":"La porte d’os","event.secret_stage.a":"T’asseoir à ta place","event.secret_stage.b":"Rester debout","event.secret_stage.ra":"De ta place, tu vois une table, un paquet et une chaise vide. Tu comprends que tu n’es pas le seul à jouer ici. Ni le seul à regarder.","event.secret_stage.rb":"Tu préfères rester debout. Un court répit, et un air un peu plus léger.","event.secret_stage.text":"Une scène de casino avec des fauteuils vides. Chacun porte une plaque nominative. L’un porte le tien. Un autre, celui du Croupier : elle est vierge.","event.secret_stage.title":"La scène vide","event.secret_watcher.a":"Lui rendre son regard","event.secret_watcher.b":"Baisser les yeux","event.secret_watcher.ra":"Il te regarde. Tu le regardes. Et un instant, tu sens que quelqu’un d’autre vous regarde tous les deux, depuis l’extérieur de la salle.","event.secret_watcher.rb":"Tu baisses les yeux. L’œil du plafond semble soulagé, comme s’il craignait d’être regardé.","event.secret_watcher.text":"Une salle sans portes avec un œil peint au plafond. Personne ne l’a peint. Il cligne quand tu clignes.","event.secret_watcher.title":"Celui qui regarde","event.signed_receipt.a":"Le lire en entier","event.signed_receipt.b":"Le déchirer","event.signed_receipt.ra":"C’est une liste de parties. Toutes perdues. Toutes à toi.","event.signed_receipt.rb":"Tu le déchires en morceaux. Quand tu fermes le poing, il est de nouveau entier dans ta poche, mais plus léger.","event.signed_receipt.text":"Un reçu plié tombe de ta poche. Ton écriture, une somme que tu ne comprends pas, la date de demain.","event.signed_receipt.title":"Le reçu signé","event.staff_room.a":"Regarder les services","event.staff_room.b":"Effacer ton nom","event.staff_room.ra":"Chacun couvre le service d’un client qui n’est jamais parti. Tu comprends quelque chose de gênant : chacun d’eux a joué avant. Tous.","event.staff_room.rb":"Tu passes le doigt sur ton nom et il s’efface. Il réapparaît de l’autre côté de la salle. Au moins, il y a quelques pièces oubliées dans un casier.","event.staff_room.text":"Une salle avec des casiers et un tableau de service : Croupier, Archiviste, Vendeur, Cuisinier, Infirmière, Sœur, Pianiste… Il y a une case à ton nom pour le dernier service de la nuit.","event.staff_room.title":"La salle du personnel","event.wall_notes.a":"Continuer à lire","event.wall_notes.b":"Te couvrir les yeux","event.wall_notes.ra":"Il y en a davantage : des paris, des dettes, deux ou trois blagues. Parmi les gribouillis, un peu d’argent oublié dans une fissure.","event.wall_notes.rb":"On dit que celui qui lit tout reste vivre ici. Tu préfères ne pas le vérifier.","event.wall_notes.text":"Quelqu’un a écrit sur le mur, à la craie, au charbon, au sang : « L’Infirmière a cousu l’œil. » « Le Cuisinier garde les souvenirs. » « Le Vendeur les vend. » « La Sœur connaît le nom. » « Le Pianiste a payé de ses mains. » En dessous, plus petit : « Personne ne se souvient de qui écrit ceci. »","event.wall_notes.title":"Notes sur le mur","event.wet_footprints.a":"Les suivre","event.wet_footprints.b":"Les ignorer","event.wet_footprints.ra":"Derrière la porte, une table vide et une poignée de jetons humides. Personne ne les réclame.","event.wet_footprints.rb":"Tu préfères ne pas savoir. Le sol, lui, continue de se mouiller derrière toi.","event.wet_footprints.text":"Des traces de pieds nus et mouillés traversent le tapis et disparaissent sous une porte. Quelqu’un vient de passer.","event.wet_footprints.title":"Traces mouillées","event.woman_dress.a":"Prendre la carte","event.woman_dress.b":"La refuser","event.woman_dress.ra":"La carte se réchauffe. Retournée, elle montre quelqu’un qui a beaucoup pleuré et ne regrette rien.","event.woman_dress.rb":"Elle range la carte sans insister. Tu sais qu’elle te la proposera de nouveau.","event.woman_dress.text":"Une femme en robe rouge sombre tend une carte face cachée. « Quatre fois plus de tout », dit-elle. « Dettes comprises. »","event.woman_dress.title":"La Femme en Rouge","finale.stage1":"LA DERNIÈRE MAIN","finale.stage2":"LA DERNIÈRE BALLE","fx.abandoned":"Tu as quitté la salle à moitié. La maison a pris son dû.","fx.collapse":"Ton esprit se brise : tu perds de la Santé et regagnes un peu de Raison.","fx.interest":"Intérêt de la dette : +{n}","fx.revive_candle":"La bougie courte te rallume.","fx.revive_life":"Une vie supplémentaire t’arrache à la mort.","fxbanner.big":"GRAND COUP !","fxbanner.good":"BEAU COUP !","fxbanner.huge":"DÉVASTATEUR !","fxbanner.target":"OBJECTIF ATTEINT !","hand.five":"Cinq identiques","hand.flush":"Couleur","hand.four":"Carré","hand.full":"Full","hand.high":"Carte haute","hand.pair":"Paire","hand.sflush":"Quinte flush","hand.straight":"Quinte","hand.three":"Brelan","hand.twopair":"Double paire","help.combos":"Combinaisons spéciales","help.goal":"Atteins l’OBJECTIF de points avant de manquer de coups. Sinon, la maison encaisse.","help.hands":"Mains (jetons × mult)","help.score":"Chaque coup marque JETONS × MULT. La main (paire, brelan, quinte…) donne la base ; chaque carte et combinaison ajoute. Vérifie toujours le coût avant de jouer. Chaque carte ajoute des jetons selon sa valeur : As 11, figures (V, D, R) 10, les autres leur chiffre.","help.stakes":"Miser multiplie le coup mais coûte Santé, Raison, Argent ou Dette. Certaines règles l’interdisent.","help.stakes_title":"Mises","help.suits":"Couleurs","help.tips":"Défausse les mauvaises cartes, garde-en une en Poche pour le coup parfait et surveille ta Raison : quand elle baisse, l’écran se déforme et, à 0, tu t’effondres (+25 de Raison, −20 de Santé).","help.tips_title":"Conseils","help.title":"Guide rapide","hint.boss":"Chaque aile a un Gardien aux règles propres qui changent la partie. Lis-les avant de jouer : le vaincre te rapproche de la fin.","hint.event":"Ici, tu choisis entre deux options : REFUSER (← ou A) ou ACCEPTER (→ ou D). Ce qui change —Santé, Raison, Argent ou Dette— tu le verras ensuite. À 0 de Santé, tu meurs ; avec peu de Raison, la maison se déforme ; et la Dette grandit avec des intérêts.","hint.map":"Touche une salle pour voir ce que c’est, puis touche-la encore pour entrer. Si tu te perds, le bouton ? en haut t’explique le jeu quand tu veux.","hint.merchant":"Ici, tout s’achète avec de l’Argent. Et on prête aussi : les prêts ajoutent de la Dette, et la Dette grandit avec des intérêts après chaque salle.","hint.rest":"Un répit : choisis une seule chose. Dormir rend de la Santé, respirer rend de la Raison, payer réduit la Dette et étudier fait monter une main de niveau.","howto.cards":"VOIR MAINS ET COULEURS","howto.s1.h":"Objectif","howto.s1.t":"Tu descends dans la maison salle après salle. À chaque étage, tu choisis ton chemin sur la carte : tu joues des tables de cartes, tu décides lors d’événements et, parfois, tu mises quelque chose dans le duel au fusil. Chaque aile se termine par un Gardien ; viennent ensuite le Croupier, sa dernière main et La Porte.\nMourir n’est pas la fin : tu gardes souvenirs et connaissances, et tu redescends.","howto.s2.h":"La carte","howto.s2.t":"Chaque salle est un nœud. Touche-en un pour voir ce que c’est, puis touche-le encore (ou appuie sur ENTRER) pour entrer. Tu ne peux aller que vers les salles reliées à la tienne.\nIl y a des tables de cartes, des événements, le Vendeur, des repos, le fusil (un duel où tu mises quelque chose), une porte d’os secrète et le Gardien.","howto.s3.h":"Tes ressources","howto.s3.t":"• Santé : à 0, tu meurs. Une bougie en plus te relève une fois, avec 40 % de Santé.\n• Raison : elle baisse avec les cartes, les mises et les événements. Quand elle est basse, l’écran se déforme et des murmures apparaissent ; à 0, tu t’effondres : tu regagnes 25 de Raison mais perds 20 de Santé.\n• Argent : sert à acheter à la boutique et à payer la dette.\n• Dette : elle augmente avec les prêts et les mises, et 3 % d’intérêts s’ajoutent après chaque salle. Avec beaucoup de dette, la Maison relève l’objectif des tables de 5 % par tranche de 100 au-dessus de 200 (jusqu’à 25 %).\n• Bouclier : absorbe le coût en Santé des cartes.","howto.s4.h":"Tables de cartes","howto.s4.t":"Choisis 1 à 5 cartes de ta main et joue : la main (paire, brelan, quinte…) donne jetons × multiplicateur, et chaque carte et combinaison ajoute davantage. Atteins l’objectif avant de manquer de coups ; sinon, tu paies en Santé, Raison et Dette.\nTu peux défausser, garder une carte en Poche ou miser (cela multiplie le coup, mais coûte). Chaque adversaire apporte une règle propre, visible sur la table. Vérifie toujours le coût avant de jouer.","howto.s5.h":"Événements","howto.s5.t":"Ce sont des décisions à deux options : REFUSER (← ou A) ou ACCEPTER (→ ou D) ; sur téléphone, glisse. Parfois une troisième option cachée (H) apparaît, selon ce que tu sais ou portes. Ce que ta décision change s’affiche ensuite, et certains outils permettent de la refaire.","howto.s6.h":"Duel au fusil","howto.s6.t":"Tu mises quelque chose (Argent, Raison, Dette ou une carte). Le fusil a 6 chambres, certaines chargées. L’adversaire annonce combien il y a de balles… et il peut mentir.\nÀ ton tour, tu peux tirer sur l’adversaire (si la chambre est chargée, il perd une marque ; sinon, le tour passe), tenter la Table (si elle est vide, tu gardes la main ; sinon, tu perds une marque) ou écouter (cela coûte de la Raison et ne tombe pas toujours juste). Celui qui laisse l’autre sans marques gagne.","howto.s7.h":"Boutique et repos","howto.s7.t":"Le Vendeur vend des objets, des outils et des cartes contre de l’Argent, et il prête aussi : les prêts ajoutent de la Dette.\nÀ un repos, tu choisis une seule chose : dormir (Santé), respirer (Raison), payer la dette ou étudier une main pour la faire monter de niveau.","howto.s8.h":"Mourir et se souvenir","howto.s8.t":"Quand tu meurs, tu vois ta DETTE ACTUELLE (une partie est reportée à la descente suivante) et tes SOUVENIRS CONSERVÉS : des avantages permanents gagnés en faisant certaines choses. Ce que tu découvres est gardé comme connaissance et ouvre des options cachées et des portes.\nIl y a 6 fins ; La Porte demande des choses différentes pour chacune.","howto.title":"Comment jouer","hud.debt":"Dette","hud.deck":"Paquet","hud.health":"Santé","hud.howto":"Comment jouer","hud.inventory":"Inventaire","hud.items":"Objets","hud.jokers":"Jokers","hud.levels":"Niveaux de main","hud.lives":"Vies","hud.money":"Argent","hud.no_items":"Rien pour l’instant.","hud.sanity":"Raison","hud.settings":"Paramètres","hud.tools":"Outils","intro.1":"Tu es réveillé ?","intro.2":"Enfin.","intro.3":"Nous devons terminer une partie.","intro.4":"Quelle partie ?","intro.5":"La précédente.","intro.6":"Assieds-toi. Je vais te montrer comment on joue ici.","item.campanilla.desc":"+1 défausse par manche.","item.campanilla.name":"Clochette","item.ceniza.desc":"+15 jetons par coup. −2 Raison après chaque salle.","item.ceniza.name":"Cendre","item.cuchilla_oxidada.desc":"Le Sang donne +1 mult de plus mais coûte +1 Santé.","item.cuchilla_oxidada.name":"Lame rouillée","item.diente_leche.desc":"Les Dents gagnent +1 de plus par coup.","item.diente_leche.name":"Dent de lait","item.espejo_roto.desc":"+2 mult. Tu commences à −2 de Raison. Refaire une décision par partie (−5 Raison).","item.espejo_roto.name":"Miroir brisé","item.ficha_negra.desc":"Les mises multiplient +0,15 de plus. Défais une décision contre 50 de Dette.","item.ficha_negra.name":"Jeton noir","item.guante_crupier.desc":"+1 coup par manche.","item.guante_crupier.name":"Gant du Croupier","item.libro_cuentas.desc":"L’intérêt de la dette est réduit de moitié.","item.libro_cuentas.name":"Livre de comptes","item.llave_hueso.desc":"Bouclier initial de 4. Ouvre la porte cachée. Permet la fin de la Porte.","item.llave_hueso.name":"Clé d’os","item.moneda_mordida.desc":"+5 d’Argent par manche gagnée. Les cartes Dorées donnent +2 de plus.","item.moneda_mordida.name":"Pièce mordue","item.ojo_vidrio.desc":"+1 carte en main. La Brume ne t’affecte pas.","item.ojo_vidrio.name":"Œil de verre","item.reloj_parado.desc":"Les objectifs baissent de 8 %. La dette croît 50 % plus vite.","item.reloj_parado.name":"Horloge arrêtée","joker.abaco.desc":"+1 mult permanent par manche gagnée lors de cette descente.","joker.abaco.name":"Le Boulier Rouillé","joker.as_manga.desc":"×1,5 par As qui marque.","joker.as_manga.name":"L’As dans la Manche","joker.bufon.desc":"+4 de multiplicateur.","joker.bufon.name":"Le Bouffon Muet","joker.casa_gana.desc":"×1,4 si tu mises sur le coup.","joker.casa_gana.name":"La Maison Gagne Toujours","joker.colmillo_dorado.desc":"+10 jetons par carte de Dent qui marque.","joker.colmillo_dorado.name":"Le Croc Doré","joker.corona_podrida.desc":"×2 si le coup est une Couleur ou mieux (Couleur, Full, Carré, Quinte flush).","joker.corona_podrida.name":"La Couronne Pourrie","joker.escalera_sin_fin.desc":"+40 jetons et +4 mult si le coup est une Quinte.","joker.escalera_sin_fin.name":"L’Escalier Sans Fin","joker.gemelos.desc":"×1,5 si le coup est une Double paire ou un Full.","joker.gemelos.name":"Les Jumeaux","joker.llavero_roto.desc":"+8 jetons et +1 de Bouclier par Clé qui marque.","joker.llavero_roto.name":"Le Porte-clés Brisé","joker.monja_ciega.desc":"×1,25 par figure (V, D, R) qui marque.","joker.monja_ciega.name":"La Nonne Aveugle","joker.ojo_nuca.desc":"+12 jetons par carte d’Œil qui marque.","joker.ojo_nuca.name":"L’Œil dans la Nuque","joker.peaje.desc":"Tu gagnes 2 d’Argent par carte qui marque.","joker.peaje.name":"Le Péage du Passeur","joker.sanguijuela.desc":"+2 mult par carte de Sang qui marque.","joker.sanguijuela.name":"La Sangsue","joker.sombrero.desc":"×1,3 sur tous tes coups, mais chaque coup coûte 2 de Raison.","joker.sombrero.name":"Le Chapeau du Croupier","joker.sonrisa.desc":"+30 jetons si le coup contient une paire ou mieux.","joker.sonrisa.name":"Le Sourire Figé","joker.trapero.desc":"+1 mult par tranche de 40 de Dette (max +10).","joker.trapero.name":"Le Chiffonnier","joker.ultima_oportunidad.desc":"+10 mult lors de ton dernier coup de la manche.","joker.ultima_oportunidad.name":"La Dernière Chance","joker.ultimo_aliento.desc":"×3 si ta Santé est inférieure à 30 %.","joker.ultimo_aliento.name":"Le Dernier Souffle","joker.vela_viuda.desc":"×1,5 si ta Raison est inférieure à 40.","joker.vela_viuda.name":"La Bougie de la Veuve","know.clue":"Indice sur le Croupier","know.k_chair_founder.name":"Le fondateur","know.k_chair_founder.text":"L’Homme à la Chaise a fondé la maison et n’a jamais bougé.","know.k_child_self.name":"L’enfant, c’est toi","know.k_child_self.text":"L’enfant à la robe d’anniversaire, rs.name":"Les joueurs","know.k_players.text":"Tous ceux qui sont ici ont joué avant. Tous.","know.k_puppet_script.name":"Le texte","know.k_puppet_script.text":"Le Pantin répète le texte du Croupier. Tout ce qui se dit ici est écrit ; reste à savoir par qui.","know.k_reflection.name":"Ton reflet","know.k_reflection.text":"Dans le miroir, ce n’est pas toi qui bouges en premier.","know.k_room13.name":"La Chambre 13","know.k_room13.text":"Il y a une chambre qui ne figure sur aucun plan.","know.k_watcher.name":"Quelqu’un regarde","know.k_watcher.text":"Quelqu’un regarde la partie depuis l’extérieur de la maison.","legal.back":"RETOUR AU JEU","legal.lang":"Langue","legal.privacy.s1.h":"1. Ce que le jeu enregistre","legal.privacy.s1.t":"Le jeu enregistre dans le stockage local de ton navigateur ta partie et tes paramètres (langue, volume, accessibilité). Ces données restent sur ton appareil : le jeu ne les envoie à aucun serveur.\nTu peux les effacer avec RÉINITIALISER LA PROGRESSION dans le menu ou depuis les paramètres de ton navigateur. Si tu les effaces, tu perds ta partie.","legal.privacy.s2.h":"2. Aucun service tiers","legal.privacy.s2.t":"Le jeu ne comporte ni publicité ni outil d’analyse, n’utilise aucun cookie et ne charge aucune ressource d’autres sites. Il ne collecte aucune donnée personnelle.","legal.privacy.s3.h":"3. Hébergement","legal.privacy.s3.t":"Comme tout site web, l’hébergement où le jeu est publié (actuellement GitHub Pages) peut enregistrer des données techniques sur les visites, comme l’adresse IP, selon ses propres conditions. Le jeu ne reçoit pas ces données.","legal.privacy.s4.h":"4. Avertissement de contenu","legal.privacy.s4.t":"THE HOUSE ALWAYS WATCHES est une œuvre de fiction d’horreur : les personnages, lieux et événements sont imaginaires.\nL’argent, les jetons, les paris et les dettes du jeu sont fictifs : ils n’ont aucune valeur réelle, ne s’achètent ni ne s’échangent contre de l’argent réel, et le jeu n’est pas un service de jeux d’argent.\nIl comprend des effets de clignotement et de secousses, et une distorsion visuelle quand la Raison baisse. Tu peux les réduire dans PARAMÈTRES → Réduire les effets. Si tu as une épilepsie photosensible ou d’autres troubles, demande l’avis d’un professionnel avant de jouer.","legal.title.privacy":"Confidentialité et avertissement","legal.updated":"Dernière mise à jour : 2026-10-01","log.round_lost":"Tu as perdu la manche. La maison encaisse.","log.round_won":"Manche gagnée.","map.enter":"ENTRER","map.info.event":"Quelque chose t’attend. Tu ne sais pas quoi.","map.info.merchant":"Un vendeur de choses qui ne devraient pas se vendre.","map.info.rest":"Un coin pour reprendre son souffle.","map.info.secret":"Une porte d’os que personne d’autre ne voit.","map.locked":"hors de portée","map.opp":"Adversaire : {name}","map.pick":"Choisis ta prochaine salle.","map.shotgun":"Duel au fusil. Tu mises quelque chose.","map.title":"Salle {n}/{total}","map.visited":"visitée","mem.m01.name":"Le premier coup","mem.m01.text":"Mourir une fois t’a appris à garder un peu d’argent sur toi. +10 d’Argent au départ.","mem.m02.name":"Mains de rechange","mem.m02.text":"Tu as appris à défausser sans douter. +1 défausse par manche.","mem.m03.name":"Cicatrices","mem.m03.text":"Le corps se souvient. +10 de Santé maximale.","mem.m04.name":"La pièce de la fille","mem.m04.text":"Tu commences avec Paire au niveau 1.","mem.m05.name":"Le sel de la chaise","mem.m05.text":"Tu commences avec un Sel.","mem.m06.name":"De l’air sous l’eau","mem.m06.text":"Récupère 3 de Raison en gagnant une manche.","mem.m07.name":"Jouer comme un enfant","mem.m07.text":"+1 coup par manche.","mem.m08.name":"La mauvaise balle","mem.m08.text":"Tu commences avec un Témoin.","mem.m09.name":"Oreille fine","mem.m09.text":"Écouter en duel est fiable à 85 %.","mem.m10.name":"Comptes clairs","mem.m10.text":"L’intérêt de la dette est réduit de moitié.","mem.m11.name":"Os de la Chambre 13","mem.m11.text":"Tu commences avec un Os Lisse r":"Er hat keinen Namen. Er führt das Schuldbuch und teilt ein Blatt aus zweiundfünfzig Karten … und einer, die fehlt.","bio.drowned":"Er zahlte seine Schuld mit Wasser. Die Schwester taufte ihn zu lange, und nun lebt er unten.","bio.girl":"Sie lügt fast immer. Die Krankenschwester hat ihr das linke Auge zugenäht, damit sie nicht mehr sieht, was sie nicht sehen soll; jede Nacht bittet sie darum, es neu zu nähen.","bio.merchant":"Er verkauft Erinnerungen im Glas. Er bekommt sie von seinem Bruder, dem Koch, der sie einmacht.","bio.nun":"Sie hört die Beichte aller, auch die des Croupiers. Sie kennt seinen Namen; die Beichte ist heilig, und sie wird ihn nicht nennen.","bio.nurse":"Sie pflegt jeden, der bleibt. Sie nähte das Auge des Mädchens zu und hält den Mann auf dem Stuhl sitzend; keiner der beiden hat ihr gedankt.","bio.pianist":"Er spielte für den Croupier, als alles begann, und zahlte mit seinen Händen. Noch immer spielt er das einzige Stück, an das er sich erinnert.","bio.puppet":"Er spricht mit der Stimme dessen, der ihn bezahlt hat. Er wiederholt das Skript des Croupiers Wort für Wort … und manchmal eines früher.","bio.woman":"Sie tanzt in einem Kleid, das sie nicht mehr ablegen kann. Der Pianist spielt für sie, und sie bittet ihn nie aufzuhören.","boss.chair.a":"„Setz dich. Hier wird das Blut kalt, und deine Karten geben keine Wärme.“","boss.chair.l":"„Der Stuhl gewinnt immer. Das ist das Einzige, was ich über ihn weiß.“","boss.chair.w":"„Ich stehe auf. Ich saß so lange, dass ich vergessen habe, wie das geht.“","boss.child.a":"„Erinnerst du dich an mich? Ich an dich schon. Schließ die Augen nicht… ach, sie sind ja schon zu.“","boss.child.l":"„Schon wieder. Du verlierst hier immer. Du kommst immer zurück.“","boss.child.w":"„Du hast mich besiegt. Das wollte ich. Jetzt musst du erwachsen werden.“","boss.cook.a":"„In dieser Küche herrscht Hunger. Leg mehr auf den Tisch und beschwer dich nicht über den Dampf.“","boss.cook.l":"„Ohne Schuld kein Haus. Setz dich, es wird kalt.“","boss.cook.w":"„Du hast deinen Teller leer gegessen. Nimm dir etwas, bevor mein Bruder es verkauft.“","boss.dealer.a":"„Die letzte Hand. Keine Einsätze, keine Tricks. Alles offen.“","boss.dealer.l":"„Es war immer mein Tisch. Steh auf; wir fangen wieder an.“","boss.dealer.w":"„Gut gespielt. Einen Moment lang dachte ich, ich wäre derjenige, der nicht aufsteht.“","boss.drowned.a":"„Atme, solange du kannst. Jede Karte, die du spielst, lässt dich ein Stück sinken.“","boss.drowned.l":"„Trink, trink. Es ist nur Wasser. Es ist nur eine Schuld.“","boss.drowned.w":"„Ich habe schon bezahlt. Dachte ich. Geh hinauf; hier unten bleibt nichts.“","boss.fight":"PARTIE SPIELEN","boss.girl.a":"„Wir spielen: Nicht wiederholen. Ich merke alles mit dem Auge, das nicht sieht.“","boss.girl.l":"„Schon wieder dasselbe, schon wieder dasselbe. Du langweilst mich.“","boss.girl.w":"„Du hast mich geschlagen und nicht gelogen. Wie seltsam. Nimm, was du willst.“","boss.no_rules":"Keine Sonderregeln","boss.nun.a":"„Beichte deine Hände, bevor du sie ausspielst. Was sich wiederholt, wird erinnert, und was erinnert wird, wird bezahlt.“","boss.nun.l":"„Bete, mein Kind. Das Haus hört nicht zu, aber es schreibt mit.“","boss.nun.w":"„Ich vergebe dir, was du mir schuldest. Die Rechnung des Croupiers ist eine andere. Geh.“","boss.nurse.a":"„Atme tief, Liebes. Deine Augen nützen dir hier nichts, und die Luft wird knapp.“","boss.nurse.l":"„Ruhig, nur ein kleiner Stich. Alle sagen das Gleiche, und alle kehren ins Bett zurück.“","boss.nurse.w":"„Du bist geheilt. Wie seltsam; hier ist das niemand. Geh, bevor ich es mir anders überlege.“","boss.rules":"Regeln dieser Partie","boss.title":"WÄCHTER","boss.weakened":"geschwächt","card.base":"{rank} ({suit})","card.carta_doble.desc":"Wiederholt den Effekt der direkt zuvor gewerteten Karte.","card.carta_doble.name":"Doppelkarte","card.colmillo.desc":"+8 Chips. Wächst um +2 pro Wertung (max. +40).","card.colmillo.name":"Fangzahn","card.corazon.desc":"+2 Mult
